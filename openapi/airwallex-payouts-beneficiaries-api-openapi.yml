  /api/v1/beneficiary_api_schemas/generate:
    post:
      tags:
      - Payouts > Beneficiaries
      summary: 8|Retrieve the API Schema
      description: 'API schema specifies the required fields and the corresponding field validation rules for each transfer scenario. A payment scenario is defined as a combination of the following parameters: beneficiary entity_type, bank_country_code. account_currency, and your preferred transfer_method, local_clearing_system (if applicable).'
      operationId: generateApiSchemas
      requestBody:
        content:
          application/json:
            schema:
              title: Beneficiary type
              description: Condition map specified in the request defines the schema. The set of parameters depends on the beneficiary `type`.
              oneOf:
              - title: Bank account
                type: object
                properties:
                  type:
                    type: string
                    description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`.
                    enum:
                    - BANK_ACCOUNT
                  entity_type:
                    type: string
                    description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
                  bank_country_code:
                    type: string
                    description: Bank country code (2-letter ISO 3166-2 country code).
                  account_currency:
                    type: string
                    description: Account currency (3-letter ISO 4217 currency code).
                  transfer_method:
                    type: string
                    description: Transfer method, i.e., `SWIFT`, `LOCAL`.
                  local_clearing_system:
                    type: string
                    description: 'Local clearing systems are available for selection when making local transfers to the following countries and currencies: US USD, AU AUD, HK HKD, HK USD, HK CNY, SG SGD. Without specification, it will be set to the default value. To learn more, please visit: [https://www.airwallex.com/guides/payout](https://www.airwallex.com/guides/payout).'
              - title: Digital wallet
                type: object
                properties:
                  type:
                    type: string
                    description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`.
                    enum:
                    - DIGITAL_WALLET
                  entity_type:
                    type: string
                    description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
                  provider:
                    type: string
                    description: Service provider of the beneficiary's digital wallet.
              - title: Card
                type: object
                properties:
                  type:
                    type: string
                    description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`.
                    enum:
                    - CARD
        description: request.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: Beneficiary type
                oneOf:
                - title: Bank account
                  type: object
                  properties:
                    condition:
                      type: object
                      description: Condition map specified in the request defines the API schema.
                      properties:
                        type:
                          type: string
                          description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`.
                          enum:
                          - BANK_ACCOUNT
                        entity_type:
                          type: string
                          description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
                        bank_country_code:
                          type: string
                          description: Bank country code (2-letter ISO 3166-2 country code).
                        account_currency:
                          type: string
                          description: Account currency (3-letter ISO 4217 currency code).
                        transfer_method:
                          type: string
                          description: Transfer method, i.e., `SWIFT`, `LOCAL`.
                        local_clearing_system:
                          type: string
                          description: 'Local clearing systems are available for selection when making local transfers to the following countries and currencies: US USD, AU AUD, HK HKD, HK USD, HK CNY, SG SGD. Without specification, it will be set to the default value. To learn more, please visit: [https://www.airwallex.com/guides/payout](https://www.airwallex.com/guides/payout).'
                    fields:
                      type: array
                      description: List of fields in the API schema defined by the condition map.
                      items:
                        $ref: '#/components/schemas/ApiSchemaField'
                    key:
                      type: string
                      description: Identifier of the API schema.
                - title: Digital wallet
                  type: object
                  properties:
                    condition:
                      type: object
                      description: Condition map specified in the request defines the API schema.
                      properties:
                        type:
                          type: string
                          description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`.
                          enum:
                          - DIGITAL_WALLET
                        entity_type:
                          type: string
                          description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
                        provider:
                          type: string
                          description: Service provider of the beneficiary's digital wallet.
                    fields:
                      type: array
                      description: List of fields in the API schema defined by the condition map.
                      items:
                        $ref: '#/components/schemas/ApiSchemaField'
                    key:
                      type: string
                      description: Identifier of the API schema.
                - title: Card
                  type: object
                  properties:
                    condition:
                      type: object
                      description: Condition map specified in the request defines the API schema.
                      properties:
                        type:
                          type: string
                          description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`.
                          enum:
                          - CARD
                    fields:
                      type: array
                      description: List of fields in the API schema defined by the condition map.
                      items:
                        $ref: '#/components/schemas/ApiSchemaField'
                    key:
                      type: string
                      description: Identifier of the API schema.
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
