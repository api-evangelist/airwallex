        status_code: 200
        reason_phrase: OK
        request_body:
          type: DIGITAL_WALLET
          entity_type: PERSONAL
          provider: AIRWALLEX
        response_body:
          condition:
            provider: AIRWALLEX
            entity_type: PERSONAL
            type: DIGITAL_WALLET
          fields:
          - enabled: false
            field:
              key: type
              options:
              - label: BANK_ACCOUNT
                value: BANK_ACCOUNT
              - label: DIGITAL_WALLET
                value: DIGITAL_WALLET
              default: DIGITAL_WALLET
              description: Beneficiary type.
              example: DIGITAL_WALLET
              label: Beneficiary type
              placeholder: ''
              refresh: true
              tip: ''
              type: RADIO
            path: beneficiary.type
            required: true
            rule:
              type: string
              pattern: BANK_ACCOUNT|DIGITAL_WALLET
          - enabled: false
            field:
              key: transfer_method
              options:
              - description: ''
                label: LOCAL
                value: LOCAL
              default: LOCAL
              description: Transfer methods.
              example: ''
              label: Transfer methods
              placeholder: ''
              refresh: true
              tip: ''
              type: TRANSFER_METHOD
            path: transfer_method
            required: true
            rule:
              type: string
              pattern: LOCAL
          - enabled: true
            field:
              key: provider
              options:
              - description: 'Instant transfer to another Airwallex account, which needs:

                  • Account number

                  • Account name.'
                flight_time:
                  max: P0D
                  min: P0D
                label: AIRWALLEX
                value: AIRWALLEX
              default: AIRWALLEX
              description: Transfer method.
              example: AIRWALLEX
              label: Transfer method
              placeholder: ''
              refresh: true
              tip: ''
              type: TRANSFER_METHOD
            path: beneficiary.digital_wallet.provider
            required: true
            rule:
              type: string
              pattern: AIRWALLEX
          - enabled: false
