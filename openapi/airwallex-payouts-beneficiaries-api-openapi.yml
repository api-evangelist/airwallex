  /api/v1/beneficiary_form_schemas/generate:
    post:
      tags:
      - Payouts > Beneficiaries
      summary: 9|Retrieve the Form Schema
      description: Form Schema can be used to build your own user interface to collect beneficiaries’ bank account and contact information. It specifies what UI component should be used to render a field along with the corresponding field validation rules. As all schema and field validation rules are maintained by Airwallex, no code changes will be needed on your end when there are updates.
      operationId: generateFormSchemas
      requestBody:
        content:
          application/json:
            schema:
              title: Beneficiary type
              description: Condition map specified in the request defines the schema. If `type` is omitted, the bank account form schema is returned. Set `type` to select a digital wallet, card, or stablecoin wallet form schema. For stablecoin wallets, `entity_type` is also required. Other parameters can be supplied as the form is completed to retrieve the matching fields.
              oneOf:
              - title: Bank account
                type: object
                properties:
                  type:
                    type: string
                    description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`, `STABLECOIN_WALLET`.
                    enum:
                    - BANK_ACCOUNT
                  entity_type:
                    type: string
                    description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
                  bank_country_code:
                    type: string
                    description: Bank country code (2-letter ISO 3166-2 country code).
                  account_currency:
                    type: string
                    description: Account currency (3-letter ISO 4217 currency code).
                  transfer_method:
                    type: string
                    description: Transfer method, i.e., `SWIFT`, `LOCAL`.
                  local_clearing_system:
                    type: string
                    description: 'Local clearing systems are available for selection when making local transfers to the following countries and currencies: US USD, AU AUD, HK HKD, HK USD, HK CNY, SG SGD. Without specification, it will be set to the default value. To learn more, please visit: [https://www.airwallex.com/guides/payout](https://www.airwallex.com/guides/payout).'
              - title: Digital wallet
                type: object
                required:
                - type
                properties:
                  type:
                    type: string
                    description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`, `STABLECOIN_WALLET`.
                    enum:
                    - DIGITAL_WALLET
                  entity_type:
                    type: string
                    description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
                  provider:
                    type: string
                    description: Service provider of the beneficiary's digital wallet.
              - title: Card
                type: object
                required:
                - type
                properties:
                  type:
                    type: string
                    description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`, `STABLECOIN_WALLET`.
                    enum:
                    - CARD
              - title: Stablecoin wallet
                type: object
                required:
                - type
                - entity_type
                example:
                  type: STABLECOIN_WALLET
                  entity_type: PERSONAL
                properties:
                  type:
                    type: string
                    description: Set to `STABLECOIN_WALLET` to retrieve the stablecoin wallet beneficiary form schema.
                    enum:
                    - STABLECOIN_WALLET
                    x-enumDescriptions:
                      STABLECOIN_WALLET: Stablecoin wallet beneficiary type.
                  entity_type:
                    type: string
                    description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
        description: request.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: Beneficiary type
                oneOf:
                - title: Bank account
                  type: object
                  properties:
                    condition:
                      type: object
                      description: Condition map specified in the request defines the form schema.
                      properties:
                        type:
                          type: string
                          description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`, `STABLECOIN_WALLET`.
                          enum:
                          - BANK_ACCOUNT
                        entity_type:
                          type: string
                          description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
                        bank_country_code:
                          type: string
                          description: Bank country code (2-letter ISO 3166-2 country code).
                        account_currency:
                          type: string
                          description: Account currency (3-letter ISO 4217 currency code).
                        transfer_method:
                          type: string
                          description: Transfer method, i.e., `SWIFT`, `LOCAL`.
                        local_clearing_system:
                          type: string
                          description: 'Local clearing systems are available for selection when making local transfers to the following countries and currencies: US USD, AU AUD, HK HKD, HK USD, HK CNY, SG SGD. Without specification, it will be set to the default value. To learn more, please visit: [https://www.airwallex.com/guides/payout](https://www.airwallex.com/guides/payout).'
                    fields:
                      type: array
                      description: List of fields in the form schema defined by the condition map.
                      items:
                        $ref: '#/components/schemas/FormSchemaField'
                    key:
                      type: string
                      description: Identifier of the form schema.
                - title: Digital wallet
                  type: object
                  properties:
                    condition:
                      type: object
                      description: Condition map specified in the request defines the form schema.
                      properties:
                        type:
                          type: string
                          description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`, `STABLECOIN_WALLET`.
                          enum:
                          - DIGITAL_WALLET
                        entity_type:
                          type: string
                          description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
                        provider:
                          type: string
                          description: Service provider of the beneficiary's digital wallet.
                    fields:
                      type: array
                      description: List of fields in the form schema defined by the condition map.
                      items:
                        $ref: '#/components/schemas/FormSchemaField'
                    key:
                      type: string
                      description: Identifier of the form schema.
                - title: Card
                  type: object
                  properties:
                    condition:
                      type: object
                      description: Condition map specified in the request defines the form schema.
                      properties:
                        type:
                          type: string
                          description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`, `STABLECOIN_WALLET`.
                          enum:
                          - CARD
                    fields:
                      type: array
                      description: List of fields in the form schema defined by the condition map.
                      items:
                        $ref: '#/components/schemas/FormSchemaField'
                    key:
                      type: string
                      description: Identifier of the form schema.
                - title: Stablecoin wallet
                  type: object
                  properties:
                    condition:
                      type: object
                      description: Condition map specified in the request defines the form schema.
                      properties:
                        type:
                          type: string
                          description: Type of the beneficiary. For a stablecoin wallet, this is `STABLECOIN_WALLET`.
                          enum:
                          - STABLECOIN_WALLET
                          x-enumDescriptions:
                            STABLECOIN_WALLET: Stablecoin wallet beneficiary type.
                        entity_type:
                          type: string
                          description: Entity type of the beneficiary, i.e., `COMPANY`, `PERSONAL`.
                    fields:
                      type: array
                      description: List of fields in the form schema defined by the condition map. Stablecoin wallet fields use the `beneficiary.stablecoin_wallet` path.
                      items:
                        $ref: '#/components/schemas/FormSchemaField'
                    key:
                      type: string
                      description: Identifier of the form schema. For a stablecoin wallet beneficiary, this is `newStablecoinWalletRecipient`.
