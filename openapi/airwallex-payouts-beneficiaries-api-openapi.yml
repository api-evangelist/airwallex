          - BRAccountNumberIsValidForBancoSantanderBrasilSA
          - BRAccountNumberIsValidForBancoBradescoSA
          - BRAccountNumberIsValidForItauUnibancoSA
          - BRAccountNumberIsValidForHSBCBankBrasilSA
          - PhoneNumberFormat
          - PhoneNumberCountryCode
          - PhoneNumberLength
