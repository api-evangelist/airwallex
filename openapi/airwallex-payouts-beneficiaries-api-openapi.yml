  /api/v1/beneficiaries:
    get:
      tags:
      - Payouts > Beneficiaries
      summary: 3|List all Beneficiaries
      description: Get list of beneficiaries with optional filters on from date/time, to date/time, names and entity type. Results are paginated, with default list limit of 50 results.
      operationId: listBeneficiaries
      parameters:
      - name: bank_account_number
        in: query
        description: Filter on bank account number of beneficiary.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: company_name
        in: query
        description: Filter on company name of beneficiary.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: Swift concrete services
      - name: entity_type
        in: query
        description: Filter on entity type of COMPANY or PERSONAL.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: COMPANY
      - name: from_date
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
          default: '2017-04-01'
      - name: name
        in: query
        description: Filter on name of beneficiary.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: Adam
      - name: nick_name
        in: query
        description: Filter on nickname of beneficiary.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: sca_exemptible
        in: query
        description: Filter on SCA exemptible beneficiaries.
        required: false
        allowEmptyValue: false
        schema:
          type: boolean
          default: false
      - name: to_date
        in: query
        description: The end date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
          default: 2030-01-01T00:00:00+0000
      - name: type
        in: query
        description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds, i.e., BANK_ACCOUNT, DIGITAL_WALLET, CARD, STABLECOIN_WALLET.
        required: false
        allowEmptyValue: false
        explode: true
        schema:
          type: array
          items:
            type: string
          default: BANK_ACCOUNT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
