          - key: account_currency
            path: beneficiary.bank_details.account_currency
            required: true
            rule:
              type: string
              pattern: AUD|BDT|CAD|CHF|CNY|EUR|GBP|HKD|IDR|INR|JPY|KRW|LKR|MYR|NPR|NZD|PHP|PKR|SGD|THB|TRY|USD|VND
          - key: transfer_method
            path: transfer_method
            required: true
            rule:
              type: string
              pattern: LOCAL|SWIFT
          - key: local_clearing_system
            path: beneficiary.bank_details.local_clearing_system
            required: false
            rule:
              type: string
              pattern: ACH|FEDWIRE
          - key: first_name
            path: beneficiary.first_name
            required: true
            rule:
              type: string
              pattern: ^.{1,50}$
          - key: last_name
            path: beneficiary.last_name
            required: true
            rule:
              type: string
              pattern: ^.{1,50}$
          - key: date_of_birth
            path: beneficiary.date_of_birth
            required: false
            rule:
              type: string
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          - key: account_routing_type1
            path: beneficiary.bank_details.account_routing_type1
            required: true
            rule:
              pattern: ^aba$
              type: string
          - key: account_routing_value1
            path: beneficiary.bank_details.account_routing_value1
            required: true
            rule:
              pattern: ^[0-9]{9}$
              type: string
          - key: bank_name
            path: beneficiary.bank_details.bank_name
            required: true
            rule:
              type: string
              pattern: ^.{1,200}$
          - key: account_number
            path: beneficiary.bank_details.account_number
            required: true
            rule:
              pattern: ^[0-9]{1,17}$
              type: string
          - key: account_name
            path: beneficiary.bank_details.account_name
            required: true
            rule:
              type: string
              pattern: ^.{2,100}$
          - key: country_code
            path: beneficiary.address.country_code
            required: true
