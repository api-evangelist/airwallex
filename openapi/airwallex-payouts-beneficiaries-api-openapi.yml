          - BRBranchNameIsVaildForBancoSantanderBrasilSAORItauUnibancoSA
          - BRBranchNameIsVaildForCaixaCEFORBancoBradescoSA
          - BRBranchNameIsVaild
          - BRCheckingsAccountNumberIsValidForCaixaCEF
          - BRSavingsAccountNumberIdValidForCaixaCEF
