          - Alphanumeric
          - AlphanumericIncludingPunctuation
          - AlphanumericIncludingSpaces
          - LengthOneOf
          - Boolean
          - BPayAlphanumeric
          - ChineseCharacters
          - ChineseCharactersIncludingPunctuation
          - CNAccountNameMatchesFirstLastNameInChinese
          - CNAccountNameNotFI
          - Date
          - DateTime
          - DigitsOnly
          - NotDigitsOnly
          - Email
          - Equal
          - IbanCountryOneOf
          - IbanOrAccountNumberIsMandatory
          - Length
          - MayNotSpecifyPayer
          - MaxLength
          - MinItems
          - MinLength
          - MinMaxLength
          - NumberOfDecimalPlaces
          - OneOf
