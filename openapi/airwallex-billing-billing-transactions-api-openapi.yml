  /api/v1/billing/billing_transactions:
    get:
      description: Retrieves a list of Billing Transactions based on the query parameters.
      operationId: listBillingTransactions
      parameters:
      - description: ID of the [Invoice](/docs/api/billing/invoices) this Billing Transaction is associated with.
        in: query
        name: invoice_id
        required: true
        schema:
          type: string
      - description: The start date of `created_at` in ISO8601 format (inclusive).
        in: query
        name: from_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The end date of `created_at` in ISO8601 format (exclusive).
        in: query
        name: to_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not `null`) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not `null`) from the response to a subsequent call.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: Number of Billing Transactions per page. Defaults to `20`.
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 20
