components:
  schemas:
    Transaction:
      required:
      - amount
      - billing_customer_id
      - created_at
      - currency
      - id
      - status
      - updated_at
      type: object
      properties:
        amount:
          type: number
          description: The total amount of this billing transaction.
        billing_customer_id:
          type: string
          description: ID of the [Billing Customer](/docs/api/billing/billing_customers) who is making this Billing Transaction.
        cancelled_at:
          type: string
          description: Time when this billing transaction was cancelled.
        created_at:
          type: string
          description: Time when this billing transaction was created.
        currency:
          type: string
          description: The currency of the Billing Transaction in 3-letter ISO-4217 format.
        external_id:
          type: string
          description: ID of the [Payment Intent](/docs/api/payments/payment_intents) associated with the Billing Transaction.
        id:
          type: string
          description: ID of the Billing Transaction object.
        invoice_id:
          type: string
          description: ID of the [Invoice](/docs/api/billing/invoices) this billing transaction is associated with.
        linked_payment_account_id:
          type: string
          description: ID of the linked payment account to collect payment. You can find this ID in the Airwallex web app > Settings > Account details, within the Account Information section.
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of string key-value pairs that you can attach to this object for storing additional information.
          description: A set of string key-value pairs that you can attach to this object for storing additional information.
        out_of_band:
          type: boolean
          description: Returns true if the billing transaction was manually marked as succeeded, returns false if the transaction hasn't succeeded yet or was processed on Airwallex.
        payment_source_id:
          type: string
          description: ID of the [Payment Source](/docs/api/billing/payment_sources) for which this billing transaction is made.
        status:
          type: string
          description: Status of the billing transaction, one of `CREATED`, `SUCCEEDED`, `CANCELLED` and `FAILED`.
        succeeded_at:
          type: string
          description: The time that the billing transaction succeeded.
        type:
          type: string
          description: Type of the billing transaction. One of `PAYMENT` or `REFUND`.
        updated_at:
          type: string
          description: Time when this billing transaction was last updated.
    CursorPaginationClientApiResponseTransaction:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/Transaction'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
