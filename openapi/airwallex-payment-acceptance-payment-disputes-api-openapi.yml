openapi: 3.2.0
info:
  title: Airwallex Payment Acceptance > Payment Disputes API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payment Acceptance > Payment Disputes
  description: 'A dispute occurs when a shopper contests legitimacy of a payment. **PaymentDispute** APIs will enable you to manage your dispute events removing the need to managing dispute events manually via web-app, there by reducing your manual efforts.


    Combination of a stage & status of a PaymentDispute will indicate the current situation of dispute. You can use our product documentation to understand the possible next actions based on stage & status combination.


    Data Retention Policy: You can query and operate PaymentDispute resources for a maximum of 2 years since creation.'
  x-domain: Payment Acceptance
  x-resource: Payment Disputes
  x-urlPath: payments/payment_disputes
paths:
  /api/v1/pa/payment_disputes/{id}:
    get:
      tags:
      - Payment Acceptance > Payment Disputes
      summary: 1|Retrieve a Payment Dispute
      description: Retrieve Payment Dispute information using Payment Dispute unique identifier.
      operationId: retrievePaymentDispute
      parameters:
      - name: id
        in: path
        description: Payment Dispute unique identifier.
        required: true
        schema:
          type: string
          default: dst_hkst98v9kgk2t7otgl0
