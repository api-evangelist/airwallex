  /api/v1/pa/payment_disputes/{id}/accept:
    post:
      tags:
      - Payment Acceptance > Payment Disputes
      summary: 4|Accept a Payment Dispute
      description: Accept a Payment Dispute. When a Payment Dispute is under status `REQUIRES_RESPONSE`, you can accept it to avoid further escalation and fees. Accepting the dispute during `RFI` stage will trigger a full refund. The refund amount and reason can be customized by populating the `refund` field.
      operationId: accept
      parameters:
      - name: id
        in: path
        description: Payment Dispute unique identifier.
        required: true
        schema:
          type: string
          default: dst_hkst98v9kgk2t7otgl0
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                accepted_by:
                  type: string
                  description: User unique identifier of person/system accepts Payment Dispute.
                description:
                  type: string
                  description: The accept description.
                reason:
                  type: string
                  description: "The accept reason, `OTHERS` is used by default. One of \n\n- `AGREEMENT_REACHED_WITH_CUSTOMER`\n- `CUSTOMER_RELATIONSHIP_MAINTENANCE` \n- `LOW_VALUE_TRANSACTION`\n- `VALID_CUSTOMER_DISPUTE` \n- `COLLABORATION_ACCEPTED_MANUAL`\n- `OTHERS`.\n"
                refund:
                  type: object
                  description: The Refund to be created. It is applicable when accepting a dispute at the `RFI` stage.
                  properties:
                    amount:
                      type: number
                      description: The refund amount when accepting `RFI`. If not specified, it will be same as the remaining amount that has been captured but not yet refunded. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
                    reason:
                      type: string
                      description: The refund reason when accepting `RFI`. `OTHERS` is used by default. One of `REQUESTED_BY_CUSTOMER`, `DUPLICATE`, `FRAUDULENT`, `ABANDONED`, and `OTHERS`.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant.
        description: Dispute respond request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDispute'
        '201':
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
