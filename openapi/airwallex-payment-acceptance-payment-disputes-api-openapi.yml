        status:
          type: string
          description: "Payment Dispute status. Possible values: \n\n- **REQUIRES_RESPONSE**: In this status, you can decide whether to accept or challenge the Payment Dispute.\n  - Applicable when receive notification from card schemes that Payment Dispute has entered `RFI`, `PRE_CHARGEBACK`, `CHARGEBACK`, or `PRE_ARBITRATION` stage.\n- **CHALLENGED**: In this status, we have informed the issuing bank that you would like to challenge the Payment Dispute.\n  - Applicable when you challenge the Payment Dispute. At `PRE_CHARGEBACK` stage, the issuing bank will escalate to the chargeback stage in the following days. At `RFI`, `CHARGEBACK`, and `PRE_ARBITRATION` stage, the issuing bank will review your submitted evidence and decide whether to escalate the Payment Dispute or not.\n- **ACCEPTED**: In this status the Payment Dispute has been accepted and the payment will be refunded to the shopper.\n  - Applicable when you accept the Payment Dispute at `RFI`, `PRE_CHARGEBACK`, `CHARGEBACK`, and `PRE_ARBITRATION` stage.\n- **REVERSED**: In this status, the Payment Dispute has been reversed by the issuing bank. No further action is required.\n  - Applicable when receive notification from card schemes that Payment Dispute has been reversed at `PRE_CHARGEBACK`, `CHARGEBACK`, and `PRE_ARBITRATION` stage.\n- **WON**: In this status, the issuing bank has accepted the response provided, or card schemes have ruled the Payment Dispute decision in your favor. No further action is required.\n  - Applicable at `CHARGEBACK`, `PRE_ARBITRATION` and `ARBITRATION` stage.\n- **LOST**: In this status, the issuing bank has not accepted the evidence provided by you, or card schemes have ruled the Payment Dispute decision in Issuer’s favor. No further action is required.\n  - Applicable at `PRE_ARBITRATION` and `ARBITRATION` stage.\n- **PENDING_CLOSURE**: In this status, the issuing bank has escalated the Payment Dispute to `PRE_ARBITRATION` stage and Airwallex is reviewing the Payment Dispute. Airwallex will decide whether to accept the Payment Dispute or respond to it on your behalf and may reach out to you for more information.\n  - Applicable at `PRE_ARBITRATION` stage.\n- **EXPIRED**: In this status, the `RFI` event has expired as you have not responded to the request within 15 days.\n  - Applicable at `RFI` stage.\n- **PENDING_DECISION**: In this status, we have responded to the issuing bank with evidence provided by you. The issuing bank will review your submitted evidence and decide whether to accept the Payment Dispute or not.\n  - Applicable at `PRE_ARBITRATION` and `ARBITRATION` stage."
