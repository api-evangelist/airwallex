  /api/v1/pa/payment_disputes:
    get:
      tags:
      - Payment Acceptance > Payment Disputes
      summary: 2|List all Payment Disputes
      description: List all Payment Disputes using stage, status, reason code, due date, created time or updated time.
      operationId: listPaymentDisputes
      parameters:
      - name: connected_account_id
        in: query
        description: Optional Airwallex-assigned identifier of the connected account to filter by. Only applicable to platforms.
        required: false
        schema:
          type: string
      - name: customer_id
        in: query
        description: The customer unique identifier of original payment.
        required: false
        schema:
          type: string
          default: cus_ps8e0ZgQzd2QnCxVpzJrHD6KOVu
      - name: customer_name
        in: query
        description: The customer name of original payment.
        required: false
        schema:
          type: string
          default: John Doe
      - name: from_created_at
        in: query
        description: The start time of created_at in ISO8601 format.
        required: false
        schema:
          type: string
          default: 2023-08-08T08:00:00+0000
      - name: from_due_at
        in: query
        description: The start time of due_at in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2023-08-08T08:00:00+00:00'
      - name: from_updated_at
        in: query
        description: The start time of updated_at in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2023-08-08T08:00:00+00:00'
      - name: merchant_order_id
        in: query
        description: The order unique identifier of original payment.
        required: false
        schema:
          type: string
          default: '123456'
      - name: page
        in: query
        description: '`0` or the BASE 64 encoded resource unique identifier of Payment Dispute and navigation direction to indicate the page should be returned. `0` is used by default for initial page.'
        required: false
        schema:
          type: string
          default: '0'
      - name: payment_intent_id
        in: query
        description: Payment Dispute status.
        required: false
        schema:
          type: string
          default: int_sgstfwxj9gkanu6hezi
      - name: payment_method_type
        in: query
        description: The payment method type of original payment.
        required: false
        schema:
          type: string
          default: VISA
      - name: reason_code
        in: query
        description: Payment Dispute reason code.
        required: false
        schema:
          type: string
          default: '10.4'
      - name: size
        in: query
        description: Number of Payment Disputes to be listed per page. Default value is 10. Maximum is 1000. The value greater than the maximum will be capped to the maximum.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: stage
        in: query
        description: Payment Dispute stage.
        required: false
        schema:
          type: string
          default: CHARGEBACK
      - name: status
        in: query
        description: Payment Dispute status.
        required: false
        schema:
          type: string
          default: REQUIRES_RESPONSE
      - name: to_created_at
        in: query
        description: The end time of created_at in ISO8601 format.
        required: false
        schema:
          type: string
          default: 2023-08-08T08:00:00+0000
      - name: to_due_at
        in: query
        description: The end time of due_at in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2023-08-08T08:00:00+00:00'
      - name: to_updated_at
        in: query
        description: The end time of updated_at in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2023-08-08T08:00:00+00:00'
      - name: transaction_type
        in: query
        description: 'The transaction type of the original transaction. Possible values: `PAYMENT`, `REFUND`.'
        required: false
        schema:
          type: string
          default: PAYMENT
