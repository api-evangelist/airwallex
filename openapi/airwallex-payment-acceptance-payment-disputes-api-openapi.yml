  /api/v1/pa/payment_disputes/{id}/challenge:
    post:
      tags:
      - Payment Acceptance > Payment Disputes
      summary: 5|Challenge a Payment Dispute
      description: Challenge a Payment Dispute. When you receive a Payment Dispute in Chargeback or RFI stage with `REQUIRES_RESPONSE` status then you can further challenge the Payment Dispute. Challenge response should include at least one of the recommended evidence document types attached, please use File Service to upload files and refer to it under `supporting_documents`. There are different suggested information sections in different stages, please check if the section is applicable before submission.
      operationId: challenge
      parameters:
      - name: id
        in: path
        description: Payment Dispute unique identifier.
        required: true
        schema:
          type: string
          default: dst_hkst98v9kgk2t7otgl0
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                challenge_method:
                  type: string
                  description: "The method used to challenge the dispute. Possible values: \n\n- **AI_DISPUTE_AUTOMATION**: Challenge using [AI Dispute Automation](/docs/payments/payment-operations/disputes/dispute-automation)\n  - Applicable when Payment Dispute stage is `CHARGEBACK` and AI Dispute Automation status is `AVAILABLE`\n- **STANDARD**: Challenge using standard flow\n\nDefault to `STANDARD` if not provided."
                challenged_by:
                  type: string
                  description: User unique identifier of person/system challenges Payment Dispute.
                customer_info:
                  type: object
                  description: Customer information. Applicable when Payment Dispute stage is `CHARGEBACK`.
                  properties:
                    billing_address:
                      type: string
                      description: Customer billing address.
                    device_id:
                      type: string
                      description: Customer device unique identifier.
                    email:
                      type: string
                      description: Customer email.
                    ip:
                      type: string
                      description: Customer ip.
                    name:
                      type: string
                      description: Customer name.
                    phone_number:
                      type: string
                      description: Customer phone number.
                delivery_info:
                  type: object
                  description: The delivery information of goods or services.
                  properties:
                    address:
                      type: string
                      description: The shipping address. Applicable at stage `RFI`.
                    delivered_at:
                      type: string
                      format: date-time
                      description: The date when services or goods are delivered.
                    fee_amount:
                      type: number
                      description: The amount of shipping fee. Applicable at stage `RFI`. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
                    fee_currency:
                      type: string
                      description: The currency of shipping fee. Applicable at stage `RFI`. Please refer to [supported currencies](/docs/payments/supported-currencies).
                    name:
                      type: string
                      description: The recipient's name. Applicable at stage `RFI`.
                    phone_number:
                      type: string
                      description: The recipient's phone number. Applicable at stage `RFI`.
                    shipped_at:
                      type: string
                      format: date-time
                      description: The shipping date (the expected delivery date for `RFI`).
                    shipping_company:
                      type: string
                      description: The company name managing this delivery, such as asendia-usa, 4px, and so on.
                    shipping_method:
                      type: string
                      description: The shipping method, such as Priority Mail, Flat rate, and so on. Applicable at stage `RFI`.
                    status:
                      type: string
                      description: The shipping status, such as `SHIPPED`, `DELIVERED`, and so on. Applicable at stage `RFI`.
                    tracking_number:
                      type: string
                      description: The shipping tracking number.
                description:
                  type: string
                  description: "The additional description of the Payment Dispute.  \nDeprecated. Use `supporting_documents.documents.description` instead."
                duplicate_charge_info:
                  type: object
                  description: The defense information when a Payment Dispute is raised due to a duplicate charge.
                  properties:
                    explanation:
                      type: string
                      description: The explanation of duplicate payment.
                    payment_id:
                      type: string
                      description: The unique identifier of duplicate payment.
                evidence:
                  type: object
                  description: Evidence required when challenge_method is set to `AI_DISPUTE_AUTOMATION`.
                  properties:
                    access_activity_file_ids:
                      type: array
                      description: 'File unique identifiers of access activity files. Provide screenshots from your activity log that show the customer''s on-site behaviour, such as login times or download timestamps. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    authenticity_proof_file_ids:
                      type: array
                      description: 'File unique identifiers of authenticity proof files. Provide documentation that confirms your products are genuine and not counterfeit. This can include certificates, supplier invoices, or brand authorization letters. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    customer_communication_file_ids:
                      type: array
                      description: 'File unique identifiers of customer communication files. Provide copies of any emails, chat logs, or messages with the customer that show communication before or after the purchase. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    duplicate_acquirer_reference_number:
                      type: string
                      description: Acquirer reference number of the duplicate transaction.
                    duplicate_explanation:
                      type: string
                      description: Explanation of the duplicate transaction.
                    duplicate_payment_file_ids:
                      type: array
                      description: 'File unique identifiers of duplicate payment files. Provide documents that show how this transaction differs from any potential duplicates. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    duplicate_transaction_amount_currency:
                      type: string
                      description: Amount and currency of the duplicate transaction.
                    duplicate_transaction_created_at:
                      type: string
                      format: date-time
                      description: Creation date of the duplicate transaction.
                    merchant_business_model_description:
                      type: string
                      description: Description of the merchant's business model.
                    order_fulfilled_at:
                      type: string
                      format: date-time
                      description: Date and time when the order was fulfilled.
                    order_fulfillment_file_ids:
                      type: array
                      description: 'File unique identifiers of order fulfillment files. Provide screenshots of delivery confirmation or shipment tracking information that clearly show the order was successfully delivered. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    order_snapshot_file_ids:
                      type: array
                      description: 'File unique identifiers of order snapshot files. Provide screenshots of the customer''s receipt or order confirmation page as evidence that the customer placed the order. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    previous_dispute_won_on_same_card_file_ids:
                      type: array
                      description: 'File unique identifiers of previous won disputes on same card. Provide evidence of any previous disputes that you won for transactions using the same card. This helps establish a history of legitimate transactions. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    previous_purchase_similar_product_file_ids:
                      type: array
                      description: 'File unique identifiers of previous purchases of similar products. Provide proof of the customer''s past purchases of similar items to show their history and relationship with your business. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    product_consumption_file_ids:
                      type: array
                      description: 'File unique identifiers of product usage files. Provide evidence that the customer has used the product or service, such as a login record or usage timestamp. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    product_description:
                      type: string
                      description: Description of the product.
                    product_snapshot_file_ids:
                      type: array
                      description: 'File unique identifiers of product snapshot files. Provide a screenshot of the product page or a photo of the item to show that the product matches its description. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    refund_policy_file_ids:
                      type: array
                      description: 'File unique identifiers for your refund policy documents. Upload all documents that describe your refund policy. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                    refund_policy_url:
                      type: string
                      description: URL of the refund policy page.
                    user_agreement_file_ids:
                      type: array
                      description: 'File unique identifiers of user agreement files. Upload your user agreement forms that outline the terms and conditions for your customers. Supported file formats: JPG, PNG, WEBP and max 10MB size. Please use [File Service](/docs/api/supporting_services/file_service/upload_files) to upload files.'
                      items:
                        type: string
                order_info:
                  type: object
                  description: The order information. Applicable when Payment Dispute stage is `RFI`.
                  properties:
                    created_at:
                      type: string
                      format: date-time
                      description: Time at which this order was created.
                    id:
                      type: string
                      description: The order unique identifier.
                    invoice_number:
                      type: string
                      description: The invoice number of order.
                    products:
                      type: array
                      description: The products of order.
                      items:
                        type: object
                        properties:
                          category:
                            type: string
                            description: Product category at the merchant store, such as home furnishings, pet supplies, apparel and accessories.
                          code:
                            type: string
                            description: Merchant’s product identifier code. Maximum of 128 characters.
                          desc:
                            type: string
                            description: Product description. Maximum of 500 characters.
                          effective_end_at:
                            type: string
                            description: The effective end time of the product, only applicable when product type is `intangible_good`. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
                          effective_start_at:
                            type: string
                            description: The effective start time of the product, only applicable when product type is `intangible_good`. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
                          image_url:
                            type: string
                            description: The preview image url for this product, which is usually displayed as thumbnail in the order details.
                          name:
                            type: string
                            description: Name of the product. Maximum of 255 characters.
                          quantity:
                            type: integer
                            format: int32
                            description: Product quantity.
                          seller:
                            type: object
                            description: Seller info of the purchase order.
                            properties:
                              identifier:
                                type: string
                                description: The identifier of the seller in the merchant's system.
                              name:
                                type: string
                                description: The name of the seller in the merchant's system.
                          sku:
                            type: string
                            description: Stock keeping unit. A unique identifier assigned by the merchant to identify and track this specific product. Maximum of 128 characters.
                          type:
                            type: string
                            description: Type of product, such as `physical_good`, `intangible_good`, or `service`. Maximum of 128 characters.
                          unit_price:
                            type: number
                            description: Product unit price.
                          url:
                            type: string
                            description: The url that links to the product page at merchant site.
                    total_amount:
                      type: number
                      description: The total amount of order. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
                    total_currency:
                      type: string
                      description: The currency of total amount in 3-letter ISO 4217 currency code. Please refer to [supported currencies](/docs/payments/supported-currencies).
                product_description:
                  type: string
                  description: The description of the product. Applicable when the Payment Dispute stage is `CHARGEBACK`.
                product_type:
                  type: string
                  description: 'The type of the product. Possible values: `PHYSICAL_GOODS`, `DIGITAL_PRODUCT_OR_SERVICE`, `OFFLINE_SERVICE`, `TRAVEL`, `RESERVE_OR_BOOKING`, `OTHERS`. Required when the Payment Dispute stage is `CHARGEBACK`.'
                reason:
                  type: string
                  description: "The reason why the merchant challenges the dispute. Possible values: \n\n- **CUSTOMER_WITHDRAWN**: The customer withdrew the dispute\n- **CUSTOMER_REFUNDED**: The customer has already been refunded\n- **PRODUCT_RECEIVED**: The customer has already received / will receive the product or service\n- **PURCHASE_HISTORY**: The customer has a purchasing history with me\n- **NOT_ENTITLED**: The customer is not entitled to refund\n- **SEPARATE_PRODUCT**: The customer purchased separate products or services\n- **AUTHENTIC_PRODUCT**: The product is not damaged, defective or counterfeit\n- **OTHER_REASONS**: Other reasons for challenging.\n"
                refund_refusal_reason:
                  type: string
                  description: Explanation of why refund is refused. Applicable when Payment Dispute stage is `CHARGEBACK`.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant.
                seller_info:
                  type: object
                  description: Seller information. Applicable when Payment Dispute stage is `RFI`.
                  properties:
                    name:
                      type: string
                      description: Seller name.
                    store_name:
                      type: string
                      description: Store name.
                    store_physical_address:
                      type: string
                      description: Store physical address.
                    store_url:
                      type: string
                      description: Store URL.
                supporting_documents:
                  type: object
                  description: The file unique identifiers of support documents.
                  properties:
                    customer_communication_documents:
                      type: array
                      description: "The file IDs of customer communication. Applicable when stage is `CHARGEBACK`.  \nDeprecated. Use `documents` instead."
                      items:
                        type: string
                    customer_signature_documents:
                      type: array
                      description: "The file IDs of customer signature. Applicable when stage is `CHARGEBACK`.  \nDeprecated. Use `documents` instead."
                      items:
                        type: string
                    documents:
                      type: array
                      description: List of documents.
                      items:
                        type: object
                        properties:
                          description:
                            type: string
                            description: Additional file descriptions or explanations.
                          file_ids:
                            type: array
                            description: File unique identifiers of the documents.
                            items:
                              type: string
                          type:
                            type: string
                            description: 'Type of the documents. Possible values: `PRIMARY`, `ORDER`, `CUSTOMER`, `OTHER`.


                              - **PRIMARY**: The primary evidence depends on the challenge reason.

                              - **ORDER**: Order related evidence.

                              - **CUSTOMER**: Customer related evidence.

                              - **OTHER**: Other supporting evidence.

                              '
                    duplicate_charge_defense_documents:
                      type: array
                      description: "The file IDs of duplicate payment evidence. Applicable when stage is `CHARGEBACK`.  \nDeprecated. Use `documents` instead."
                      items:
                        type: string
                    other_documents:
                      type: array
                      description: "The list of file IDs of other documents.  \nDeprecated. Use `documents` instead."
                      items:
                        type: string
                    proof_of_delivery_documents:
                      type: array
                      description: "The file IDs of proof of delivery. Applicable when stage is `CHARGEBACK`.  \nDeprecated. Use `documents` instead."
                      items:
                        type: string
                    receipt_documents:
                      type: array
                      description: "The file IDs of the receipt. Applicable when stage is `CHARGEBACK`.  \nDeprecated. Use `documents` instead."
                      items:
                        type: string
                    refund_policy_documents:
                      type: array
                      description: "The file IDs of the refund policy. Applicable when stage is `CHARGEBACK`.  \nDeprecated. Use `documents` instead."
                      items:
                        type: string
