      - scope: beneficiary:read
        group: Payouts
        resource_name: Beneficiaries
      - scope: beneficiary:write
        group: Payouts
        resource_name: Beneficiaries
      - scope: transfer:write
        group: Authentication
        resource_name: Embedded Components - Transfers
      x-domain: Payouts
      x-resource: Payers
      x-urlPath: create
      x-oauthSupported: true
      x-resourceLevel: account
