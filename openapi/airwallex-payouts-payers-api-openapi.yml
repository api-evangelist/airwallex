openapi: 3.2.0
info:
  title: Airwallex Payouts > Payers API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payouts > Payers
  description: By default you make payments from yourself therefore this resource is optional. However if your Airwallex Account allows paying on behalf of others, you can create new payers and this resource becomes mandatory to be defined which payer you are paying from.
  x-domain: Payouts
  x-resource: Payers
  x-urlPath: payouts/payers
paths:
  /api/v1/payers/create:
    post:
      tags:
      - Payouts > Payers
      summary: 1|Create a Payer
      description: Create a new payer to be stored on the Airwallex platform.
      operationId: createPayer
      x-oboSupported: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - payer
              properties:
                nickname:
                  type: string
                  description: Nickname of the payer.
                payer:
                  type: object
                  required:
                  - address
                  - entity_type
                  description: Details of the payer.
                  properties:
                    additional_info:
                      type: object
                      description: Additional information about the payer.
                      properties:
                        business_registration_number:
                          type: string
                          description: Business registration number.
                        business_registration_type:
                          type: string
                          description: Type of business as registered with the local government authority.
                        external_id:
                          type: string
                          description: Unique identifier of the person in your company.
                        personal_email:
                          type: string
                          description: Personal email.
                        personal_id_number:
                          type: string
                          description: Personal unique identifier number.
                    address:
                      type: object
                      required:
                      - country_code
                      description: Payer's address details.
                      properties:
                        city:
                          type: string
                          description: Payer's city.
                        country_code:
                          type: string
                          description: Payer's country code (2-letter ISO 3166-2 country code).
                        postcode:
                          type: string
                          description: Payer's post code.
                        state:
                          type: string
                          description: Payer's state.
                        street_address:
                          type: string
                          description: Payer's street address.
                    company_name:
                      type: string
                      description: Company name of the payer.
                    date_of_birth:
                      type: string
                      description: Payer's date of birth.
                    entity_type:
                      type: string
                      description: Entity type of the payer.
                    first_name:
                      type: string
                      description: First name of the payer.
                    last_name:
                      type: string
                      description: Last name of the payer.
              description: The partial payer creation request.  Any subset of fields can be supplied, starting at an empty object (`{}`).
        description: payerContactRequestDto.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayerContact'
        '400':
          description: '["validation_failed"

            ,"service_unavailable"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/payers/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          nickname: Complete Concrete Pty Ltd
          payer:
            additional_info:
              business_registration_number: EU300503
              business_registration_type: Partnership
              external_id: '1234567890'
              personal_email: james.smith@google.com
              personal_id_number: '1234567890'
            address:
              city: Melbourne
              country_code: AU
              postcode: '3000'
              state: VIC
              street_address: 15 William Street
            company_name: Complete Concrete Pty Ltd
            date_of_birth: '1976-08-26'
            entity_type: COMPANY
            first_name: James
            last_name: Smith
        response_body:
          id: 46c22228-5831-4c53-a4fa-a3ab4954877c
          nickname: Complete Concrete Pty Ltd
          payer:
            additional_info:
              business_registration_number: EU300503
              business_registration_type: Partnership
              external_id: '1234567890'
              personal_email: james.smith@google.com
              personal_id_number: '1234567890'
            address:
