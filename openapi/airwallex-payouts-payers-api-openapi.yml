  /api/v1/payers/schema:
    post:
      tags:
      - Payouts > Payers
      summary: 7|Retrieve the Payer Schema
      description: 'Given a partial payer request, return a dynamic schema of all fields. Can be used to generate a dynamic payer form user interface.


        [beta]: This is a new endpoint with significant complexity, so the experience of integrating with it will be improved as we obtain more feedback. It is ready for production use, and is currently used internally by Airwallex for our Webapp beneficiary form and dynamic schema documentation. Please get in touch with our support team if you''d like to know more.'
      operationId: payers_schema
      x-oboSupported: false
      x-stage: beta
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                create_payer_request:
                  type: object
                  required:
                  - payer
                  description: The partial payer creation request.  Any subset of fields can be supplied, starting at an empty object (`{}`).
                  properties:
                    nickname:
                      type: string
                      description: Nickname of the payer.
                    payer:
                      type: object
                      required:
                      - address
                      - entity_type
                      description: Details of the payer.
                      properties:
                        additional_info:
                          type: object
                          description: Additional information about the payer.
                          properties:
                            business_registration_number:
                              type: string
                              description: Business registration number.
                            business_registration_type:
                              type: string
