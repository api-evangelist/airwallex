  /api/v1/payers:
    get:
      tags:
      - Payouts > Payers
      summary: 3|List all Payers
      description: Get list of payers with optional filters on from date/time, to date/time, names and entity type. Results are paginated, with default list limit of 50 results.
      operationId: listPayers
      x-oboSupported: false
      parameters:
      - name: entity_type
        in: query
        description: Filter on entity type of COMPANY or PERSONAL.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: COMPANY
      - name: from_date
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
          default: '2017-04-01'
      - name: name
        in: query
        description: Filter on name of payer.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: Clare
      - name: nick_name
        in: query
        description: Filter on nickname of payer.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: to_date
        in: query
        description: The end date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
          default: 2030-01-01T00:00:00+0000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: Paged results.
                    items:
                      $ref: '#/components/schemas/PayerContact'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
