  /api/v1/risk/risk_reports/generate:
    post:
      summary: Generate a risk report
      description: Submits a risk report query for the authenticated merchant. Returns immediately with an `id`; the report is generated asynchronously. Poll the **Retrieve a risk report** endpoint (`GET /api/v1/risk/risk_reports/{id}`) using the returned `id` to track progress. When the report reaches `COMPLETED` status, obtain a short-lived signed download link.
      operationId: generateRiskReport
      x-oboSupported: false
      tags:
      - Risk > Risk Reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - start_date
              - end_date
              - type
              properties:
                start_date:
                  type: string
                  format: date
                  description: "Start date (inclusive, in `YYYY-MM-DD` format, UTC) to specify the data records that the report should include. This parameter is a filter for:\n * Fraud reported date in the `PAYMENT_FRAUD_REPORT`\n\nFor example, request a risk report with `start_date` = `2026-04-01` and `end_date` = `2026-06-30` to obtain records from `2026-04-01` to `2026-06-30` inclusive, in UTC.\n\nThe max interval size between `start_date` and `end_date` is 90 days."
                end_date:
                  type: string
                  format: date
                  description: "End date (inclusive, in `YYYY-MM-DD` format, UTC) to specify the data records that the report should include. This parameter is a filter for:\n * Fraud reported date in the `PAYMENT_FRAUD_REPORT`\n\nFor example, request a risk report with `start_date` = `2026-04-01` and `end_date` = `2026-06-30` to obtain records from `2026-04-01` to `2026-06-30` inclusive, in UTC.\n\nThe max interval size between `start_date` and `end_date` is 90 days."
                type:
                  type: string
                  description: Type of report requested.
                  enum:
                  - PAYMENT_FRAUD_REPORT
                  x-enumDescriptions:
                    PAYMENT_FRAUD_REPORT: Payment fraud reported data, including the Visa TC40 and Mastercard SAFE reports.
        description: Risk report query.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskReport'
        '400':
          description: '["invalid_argument"]'
