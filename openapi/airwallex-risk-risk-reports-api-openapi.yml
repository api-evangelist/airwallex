components:
  schemas:
    RiskReport:
      description: A risk report represents an asynchronous request to generate and download a merchant's risk dataset for a given date range and report type. It progresses through a simple lifecycle (`PENDING` → `COMPLETED` or `FAILED`). When `COMPLETED`, it exposes a short-lived, signed file download link.
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          description: Unique ID of the report.
        status:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
          description: Status of the report.
        start_date:
          type: string
          format: date
          description: Start date of the report (UTC).
        end_date:
          type: string
          format: date
          description: End date of the report (UTC).
        type:
          type: string
          enum:
          - PAYMENT_FRAUD_REPORT
          description: Type of report requested.
        file:
          type: object
          description: File result. Present when `status` is `COMPLETED`.
          properties:
            name:
              type: string
              description: File name of the report.
            download_url:
              type: string
              description: File download URL.
            expires_at:
              type: string
              format: date-time
              description: File download URL expiration date.
        failure_reason:
          type: string
          description: Reason the report failed. Populated when `status` is `FAILED`.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
