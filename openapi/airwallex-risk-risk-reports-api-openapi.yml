tags:
- name: Risk > Risk Reports
  description: 'The Risk Reports API lets merchants self-serve their own risk datasets. The currently supported report type is `PAYMENT_FRAUD_REPORT`, which contains payment fraud data reported through acquirer TC40 / SAFE reports for a given date range.


    Use Generate a risk report to submit a query and obtain a report `id`, followed by Retrieve a risk report to track the report status. When the report reaches `COMPLETED` status, obtain a short-lived signed download link. Reports are generated asynchronously. Subscribe to the `risk.risk_reports.completed` and `risk.risk_reports.failed` webhook events to be notified when a report is ready or generation has failed.'
  x-domain: Risk
  x-resource: Risk Reports
  x-urlPath: risk/risk_reports
paths:
  /api/v1/risk/risk_reports/{id}:
    get:
      summary: Retrieve a risk report
      description: Fetches the status of a risk report and, once the report is `COMPLETED`, returns a short-lived signed download link. The link is regenerated on each poll, so an expired link is replaced with a new link on the next call.
      operationId: retrieveRiskReport
      x-oboSupported: false
      tags:
      - Risk > Risk Reports
      parameters:
      - name: id
        in: path
        description: Unique ID of the risk report.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
