  /api/v1/billing/subscriptions:
    get:
      description: Retrieves a list of Subscriptions based on the query parameters.
      operationId: listSubscriptions
      parameters:
      - description: ID of the [Billing Customer](/docs/api/billing/billing_customers) who subscribes to this subscription.
        in: query
        name: billing_customer_id
        required: false
        schema:
          type: string
      - description: Status of the subscription, one of `PENDING`, `IN_TRIAL`, `ACTIVE`, `UNPAID` or `CANCELLED`.
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: The start date of `created_at` in ISO8601 format (inclusive).
        in: query
        name: from_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The end date of `created_at` in ISO8601 format (exclusive).
        in: query
        name: to_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The number of period units between subscription billing cycles.
        in: query
        name: recurring_period
        required: false
        schema:
          type: integer
          format: int32
      - description: Specifies billing frequency. One of `DAY`, `WEEK`, `MONTH` or `YEAR`.
        in: query
        name: recurring_period_unit
        required: false
        schema:
          type: string
      - description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not `null`) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not `null`) from the response to a subsequent call.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: Number of Subscriptions per page. Defaults to `20`.
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
