  /api/v1/billing/subscriptions/{id}/update:
    post:
      description: Updates a Subscription. Only fields provided in the request are updated, while omitted fields remain unchanged. Array fields are fully replaced if included. Set a field to null or an empty string (for strings) to clear its value.
      operationId: updateSubscription
      parameters:
      - description: ID of the Subscription object.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - request_id
              type: object
              properties:
                billing_action:
                  type: string
                  description: 'Specifies how to handle billing when updating the subscription.

                    Defaults to `DEFER_CHARGE_AND_KEEP_CYCLE`.'
                  enum:
                  - DEFER_CHARGE_AND_KEEP_CYCLE
                  - IMMEDIATE_CHARGE_AND_KEEP_CYCLE
                  - IMMEDIATE_CHARGE_AND_RESET_CYCLE
                  x-enumDescriptions:
                    DEFER_CHARGE_AND_KEEP_CYCLE: Prorated in-advance fees are applied to the next upcoming invoice. In-arrears fees are still billed on its original billing date. Keep the current billing cycle anchor unchanged.
                    IMMEDIATE_CHARGE_AND_KEEP_CYCLE: A one-time adjustment invoice is generated and attempted for payment upon the subscription update. Keep the current billing cycle anchor unchanged.
                    IMMEDIATE_CHARGE_AND_RESET_CYCLE: Resets the subscription's `billing_cycle_anchor_at` to the time of update request. After you reset the billing cycle anchor, the subscription immediately sends an invoice for prorations. The upcoming billing cycles will be aligned on the new billing cycle anchor.
                cancel_at_period_end:
                  type: boolean
                  description: '`true` if the subscription is scheduled to be cancelled at the end of the current period, `false` otherwise.'
                collection_method:
                  type: string
                  description: Specify how payment is collected, one of `AUTO_CHARGE`, `CHARGE_ON_CHECKOUT` or `OUT_OF_BAND`.
                days_until_due:
                  minimum: 0
                  type: integer
                  description: Number of days from invoice finalization until payment is due.
                  format: int32
                default_invoice_template:
                  type: object
                  description: Invoices for this subscription will be created using the specified settings.
                  properties:
                    invoice_memo:
                      maxLength: 500
                      minLength: 0
                      type: string
                      description: Memo to be used for the invoices that are generated by this Subscription.
                default_proration_mode:
                  type: string
                  description: 'By default, how to handle credit and fee prorations for all Subscription Item changes.

                    Defaults to `PRORATED`.'
                  enum:
                  - NONE
                  - PRORATED
                  - ALL
                  x-enumDescriptions:
                    NONE: Does not issue any credit for the Subscription's unused time, only charges the new fee from the next billing cycle.
                    PRORATED: Calculates and applies the proration on both credit and fee for the Subscription's unused time.
                    ALL: Credits the full remaining creditable amount of the old items for the current billing cycle, and charges the full amount of the new items for the current billing cycle.
                default_tax_percent:
                  maximum: 100
                  minimum: 0
                  type: number
                  description: The tax percent between `0` and `100` to be applied to invoices to be generated. The tax will be exclusive.
                discounts:
                  maxItems: 1
                  minItems: 0
                  type: array
                  description: Desired set of subscription-level discounts. If provided, replaces all existing subscription-level discounts. Currently, only one element is supported.
                  items:
                    required:
                    - coupon
                    type: object
                    properties:
                      coupon:
                        required:
                        - id
                        type: object
                        description: Coupon to redeem into a discount for this resource. Only required when `type` = `COUPON`.
                        properties:
                          id:
                            type: string
                            description: Id of the Coupon object.
                      type:
                        pattern: ^(COUPON)$
                        type: string
                        description: 'Specifies how to obtain a new discount. One of: `COUPON`.'
                duration:
                  required:
                  - period
                  - period_unit
                  type: object
                  description: "The total billing duration of the subscription.\n\n The subscription will continue indefinitely if `duration`, `remaining_duration` and `ends_at` are all null in the update request."
                  properties:
                    period:
                      minimum: 1
                      type: integer
                      description: The number of period units.
                      format: int32
                    period_unit:
                      type: string
                      description: Specifies billing duration. One of `DAY`, `WEEK`, `MONTH` or `YEAR`.
                enable_automatic_tax:
                  type: boolean
                  description: Whether automatic tax is enabled for this subscription. When enabled, the system attempts to calculate taxes for this subscription's invoice automatically.
                ends_at:
                  type: string
                  description: "Time when the subscription is scheduled to end.\n\n The subscription will continue indefinitely if `duration`, `remaining_duration` and `ends_at` are all null in the update request."
                items:
                  type: array
                  description: List of Subscription Items to be added, updated, or deleted. It may trigger credit and proration when the subscription status is `ACTIVE`. If an existing item is not included in the list, it remains unchanged. You may add 100 items at a time.
                  items:
                    type: object
                    properties:
                      deleted:
                        type: boolean
                        description: If set to true, will delete the specified subscription item.
                      discounts:
                        type: array
                        description: List of discounts to be applied to the Subscription Item. Discounts of subscription items are applied before subscription discounts. Currently, only one element is supported.
                        items:
                          required:
                          - coupon
                          - type
                          type: object
                          properties:
                            coupon:
                              required:
                              - id
                              type: object
                              description: Coupon to redeem into a discount for this resource. Only required when `type` = `COUPON`.
                              properties:
                                id:
                                  type: string
                                  description: Id of the Coupon object.
                            type:
                              pattern: ^(COUPON)$
                              type: string
                              description: 'Specifies how to obtain the discount. One of: `COUPON`.'
                      id:
                        type: string
                        description: ID of the Subscription Item to be updated or be deleted. If not provided, a new Subscription Item will be added.
                      metadata:
                        type: object
                        additionalProperties:
                          type: string
                          description: A set of string key-value pairs that you can attach to this object for storing additional information.
                        description: A set of string key-value pairs that you can attach to this object for storing additional information.
                      price_id:
                        type: string
                        description: ID of the Price. Required when adding a new item. You can't update the `price_id` of the existing item.
                      proration_mode:
                        type: string
                        description: 'Specifies how to handle credit and fee prorations for the Subscription Item. This field overrides the `default_proration_mode` provided in the update request.

                          Defaults to `PRORATED`.'
                        enum:
                        - NONE
                        - PRORATED
                        - ALL
                        x-enumDescriptions:
                          NONE: Does not issue any credit for the Subscription's unused time, only charges the new fee from the next billing cycle.
                          PRORATED: Calculates and applies the proration on both credit and fee for the Subscription's unused time.
                          ALL: Credits the full remaining creditable amount of the old items for the current billing cycle, and charges the full amount of the new items for the current billing cycle.
                      quantity:
                        minimum: 1
                        type: integer
                        description: The quantity of the product.
                        format: int32
                      rate_card_id:
                        type: string
                        description: ID of the [Rate Card](/docs/api/billing/rate_cards) object. Required when adding a new item. You can't update the `rate_card_id` of the existing item.
                      rate_card_version:
                        type: integer
                        description: Pinned Rate Card version number. Required when adding a new item with `rate_card_id`.
                        format: int32
                      tax_percent:
                        maximum: 100
                        minimum: 0
                        type: number
                        description: The effective tax percent of this subscription item.
                legal_entity_id:
                  type: string
                  description: ID of the legal entity to be used as billing entity. You can find this ID in the Airwallex web app > Settings.
                linked_payment_account_id:
                  type: string
                  description: ID of the linked payment account to collect payment. You can find this ID in the Airwallex web app > Settings > Account details, within the Account Information section.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of string key-value pairs that you can attach to this object for storing additional information.
                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                payment_options:
                  type: object
                  description: Payment settings applied to invoices generated by this Subscription. Only applicable when `collection_method` is `CHARGE_ON_CHECKOUT` or `AUTO_CHARGE`.
                  properties:
                    payment_method_types:
                      type: array
                      description: "Specify the payment methods and their order for display on the digital invoice pages of this Subscription. Note: Only payment methods supported for the specified currency and the customer's country code will be shown.  \nPossible enum values: `card`, `applepay`, `googlepay`, `alipaycn`, `alipayhk`, `dana`, `gcash`, `kakaopay`, `klarna`, `rabbit_line_pay`, `tng`, `truemoney`."
                      items:
                        type: string
                        description: "Specify the payment methods and their order for display on the digital invoice pages of this Subscription. Note: Only payment methods supported for the specified currency and the customer's country code will be shown.  \nPossible enum values: `card`, `applepay`, `googlepay`, `alipaycn`, `alipayhk`, `dana`, `gcash`, `kakaopay`, `klarna`, `rabbit_line_pay`, `tng`, `truemoney`."
                    payment_method_save:
                      type: object
                      description: 'Settings that control whether and how a payment method provided by a customer while paying a subscription invoice is saved for future use.

                        Only applicable when the Subscription uses the `AUTO_CHARGE` collection method.

                        When not provided, defaults to `mode=ENABLED` and `next_triggered_by=MERCHANT`.'
                      properties:
                        mode:
                          type: string
                          description: 'Controls whether the payment method can be saved for future use. Possible values: `ENABLED`, `DISABLED`, or `COLLECT_CONSENT`.

                            - `ENABLED`: The payment method will be saved for future use.

                            - `DISABLED`: The payment method will not be saved.

                            - `COLLECT_CONSENT`: The invoice UI asks the customer whether they want to save the payment method. Only applicable to cards.'
                        next_triggered_by:
                          type: string
                          description: 'Indicates who will use the saved payment source to trigger future payments. One of `MERCHANT` or `CUSTOMER`.

                            If `MERCHANT`, a Payment Source is created for future use. If `CUSTOMER`, the payment method is saved only with the payment provider.'
                payment_source_id:
                  type: string
                  description: ID of the [Payment Source](/docs/api/billing/payment_sources) to pay for the subscription at each billing period. Required if `collection_method` is `AUTO_CHARGE`. If the payment_source_id is updated, the last failed invoice payment associated with this subscription will be retried immediately.
                remaining_duration:
                  required:
                  - period
                  - period_unit
                  type: object
                  description: "Update the remaining billing duration of the subscription after the time of request.\n\n The subscription will continue indefinitely if `duration`, `remaining_duration` and `ends_at` are all null in the update request."
                  properties:
                    period:
                      minimum: 1
                      type: integer
                      description: The number of period units.
                      format: int32
                    period_unit:
                      type: string
                      description: Specifies billing duration. One of `DAY`, `WEEK`, `MONTH` or `YEAR`.
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
                starts_at:
                  type: string
                  description: Time when the subscription started or is scheduled to start. Use `NOW` to start the subscription immediately. Only applicable when `status` is `PENDING`.
                trial_ends_at:
                  type: string
                  description: The end time of the trial if applicable. Use `NOW` to end the trial immediately.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: OK
