components:
  schemas:
    DiscountResponse:
      required:
      - applied_to
      - applied_to_id
      - billing_customer_id
      - created_at
      - discount_model
      - duration_type
      - id
      - name
      - source
      - starts_at
      - updated_at
      type: object
      properties:
        amount_off:
          type: number
          description: The fixed amount to deduct when `discount_model` is `FLAT`.
        applied_to:
          type: string
          description: "Specifies the type of object this discount applies to. Possible values: \n- `SUBSCRIPTION`: Applies to an entire subscription. \n- `SUBSCRIPTION_ITEM`: Applies to a specific item within a subscription. \n- `INVOICE`: Applies to an entire invoice. \n- `INVOICE_LINE_ITEM`: Applies to a specific line item on an invoice."
        applied_to_id:
          type: string
          description: ID of the specific target object the discount is applied to. Must correspond to the object type defined in applied_to.
        billing_customer_id:
          type: string
          description: The ID of the billing customer to whom the coupon is applied.
        checkout_id:
          type: string
          description: The ID of the Checkout where this discount was redeemed, if applicable.
        created_at:
          type: string
          description: Time when the Discount was created.
          format: date-time
        currency:
          type: string
          description: The currency of `amount_off` when `discount_model` is `FLAT`.
        discount_model:
          type: string
          description: "Specified how to calculate the discount amount when applied, one of \n- `FLAT`: fixed amount off.\n- `PERCENTAGE`: percentage off."
        duration:
          $ref: '#/components/schemas/CouponDuration'
          description: The duration of the discount to apply, when `duration_type` is `CUSTOM`. `null` if `duration_type` is `ONCE` or `INDEFINITELY`.
        duration_type:
          type: string
          description: "Determines how long the coupon's discount remains active after being applied. Possible values: \n- `ONCE`: Applies only to the first charge of a subscription or a one-off invoice.\n- `CUSTOM`: Applies to all charges within a specified number of billing cycles, as defined by duration.\n- `INDEFINITELY`: Applies to all future charges for the subscription until it is removed."
        ends_at:
          type: string
          description: The timestamp when the discount expires. Present only when the associated coupon's duration_type is CUSTOM.
        id:
          type: string
          description: ID of the Discount object.
        name:
          type: string
          description: Name of the discount. For discounts created from a coupon, defaults to the coupon name at creation time.
        percentage_off:
          type: number
          description: The percentage between 0 to 100 to be applied to deduct when `discount_model` is `PERCENTAGE`.
        source:
          type: string
          description: "Source of the Discount. Possible values: \n- `COUPON`: the discount is applied through a coupon."
        source_id:
          type: string
          description: ID of the creating source, e.g. is the ID of the coupon if source = COUPON.
        starts_at:
          type: string
          description: Time when the discount takes effect. For discounts applied to a subscription or subscription item, this corresponds to the start date of the first billing period.
        updated_at:
          type: string
          description: Time when the Discount was updated.
          format: date-time
    CursorPaginationClientApiResponseSubscriptionItem:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/SubscriptionItem'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    CursorPaginationClientApiResponseSubscription:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/Subscription'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    CouponDuration:
      required:
      - period
      - period_unit
      type: object
      properties:
        period:
          type: integer
          description: The number of period units.
          format: int32
          minimum: 1
        period_unit:
          type: string
          description: Specifies duration. One of `DAY`, `WEEK`, `MONTH`, `YEAR`.
          pattern: ^(DAY|WEEK|MONTH|YEAR)$
      description: The duration of the coupon to apply, when `duration_type`is `CUSTOM`. `null` if `duration_type` is `ONCE` or `INDEFINITELY`.
    RateCard:
      required:
      - active
      - created_at
      - currency
      - id
      - meter_id
      - name
      - product_id
      - recurring
      - tax_included
      - updated_at
      type: object
      properties:
        active:
          type: boolean
          description: '`true` if the rate card is available for new purchases, `false` otherwise.'
        created_at:
          type: string
          description: Time when this rate card was created.
        currency:
          type: string
          description: Currency of the items of this rate card (in 3-letter ISO-4217 format).
        description:
          type: string
          description: Rate card description. Used for internal classification and identification.
        id:
          type: string
          description: ID of the Rate Card object.
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of string key-value pairs that you can attach to this object for storing additional information.
          description: A set of string key-value pairs that you can attach to this object for storing additional information.
        meter_id:
          type: string
          description: ID of the [Meter](/docs/api/billing/meters) object specifying how to calculate the usage for the items of this rate card.
        name:
          type: string
          description: Rate card name.
        product_id:
          type: string
          description: ID of the [Product](/docs/api/billing/products) object this rate card is associated with.
        recurring:
          $ref: '#/components/schemas/SubscriptionRecurring'
          description: The frequency at which the items of this rate card are charged.
        tax_included:
          type: boolean
          description: Whether the item prices include tax.
        updated_at:
          type: string
          description: Time when this rate card was last updated.
      description: Represents a versioned container for multi-dimensional pricing that groups multiple Rate Card Items by dimension combinations under a shared set of billing fields.
    ProductResponse:
      required:
      - active
      - created_at
      - id
      - name
      - unit
      - updated_at
      type: object
      properties:
        active:
          type: boolean
          description: '`true` if the product is available for new purchases, `false` otherwise.'
        created_at:
          type: string
          description: Time when this product was created.
        description:
          type: string
          description: Product description.
        id:
          type: string
          description: ID of the Product object.
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of string key-value pairs that you can attach to this object for storing additional information.
          description: A set of string key-value pairs that you can attach to this object for storing additional information.
        name:
          type: string
          description: Product name.
        tax_code:
          type: string
          description: The tax category of the product.
        unit:
          type: string
          description: Product unit.
        updated_at:
          type: string
          description: Time when this product was last updated.
      description: Details of the [Product](/docs/api/billing/products) object this price is associated with.
    RateCardVersionWithRateCard:
      required:
      - created_at
      - dimension_keys
      - rate_card
      - rate_card_id
      - version
      type: object
      properties:
        created_at:
          type: string
          description: Time when this rate card version was created.
        dimension_keys:
          type: array
          description: Subset of or equal to the Meter's `dimension_keys`. Defines which dimension keys are used in each item's `dimension_values`. Append-only across versions — a new version's set must contain all keys from the previous version.
          items:
            type: string
        rate_card:
          $ref: '#/components/schemas/RateCard'
          description: The Rate Card this version belongs to.
        rate_card_id:
          type: string
          description: ID of the Rate Card this version belongs to.
        version:
          type: integer
          description: The version number within the Rate Card, starting from `1`.
          format: int32
      description: The pinned Rate Card Version on a Subscription Item, including the associated Rate Card.
    PriceTier:
      required:
      - level
      type: object
      properties:
        flat_amount:
          type: number
          description: The flat amount to be charged for this tier when pricing model is `GRADUATED`, or the overall flat amount to be charged when pricing model is `VOLUME`.
          minimum: 0
        level:
          type: integer
          description: The sequential position of the tier within the price definition. Starts from 1.
          format: int32
        lot:
          $ref: '#/components/schemas/PriceLot'
          description: Defines how quantity is grouped into billable lots. The unit_amount is then applied per lot. If not set, quantity is treated as the number of billable lots. Only applicable for `VOLUME` and `GRADUATED` prices.
        unit_amount:
          type: number
          description: The per-unit amount to be charged for this tier when pricing model is `GRADUATED`, or the overall per-unit amount to be charged when pricing model is `VOLUME`.
          minimum: 0
        unit_description:
          type: string
          description: Description of the billable unit for the tier.
        upper_bound:
          type: number
          description: The upper quantity limit of this tier. This tier is applicable when the quantity does not exceed the upper bound of this tier, and is greater than the upper bound of the tier below it(or `0` if this is the first tier). For the last tier, the upper bound must be left empty.
          minimum: 0
    PriceRecurring:
      required:
      - period
      - period_unit
      type: object
      properties:
        period:
          type: integer
          description: The number of period units between subscription billing cycles. For example, the billing cycle is bi-monthly if `period=2` and `period_unit=MONTH`.
          format: int32
        period_unit:
          type: string
          description: Specifies billing frequency. One of `DAY`, `WEEK`, `MONTH` or `YEAR`.
      description: The frequency at which the price is charged. null for one-time charge.
    PriceLot:
      required:
      - rounding_mode
      - size
      type: object
      properties:
        rounding_mode:
          pattern: ^UP$
          type: string
          description: Specifies how to round the calculated lots when the total quantity is not an exact multiple of the size. One of `UP`.
        size:
          minimum: 2
          type: integer
          description: The amount of quantity that constitutes a single billable lot.
          format: int32
      description: Defines how quantity is grouped into billable lots. The unit_amount is then applied per lot. If not set, quantity is treated as the number of billable lots. Only applicable for `PER_UNIT` price.
    Subscription:
      required:
      - applied_discounts
      - automatic_tax_status
      - billing_customer_id
      - cancel_at_period_end
      - collection_method
      - created_at
      - currency
      - days_until_due
      - enable_automatic_tax
      - id
      - recurring
      - starts_at
      - status
      - updated_at
      type: object
      properties:
        applied_discounts:
          type: array
          description: List of the discounts that are applied to the Subscription. Discounts of subscription items are applied before the subscription discounts.
          items:
            $ref: '#/components/schemas/DiscountResponse'
        automatic_tax_status:
          type: string
          description: The automatic tax status of this subscription.
          enum:
          - APPLIED
          - LOCATION_NOT_SUPPORTED
          - LOCATION_NOT_REGISTERED_BY_MERCHANT
          - ADDRESS_INCOMPLETE
          - DISABLED
          x-enumDescriptions:
            APPLIED: The automatic tax is applied.
            LOCATION_NOT_SUPPORTED: Automatic tax calculation isn't supported in the customer's location.
            LOCATION_NOT_REGISTERED_BY_MERCHANT: The merchant isn't registered to collect tax in the customer's location.
            ADDRESS_INCOMPLETE: The customer address was insufficient or invalid to determine the correct tax.
            DISABLED: The automatic tax is disabled.
        billing_customer_id:
          type: string
          description: ID of the [Billing Customer](/docs/api/billing/billing_customers) who subscribes to this subscription.
        billing_cycle_anchor_at:
          type: string
          description: A future timestamp in the first billing cycle as the reference point to align the future billing date.
        cancel_at_period_end:
          type: boolean
          description: '`true` if  the subscription is scheduled to be cancelled at the end of the current billing period, `false` otherwise.'
        cancel_requested_at:
          type: string
          description: Time when the cancellation request was received.
        collection_method:
          type: string
          description: Specify how payment is collected, one of `AUTO_CHARGE`, `CHARGE_ON_CHECKOUT` or `OUT_OF_BAND`.
        created_at:
          type: string
          description: Time when the subscription was created.
        currency:
