openapi: 3.2.0
info:
  title: Airwallex Billing > Subscriptions API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Billing > Subscriptions
  description: 'A Subscription manages the billing lifecycle for the recurring products or services that a customer purchases. One or more Products and Prices can be added as Subscription Items to a Subscription.


    Customers can be charged automatically, or be issued invoices that they will pay manually every billing cycle.


    If a Subscription is set to charge a Billing Customer''s Payment Source automatically, the charge will either happen at the start or end of a billing cycle depending on whether a Price''s billing type is `IN_ADVANCE` or `IN_ARREARS`:


    - `IN_ADVANCE`: billed at the beginning of the billing cycle.

    - `IN_ARREARS`: billed at the end of the billing cycle.


    A Subscription with a free trial moves from `IN_TRIAL` status to `ACTIVE` status when the trial period ends. If a Subscription is created with a future start time, it will be in `PENDING` status until the trial period or paid billing period starts. The status of a Subscription is `UNPAID` when a payment initially fails. When this happens, Airwallex will retry payment up to 4 times (after 1 day, 2 days, 5 days and 7 days).


    The status of a Subscription moves to `ACTIVE` if a payment retry attempt succeeds, or `CANCELLED` if all retries fail. A Subscription moves to `CANCELLED` when it ends or if cancelled.'
  x-domain: Billing
  x-resource: Subscriptions
  x-urlPath: billing/subscriptions
paths:
  /api/v1/billing/subscriptions/create:
    post:
      description: Create a new Subscription for an existing Billing Customer to charge the customer on a recurring basis.
      operationId: createSubscription
      requestBody:
        content:
          application/json:
            schema:
              required:
              - billing_customer_id
              - collection_method
              - items
              - request_id
              type: object
              properties:
                billing_customer_id:
                  type: string
                  description: ID of the [Billing Customer](/docs/api/billing/billing_customers) who subscribes to this subscription.
                billing_cycle_anchor_at:
                  type: string
                  description: A future timestamp in the first billing cycle as the reference point to align the future billing date.
                collection_method:
                  type: string
                  description: Specify how payment is collected, one of `AUTO_CHARGE`, `CHARGE_ON_CHECKOUT` or `OUT_OF_BAND`.
                currency:
                  type: string
                  description: The currency of the subscription in 3-letter ISO-4217 format.
                days_until_due:
                  minimum: 0
                  type: integer
                  description: Number of days from invoice finalization until payment is due. Defaults to `0`.
                  format: int32
                default_invoice_template:
                  type: object
                  description: Invoices for this subscription will be created using the specified settings.
                  properties:
                    invoice_memo:
                      maxLength: 500
                      minLength: 0
                      type: string
                      description: Memo to be used for the invoices that are generated by this Subscription.
                default_tax_percent:
                  maximum: 100
                  minimum: 0
                  type: number
                  description: The tax percent between `0` and `100` to be applied to invoices to be generated. The tax will be exclusive. Defaults to `0`.
                discounts:
                  type: array
                  description: List of discounts to be applied to the subscription. Discounts of subscription items are applied before subscription discounts. Currently, only one element is supported.
                  items:
                    required:
                    - coupon
                    - type
                    type: object
                    properties:
                      coupon:
                        required:
                        - id
                        type: object
                        description: Coupon to redeem into a discount for this resource. Only required when `type` = `COUPON`.
                        properties:
                          id:
                            type: string
                            description: Id of the Coupon object.
                      type:
                        pattern: ^(COUPON)$
                        type: string
                        description: 'Specifies how to obtain the discount. One of: `COUPON`.'
                duration:
                  required:
                  - period
                  - period_unit
                  type: object
                  description: "The total billing duration of the subscription. The subscription will continue indefinitely if both of `duration` and `ends_at` are null.\nIt is only applicable when `ends_at` is empty. \n"
                  properties:
                    period:
                      minimum: 1
                      type: integer
                      description: The number of period units.
                      format: int32
                    period_unit:
                      type: string
                      description: Specifies billing duration. One of `DAY`, `WEEK`, `MONTH` or `YEAR`.
                enable_automatic_tax:
                  type: boolean
                  description: Whether automatic tax is enabled for this subscription. When enabled, the system attempts to calculate taxes for this subscription's invoice automatically. Defaults to `false`.
                ends_at:
                  type: string
                  description: "Time when the subscription is scheduled to end. The subscription will continue indefinitely if both of `duration` and `ends_at` are null.\nIt is only applicable when `duration` is empty. \n"
                items:
                  type: array
                  description: List of Subscription Items.
                  items:
                    type: object
                    properties:
                      discounts:
                        type: array
                        description: List of discounts to be applied to the Subscription Item. Discounts of subscription items are applied before subscription discounts. Currently, only one element is supported.
                        items:
                          required:
                          - coupon
                          - type
                          type: object
                          properties:
                            coupon:
                              required:
                              - id
                              type: object
                              description: Coupon to redeem into a discount for this resource. Only required when `type` = `COUPON`.
                              properties:
                                id:
                                  type: string
                                  description: Id of the Coupon object.
                            type:
                              pattern: ^(COUPON)$
                              type: string
                              description: 'Specifies how to obtain the discount. One of: `COUPON`.'
                      metadata:
                        type: object
                        additionalProperties:
                          type: string
                          description: A set of string key-value pairs that you can attach to this object for storing additional information.
                        description: A set of string key-value pairs that you can attach to this object for storing additional information.
                      price:
                        required:
                        - currency
                        type: object
                        description: One-time price definition following the same schema as the [Price](/docs/api/billing/prices) resource. Exactly one of `price_id`, `price`, or `rate_card_id` is required.
                        properties:
                          currency:
                            type: string
                            description: Currency of the price (in 3-letter ISO-4217 format).
                          description:
                            maxLength: 500
                            minLength: 0
                            type: string
                            description: Price description. Used for internal classification and identification.
                          flat_amount:
                            maximum: 9999999999
                            minimum: 0
                            type: number
                            description: The fixed amount to be charged. Only required when the pricing model is `FLAT`.
                          metadata:
                            type: object
                            additionalProperties:
                              type: string
                              description: Custom key-value pairs attached to the price.
                            description: Custom key-value pairs attached to the price.
                          pricing_model:
                            type: string
                            description: 'Specify how to calculate the total billing amount when a quantity is provided. One of

                              - `FLAT`: a fixed price.

                              - `PER_UNIT`: a fixed price per unit quantity.

                              Defaults to `PER_UNIT`.'
                          product:
                            required:
                            - name
                            type: object
                            description: One-time product definition following the same schema as the [Product](/docs/api/billing/products). Exactly one of `product_id` or `product` is required.
                            properties:
                              description:
                                maxLength: 500
                                minLength: 0
                                type: string
                                description: Product description. Used for internal classification and identification.
                              metadata:
                                type: object
                                additionalProperties:
                                  type: string
                                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                                description: A set of string key-value pairs that you can attach to this object for storing additional information.
                              name:
                                maxLength: 200
                                minLength: 0
                                type: string
                                description: Product name.
                              tax_code:
                                type: string
                                description: The tax category of the product.
                              unit:
                                maxLength: 30
                                minLength: 0
                                type: string
                                description: Product unit.
                          product_id:
                            type: string
                            description: ID of the [Product](/docs/api/billing/products) object. Exactly one of `product_id` or `product` is required.
                          tax_included:
                            type: boolean
                            description: Whether the price includes tax. Defaults to `false`.
                          unit_amount:
                            maximum: 9999999999
                            minimum: 0
                            type: number
                            description: The amount to be charged per product unit. Only required when the pricing model is `PER_UNIT`.
                      price_id:
                        type: string
                        description: ID of the [Price](/docs/api/billing/prices) subscribed by the customer. All Prices in the subscription must have recurring frequencies that are compatible - meaning they must be exact multiples or divisors of one another (e.g., `1 MONTH` and `1 YEAR` are compatible; `1 WEEK` and `1 MONTH` are not). Exactly one of `price_id`, `price`, or `rate_card_id` is required.
                      quantity:
                        minimum: 1
                        type: integer
                        description: The quantity of the product. Defaults to `1`.
                        format: int32
                      rate_card_id:
                        type: string
                        description: ID of a [Rate Card](/docs/api/billing/rate_cards) object. Exactly one of `price_id`, `price`, or `rate_card_id` is required.
                      rate_card_version:
                        type: integer
                        description: Pinned Rate Card version number. Required when `rate_card_id` is set.
                        format: int32
                      tax_percent:
                        maximum: 100
                        minimum: 0
                        type: number
                        description: The effective tax percent of this subscription item.
                legal_entity_id:
                  type: string
                  description: ID of the legal entity to be used as billing entity. You can find this ID in the Airwallex web app > Settings. Required if you have more than 1 entity in your organisation.
                linked_payment_account_id:
                  type: string
                  description: ID of the linked payment account to collect payment. You can find this ID in the Airwallex web app > Settings > Account details, within the Account Information section. Required if `collection_method` is `CHARGE_ON_CHECKOUT` and if you have more than 1 payment account in your organisation.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of string key-value pairs that you can attach to this object for storing additional information.
                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                payment_options:
                  type: object
                  description: Payment settings applied to invoices generated by this Subscription. Only applicable when `collection_method` is `CHARGE_ON_CHECKOUT` or `AUTO_CHARGE`.
                  properties:
                    payment_method_types:
                      type: array
                      description: "Specify the payment methods and their order for display on the digital invoice pages of this Subscription. Note: Only payment methods supported for the specified currency and the customer's country code will be shown.  \nPossible enum values: `card`, `applepay`, `googlepay`, `alipaycn`, `alipayhk`, `dana`, `gcash`, `kakaopay`, `klarna`, `rabbit_line_pay`, `tng`, `truemoney`."
                      items:
                        type: string
                        description: "Specify the payment methods and their order for display on the digital invoice pages of this Subscription. Note: Only payment methods supported for the specified currency and the customer's country code will be shown.  \nPossible enum values: `card`, `applepay`, `googlepay`, `alipaycn`, `alipayhk`, `dana`, `gcash`, `kakaopay`, `klarna`, `rabbit_line_pay`, `tng`, `truemoney`."
                    payment_method_save:
                      type: object
                      description: 'Settings that control whether and how a payment method provided by a customer while paying a subscription invoice is saved for future use.

                        Only applicable when the Subscription uses the `AUTO_CHARGE` collection method.

                        When not provided, defaults to `mode=ENABLED` and `next_triggered_by=MERCHANT`.'
                      properties:
                        mode:
                          type: string
                          description: 'Controls whether the payment method can be saved for future use. Possible values: `ENABLED`, `DISABLED`, or `COLLECT_CONSENT`.

                            - `ENABLED`: The payment method will be saved for future use.

                            - `DISABLED`: The payment method will not be saved.

                            - `COLLECT_CONSENT`: The invoice UI asks the customer whether they want to save the payment method. Only applicable to cards.'
                        next_triggered_by:
                          type: string
                          description: 'Indicates who will use the saved payment source to trigger future payments. One of `MERCHANT` or `CUSTOMER`.

                            If `MERCHANT`, a Payment Source is created for future use. If `CUSTOMER`, the payment method is saved only with the payment provider.'
                payment_source_id:
                  type: string
                  description: ID of the [Payment Source](/docs/api/billing/payment_sources) to pay for the subscription at each billing period. Required if `collection_method` is `AUTO_CHARGE`.
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
                starts_at:
                  type: string
                  description: Time when the subscription started or scheduled to start. Defaults to start immediately after creation.
                trial_ends_at:
                  type: string
                  description: The end time of the trial if applicable.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
          description: Created
        '400':
          description: "Bad Request. Possible error codes: `validation_error`, `duplicate_request_id`, `suspended_from_online_payments`, `currency_not_supported`, `provider_unavailable`, `resource_not_found`(invalid `billing_customer_id` or `payment_source_id`), `frequency_above_limit`, `configuration_error`, `authentication_declined`, `risk_declined`, `provider_declined`, `quote_expired`, `issuer_declined`, `no_3ds_liability_shift`, `rejected_by_routing_rules`.  \n  \nFor payment-related error codes (`authentication_declined`, `risk_declined`, `provider_declined`, `quote_expired`, `issuer_declined`, `no_3ds_liability_shift`, `rejected_by_routing_rules`), ID of the [Payment Intent](/docs/api/payments/payment_intents) will be returned in the error `details`. Retrieve the Payment Intent to get detailed error information for the failed payment."
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Create a Subscription
