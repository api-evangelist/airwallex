          type: number
          description: Available balance.
        currency:
          type: string
          description: Three-letter ISO 4217 currency code.
        reserved_amount:
          type: number
          description: Reserved balance.
        total_amount:
          type: number
          description: Account total balance.
      description: Limit balance information.
