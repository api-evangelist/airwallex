        available_limit:
          type: number
          description: The available limit after this transaction.
        connected_account_id:
          type: string
          description: Unique identifier of the Connected Account to which the spending account is linked. Empty for `DC_CREDIT/DEBIT` transactions, which represent limit updates resulting from deposits and withdrawals.
        currency:
          type: string
          description: The transaction currency in 3-letter ISO-4217 format.
        id:
          type: string
          description: Unique identifier of the transaction object.
        posted_at:
          type: string
          description: Timestamp of the transaction posted to balance.
        source_id:
          type: string
          description: Unique identifier of the source transaction. For `LIQUIDITY_*` transactions, this is the Issuing card transaction event identifier, which can be retrieved using [Retrieve a Card Transaction Event](/docs/api/issuing/card_transaction_events/retrieve). For `DC_CREDIT` and `DC_DEBIT` transactions, this is the financial transaction identifier, which can be looked up using [List Financial Transactions](/docs/api/financial_platform/financial_transactions/list) by passing it as the `source_id` query parameter.
        transaction_type:
          type: string
          description: "The type of this transaction. Possible values:\n * `DC_CREDIT`: Increase of the program balance after a deposit.\n * `DC_DEBIT`: Decrease of the program balance after a withdrawal.\n * `LIQUIDITY_AUTH_CREDIT`: Increase of the program balance when a card authorization is released.\n * `LIQUIDITY_AUTH_DEBIT`: Decrease of the program balance to reserve funds for a card authorization.\n * `LIQUIDITY_FUNDING_CREDIT`: Increase of the program balance when a card transaction is refunded.\n * `LIQUIDITY_FUNDING_DEBIT`: Decrease of the program balance to fund a card capture.\n"
      description: Program transaction.
    ProgramSpendingAccountLimitBalance:
      type: object
      required:
      - available_amount
      - currency
      - reserved_amount
      - total_amount
      properties:
        available_amount:
