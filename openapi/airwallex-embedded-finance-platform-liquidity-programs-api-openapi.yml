          type: string
          description: Unique identifier of the funding source. Use this identifier to link a card to the program's spending account. Refer to [Create a Card](/docs/api/issuing/cards/create).
        id:
          type: string
          description: Unique identifier of the program spending account.
        limit_balances:
          type: array
          description: Per-currency balances when `limit_policy` is `ENFORCED`; `null` when `limit_policy` is `BYPASSED`.
          items:
            $ref: '#/components/schemas/ProgramSpendingAccountLimitBalance'
        limit_policy:
          type: string
          description: Policy controlling whether local spending limits are enforced.
          enum:
          - BYPASSED
          - ENFORCED
        status:
          type: string
          description: Status of the spending account, either `ACTIVE` or `INACTIVE`.
        updated_at:
          type: string
          description: The time the spending account was last updated.
      description: Program Spending Account.
    SupportedCurrency:
      type: object
      properties:
