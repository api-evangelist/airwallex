  /api/v1/platform_liquidity_programs/{id}/deposit:
    post:
      tags:
      - Embedded Finance > Platform Liquidity Programs
      x-stage: beta
      summary: 2|Deposit Funds Into a Program
      description: Deposits funds into the program's settlement Airwallex account from the platform's wallet. The program limit balance will increase by the deposited amount.
      operationId: deposit
      x-oboSupported: false
      parameters:
      - name: id
        in: path
        description: Unique identifier of the program.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - currency
              - request_id
              properties:
                amount:
                  type: number
                  description: Deposit amount, greater than 0.
                currency:
                  type: string
                  description: Currency in 3-letter ISO-4217 format.
                request_id:
                  type: string
                  description: A unique request identifier specified by the client. It's used by Airwallex for idempotency check. In case of timeout, the client can retry with the same `request_id`.
              description: Deposit request for platform liquidity program.
        description: Deposit details.
        required: true
      responses:
