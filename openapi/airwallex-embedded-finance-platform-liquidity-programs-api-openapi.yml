          description: Amount available for new spending.
        currency:
          type: string
          description: Three-letter ISO 4217 currency code.
        reserved_amount:
          type: number
          description: Amount reserved by pending spending.
        total_amount:
          type: number
          description: Sum of `available_amount` and `reserved_amount`.
      description: Per-currency limit balance for a program spending account.
