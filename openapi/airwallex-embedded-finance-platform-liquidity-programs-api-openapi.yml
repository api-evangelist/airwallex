  /api/v1/platform_liquidity_programs/{id}/program_spending_accounts/{spending_account_id}/adjust_limits:
    post:
      tags:
      - Embedded Finance > Platform Liquidity Programs
      x-stage: beta
      summary: 7|Adjust Program Spending Account Limits
      description: Updates a spending account's spending limits. Set `limit_policy` to `ENFORCED` to apply per-currency limits, or `BYPASSED` to turn them off. When enforcing, you can include `limit_adjustments` to raise or lower each currency's limit (a positive amount increases it, a negative amount decreases it). Leave `limit_adjustments` out when `limit_policy` is `BYPASSED`.
      operationId: programSpendingAccountsAdjustLimits
      x-oboSupported: false
      parameters:
      - name: id
        in: path
        description: Unique identifier of the program.
        required: true
        schema:
          type: string
      - name: spending_account_id
        in: path
        description: Program Spending Account unique identifier.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - limit_policy
              - request_id
              properties:
                limit_adjustments:
                  type: array
                  description: Non-empty signed per-currency adjustments for `ENFORCED`; omitted for `BYPASSED`.
                  items:
                    type: object
                    required:
                    - amount
                    - currency
                    properties:
                      amount:
                        type: number
                        description: Amount to adjust the available limit. Positive values increase the limit; negative values decrease it. Supports up to two decimal places.
                      currency:
                        type: string
                        description: Supported uppercase three-letter ISO 4217 currency code.
                    description: Signed adjustment to one currency's available limit.
                limit_policy:
                  type: string
                  description: Target limit policy.
                  enum:
                  - BYPASSED
                  - ENFORCED
                request_id:
                  type: string
                  description: A globally unique UUID specified by the client to ensure idempotency. If the request times out, retry with the same `request_id`.
              description: Request to adjust a program spending account's limit policy and per-currency limits.
        description: Target policy and optional signed limit adjustments.
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramSpendingAccount'
        '400':
