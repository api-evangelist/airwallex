          items:
            type: string
        created_at:
          type: string
          description: The time the program was created.
        id:
          type: string
          description: Unique identifier of the Platform Liquidity Program.
        limit_balances:
          type: array
          description: Array of program balance information.
          items:
            $ref: '#/components/schemas/LimitBalance'
        name:
          type: string
          description: Name of the Platform Liquidity Program.
        status:
          type: string
          description: Status of the Platform Liquidity Program, either `ACTIVE` or `INACTIVE`.
        supported_currencies:
          type: array
          deprecated: true
          description: Array of currency configurations.
          items:
            $ref: '#/components/schemas/SupportedCurrency'
