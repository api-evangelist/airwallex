openapi: 3.2.0
info:
  title: Airwallex Simulation (Sandbox Only) > Accounts API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Simulation (Sandbox Only) > Accounts
  description: Simulate the status transition of a connected account through its lifecycle in the sandbox environment.
  x-domain: Simulation (Sandbox Only)
  x-resource: Accounts
  x-urlPath: simulation/accounts
paths:
  /api/v1/simulation/account/amendments/{id}/approve:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Accounts
      summary: 1|Approve an Account Amendment
      description: Use this endpoint to approve an account amendment in PENDING status. Please note that the action is asynchronous and may take some time to complete. This endpoint does not guarantee an immediate status change upon request.
      operationId: simulation_approveAmendment
      parameters:
      - name: id
        in: path
        description: Account amendment unique identifier.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationAmendment'
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '404':
          description: not_found
        '500':
          description: service_unavailable
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/simulation/account/amendments/account_id/approve
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 202
        reason_phrase: Accepted
        response_body:
          id: <string>
          primary_contact:
            email: alice.smith@gmail.com
            mobile: <string>
          status: APPROVED
          store_details:
            cross_border_transaction_percent: '5.6'
            dispute_percent: '1.5'
            employee_size: 100
            estimated_transaction_volume:
              average_amount_per_transaction: '100'
              currency: AUD
              max_amount_per_transaction: '1000'
              monthly_transaction_amount: '500000'
            financial_statements:
            - file_id: your_file_id
            fulfillment_days: 3
            industry_code: ICCV3_0002XX
            mcc: '5599'
            operating_models:
            - ONLINE_CHECKOUT
            - INVOICES_OR_CUSTOM_ORDER_LINKS
            payment_distribution: []
            refund_percent: '1.5'
            selling_to_country_codes:
            - US
            - CA
            shipping_from_country_codes:
            - US
            - AU
            store_address:
              address_line1: 200 Collins Street
              address_line2: 200 Collins Street
              country_code: AU
              postcode: '3000'
              state: VIC
              suburb: Melbourne
            store_description: I sell awesome products
            store_name: My Awesome Store
            store_photos:
            - file_id: your_photo_file_id
            store_websites:
            - url: https://my-awesome-store.com
          target: account_details.store_details
      x-scope:
      - scope: simulation:write
        group: Simulations
        resource_name: Simulations
      x-domain: Simulation (Sandbox Only)
      x-resource: Accounts
      x-urlPath: approve_amendments
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
