  /api/v1/simulation/accounts/{account_id}/update_status:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Accounts
      summary: 3|Update Status of Connected Account
      description: 'Use this endpoint to transition the status of a connected account to one of the following: ACTIVE, SUSPENDED. The connected account must be in the SUBMITTED state to transition statuses. Learn about the connected account status lifecycle.'
      operationId: simulation_updateStatus
      parameters:
      - name: account_id
        in: path
        description: Connected account unique identifier.
        required: true
        schema:
          type: string
          default: acct_zwxZXgUJOTCL5J9v89FfJQ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - next_status
              properties:
                force:
                  type: boolean
                  description: Force the account to transition the status. This is true by default. If this is set to false, then any action_required state will not be cleared.
                next_status:
                  type: string
                  description: The connected account status to transition to.
                  enum:
                  - ACTION_REQUIRED
                  - ACTIVE
                  - SUSPENDED
        description: payload
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationAccount'
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '500':
          description: service_unavailable
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/simulation/accounts/account_id/update_status
        request_headers:
