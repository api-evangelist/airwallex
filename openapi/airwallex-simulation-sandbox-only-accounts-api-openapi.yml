components:
  schemas:
    SimulationOtherName:
      type: object
      properties:
        first_name:
          type: string
          description: First name (given name) of the individual person if different.
        last_name:
          type: string
          description: Last name (family name) of the individual person if different.
        middle_name:
          type: string
          description: Middle name of the individual person if different.
    SimulationBusinessPersonDocumentation:
      type: object
      properties:
