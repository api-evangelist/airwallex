openapi: 3.2.0
info:
  title: Airwallex Billing > Rate Cards API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Billing > Rate Cards
  description: 'A Rate Card is a versioned container for multi-dimensional pricing. It groups multiple Rate Card Items, each representing the price for one combination of dimensions (e.g. `model` × `token_type`), under shared billing fields (`product_id`, `meter_id`, `currency`, `recurring`). This lets you define pricing for an entire matrix for a single Product and add it to a Subscription as a single item, instead of creating one Price for each combination.


    Pricing is organized in three layers:

    - Rate Card — the container and its shared billing fields.

    - Rate Card Version — an immutable snapshot of the pricing. Change pricing by publishing a new version; existing subscriptions stay pinned to the version they were created with.

    - Rate Card Item — one entry in the matrix: the price for a specific set of `dimension_values`.


    When usage is billed, each usage record is matched against the version''s items in order and billed at the first item whose `dimension_values` match (an omitted key matches any value; an empty object matches all usage). So one Rate Card subscription item expands into one invoice line item per priced dimension combination that had usage.'
  x-domain: Billing
  x-resource: Rate Cards
  x-urlPath: billing/rate_cards
paths:
  /api/v1/billing/rate_cards/create:
    post:
      description: Create a new Rate Card with shared billing fields, dimension keys, and a list of items. Each item entry creates a Rate Card Item object.
      operationId: createRateCard
      requestBody:
        content:
          application/json:
            schema:
              required:
              - currency
              - dimension_keys
              - items
              - meter_id
              - name
              - product_id
              - recurring
              - request_id
              type: object
              properties:
                currency:
                  type: string
                  description: Currency of the items of this rate card (in 3-letter ISO-4217 format).
                description:
                  maxLength: 500
                  minLength: 0
                  type: string
                  description: Rate card description. Used for internal classification and identification.
                dimension_keys:
                  type: array
                  description: Subset of or equal to the Meter's `dimension_keys`. Defines which dimension keys are used in each item's `dimension_values`.
                  items:
                    type: string
                items:
                  type: array
                  description: Ordered list of item definitions. Each entry creates a Rate Card Item object. At least one is required.
                  minItems: 1
                  items:
                    required:
                    - dimension_values
                    - pricing_model
                    type: object
                    properties:
                      dimension_values:
                        type: object
                        additionalProperties:
                          type: string
                          description: A dimension value that this item applies to.
                        description: The dimension values this item applies to. Each key must be one of the `dimension_keys` (a subset is allowed). Any key omitted here acts as a wildcard, matching any value for that dimension; an empty object matches all usage (a catch-all).
                      lot:
                        required:
                        - rounding_mode
                        - size
                        type: object
                        description: Defines how quantity is grouped into billable lots. The `unit_amount` is then applied per lot. If not set, quantity is treated as the number of billable lots. Only applicable for `PER_UNIT`.
                        properties:
                          rounding_mode:
                            pattern: ^UP$
                            type: string
                            description: Specifies how to round the calculated lots when the total quantity is not an exact multiple of the size. One of `UP`.
                          size:
                            minimum: 2
                            type: integer
                            description: The amount of quantity that constitutes a single billable lot.
                            format: int32
                      pricing_model:
                        type: string
                        description: 'Specify how to calculate the total billing amount when a quantity is provided. One of

                          - `PER_UNIT`: a fixed price per unit quantity.

                          - `VOLUME`: the unit price is based on which tier the total quantity falls in.

                          - `GRADUATED`: the unit price changes as the quantity increases.'
                      tiers:
                        type: array
                        description: List of quantity-based pricing tiers for this item. Required when the pricing model is `VOLUME` or `GRADUATED`.
                        items:
                          type: object
                          properties:
                            flat_amount:
                              minimum: 0
                              type: number
                              description: The flat amount to be charged for this tier when pricing model is `GRADUATED`, or the overall flat amount to be charged when pricing model is `VOLUME`.
                            unit_amount:
                              minimum: 0
                              type: number
                              description: The per-unit amount to be charged for this tier when pricing model is `GRADUATED`, or the overall per-unit amount to be charged when pricing model is `VOLUME`.
                            unit_description:
                              type: string
                              description: Description of the billable unit for the tier.
                            upper_bound:
                              minimum: 0
                              type: number
                              description: The upper quantity limit of this tier. For the last tier, the upper bound must be left empty.
                      unit_amount:
                        minimum: 0
                        type: number
                        description: The amount to be charged per product unit. Only required when the pricing model is `PER_UNIT`.
                      unit_description:
                        type: string
                        description: Description of the billable unit for this item.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of key-value pairs that you can attach to this object for storing additional information.
                  description: A set of key-value pairs that you can attach to this object for storing additional information.
                meter_id:
                  type: string
                  description: ID of the shared [Meter](/docs/api/billing/meters) object specifying how to calculate the usage for the items of this rate card.
                name:
                  maxLength: 200
                  minLength: 0
                  type: string
                  description: Rate card name.
                product_id:
                  type: string
                  description: ID of the [Product](/docs/api/billing/products) object this rate card is associated with.
                recurring:
                  required:
                  - period_unit
                  type: object
                  description: The frequency at which the items of this rate card are charged.
                  properties:
                    period:
                      type: integer
                      description: The number of period units between subscription billing cycles. For example, the billing cycle is bi-monthly if `period=2` and `period_unit=MONTH`. Defaults to `1`.
                      format: int32
                    period_unit:
                      type: string
                      description: Specifies billing frequency. One of `DAY`, `WEEK`, `MONTH` or `YEAR`.
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
                tax_included:
                  type: boolean
                  description: Whether the item prices include tax. Defaults to `false`.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCard'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '404':
          description: 'Not Found. Possible error codes: `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Create a Rate Card
      tags:
      - Billing > Rate Cards
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/billing/rate_cards/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          request_id: b3a8b688-e223-40dd-b034-4db35caaa6d4
          name: GPT Model Pricing
          description: Rate card for GPT model family.
          product_id: prd_hkpd1x2gbgazzvcd42w
          meter_id: mtr_hkpdwesy9gazzrtqbkg
          currency: USD
          tax_included: false
          recurring:
            period: 1
            period_unit: MONTH
          dimension_keys:
          - model
          - token_type
          items:
          - dimension_values:
              model: gpt-5.4
              token_type: input
            pricing_model: PER_UNIT
            unit_amount: 2.5
            lot:
              size: 1000000
              rounding_mode: UP
          - dimension_values:
              model: gpt-5.4
              token_type: output
            pricing_model: PER_UNIT
            unit_amount: 15
            lot:
              size: 1000000
              rounding_mode: UP
          metadata:
            foo: bar
        response_body:
          id: rtc_hkpdwesy9gazzrtqbkg
          active: true
          name: GPT Model Pricing
          description: Rate card for GPT model family.
          product_id: prd_hkpd1x2gbgazzvcd42w
          meter_id: mtr_hkpdwesy9gazzrtqbkg
          currency: USD
          tax_included: false
          recurring:
            period: 1
            period_unit: MONTH
          metadata:
            foo: bar
          created_at: 2026-06-01T00:00:00+0000
          updated_at: 2026-06-01T00:00:00+0000
      x-resourceLevel: org
      x-oboSupported: false
      x-scope:
