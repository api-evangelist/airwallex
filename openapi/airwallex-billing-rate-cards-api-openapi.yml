  /api/v1/billing/rate_cards/{id}/versions/create:
    post:
      description: Publish a new Rate Card version. `items` is the complete ordered list; each entry is either the `id` of an existing Rate Card Item (carried forward by reference) or an inline definition of a new item.
      operationId: createRateCardVersion
      parameters:
      - description: ID of the Rate Card object.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - items
              - request_id
              type: object
              properties:
                dimension_keys:
                  type: array
                  description: The dimension keys this version prices by — a subset of the Meter's `dimension_keys`. Append-only across versions — must be a superset of the previous version's. Inherits the previous version's set if omitted.
                  items:
                    type: string
                items:
                  type: array
                  description: Ordered list of item definitions. Each entry is either an existing Rate Card Item (carried forward by specifying an `id`) or an inline definition of a new item, but not both. At least one is required.
                  minItems: 1
                  items:
                    type: object
                    properties:
                      dimension_values:
                        type: object
                        additionalProperties:
                          type: string
                          description: A dimension value that this item applies to.
                        description: The dimension values this item applies to. Each key must be one of the version's `dimension_keys` (a subset is allowed). Any key omitted here acts as a wildcard, matching any value for that dimension; an empty object matches all usage (a catch-all).
                      id:
                        type: string
                        description: ID of an existing Rate Card Item from this Rate Card to carry forward into the new version.
                      lot:
                        required:
                        - rounding_mode
                        - size
                        type: object
                        description: Defines how quantity is grouped into billable lots. The `unit_amount` is then applied per lot. If not set, quantity is treated as the number of billable lots. Only applicable for `PER_UNIT`.
                        properties:
                          rounding_mode:
                            pattern: ^UP$
                            type: string
                            description: Specifies how to round the calculated lots when the total quantity is not an exact multiple of the size. One of `UP`.
                          size:
                            minimum: 2
                            type: integer
                            description: The amount of quantity that constitutes a single billable lot.
                            format: int32
                      pricing_model:
                        type: string
                        description: 'Specify how to calculate the total billing amount when a quantity is provided. One of

                          - `PER_UNIT`: a fixed price per unit quantity.

                          - `VOLUME`: the unit price is based on which tier the total quantity falls in.

                          - `GRADUATED`: the unit price changes as the quantity increases.'
                      tiers:
                        type: array
                        description: List of quantity-based pricing tiers for this item. Required when the pricing model is `VOLUME` or `GRADUATED`.
                        items:
                          type: object
                          properties:
                            flat_amount:
                              minimum: 0
                              type: number
                              description: The flat amount to be charged for this tier when pricing model is `GRADUATED`, or the overall flat amount to be charged when pricing model is `VOLUME`.
                            unit_amount:
                              minimum: 0
                              type: number
                              description: The per-unit amount to be charged for this tier when pricing model is `GRADUATED`, or the overall per-unit amount to be charged when pricing model is `VOLUME`.
                            unit_description:
                              type: string
                              description: Description of the billable unit for the tier.
                            upper_bound:
                              minimum: 0
                              type: number
                              description: The upper quantity limit of this tier. For the last tier, the upper bound must be left empty.
                      unit_amount:
                        minimum: 0
                        type: number
                        description: The amount to be charged per product unit. Only required when the pricing model is `PER_UNIT`.
                      unit_description:
                        type: string
                        description: Description of the billable unit for this item.
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCardVersion'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '404':
          description: 'Not Found. Possible error codes: `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 5|Create a Rate Card Version
      tags:
      - Billing > Rate Cards
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/billing/rate_cards/rtc_hkpdwesy9gazzrtqbkg/versions/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          request_id: b3a8b688-e223-40dd-b034-4db35caaa6d4
          dimension_keys:
          - model
          - token_type
          items:
          - dimension_values:
              model: gpt-5.4
              token_type: input
            pricing_model: PER_UNIT
            unit_amount: 2.5
            lot:
              size: 1000000
              rounding_mode: UP
          - id: rcit_hkpd7fedfgb004apkvs
        response_body:
          version: 4
          rate_card_id: rtc_hkpdwesy9gazzrtqbkg
          dimension_keys:
          - model
          - token_type
          created_at: 2026-06-01T00:00:00+0000
      x-resourceLevel: org
