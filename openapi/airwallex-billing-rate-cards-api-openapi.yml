          type: string
      - description: The version number within the Rate Card.
        in: path
        name: version
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCardVersion'
          description: OK
        '400':
