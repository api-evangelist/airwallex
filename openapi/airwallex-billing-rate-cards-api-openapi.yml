            $ref: '#/components/schemas/RateCard'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    RateCardItem:
      required:
      - created_at
      - dimension_values
      - id
      - pricing_model
      - rate_card_id
      type: object
      properties:
        created_at:
          type: string
          description: Time when this rate card item was created.
        dimension_values:
          type: object
          additionalProperties:
            type: string
            description: A dimension value that this item applies to.
          description: The dimension values this item applies to. Each key must be one of the Rate Card Version's `dimension_keys` (a subset is allowed). Any key omitted here acts as a wildcard, matching any value for that dimension; an empty object matches all usage (a catch-all).
        id:
          type: string
          description: ID of the Rate Card Item object.
        lot:
          $ref: '#/components/schemas/RateCardItemLot'
          description: Defines how quantity is grouped into billable lots. The `unit_amount` is then applied per lot. If not set, quantity is treated as the number of billable lots. Only applicable for `PER_UNIT`.
        pricing_model:
          type: string
          description: 'Specify how to calculate the total billing amount when a quantity is provided. One of

            - `PER_UNIT`: a fixed price per unit quantity.

            - `VOLUME`: the unit price is based on which tier the total quantity falls in.

            - `GRADUATED`: the unit price changes as the quantity increases.'
        rate_card_id:
          type: string
          description: ID of the Rate Card this item belongs to.
        tiers:
          type: array
          description: List of quantity-based pricing tiers for this item. Only present when the pricing model is `VOLUME` or `GRADUATED`.
          items:
            $ref: '#/components/schemas/RateCardItemTier'
        unit_amount:
          type: number
          description: The amount to be charged per product unit. Only present when the pricing model is `PER_UNIT`.
        unit_description:
          type: string
          description: Description of the billable unit for this item.
      description: A Rate Card Item represents the price for one dimension combination within a Rate Card version.
    CursorPaginationClientApiResponseRateCardItem:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/RateCardItem'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    RateCard:
      required:
      - active
      - created_at
      - currency
      - id
      - meter_id
      - name
      - product_id
      - recurring
      - tax_included
      - updated_at
      type: object
      properties:
        active:
          type: boolean
          description: '`true` if the rate card is available for new purchases, `false` otherwise.'
        created_at:
          type: string
          description: Time when this rate card was created.
        currency:
          type: string
          description: Currency of the items of this rate card (in 3-letter ISO-4217 format).
        description:
          type: string
          description: Rate card description. Used for internal classification and identification.
        id:
          type: string
          description: ID of the Rate Card object.
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of string key-value pairs that you can attach to this object for storing additional information.
          description: A set of string key-value pairs that you can attach to this object for storing additional information.
        meter_id:
          type: string
          description: ID of the [Meter](/docs/api/billing/meters) object specifying how to calculate the usage for the items of this rate card.
        name:
          type: string
          description: Rate card name.
        product_id:
          type: string
          description: ID of the [Product](/docs/api/billing/products) object this rate card is associated with.
        recurring:
          $ref: '#/components/schemas/SubscriptionRecurring'
          description: The frequency at which the items of this rate card are charged.
        tax_included:
          type: boolean
          description: Whether the item prices include tax.
        updated_at:
          type: string
          description: Time when this rate card was last updated.
      description: Represents a versioned container for multi-dimensional pricing that groups multiple Rate Card Items by dimension combinations under a shared set of billing fields.
    RateCardItemLot:
      required:
      - rounding_mode
      - size
      type: object
      properties:
        rounding_mode:
          pattern: ^UP$
          type: string
          description: Specifies how to round the calculated lots when the total quantity is not an exact multiple of the size. One of `UP`.
        size:
          minimum: 2
          type: integer
          description: The amount of quantity that constitutes a single billable lot.
          format: int32
      description: Defines how quantity is grouped into billable lots. The `unit_amount` is then applied per lot. If not set, quantity is treated as the number of billable lots. Only applicable for `PER_UNIT`.
    CursorPaginationClientApiResponseRateCardVersion:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/RateCardVersion'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    SubscriptionRecurring:
      required:
      - period
      - period_unit
      type: object
      properties:
        period:
          type: integer
          description: The number of period units between subscription billing cycles. For example, the billing cycle is bi-monthly if `period=2` and `period_unit=MONTH`.
          format: int32
        period_unit:
          type: string
          description: Specifies billing frequency. One of `DAY`, `WEEK`, `MONTH` or `YEAR`.
      description: The billing cycle for recurring charges.
    RateCardItemTier:
      required:
      - level
      type: object
      properties:
        flat_amount:
          type: number
          description: The flat amount to be charged for this tier when pricing model is `GRADUATED`, or the overall flat amount to be charged when pricing model is `VOLUME`.
          minimum: 0
        level:
          type: integer
          description: The sequential position of the tier within the item definition. Starts from 1.
          format: int32
        lot:
          $ref: '#/components/schemas/RateCardItemLot'
          description: Defines how quantity is grouped into billable lots. The `unit_amount` is then applied per lot. Only applicable for `VOLUME` and `GRADUATED`.
        unit_amount:
          type: number
          description: The per-unit amount to be charged for this tier when pricing model is `GRADUATED`, or the overall per-unit amount to be charged when pricing model is `VOLUME`.
          minimum: 0
        unit_description:
          type: string
          description: Description of the billable unit for the tier.
        upper_bound:
          type: number
          description: The upper quantity limit of this tier. For the last tier, the upper bound must be left empty.
          minimum: 0
      description: A quantity-based pricing tier for a Rate Card Item.
    RateCardVersion:
      required:
      - created_at
      - dimension_keys
      - rate_card_id
      - version
      type: object
      properties:
        created_at:
          type: string
          description: Time when this rate card version was created.
        dimension_keys:
          type: array
          description: Subset of or equal to the Meter's `dimension_keys`. Defines which dimension keys are used in each item's `dimension_values`. Append-only across versions — a new version's set must contain all keys from the previous version.
          items:
            type: string
        rate_card_id:
          type: string
          description: ID of the Rate Card this version belongs to.
        version:
          type: integer
          description: The version number within the Rate Card, starting from `1`.
          format: int32
      description: An immutable, numbered snapshot of a Rate Card's pricing configuration.
