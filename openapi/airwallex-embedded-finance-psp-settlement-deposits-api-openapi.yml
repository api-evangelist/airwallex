        status_code: 200
        reason_phrase: OK
        response_body:
          amount: '10000'
          currency: AUD
          deposit_id: 90b98dc6-63a0-403f-816b-ac5305b42a11
          deposited_at: 2022-09-22T16:08:02+1100
          global_account_id: 3f457fe5-daf4-9962-92ec-10332301d9p3
          holding_account_id: acct_wst1AJZWbOx2Ijf-PDS123w
          payer:
            name: <string>
          psp_settlement_intent_id: psi_0iBwL9IuOZaKCz8Kn-01ew
          reference: PMT1936398
          requirements:
            matching_psp_settlement_required:
              message: <string>
            psp_settlement_intent_required:
              message: <string>
            reference_disambiguation_required:
              message: <string>
          status: ACTION_REQUIRED
      x-oauthSupported: false
      x-scope:
      - scope: psp_settlement_deposit:read
        group: Embedded Finance
        resource_name: PSP Settlement Deposits
      x-domain: Embedded Finance
      x-resource: PSP Settlement Deposits
