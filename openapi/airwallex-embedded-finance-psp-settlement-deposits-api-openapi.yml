components:
  schemas:
    SettlementDepositRequirements:
      type: object
      properties:
        matching_psp_settlement_required:
          $ref: '#/components/schemas/MatchingPspSettlementRequired'
          description: The amount of associated PSP settlement deposits does not match the amount of the PSP settlement intent.
        psp_settlement_intent_required:
          $ref: '#/components/schemas/PspSettlementIntentRequired'
          description: Awaiting a PSP settlement intent.
        reference_disambiguation_required:
          $ref: '#/components/schemas/ReferenceDisambiguationRequired'
          description: PSP settlement deposit reference corresponds to multiple PSP settlement intents. Please specify in the PSP settlement intents which PSP settlement deposits correspond to them.
      description: Further actions required in order to proceed with this PSP settlement deposit.
    Embedded_Finance_Payer:
      type: object
      properties:
        name:
          type: string
          description: The name of the payer.
      description: The Payer provided along with the deposit.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    MatchingPspSettlementRequired:
      type: object
      properties:
        message:
          type: string
          description: Information about this requirement.
      description: The amount of associated PSP settlement deposits does not match the amount of the PSP settlement intent.
    SettlementDeposit:
      type: object
      properties:
        amount:
          type: string
          description: Amount of the PSP settlement deposit.
        currency:
          type: string
          description: Currency (3-letter ISO-4217 code) of the PSP settlement deposit.
        deposit_id:
          type: string
          description: The unique identifier of the deposit associated with this PSP settlement deposit.
        deposited_at:
          type: string
          description: The time this deposit was created.
        global_account_id:
          type: string
          description: The unique identifier of the global account to which the funds were sent.
        holding_account_id:
          type: string
          description: Holding account unique identifier into which the funds were deposited.
        payer:
          $ref: '#/components/schemas/Embedded_Finance_Payer'
          description: The Payer provided along with the deposit.
        psp_settlement_intent_id:
          type: string
          description: The unique identifier of the PSP settlement intent, if any, associated with this PSP settlement deposit.
        reference:
          type: string
          description: Reference provided along with the deposit, which will be used to associate this PSP settlement deposit with PSP settlement splits.
        requirements:
          $ref: '#/components/schemas/SettlementDepositRequirements'
          description: Further actions required in order to proceed with this PSP settlement deposit.
        status:
          type: string
          description: 'Status of the PSP settlement deposit. One of: `NEW`, `ACTION_REQUIRED`, `MATCHED`, `SETTLED`.'
    ReferenceDisambiguationRequired:
      type: object
      required:
      - message
      properties:
        message:
          type: string
      description: PSP settlement deposit reference corresponds to multiple PSP settlement intents. Please specify in the PSP settlement intents which PSP settlement deposits correspond to them.
    PspSettlementIntentRequired:
      type: object
      properties:
        message:
          type: string
          description: Information about this requirement.
      description: Awaiting a PSP settlement intent.
