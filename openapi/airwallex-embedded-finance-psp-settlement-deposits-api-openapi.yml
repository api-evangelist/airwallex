tags:
- name: Embedded Finance > PSP Settlement Deposits
  description: 'A PSP Settlement Deposit is a deposit made by a PSP into a holding account. It is associated with a PSP Settlement Intent.


    Airwallex provides the Platform with a **holding account**, set up by a Airwallex Solutions Engineer. Platforms pass payment details to a pay-in PSP for funds acquired by PSPs to be deposited to Airwallex.


    PSP Settlement Deposits form part of the PSP-agnostic payout solution.'
  x-domain: Embedded Finance
  x-resource: PSP Settlement Deposits
  x-urlPath: scale/psp_settlement_deposits
paths:
  /api/v1/psp_settlement_deposits:
    get:
      tags:
      - Embedded Finance > PSP Settlement Deposits
      summary: 1|List all PSP Settlement Deposits
      description: Get a list of PSP settlement deposits sent to your account. The deposits returned are sorted by deposit time in descending order.
      operationId: listPspSettlementDeposits
      x-oboSupported: false
      parameters:
      - name: deposit_id
        in: query
        description: Unique identifier of the deposit.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: from_deposited_at
        in: query
        description: The start date of `deposited_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: global_account_id
        in: query
        description: Global account unique identifier to which the funds were sent.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: holding_account_id
        in: query
        description: Holding account unique identifier into which the funds were deposited.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100, minimum 10, maximum 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: status
        in: query
        description: PSP Settlement Deposit status. One of `NEW`, `MATCHED`, or `ACTION_REQUIRED`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: to_deposited_at
        in: query
        description: The end date of `deposited_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementDeposit'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid","credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/psp_settlement_deposits
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
