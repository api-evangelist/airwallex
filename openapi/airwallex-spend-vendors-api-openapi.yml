    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Spend > Vendors
  description: Manages vendor records for accounts payable and purchase order workflows. Supports vendor creation, retrieval, listing with filters, and sync status updates for integration with external accounting systems.
  x-domain: Spend
  x-resource: Vendors
  x-urlPath: spend/vendors
paths:
