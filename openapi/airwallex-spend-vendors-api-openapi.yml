  /api/v1/spend/vendors/{id}/sync:
    post:
      tags:
      - Spend > Vendors
      x-stage: beta
      summary: 4|Update Vendor Sync Status
      description: Updates the sync status of a vendor.
      operationId: syncVendors
      parameters:
      - name: id
        in: path
        description: Unique identifier of the vendor.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sync_status
              properties:
                sync_status:
                  type: string
                  description: Sync status for an accounting system.
                  enum:
                  - NOT_SYNCED
                  - SYNCED
                  - SYNC_FAILED
                sync_error_message:
                  type: string
                  description: Error message for sync failures. Only applicable when sync_status is `SYNC_FAILED`.
              description: Vendor Update Sync Status Payload.
        required: true
      responses:
