          type: array
          description: List of user emails who can approve the vendor.
          items:
            type: string
            description: List of user emails who can approve the vendor.
        owner_email:
          type: string
          description: Email of the internal owner responsible for managing this vendor.
        business_registration_number:
          type: string
          description: Business registration number of the vendor.
        external_id:
          type: string
          description: External identifier for this vendor in your system.
        contacts:
          type: array
          description: Contacts associated with this vendor.
          items:
            $ref: '#/components/schemas/VendorContact'
        attachments:
          type: array
          description: List of file attachments associated with the vendor.
          items:
            $ref: '#/components/schemas/Attachment'
        comments:
          type: array
          description: List of comments associated with the vendor.
          items:
            $ref: '#/components/schemas/Comment'
        created_at:
          type: string
          description: Timestamp for when the resource was created in ISO8601 format.
        updated_at:
          type: string
          description: Timestamp for when the resource was updated in ISO8601 format.
      description: Vendor representing an external supplier or service provider, used for managing accounts payable relationships, purchase orders, and bill payments.
    VendorContact:
      type: object
      properties:
        contact_name:
          type: string
          description: Full name of the vendor contact.
        email:
          type: string
          description: Email address of the vendor contact.
        phone_number:
          type: string
          description: Phone number in E.164 format.
      description: Vendor Contact.
    Attachment:
      type: object
      required:
      - content_type
      - created_at
      - file_name
      - file_url
      - id
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the attachment.
        content_type:
          type: string
          description: MIME type of the attached file. Common types include `image/jpeg`, `image/png`, and `application/pdf`.
        file_name:
          type: string
          description: Original filename of the uploaded attachment, including the file extension.
        file_url:
          type: string
          description: URL to access and download the attachment file.
        created_at:
          type: string
          description: Timestamp for when the resource was created in ISO8601 format.
      description: File attachment containing supporting documentation such as receipts, invoices, or other proof of expense. Used for compliance, audit trails, and approval workflows.
