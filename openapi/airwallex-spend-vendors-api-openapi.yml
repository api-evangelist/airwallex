      summary: 1|Create a Vendor
      description: Creates a new vendor.
      operationId: createVendor
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - external_id
              - legal_entity_ids
              - name
              - request_id
              - status
              - sync_status
              properties:
                request_id:
                  type: string
                  description: Unique identifier for this request to ensure idempotency. To prevent accidental duplication, clients should generate a random UUID.
                external_id:
                  type: string
                  description: External identifier for this vendor in your system.
                name:
                  type: string
                  description: Name of the vendor.
                legal_entity_ids:
                  type: array
                  description: List of unique identifiers of the legal entities associated with the vendor.
                  items:
                    type: string
                    description: List of unique identifiers of the legal entities associated with the vendor.
