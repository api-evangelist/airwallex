openapi: 3.2.0
info:
  title: Airwallex Embedded Finance > Platform Reports API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Embedded Finance > Platform Reports
  description: 'Generate reports to understand the activity of your Platform account and connected accounts.


    Use Create Platform report to obtain a report id, followed by Get Platform report to retrieve a download URL for the report once it is ready. Subscribe to the `Platform Report` webhook in the Airwallex webapp to be notified when the report that you have requested is ready. Only files smaller than 100MB can be generated.


    Create scheduled reports by specifying future dates for `to_created_at`, or `to_updated_at`.


    Reports will be generated at the end of the requested interval, once all data has been captured.


    For example, if `2023-01-10` is the current date, request a Platform report with `from_created_at` = `2023-01-01` and `to_created_at` = `2023-02-01` to obtain data for January. The scheduled report will be generated after the end of the interval.'
  x-domain: Embedded Finance
  x-resource: Platform Reports
  x-urlPath: scale/platform_reports
paths:
  /api/v1/platform_reports/create:
    post:
      tags:
      - Embedded Finance > Platform Reports
      x-stage: beta
      summary: 1|Create a Platform Report
      description: 'Create a new report. This request triggers an Airwallex job to generate a new report.


        A report id is returned that can then be used to retrieve the download link for that file (Get Platform report).'
      operationId: createPlatformReport
      x-oboSupported: false
      parameters:
      - name: x-api-version
        in: header
        description: x-api-version.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - file_format
              - type
              properties:
                file_format:
                  type: string
                  description: 'File format of the report. Currently supported formats: `CSV`.'
                  enum:
                  - CSV
                file_name:
                  type: string
                  description: 'File name requested for the report. If not provided, a file name will be automatically generated by Airwallex in the following format: `{REPORT_TYPE}_{TIMESTAMP}`. Format of `TIMESTAMP` is `YYYY-MM-DDThh:mm:ss+0000`.'
                from_created_at:
                  type: string
                  description: "Timestamp (inclusive, in ISO8601 standard, UTC) to specify data records that the report should include. This parameter is a filter for:\n * `created_at` field in the `TRANSACTION_RECON_REPORT`\n * `created_at` field in the `PAYOUT_REPORT`\n * `created_at` field in the `ISSUING_TRANSACTION_REPORT`\n * `created_at` field in the `APPLICATION_FEE_REPORT`\n* `created_at` field in the `PLATFORM_LIQUIDITY_TRANSACTION_REPORT`\n* `date` field in the `PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT`\n\nFor example, request a Platform report with `from_created_at` = `2023-01-01` and `to_created_at` = `2023-01-02` to obtain records created during the day `2023-01-01` in UTC.\n\nThe max interval size between `from_created_at` and `to_created_at` is 366 days."
                from_updated_at:
                  type: string
                  description: "Timestamp (inclusive, in ISO8601 standard, UTC) to specify data records that the report should include. This parameter is a filter for:\n * `last_update` field in the `TRANSACTION_RECON_REPORT`\n * `last_update` field in the `PAYOUT_REPORT`\n * `last_update` field in the `ISSUING_TRANSACTION_REPORT`\n * `last_update` field in the `APPLICATION_FEE_REPORT`\n* `updated_at` field in the `PLATFORM_LIQUIDITY_TRANSACTION_REPORT`\n* `date` field in the `PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT`\n\nFor example, request a Platform report with `from_updated_at` = `2023-01-01` and `to_updated_at` = `2023-01-02` to obtain records last updated during the day `2023-01-01` in UTC.\n\nThe max interval size between `from_updated_at` and `to_updated_at` is 366 days."
                to_created_at:
                  type: string
                  description: "Timestamp (exclusive, in ISO8601 standard, UTC) to specify data records that the report should include. This parameter is a filter for:\n * `created_at` field in the `TRANSACTION_RECON_REPORT`\n * `created_at` field in the `PAYOUT_REPORT`\n * `created_at` field in the `ISSUING_TRANSACTION_REPORT`\n * `created_at` field in the `APPLICATION_FEE_REPORT`\n* `created_at` field in the `PLATFORM_LIQUIDITY_TRANSACTION_REPORT`\n* `date` field in the `PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT`\n\nFor example, request a Platform report with `from_created_at` = `2023-01-01` and `to_created_at` = `2023-01-02` to obtain records created during the day `2023-01-01` in UTC.\n\nThe max interval size between `from_created_at` and `to_created_at` is 366 days."
                to_updated_at:
                  type: string
                  description: "Timestamp (exclusive, in ISO8601 standard, UTC) to specify data records that the report should include. This parameter is a filter for:\n * `last_update` field in the `TRANSACTION_RECON_REPORT`\n * `last_update` field in the `PAYOUT_REPORT`\n * `last_update` field in the `ISSUING_TRANSACTION_REPORT`\n * `last_update` field in the `APPLICATION_FEE_REPORT`\n* `updated_at` field in the `PLATFORM_LIQUIDITY_TRANSACTION_REPORT`\n* `date` field in the `PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT`\n\nFor example, request a Platform report with `from_updated_at` = `2023-01-01` and `to_updated_at` = `2023-01-02` to obtain records last updated during the day `2023-01-01` in UTC.\n\nThe max interval size between `from_updated_at` and `to_updated_at` is 366 days."
                type:
                  type: string
                  description: Type of report requested.
                  enum:
                  - TRANSACTION_RECON_REPORT
                  - PAYOUT_REPORT
                  - BALANCE_REPORT
                  - ACCOUNT_REPORT
                  - ISSUING_TRANSACTION_REPORT
                  - APPLICATION_FEE_REPORT
                  - PLATFORM_LIQUIDITY_TRANSACTION_REPORT
                  - PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT
                  x-enumDescriptions:
                    TRANSACTION_RECON_REPORT: All financial transactions having occurred on your Platform account and connected accounts.
                    PAYOUT_REPORT: Details of all payouts out of your Platform account and connected accounts, across all payout statuses.
                    BALANCE_REPORT: Balances of your Platform account and connected accounts.
                    ACCOUNT_REPORT: Account-related information for your Platform and connected accounts, including KYC & KYB information.
                    ISSUING_TRANSACTION_REPORT: All issuing transactions having occurred on your Platform account and connected accounts.
                    APPLICATION_FEE_REPORT: A consolidated list of application fees that a Platform account charges its connected accounts.
                    PLATFORM_LIQUIDITY_TRANSACTION_REPORT: Transactions across all Platform Liquidity Program accounts under your Platform account, including both program accounts and program subscriber accounts.
                    PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT: End-of-day balances across all Platform Liquidity Program accounts under your Platform account, with one record per program, currency, and UTC calendar day.
        description: request to create a Platform report.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateScaleReportRes'
        '400':
          description: '["field_required","invalid_argument"]'
        '401':
          description: '["credentials_invalid","credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/platform_reports/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          file_format: CSV
          file_name: my_report_1
          from_created_at: '2023-01-01'
          from_updated_at: <string>
          to_created_at: '2023-01-02'
          to_updated_at: <string>
          type: TRANSACTION_RECON_REPORT
        response_body:
          id: b4ac9a1e-8cd8-11ed-a1eb-0242ac1200a2
      x-oauthSupported: false
      x-scope:
      - scope: platform_report:write
        group: Embedded Finance
        resource_name: Platform Reports
      x-domain: Embedded Finance
      x-resource: Platform Reports
      x-urlPath: create
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
  /api/v1/platform_reports/{id}:
    get:
      tags:
      - Embedded Finance > Platform Reports
      x-stage: beta
      summary: 2|Retrieve a Platform Report
      description: 'Retrieve the download URL of a report once the report is ready.


        Subscribe to the `Platform Report` webhook in the Airwallex webapp to be notified when the report that you have requested is ready.


        The download link obtained is only valid for 1 minute, due to security considerations. If clients opens the link within 1 minute, the report download can be completed even if the total download time takes longer than 1 minute.'
      operationId: retrievePlatformReport
      x-oboSupported: false
      parameters:
      - name: id
        in: path
        description: Airwallex-generated unique identifier for the report.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetScaleReportRes'
        '400':
          description: '["field_required","invalid_argument"]'
        '401':
          description: '["credentials_invalid","credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/platform_reports/platform_report_id
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          download_url: <string>
          download_url_expires_at: 2023-01-02T00:01:00+0000
          failed_reason: REPORT_SIZE_LIMIT_EXCEEDED
          file_format: CSV
          file_name: my_report_1
          from_created_at: 2023-01-01T00:00:00+0000
          from_updated_at: <string>
          id: b4ac9a1e-8cd8-11ed-a1eb-0242ac1200a2
          status: COMPLETED
          to_created_at: 2023-01-02T00:00:00+0000
          to_updated_at: <string>
          type: TRANSACTION_RECON_REPORT
      x-oauthSupported: false
      x-scope:
      - scope: platform_report:read
        group: Embedded Finance
        resource_name: Platform Reports
      x-domain: Embedded Finance
      x-resource: Platform Reports
      x-urlPath: retrieve
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
components:
  schemas:
    GetScaleReportRes:
      type: object
      properties:
        download_url:
          type: string
          description: URL that can be used to retrieve the file. For security reasons, this URL expires 1 minute after it is generated. Only returned if the report status is `COMPLETED`.
        download_url_expires_at:
          type: string
          description: Download URL expiry timestamp in ISO8601 standard (UTC). Only returned if the status is `COMPLETED`.
        failed_reason:
          type: string
          description: Reason for the report generation failing. Only returned if the status is `FAILED`.
          enum:
          - REPORT_SIZE_LIMIT_EXCEEDED
          - SYSTEM_FAILURE
        file_format:
          type: string
          description: 'File format of the report. Currently supported formats: `CSV`.'
        file_name:
          type: string
          description: File name of the report.
        from_created_at:
          type: string
          description: "Timestamp (inclusive, in ISO8601 standard, UTC) to specify data records that the report should include. This parameter is a filter for:\n * `created_at` field in the `TRANSACTION_RECON_REPORT`\n * `created_at` field in the `PAYOUT_REPORT`\n * `created_at` field in the `ISSUING_TRANSACTION_REPORT`\n * `created_at` field in the `APPLICATION_FEE_REPORT`\n * `created_at` field in the `PLATFORM_LIQUIDITY_TRANSACTION_REPORT`\n * `date` field in the `PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT`\n\nFor example, request a Platform report with `from_created_at` = `2023-01-01` and `to_created_at` = `2023-01-02` to obtain records created during the day `2023-01-01` in UTC.\n\nThe max interval size between `from_created_at` and `to_created_at` is 366 days."
        from_updated_at:
          type: string
          description: "Timestamp (inclusive, in ISO8601 standard, UTC) to specify data records that the report should include. This parameter is a filter for:\n * `last_update` field in the `TRANSACTION_RECON_REPORT`\n * `last_update` field in the `PAYOUT_REPORT`\n * `last_update` field in the `ISSUING_TRANSACTION_REPORT`\n * `last_update` field in the `APPLICATION_FEE_REPORT`\n * `updated_at` field in the `PLATFORM_LIQUIDITY_TRANSACTION_REPORT`\n * `date` field in the `PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT`\n\nFor example, request a Platform report with `from_updated_at` = `2023-01-01` and `to_updated_at` = `2023-01-02` to obtain records last updated during the day `2023-01-01` in UTC.\n\nThe max interval size between `from_updated_at` and `to_updated_at` is 366 days."
        id:
          type: string
          description: Airwallex-generated unique identifier for the report.
        status:
          type: string
          description: Status of the report availability for download.
          enum:
          - PENDING
          - COMPLETED
          - FAILED
        to_created_at:
          type: string
          description: "Timestamp (exclusive, in ISO8601 standard, UTC) to specify data records that the report should include. This parameter is a filter for:\n * `created_at` field in the `TRANSACTION_RECON_REPORT`\n * `created_at` field in the `PAYOUT_REPORT`\n * `created_at` field in the `ISSUING_TRANSACTION_REPORT`\n * `created_at` field in the `APPLICATION_FEE_REPORT`\n * `created_at` field in the `PLATFORM_LIQUIDITY_TRANSACTION_REPORT`\n * `date` field in the `PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT`\n\nFor example, request a Platform report with `from_created_at` = `2023-01-01` and `to_created_at` = `2023-01-02` to obtain records created during the day `2023-01-01` in UTC.\n\nThe max interval size between `from_created_at` and `to_created_at` is 366 days."
        to_updated_at:
          type: string
          description: "Timestamp (exclusive, in ISO8601 standard, UTC) to specify data records that the report should include. This parameter is a filter for:\n * `last_update` field in the `TRANSACTION_RECON_REPORT`\n * `last_update` field in the `PAYOUT_REPORT`\n * `last_update` field in the `ISSUING_TRANSACTION_REPORT`\n * `last_update` field in the `APPLICATION_FEE_REPORT`\n * `updated_at` field in the `PLATFORM_LIQUIDITY_TRANSACTION_REPORT`\n * `date` field in the `PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT`\n\nFor example, request a Platform report with `from_updated_at` = `2023-01-01` and `to_updated_at` = `2023-01-02` to obtain records last updated during the day `2023-01-01` in UTC.\n\nThe max interval size between `from_updated_at` and `to_updated_at` is 366 days."
        type:
          type: string
          description: "Type of report requested. Currently supported report types:\n * `TRANSACTION_RECON_REPORT`: All financial transactions having occurred on your Platform account and connected accounts.\n * `PAYOUT_REPORT`: Details of all payouts out of your Platform account and connected accounts, across all payout statuses.\n * `BALANCE_REPORT`: Balances of your Platform account and connected accounts.\n * `ACCOUNT_REPORT`: Account-related information for your Platform and connected accounts, including KYC & KYB information.\n * `ISSUING_TRANSACTION_REPORT`: All issuing transactions having occurred on your Platform account and connected accounts.\n * `APPLICATION_FEE_REPORT`: A consolidated list of application fees that a Platform account charges its connected accounts.\n * `PLATFORM_LIQUIDITY_TRANSACTION_REPORT`: Transactions across all Platform Liquidity Program accounts under your Platform account, including both program accounts and program subscriber accounts.\n * `PLATFORM_LIQUIDITY_EOD_BALANCE_REPORT`: End-of-day balances across all Platform Liquidity Program accounts under your Platform account, with one record per program, currency, and UTC calendar day."
    CreateScaleReportRes:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Airwallex-generated unique identifier for the report.
