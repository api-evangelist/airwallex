info:
  title: Airwallex Billing > Prices API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Billing > Prices
  description: 'A Price defines the pricing information for a Product such as amount, currency, and billing frequency. A Product can have multiple Prices. For example, you can offer the following pricing options for a software license Product:

    - 1. Standard Price: $10 / month

    - 2. Student Price: $5 / month

    - 3. Lifetime Access: $200 one-off purchase


    Prices are primarily used in Invoice and Subscription APIs.'
  x-domain: Billing
  x-resource: Prices
  x-urlPath: billing/prices
paths:
  /api/v1/billing/prices/create:
    post:
      description: Create a new Price object.
      operationId: createPrice
      requestBody:
        content:
          application/json:
            schema:
              required:
              - currency
              - product_id
              - request_id
              type: object
              properties:
                active:
                  type: boolean
                  description: '`true` if the price is available for new purchases, `false` otherwise. Defaults to `true`.'
                billing_type:
                  type: string
                  description: "Indicates when should the price be billed, one of \n- `IN_ADVANCE`: billed at the beginning of the billing cycle.\n- `IN_ARREARS`: billed at the end of the billing cycle.\n\nDefaults to `IN_ADVANCE`."
                currency:
                  type: string
                  description: Currency of the price (in 3-letter ISO-4217 format).
                description:
                  maxLength: 500
                  minLength: 0
                  type: string
                  description: Price description. Used for internal classification and identification.
                flat_amount:
                  maximum: 9999999999
                  minimum: 0
                  type: number
                  description: The fixed amount to be charged. Only required when the pricing model is `FLAT`.
                lot:
                  required:
                  - rounding_mode
                  - size
                  type: object
                  description: Defines how quantity is grouped into billable lots. The unit_amount is then applied per lot. If not set, quantity is treated as the number of billable lots. Only applicable for `PER_UNIT` price.
                  properties:
                    rounding_mode:
                      pattern: ^UP$
                      type: string
                      description: Specifies how to round the calculated lots when the total quantity is not an exact multiple of the size. One of `UP`.
                    size:
                      minimum: 2
                      type: integer
                      description: The amount of quantity that constitutes a single billable lot.
                      format: int32
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of string key-value pairs that you can attach to this object for storing additional information.
                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                meter_id:
                  type: string
                  description: ID of the Meter object specifying how to calculate the usage for this price.
                metered:
                  type: boolean
                  description: Specify how to determine the quantity of the product used in each billing cycle for subscription payments. `true` if the quantity is dynamically determined during the billing cycle. The merchant should call the Ingest Usage Events API to submit usage data when the product is used. `false` if the quantity is determined when creating a subscription.
                pricing_model:
                  type: string
                  description: 'Specify how to calculate the total billing amount when a quantity is provided. One of

                    - `FLAT`: a fixed price.

                    - `PER_UNIT`: a fixed price per unit quantity.

                    - `VOLUME`: the unit price is based on which tier the total quantity falls in.

                    - `GRADUATED`: the unit price changes as the quantity increases.


                    Defaults to `PER_UNIT`.'
                product_id:
                  type: string
                  description: ID of the [Product](/docs/api/billing/products) object this price is associated with.
                recurring:
                  required:
                  - period_unit
                  type: object
                  description: The frequency at which the price is charged. null for one-time charge.
                  properties:
                    period:
                      type: integer
                      description: The number of period units between subscription billing cycles. For example, the billing cycle is bi-monthly if `period=2` and `period_unit=MONTH`. Defaults to `1`.
                      format: int32
                    period_unit:
                      type: string
                      description: Specifies billing frequency. One of `DAY`, `WEEK`, `MONTH` or `YEAR`.
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
                tax_included:
                  type: boolean
                  description: Whether the price includes tax. Defaults to `false`.
                tiers:
                  type: array
                  description: List of quantity-based pricing tiers for this price. Required when the pricing model is `VOLUME` or `GRADUATED`.
                  items:
                    type: object
                    properties:
                      flat_amount:
                        minimum: 0
                        type: number
                        description: The flat amount to be charged for this tier when pricing model is `GRADUATED`, or the overall flat amount to be charged when pricing model is `VOLUME`.
                      lot:
                        required:
                        - rounding_mode
                        - size
                        type: object
                        description: Defines how quantity is grouped into billable lots. The unit_amount is then applied per lot. If not set, quantity is treated as the number of billable lots. Only applicable for `VOLUME` and `GRADUATED` prices.
                        properties:
                          rounding_mode:
                            pattern: ^UP$
                            type: string
                            description: Specifies how to round the calculated lots when the total quantity is not an exact multiple of the size. One of `UP`.
                          size:
                            minimum: 2
                            type: integer
                            description: The amount of quantity that constitutes a single billable lot.
                            format: int32
                      unit_amount:
                        minimum: 0
                        type: number
                        description: The per-unit amount to be charged for this tier when pricing model is `GRADUATED`, or the overall per-unit amount to be charged when pricing model is `VOLUME`.
                      unit_description:
                        type: string
                        description: Description of the billable unit for the tier.
                      upper_bound:
                        minimum: 0
                        type: number
                        description: The upper quantity limit of this tier. This tier is applicable when the quantity does not exceed the upper bound of this tier, and is greater than the upper bound of the tier below it(or `0` if this is the first tier). For the last tier, the upper bound must be left empty.
                unit_amount:
                  maximum: 9999999999
                  minimum: 0
                  type: number
                  description: The amount to be charged per product unit. Only required when the pricing model is `PER_UNIT`.
                unit_description:
                  type: string
                  description: Description of the billable unit for the price.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `resource_not_found`(invalid `product_id`), `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Create a Price
      tags:
      - Billing > Prices
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/billing/prices/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          active: true
          billing_type: IN_ADVANCE
          currency: USD
          description: 'Standard option: $10 / month.'
          flat_amount: 0
          lot:
            rounding_mode: UP
            size: 10
          metadata:
            foo: bar
          meter_id: <string>
          metered: false
          pricing_model: GRADUATED
          product_id: prd_hkpd1x2gbgazzvcd42w
          recurring:
            period: 1
            period_unit: MONTH
          request_id: ee939540-3203-4a2c-9172-89a566485dd9
          tax_included: false
          tiers:
          - unit_amount: 10
            upper_bound: 20
          - flat_amount: 20
          unit_amount: 0
          unit_description: <string>
        response_body:
          active: true
          billing_type: IN_ADVANCE
          created_at: 2022-01-01T10:15:30+0000
          currency: USD
          description: 'Standard option: $10 / month.'
          flat_amount: 0
