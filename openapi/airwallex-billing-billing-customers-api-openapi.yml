components:
  schemas:
    CustomerAddress:
      required:
      - country_code
      type: object
      properties:
        city:
          type: string
          description: City of the address.
        country_code:
          type: string
          description: The two-letter country code in ISO 3166-1 alpha-2 format.
        postcode:
          type: string
          description: PostCode of the address.
        state:
          type: string
          description: State or province of the address.
        street:
          type: string
          description: Street of the address.
      description: Address of the billing customer.
    CursorPaginationClientApiResponseCustomer:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/CustomerResponse'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    CustomerResponse:
      required:
      - automatic_tax_eligibility
      - created_at
      - id
      - updated_at
      type: object
      properties:
        address:
          $ref: '#/components/schemas/CustomerAddress'
          description: Address of the billing customer.
        automatic_tax_eligibility:
          type: string
          description: Indicates whether automatic tax can be applied for this customer based on the customer's current address data and the seller’s tax registration for that jurisdiction.
          enum:
          - ELIGIBLE
          - LOCATION_NOT_SUPPORTED
          - ADDRESS_INCOMPLETE
          x-enumDescriptions:
            ELIGIBLE: Customer is in a jurisdiction where the seller is registered, and automatic tax can be applied.
            LOCATION_NOT_SUPPORTED: The customer's jurisdiction can be determined from the current address data, but automatic tax calculation isn't supported there.
            ADDRESS_INCOMPLETE: The customer's jurisdiction can't be determined from the provided address data.
        created_at:
          type: string
          description: Time when the billing customer was created.
        default_billing_currency:
          type: string
          description: Default currency to use when billing this customer in 3-letter ISO-4217 format.
        default_legal_entity_id:
          type: string
          description: ID of the default legal entity to use when billing this customer.
        description:
          type: string
          description: Additional description about the billing customer.
        email:
          type: string
          description: Email address of the billing customer.
        id:
          type: string
          description: ID of the billing customer object.
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of string key-value pairs that you can attach to this object for storing additional information.
          description: A set of string key-value pairs that you can attach to this object for storing additional information.
        name:
          type: string
          description: Name of the billing customer.
        nickname:
          type: string
          description: Internal nickname for the billing customer.
        phone_number:
          type: string
          description: Phone number of the billing customer.
        tax_identification_number:
          type: string
          description: Tax identification number of the billing customer.
        type:
          type: string
          description: Type of the billing customer.
          enum:
          - BUSINESS
          - INDIVIDUAL
        updated_at:
          type: string
          description: Time when the billing customer was last updated.
    BankTransferInstructions:
      required:
      - account_name
      - currency
      type: object
      properties:
        currency:
          type: string
          description: Currency of the receiving account (3-letter ISO-4217 code).
        account_name:
          type: string
          description: Name of the account holder receiving the transfer.
        account_number:
          type: string
          description: Bank account number.
        account_category:
          type: string
          description: Category of the receiving bank account. One of `CHECKING`, `SAVINGS`, or `BUSINESS`.
          enum:
          - CHECKING
          - SAVINGS
          - BUSINESS
        bank_name:
          type: string
          description: Name of the financial institution in which the receiving account is domiciled.
        iban:
          type: string
          description: IBAN number.
        swift_code:
          type: string
          description: Bank SWIFT or BIC code.
        routing_number:
          type: string
          description: Bank routing number. Applicable only to accounts in the United States.
        sort_code:
          type: string
          description: Bank sort code. Applicable only to accounts in the United Kingdom.
        bsb_number:
          type: string
          description: Bank State Branch (BSB) number. Applicable only to accounts in Australia.
        bank_code:
          type: string
          description: Code identifying the bank. Applicable in markets including Singapore and Hong Kong.
        branch_code:
          type: string
          description: Code identifying the bank branch. Used together with `bank_code`.
        transit_number:
          type: string
          description: Bank transit number. Applicable only to accounts in Canada.
        institution_number:
          type: string
          description: Institution number identifying the bank. Applicable only to accounts in Canada.
        charge_type:
          type: string
          description: 'Indicates who bears the bank charges on the transfer. Returned only for international (SWIFT) transfers. Omitted for local transfers.

            Possible value:

            - `OUR`: The payer covers all transfer charges so the full amount is received.'
          enum:
          - OUR
        merchant_address:
          required:
          - country_code
          type: object
          description: The recipient's registered business address, used when making an international (SWIFT) transfer. Returned only for SWIFT transfers. Omitted for local transfers.
          properties:
            country_code:
              type: string
              description: Two-letter ISO 3166-1 country code of the recipient's address.
            state:
              type: string
              description: State, province, or region of the recipient's address.
            suburb:
              type: string
              description: Suburb or city of the recipient's address.
            postcode:
              type: string
              description: Postal or ZIP code of the recipient's address.
