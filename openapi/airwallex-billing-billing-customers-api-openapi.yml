  /api/v1/billing/billing_customers:
    get:
      description: Retrieves a list of Billing Customers based on the query parameters.
      operationId: listBillingCustomers
      parameters:
      - description: The start time of `created_at` in ISO8601 format (inclusive).
        in: query
        name: from_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The end time of `created_at` in ISO8601 format (exclusive).
        in: query
        name: to_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: Email address of the billing customer.
        in: query
        name: email
        required: false
        schema:
          type: string
      - description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not `null`) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not `null`) from the response to a subsequent call.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: Number of billing customer objects per page. Defaults to `20`.
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginationClientApiResponseCustomer'
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 4|List all Billing Customers
