openapi: 3.2.0
info:
  title: Airwallex Billing > Billing Customers API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Billing > Billing Customers
  description: A Billing Customer is an individual or business who purchases or subscribes to your products or services.
  x-domain: Billing
  x-resource: Billing Customers
  x-urlPath: billing/billing_customers
paths:
  /api/v1/billing/billing_customers/create:
    post:
      description: Creates a Billing Customer.
      operationId: createBillingCustomer
      requestBody:
        content:
          application/json:
            schema:
              required:
              - request_id
              type: object
              properties:
                address:
                  required:
                  - country_code
                  type: object
                  description: Address of the billing customer.
                  properties:
                    city:
                      type: string
                      description: City of the address.
                    country_code:
                      type: string
                      description: The two-letter country code in ISO 3166-1 alpha-2 format.
                    postcode:
                      type: string
                      description: PostCode of the address.
                    state:
                      type: string
                      description: State or province of the address.
                    street:
                      type: string
                      description: Street of the address.
                default_billing_currency:
                  type: string
                  description: Default currency to use when billing this customer in 3-letter ISO-4217 format.
                default_legal_entity_id:
                  type: string
                  description: ID of the default legal entity to use when billing this customer. You can get this ID from the `legal_entity_id` in the response of the [Retrieve account details API](/docs/api/scale/accounts/retrieve).
                description:
                  type: string
                  description: Additional description about the billing customer.
                email:
                  type: string
                  description: Email address of the billing customer.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of string key-value pairs that you can attach to this object for storing additional information.
                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                name:
                  type: string
                  description: Name of the billing customer.
                nickname:
                  type: string
                  description: Internal nickname for the billing customer.
                phone_number:
                  type: string
                  description: Phone number of the billing customer.
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
                tax_identification_number:
                  type: string
                  description: Tax identification number of the billing customer.
                type:
                  pattern: ^(BUSINESS|INDIVIDUAL)$
                  type: string
                  description: Type of the billing customer. Defaults to `BUSINESS` if `tax_identification_number` exists. Otherwise defaults to `INDIVIDUAL`.
                  enum:
                  - BUSINESS
                  - INDIVIDUAL
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `resource_not_found`(invalid `default_billing_entity_id`), `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Create a Billing Customer
      tags:
      - Billing > Billing Customers
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/billing/billing_customers/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          address:
            city: Shanghai
            country_code: CN
            postcode: '100000'
            state: Shanghai
            street: Pudong District
          default_billing_currency: USD
          default_legal_entity_id: le_ib2DZgZJN72T7bObvNuMYQ
          description: VIP customer.
          email: john.doe@example.com
          metadata:
            customer_segment: premium
          name: John Doe
          nickname: JohnnyD
          phone_number: '+1234567890'
          request_id: ee939540-3203-4a2c-9172-89a566485dd9
          tax_identification_number: 123-45-6789
          type: INDIVIDUAL
        response_body:
          address:
            city: Shanghai
            country_code: CN
            postcode: '100000'
            state: Shanghai
            street: Pudong District
          automatic_tax_eligibility: ELIGIBLE
          created_at: 2024-06-10T12:34:56+0000
          default_billing_currency: USD
          default_legal_entity_id: le_ib2DZgZJN72T7bObvNuMYQ
          description: VIP customer.
          email: john.doe@example.com
          id: bcus_hkpd7fedfgb004apkvs
          metadata:
            customer_segment: premium
          name: John Doe
          nickname: JohnnyD
          phone_number: '+1234567890'
          tax_identification_number: 123-45-6789
          type: INDIVIDUAL
          updated_at: 2024-06-10T12:34:56+0000
      x-resourceLevel: org
      x-oboSupported: false
      x-scope:
      - scope: billing.customer:write
        group: Billing
        resource_name: Billing Customers
      x-domain: Billing
      x-resource: Billing Customers
      x-urlPath: create
      x-oauthSupported: true
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
