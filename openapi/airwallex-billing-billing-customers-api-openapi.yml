  /api/v1/billing/billing_customers/{id}/bank_transfer_instructions:
    get:
      description: Retrieves the bank transfer instructions of a Billing Customer as a read-only list, with one entry per supported currency. The list is empty until bank transfer instructions have been provisioned.
      operationId: listBillingCustomerBankTransferInstructions
      parameters:
      - description: ID of the Billing Customer object.
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                description: List of bank transfer detail value objects owned by the Billing Customer, with one entry per supported currency. Empty when no bank transfer instructions have been provisioned.
                items:
                  $ref: '#/components/schemas/BankTransferInstructions'
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '404':
          description: 'Not Found. Possible error codes: `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 3|Retrieve Bank Transfer Instructions of a Billing Customer
      tags:
      - Billing > Billing Customers
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/billing/billing_customers/billing_customer_id/bank_transfer_instructions
        request_headers:
