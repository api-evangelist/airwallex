paths:
  /api/v1/pa/funds_split_reversals/create:
    post:
      tags:
      - Payment Acceptance > Funds Split Reversals
      summary: 1|Create a Funds Split Reversal
      description: 'Initiate a Funds Split Reversal to take money back from a connected account. You must specify a Funds Split as the source of reversal.


        When reversing a Funds Split, You can optionally reverse part of it. You can do so as many times as you wish until the entire Funds Split has been reversed. Once entirely reversed, a Funds Split can’t be reversed again. This method will return an error when called on an already-reversed Funds Split, or when trying to reverse more money than is left on a Funds Split.'
      operationId: createFundsSplitReversal
      parameters:
      - name: x-on-behalf-of
        in: header
        description: The account unique identifier that this request is on behalf of.
        required: false
        schema:
          type: string
          default: acct_JD0UmuRLNcytX7sBj0lfWA
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - funds_split_id
              - request_id
              properties:
                amount:
                  type: string
                  description: Amount of this reversal. You can only reverse up to the unreversed amount remaining of the Funds Split. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
                funds_split_id:
                  type: string
                  description: Unique identifier of Funds Split on which the Funds Split Reversal is created.
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to the Funds Split Reversal. You can specify up to 50 keys with key names up to 50 characters long and values up to 500 characters long.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
        description: Funds Split Reversal creation request.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundsSplitReversal'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
