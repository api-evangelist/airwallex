  /api/v1/issuing/digital_wallet_tokens/{id}/lifecycle:
    post:
      tags:
      - Issuing > Digital Wallet Tokens
      summary: 3|Update the Digital Wallet Token Status
      description: 'Only available to platforms running their own white-labelled card program. Changes a digital wallet token''s status - suspend, resume, delete, or activate via call centre verification (see `operation_type` below). Applied asynchronously: Airwallex accepts the request immediately, then confirms the status change with the card network. Airwallex performs cardholder ID&V for call centre verification, before applying the change.'
      operationId: lifecycle
      parameters:
      - name: id
        in: path
        description: The unique identifier of the digital wallet token.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - operation_type
              properties:
                activation_code:
                  type: string
                  description: Required when `operation_type` is `CALL_CENTER_ACTIVATION` and ignored for all other operations. A reference of up to 8 characters, captured when the cardholder's identity is verified by the Airwallex call center, that serves as a record that the activation was approved through that process. It is not validated and does not affect the outcome of the request.
                  maxLength: 8
                operation_reason:
                  type: string
                  description: Optional free-text reason for the operation, recorded for audit purposes. For example, 'Suspended due to lost device'.
                operation_type:
                  type: string
                  description: The operation to perform on the token.
                  enum:
                  - DELETE
                  - SUSPEND
                  - RESUME
                  - CALL_CENTER_ACTIVATION
                  x-enumDescriptions:
                    DELETE: Permanently deactivate the token. Its status becomes `DEACTIVATED`. This cannot be undone, and the card must be provisioned again to create a new token.
                    SUSPEND: Temporarily block the token. Its status becomes `SUSPENDED` and the token cannot be used until it is resumed.
                    RESUME: Reactivate a suspended token. Its status returns to `ACTIVE`.
                    CALL_CENTER_ACTIVATION: Activate a token after the cardholder's identity has been verified by the Airwallex call center. Its status becomes `ACTIVE`. This operation requires `activation_code`.
        description: request.
        required: true
      responses:
        '202':
          description: Accepted. The request has been validated and queued. The token's status is updated asynchronously once the change is confirmed with the card network. No response body is returned.
        '400':
          description: '["field_required"

            ,"bad_request"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PciError'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-oauthSupported: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/issuing/digital_wallet_tokens/digital_wallet_token_id/lifecycle
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 202
        reason_phrase: Accepted
        request_body:
          activation_code: <string>
          operation_reason: <string>
          operation_type: DELETE
      x-domain: Issuing
      x-resource: Digital Wallet Tokens
      x-urlPath: lifecycle
      x-oboSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
components:
  schemas:
    PciError:
      type: object
      required:
      - code
      - source
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    NonPciRiskInformation:
      type: object
      properties:
        wallet_provider_account_score:
          type: string
          description: Indicates the wallet providers confidence in the account between 1 to 5, where 5 indicates the most confidence in the account.
        wallet_provider_device_score:
          type: string
          description: Indicates the wallet providers confidence in the device between 1 to 5, where 5 indicates the most confidence in the device.
      description: General risk information about the token.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    NonPciDeviceInformation:
      type: object
      properties:
        device_id:
          type: string
          description: The identifier for the device associated with the token.
        device_type:
          type: string
          description: "Type of device associated with the token  \nOne of `MOBILE_PHONE`, `TABLET`, `WATCH`, `MOBILEPHONE_OR_TABLET`, `PC`."
          enum:
          - MOBILE_PHONE
          - TABLET
          - WATCH
          - MOBILEPHONE_OR_TABLET
          - PC
          - UNKNOWN
      description: Additional information related to the device associated with the token.
    NonPciDigitalWalletToken:
      type: object
      properties:
        card_id:
          type: string
          format: uuid
          description: Unique identifier for the card associated with the token.
        cardholder_id:
          type: string
          format: uuid
          description: Unique identifier for the cardholder associated with the token.
        create_time:
          type: string
          description: The time this token was created.
        device_information:
          $ref: '#/components/schemas/NonPciDeviceInformation'
          description: Additional information related to the device associated with the token.
        expiry_month:
          type: integer
          format: int32
          description: Token expiry month.
        expiry_year:
          type: integer
          format: int32
          description: Token expiry year.
        masked_card_number:
          type: string
          description: Masked card number.
        pan_reference_id:
          type: string
          description: Unique identifier for the tokenization of this card. Used by mobile SDKs to determine whether this card has already been provisioned to the device.
        risk_information:
          $ref: '#/components/schemas/NonPciRiskInformation'
          description: General risk information about the token.
        token_id:
          type: string
          format: uuid
          description: Unique Identifier for the token.
        token_reference_id:
          type: string
          description: Unique identifier of the digital wallet token within the card network.
        token_status:
          type: string
          description: "Status of the token  \nOne of `ACTIVE`, `INACTIVE`, `SUSPENDED`, `DEACTIVATED`."
          enum:
          - ACTIVE
          - INACTIVE
          - SUSPENDED
          - DEACTIVATED
          - UNKNOWN
        token_type:
          type: string
          description: "The type of this token  \nOne of `SECURE_ELEMENT`, `HCE`, `CARD_ON_FILE`, `ECOMMERCE`, `QRC`."
          enum:
          - SECURE_ELEMENT
          - HCE
          - CARD_ON_FILE
          - ECOMMERCE
          - QRC
          - UNKNOWN
