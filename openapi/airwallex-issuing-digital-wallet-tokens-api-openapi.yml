  /api/v1/issuing/digital_wallet_tokens:
    get:
      tags:
      - Issuing > Digital Wallet Tokens
      summary: 2|List all Digital Wallet Tokens
      description: Get digital wallet tokens created under an account. Will default to a 30 day period unless both *to* and *from* created_at request fields are populated.
      operationId: listDigitalWalletTokens
      parameters:
      - name: card_id
        in: query
        description: Id of the card associated with the token.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: cardholder_id
        in: query
        description: Id of the cardholder associated with the token.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: from_created_at
        in: query
        description: Include tokens created after from_created_at (inclusive) in ISO8601 format.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: from_token_expires_on
        in: query
        description: Include tokens that expire after from_token_expires_on (inclusive) in format MMyy.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: to_created_at
        in: query
        description: Include tokens created before to_created_at (inclusive) in ISO8601 format.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: to_token_expires_on
        in: query
        description: Include tokens that expire before to_token_expires_on (inclusive) in format MMyy.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: token_reference_id
        in: query
        description: Unique identifier of the digital wallet token within the card network.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: token_statuses
        in: query
        description: "Token statuses  \nOne or more of `ACTIVE`, `INACTIVE`, `SUSPENDED`, `DEACTIVATED`."
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: token_types
        in: query
        description: "Token types  \nOne or more of `SECURE_ELEMENT`, `HCE`, `CARD_ON_FILE`, `ECOMMERCE`, `QRC`."
        required: false
        allowEmptyValue: false
        schema:
