        name: Authenticate with a given API key
        method: POST
        uri: /api/v1/authentication/login
        request_headers:
          x-api-key: <string>
          x-client-id: <string>
        status_code: 201
        reason_phrase: Created
        response_body:
          token: eyJhbGciOiJSUzI1NiJ9.eyJpYXQiOjE2MjQwMDAwMDAsImV4cCI6MTYyNDAwMTgwMH0.example
          expires_at: 2021-06-18T16:30:00+0000
      - key: default_for_account
        name: Authenticate with a given API key for a given account
        method: POST
        uri: /api/v1/authentication/login
        request_headers:
          x-api-key: <string>
          x-client-id: <string>
