components:
  schemas:
    TaxCodePagination:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: List of tax codes returned.
          items:
            $ref: '#/components/schemas/TaxCode'
        page_after:
          type: string
          description: A pointer to the end of the page list used to retrieve the next page of results.
        page_before:
          type: string
          description: A pointer to the start of the page list used to retrieve the previous page of results.
      description: Paginated list of tax codes.
    TaxCode:
      type: object
      required:
      - id
      - value
      - rate_percent
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the tax code.
        value:
          type: string
          description: Tax code name as defined in the accounting system.
        rate_percent:
          type: string
          description: Tax rate value as a decimal percentage.
        value_label:
          type: string
          description: Airwallex display name for the tax code.
        external_id:
          type: string
          description: External ID from the accounting system.
        legal_entity_ids:
          type: array
          description: Legal entity IDs to which this tax code applies. Omit this field when it applies to all legal entities.
          items:
            type: string
        status:
          $ref: '#/components/schemas/AccountingResourceStatus'
        created_at:
          type: string
          description: Time at which the tax code was created, in ISO 8601 format.
        updated_at:
          type: string
          description: Time at which the tax code was last updated, in ISO 8601 format.
      description: Tax code that can be selected when coding Airwallex Spend transactions.
    AccountingResourceStatus:
      type: string
      description: Status of an Accounting resource used in Airwallex Spend.
      enum:
      - ACTIVE
      - ARCHIVED
