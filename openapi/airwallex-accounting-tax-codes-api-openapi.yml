paths:
  /api/v1/accounting/tax_codes/create:
    post:
      tags:
      - Accounting > Tax Codes
      summary: 1|Create a Tax Code
      description: Creates a new tax code for coding Airwallex Spend transactions.
      operationId: createTaxCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              - value
              - rate_percent
              properties:
                request_id:
                  type: string
                  description: Unique identifier for this request to ensure idempotency. Generate a random UUID to prevent accidental duplication.
                value:
                  type: string
                  description: Tax code name as defined in the accounting system.
                rate_percent:
                  type: string
                  description: Tax rate value as a decimal percentage.
                value_label:
                  type: string
                  description: Airwallex display name for the tax code.
                external_id:
                  type: string
                  description: External ID from the accounting system.
                legal_entity_ids:
                  type: array
                  description: Legal entity IDs to which this tax code applies. Omit this field when it applies to all legal entities.
                  items:
                    type: string
      responses:
        '201':
          description: Tax code created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxCode'
        '400':
          description: Invalid request.
        '500':
          description: Internal server error.
