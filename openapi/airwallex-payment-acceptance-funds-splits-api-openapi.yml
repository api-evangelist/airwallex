        name: ''
        method: POST
        uri: /api/v1/pa/funds_splits/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        request_body:
          request_id: b7a93a42-fd15-4529-885f-4d4d7553f2f5
