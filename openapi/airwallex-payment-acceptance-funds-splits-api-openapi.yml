tags:
- name: Payment Acceptance > Funds Splits
  description: 'A **Funds Split** will guide you through the process to divide part of the collected funds to another destination before settling to the account that owns the funds.


    You may create multiple **Funds Splits** for the same source of funds to send money to different destinations. However, one **Funds Split** will only have one destination.


    You may specify the following on a Funds Split.


    1. What is the source of funds? Denoted by `source_type`.

    2. How much do you want to split? Denoted by `amount`.

    3. Who will receive the funds? Denoted by `destination`.


    Currently, Funds Split only works when the source of funds is a payment acceptance transaction, and the destinations are connected accounts to the funds owner.


    Data Retention Policy: You can query and operate Funds Split resources for a maximum of 2 years since creation.'
  x-domain: Payment Acceptance
  x-resource: Funds Splits
  x-urlPath: payments/funds_splits
paths:
  /api/v1/pa/funds_splits/create:
    post:
      tags:
      - Payment Acceptance > Funds Splits
      summary: 1|Create a Funds Split
      description: 'Start dividing the funds you are collecting by creating a Funds Split.


        A **Funds Split** can be created only after the **Payment Intent** succeeds and before funds settlement. Subscribe to `payment_intent.succeeded` webhook to confirm if the payment was successful or alternatively provide `funds_split_data` directly in Create/Confirm/Capture a Payment Intent request.


        The destination account has to pass KYC to be able to receive fund splits


        The `auto_release` flag controls at what point the split funds will be released and settled to the destination. The behavior is as follows: \* **true(default)** - Automatically release the split funds following the standard settlement mode. \* **false** - Release split funds as a separate manual process by calling release.'
      operationId: createFundsSplit
      parameters:
      - name: x-on-behalf-of
        in: header
        description: The account unique identifier that this request is on behalf of.
        required: false
        schema:
          type: string
          default: acct_JD0UmuRLNcytX7sBj0lfWA
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - destination
              - request_id
              - source_id
              - source_type
              properties:
                amount:
                  type: string
                  description: Amount of this split. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
                auto_release:
                  type: boolean
                  description: Set it to `false` if you want to release split manually. `true` by default.
                destination:
                  type: string
                  description: 'The destination that the money is splitting to. The value could be either:

                    - a connected account ID. Used to split funds when collecting payments directly

                    - a platform account ID. Used to split funds when collecting payments on behalf of connected accounts

                    - a Funds Split Destination ID. Used to split funds to an external destination.'
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to the Funds Split. You can specify up to 50 keys with key names up to 50 characters long and values up to 500 characters long.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
                source_id:
                  type: string
                  description: Unique identifier of which source this split would be created from. Currently only payment_intent_id is supported.
                source_type:
                  type: string
                  description: Type of the source for this split. Currently only PAYMENT_INTENT is supported.
        description: Funds Split creation request.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundSplit'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request`, `operation_not_supported`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
