          destination: acct_sjnladsfjklasjd
          metadata:
            foo: bar
        status_code: 201
        reason_phrase: Created
        response_body:
          id: spt_hkpd1k27vg1xc7u
          request_id: b7a93a42-fd15-4529-885f-4d4d7553f2f5
          source_id: int_hkpdskz7vg1xc7uscdj
