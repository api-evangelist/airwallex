  /api/v1/finance/financial_reports:
    get:
      tags:
      - Finance > Financial Reports
      summary: 3|List all Financial Reports
      description: Get list of previously generated balance activity, transaction reconciliation, settlement, account statement, and aggregated settlement reports.
      operationId: listFinancialReports
      parameters:
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page, default is 100, max is 1000.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: List items.
                    items:
                      $ref: '#/components/schemas/CoreBankingFinancialReportRes'
        '400':
          description: '`invalid_argument`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
