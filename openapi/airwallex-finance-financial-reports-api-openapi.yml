          file_name: TRANSACTION_RECON_REPORT_2026_02_23.xlsx
          id: 8b2e4f1a-3c7d-4e9a-9f21-0a1b2c3d4e5f
          report_expires_at: 2026-03-23T23:59:59+1100
          report_parameters:
            from_date: '2026-02-22'
            time_zone: UTC
            to_date: '2026-02-23'
          report_version: 1.1.0
          status: COMPLETED
          type: TRANSACTION_RECON_REPORT
