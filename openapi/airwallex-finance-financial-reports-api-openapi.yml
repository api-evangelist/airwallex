  /api/v1/finance/financial_reports/{id}/content:
    get:
      tags:
      - Finance > Financial Reports
      summary: 4|Retrieve a Contents of a Financial Report
      description: Download a previously generated balance activity, transaction reconciliation, settlement or aggregated settlement reports.
      operationId: listContent
      parameters:
      - name: id
        in: path
        description: Unique identifier of financial report.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: 'A file of content type matching the `file_format` of the financial report. The response `Content-Type` may be one of:


            - `application/pdf`: PDF (.pdf)

            - `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`: Microsoft Excel (.xlsx)

            - `text/plain`: CSV (.csv)

            - `application/octet-stream`: Generic binary file

            '
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/plain:
