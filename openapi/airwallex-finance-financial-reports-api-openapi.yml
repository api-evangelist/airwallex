components:
  schemas:
    CoreBankingFinancialReportParameters:
      type: object
      properties:
        currencies:
          type: array
          description: Currencies included in the report.
          items:
            type: string
        from_date:
          type: string
          description: Start date of the report (inclusive).
        time_zone:
          type: string
          description: Timezone of the user.
        to_date:
          type: string
          description: End date of the report (inclusive).
        transaction_types:
          type: array
          description: Transaction types included in the report.
          items:
            type: string
      description: Parameters used to generate report.
    CoreBankingFinancialReportRes:
      type: object
      properties:
        file_format:
          type: string
          description: File format of the report. One of `CSV`, `PDF`, `EXCEL`.
        file_name:
          type: string
          description: File name.
        id:
          type: string
          description: Unique identifier of the financial report.
        report_expires_at:
          type: string
          description: Contents expiration date. Will be empty string if report is in `PENDING` state or the report does not expire.
        report_parameters:
          $ref: '#/components/schemas/CoreBankingFinancialReportParameters'
          description: Parameters used to generate report.
        report_version:
          type: string
          description: Version of the report.
        status:
          type: string
          description: Status of the report.
          enum:
          - COMPLETED
          - FAILED
          - PENDING
        type:
          type: string
          enum:
          - ACCOUNT_STATEMENT_REPORT
          - AGGREGATED_SETTLEMENT_REPORT
          - BALANCE_ACTIVITY_REPORT
          - ONLINE_PAYMENTS_TRANSACTION_REPORT
          - SETTLEMENT_REPORT
          - TRANSACTION_RECON_REPORT
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
