            id: ff13f14b-1624-4c24-b601-b4c018d2ea092
            report_expires_at: 2022-03-23T23:59:59+1100
            report_parameters:
              currencies:
              - AUD
              - USD
              - EUR
              from_date: '2022-02-22'
              time_zone: UTC
              to_date: '2022-02-25'
              transaction_types:
              - conversion
            report_version: 1.0.0
            status: COMPLETED
            type: BALANCE_ACTIVITY_REPORT
