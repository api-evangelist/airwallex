components:
  schemas:
    CoreBankingFinancialTransaction:
      type: object
      properties:
        amount:
          type: number
          description: Gross amount the transaction.
        batch_id:
          type: string
          description: The batch unique identifier of the settlement that the transaction belongs to.
        client_rate:
          type: number
          description: The client rate for the transaction.
        created_at:
          type: string
          format: date-time
          description: The time this transaction was created at.
        currency:
          type: string
          description: Currency the transaction should be made in (3-letter ISO-4217 code).
        currency_pair:
          type: string
          description: The currency pair that the `client_rate` is quoted in.
        description:
          type: string
          description: The description of the transaction.
        estimated_settled_at:
          type: string
          format: date-time
          description: The time when the transaction will be settled at.
        fee:
          type: number
          description: Fee paid for the transaction.
        funding_source_id:
          type: string
          description: The unique identifier of the funding source from which the transaction originated.
        id:
          type: string
          description: Unique identifier  of the transaction.
        net:
          type: number
          description: Net amount of the transaction.
        settled_at:
          type: string
          format: date-time
          description: The time when the transaction was settled at.
        source_id:
          type: string
          description: The source unique identifier of the transaction.
        source_type:
          type: string
          description: "The type of the source transaction, One of `PAYOUT`, `CONVERSION`, `DEPOSIT`, \n            `ADJUSTMENT`, `FEE`, `PAYMENT_ATTEMPT`, `REFUND`, `DISPUTE`, `CHARGE`, `TRANSFER`, `YIELD`, \n            `BATCH_PAYOUT`, `CARD_PURCHASE`, `CARD_REFUND`, `PURCHASE`, `REFUND_REVERSAL`, `REPAYMENT`, `TRANSFER_OUT`, `TRANSFER_IN`, `TRANSFER_OUT_REVERSAL`, `TRANSFER_IN_REVERSAL`, `WITHHOLDING_TAX`."
        status:
          type: string
          description: One of `PENDING`, `SETTLED`, `CANCELLED` .
        transaction_type:
          type: string
          description: "The type of the transaction, One of `DISPUTE`,\n            `DISPUTE_REVERSAL`, `DISPUTE_LOST`, `REFUND`, `REFUND_REVERSAL`,`REFUND_FAILURE`,\n            `PAYMENT_RESERVE_HOLD`,`PAYMENT_RESERVE_RELEASE`,`PAYOUT`,`PAYOUT_FAILURE`,\n            `PAYOUT_REVERSAL`, `CONVERSION_SELL`, `CONVERSION_BUY`, `CONVERSION_REVERSAL`,\n            `DEPOSIT`, `ADJUSTMENT`, `FEE`, `DD_CREDIT`, `DD_DEBIT`, `DC_CREDIT`, `DC_DEBIT`,\n            `TRANSFER`, `PAYMENT`, `ISSUING_AUTHORISATION_HOLD`,\n            `ISSUING_AUTHORISATION_RELEASE`, `ISSUING_CAPTURE`, `ISSUING_REFUND`, `PURCHASE`,\n            `PREPAYMENT`, `PREPAYMENT_RELEASE`, `REPAYMENT_FUNDING`, `REPAYMENT_DEDUCTION`,\n            `MOR_PAYOUT`, `MOR_PAYOUT_REVERSAL`, `TRANSFER_OUT`, `TRANSFER_IN`,\n            `TRANSFER_OUT_REVERSAL`, `TRANSFER_IN_REVERSAL`,\n            `WITHHOLDING_TAX`, `WITHHOLDING_TAX_REVERSAL`."
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
