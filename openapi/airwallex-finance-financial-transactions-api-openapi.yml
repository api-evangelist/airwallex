  /api/v1/financial_transactions:
    get:
      tags:
      - Finance > Financial Transactions
      summary: 2|List all Financial Transactions
      description: Get a list of financial transactions that contributed to the Airwallex account balance from a specified creation date/time, with optional filters on end creation date/time, batch_id and status.
      operationId: listFinancialTransactions
      parameters:
      - name: batch_id
        in: query
        description: Batch unique identifier of the financial transaction.
        required: false
        schema:
          type: string
      - name: currency
        in: query
        description: The currency (3-letter ISO-4217 code) of the financial transaction.
        required: false
        schema:
          type: string
      - name: from_created_at
        in: query
        description: The start time of `created_at` in ISO8601 format (inclusive).
        required: false
        schema:
          type: string
      - name: page_num
        in: query
        description: Page number, default is 0, max is 2000.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page, default is 100, max is 1000.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: source_id
        in: query
        description: The source unique identifier of the transaction.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: 'Status of the financial transaction, one of: `PENDING`, `SETTLED`.'
        required: false
        schema:
          type: string
      - name: to_created_at
        in: query
        description: The end time of `created_at` in ISO8601 format (inclusive).
        required: false
        schema:
          type: string
      - name: x-on-behalf-of
        in: header
        description: Unique identifier of the connected sub account.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: List items.
                    items:
                      $ref: '#/components/schemas/CoreBankingFinancialTransaction'
        '400':
          description: '`invalid_argument`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '`credentials_invalid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`service_unavailable`'
          content:
