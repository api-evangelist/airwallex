paths:
  /api/v1/financial_transactions/{id}:
    get:
      tags:
      - Finance > Financial Transactions
      summary: 1|Retrieve a Financial Transaction
      description: Get a specific financial transaction by an Airwallex financial transaction unique identifier.
      operationId: retrieveFinancialTransaction
      parameters:
      - name: id
        in: path
        description: Unique identifier of financial transaction.
        required: true
        schema:
          type: string
      - name: x-on-behalf-of
        in: header
        description: Unique identifier of the connected sub account.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreBankingFinancialTransaction'
        '401':
          description: '`credentials_invalid`'
          content:
