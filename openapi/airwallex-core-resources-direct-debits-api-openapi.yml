components:
  schemas:
    DirectDebit:
      required:
      - amount
      - created_at
      - currency
      - global_account_id
      - transaction_id
      type: object
      properties:
        amount:
          type: number
          description: The amount of this direct debit.
        created_at:
          type: string
          description: The timestamp this direct debit was created.
          format: date-time
        currency:
          type: string
          description: The currency (3-letter ISO-4217 code) of this direct debit.
        transaction_id:
          type: string
          description: A unique id of this direct debit.
        global_account_id:
          type: string
          description: The global account id of this direct debit.
        status:
          type: string
          description: The status of direct debit transaction.
          enum:
          - NEW
          - IN_REVIEW
          - PENDING
          - SETTLED
          - REJECTED
          - RETURNED
        debtor_name:
          type: string
          description: The debtor's name of this direct debit.
        statement_ref:
          type: string
          description: The statement reference of this direct debit.
        mandate_id:
          type: string
          description: The unique identifier of the related mandate.
      description: Paged results.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
