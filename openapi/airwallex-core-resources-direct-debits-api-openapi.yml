  /api/v1/direct_debits:
    get:
      tags:
      - Core Resources > Direct Debits
      summary: 2|List all Direct Debits
      description: Get list of direct debits by specifying the start and end date/time of creation. If neither from_created_date nor to_created_date are provided, direct debits within 30 days of today will be returned. If only to_created_date is provided, direct debits within 30 days of to_created_date will be returned.
      operationId: listDirectDebits
      parameters:
      - name: from_created_date
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        schema:
          type: string
          default: '2021-05-01'
      - name: to_created_date
        in: query
        description: The end date of `created_at` in ISO8601 format (inclusive).
        required: false
        schema:
          type: string
          default: '2021-05-31'
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page, defaultValue 100.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                required:
                - has_more
                - items
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: Paged results.
                    items:
                      $ref: '#/components/schemas/DirectDebit'
        '307':
          description: Temporary Redirect
        '400':
          description: '["field_required", "bad_request", "invalid_argument"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid", "credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      x-examples:
