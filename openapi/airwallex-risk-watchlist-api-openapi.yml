  /api/v1/risk/watchlist/create:
    post:
      tags:
      - Risk > Watchlist
      summary: 4|Add an Item to the Watchlist
      description: Add an item to the Watchlist.
      operationId: createWatchlist
      x-oboSupported: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - request_id
              - type
              - value
              properties:
                action:
                  type: string
                  description: 'Risk action to be taken by the risk engine: Use `BLOCK`, `VERIFY`, `ACCEPT` to always perform the associated risk action. The risk engine will prioritize actions in the following order: `BLOCK`>`VERIFY`>`ACCEPT`.

                    Please note that `ACCEPT` functionality will only be available to users with good fraud performance and will be subject to reasonable usage limits.'
                reason:
                  type: string
                  description: The reason for adding this item to the Watchlist.
                request_id:
                  type: string
                  description: Unique id for the request.
                status:
                  type: string
                  description: The status of the list item should be one of:`ACTIVE`,`INACTIVE`. Default is:`ACTIVE`.
                type:
                  type: string
                  description: "The type of the Watchlist item: `CARD_BIN`, `CARD_FINGERPRINT`, `CARD_ISSUER_COUNTRY_CODE`, `CUSTOMER_EMAIL`, `CUSTOMER_ID`. \nPlease note that `ACCEPT` Watchlist only supports `CARD_FINGERPRINT`, `CUSTOMER_EMAIL` and `CUSTOMER_ID`. \nThe following data fields are case sensitive: `CARD_FINGERPRINT`, `CUSTOMER_ID`."
                value:
                  type: string
                  description: The value of the item corresponding to the correct type.
