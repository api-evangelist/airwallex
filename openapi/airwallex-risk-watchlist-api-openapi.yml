      description: Get list of items with optional filters, sorted by the item creation date in descending order.
      operationId: listWatchlist
      x-oboSupported: false
      parameters:
      - name: action
        in: query
        description: Filter on action of Watchlist item.
        required: false
        schema:
          type: string
      - name: from_created_at
        in: query
        description: The start date of created_at in ISO8601 format (yyyy-MM-dd'T'HH:mm:ssZ). The default is 30 days before `to_create_at`.
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of page_after (if not null) from the response to a subsequent call. To retrieve the previous page of results, pass the value of page_before (if not null) from the response to a subsequent call.
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: A limit on the number of records to be returned on a page, between 1 and 2000. The default is 100.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 2000
      - name: status
        in: query
        description: Filter on status of Watchlist item.
        required: false
        schema:
          type: string
      - name: to_created_at
        in: query
        description: The end date of created_at in ISO8601 format (yyyy-MM-dd'T'HH:mm:ssZ). The default is current time.
        required: false
        schema:
          type: string
          format: date-time
      - name: type
        in: query
        description: Filter on type of Watchlist item.
        required: false
        schema:
          type: string
      - name: value
        in: query
        description: Filter on value of Watchlist item.
        required: false
        schema:
          type: string
