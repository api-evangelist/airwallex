  /api/v1/charges/{id}:
    get:
      tags:
      - Embedded Finance > Charges
      summary: 2|Retrieve a Charge
      description: Get the details of a charge that has previously been created. Supply the unique charge identifier that was returned at the time your created a new charge and Airwallex will return details of the corresponding charge.
      operationId: retrieveCharge
      parameters:
      - name: id
        in: path
        description: Unique identifier of the charge to retrieve.
        required: true
        schema:
          type: string
          default: d9af1614-a6a1-4d45-aae7-6858fc6d9ede
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid","credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
