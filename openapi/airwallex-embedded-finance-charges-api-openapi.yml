tags:
- name: Embedded Finance > Charges
  description: A Scale Charge can be used to charge a Connected Account and credit the Platform account's wallet. This action may support processing fees and charges from your clients or business partners. Source Connected Account to be charged must have passed KYC and be in state `ACTIVE`.
  x-domain: Embedded Finance
  x-resource: Charges
  x-urlPath: scale/charges
paths:
  /api/v1/charges/create:
    post:
      tags:
      - Embedded Finance > Charges
      summary: 1|Create a Charge
      description: Create a charge to be applied to a connected account.
      operationId: createCharge
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - currency
              - reason
              - reference
              - request_id
              - source
              properties:
                amount:
                  type: string
                  description: Amount of the charge in `currency`, representing how much to charge.
                currency:
                  type: string
                  description: Currency (3-letter ISO-4217 code).
                reason:
                  type: string
                  description: 'Reason for the charge instruction.  One of: `wages_salary`, `donation_charitable_contribution`, `personal_remittance`, `transfer_to_own_account`, `pension`, `family_support`, `living_expenses`, `education_training`, `travel`, `investment_proceeds`, `investment_capital`, `loan_credit_repayment`, `taxes`, `goods_purchased`, `business_expenses`, `medical_services`, `professional_business_services`, `technical_services`, `other_services`, `construction`, `freight`, `real_estate`.'
                reference:
                  type: string
                  description: User specified reference that will be displayed to the beneficiary.  1-140 characters long.
                request_id:
                  type: string
                  description: Unique request identifier.  1-50 characters long.
                source:
                  type: string
                  description: Airwallex account unique identifier.
        description: chargeRequestDto.
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid","credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/charges/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          amount: '10000'
          currency: AUD
          reason: travel
          reference: PMT1936398
          request_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          source: '1936398'
        response_body:
          amount: '10000'
          created_at: 2017-03-22T16:08:02+1100
          currency: AUD
          fee: 10
          id: d9af1614-a6a1-4d45-aae7-6858fc6d9ede
          reason: travel
          reference: PMT1936398
