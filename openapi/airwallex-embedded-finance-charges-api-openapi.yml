components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    Charge:
      type: object
      required:
      - amount
      - created_at
      - currency
      - fee
      - id
      - reason
      - reference
      - request_id
      - short_reference_id
      - source
      - status
      - updated_at
      properties:
        amount:
          type: number
          description: Amount of the charge in `currency` specified in the request.
        created_at:
          type: string
          description: The time this charge was created.
        currency:
          type: string
          description: Currency (3-letter ISO-4217 code) specified in the request.
        fee:
          type: number
          description: Fee of the charge in `currency` specified in the request.
        id:
          type: string
          description: Unique identifier for the charge.
        reason:
          type: string
          description: Reason for the charge instruction specified in the request.
        reference:
          type: string
          description: User specified reference that will be displayed to the beneficiary specified in the request.
        request_id:
          type: string
          description: Unique request identifier specified in the request.
        short_reference_id:
          type: string
          description: Short reference for support purposes.
        source:
          type: string
          description: Airwallex account unique identifier specified in the request.
        status:
          type: string
          description: 'Status of the charge. One of: `NEW`, `PENDING`,`SETTLED`,`SUSPENDED`, `FAILED`.'
        updated_at:
          type: string
          description: The time this charge was updated.
