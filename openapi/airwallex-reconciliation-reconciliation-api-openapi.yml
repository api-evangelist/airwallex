paths:
  /api/v1/tc/balances:
    get:
      tags:
      - Reconciliation > Reconciliation
      summary: 1|List all Balances
      description: Get balances by either `client_request_id` or `currency` and range of `posted_at` dates.
      operationId: listReconciliationBalances
      x-oboSupported: false
      parameters:
      - name: client_request_id
        in: query
        description: The client request id.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: a08c0f2f
      - name: currency
        in: query
        description: Currency.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: USD
      - name: from_posted_at
        in: query
        description: The start date of `posted_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: 2017-04-01T03:52:34+0000
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: to_posted_at
        in: query
        description: The end date of `posted_at` in ISO8601 format (exclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: 2017-04-01T03:52:34+0000
      - name: type
        in: query
        description: Balance type, one of `ADJUSTMENT`, `CONVERSION_BUY`, `CONVERSION_SELL`,` DEPOSIT`, `FEE`, `PAYMENT`, `PAYMENT_REFUND`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: DEPOSIT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: Paged results.
                    items:
                      $ref: '#/components/schemas/TCBalance'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  details:
                    type: object
                  message:
                    type: string
                  source:
                    type: string
                title: ErrorResponse
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/tc/balances
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          has_more: false
          items:
          - amount: 0
            beneficiary_bank_account_name: zhou xingxing
            beneficiary_bank_account_number: '212121212'
            client_request_id: a08c0f2f
            closing_balance: 200
            created_at: 2017-04-01T03:52:34+0000
            currency: AUD
            debit_credit_flag: CREDIT
            id: a08c0f2f-3f26-4443-b5df-fad15582eb94
            opening_balance: 100
            posted_at: 2017-04-01T03:52:34+0000
            reason: note to myself
            reference: salary from airwallex
            remitter_name: '212121212'
            remitting_bank: '212121212'
            request_id: a08c0f2f
            type: PAYMENT_REFUND
