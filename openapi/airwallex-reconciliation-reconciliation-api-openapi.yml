components:
  schemas:
    TCBalance:
      type: object
      properties:
        amount:
          type: number
          description: The amount.
        beneficiary_bank_account_name:
          type: string
          description: The beneficiary bank account name, only available when transaction type is PAYMENT.
        beneficiary_bank_account_number:
          type: string
          description: The beneficiary bank account number, only available when transaction type is PAYMENT.
        client_request_id:
          type: string
          description: The original request id by client.
        closing_balance:
          type: number
          description: The closing balance.
        created_at:
          type: string
          description: The time this transaction was created.
        currency:
          type: string
          description: The currency.
        debit_credit_flag:
          type: string
          description: The debit/credit flag.
          enum:
          - DEBIT
          - CREDIT
        id:
          type: string
          description: The id of this transaction.
        opening_balance:
          type: number
          description: The opening balance.
        posted_at:
          type: string
          description: The time this transaction posted to balance.
        reason:
          type: string
          description: The note client add for itself.
        reference:
          type: string
          description: The reference to beneficiary.
        remitter_name:
          type: string
          description: The remitter name, only available when transaction type is DEPOSIT.
        remitting_bank:
          type: string
          description: The remitting bank name, only available when transaction type is DEPOSIT.
        request_id:
          type: string
          description: The client request id if the transaction initiated by client.
        type:
          type: string
          description: The type of this transaction, can be one of `PAYMENT`, `PAYMENT_REFUND`, `CONVERSION_SELL`, `CONVERSION_BUY`, `DEPOSIT`, `ADJUSTMENT`, `FEE`.
    TCTransaction:
      type: object
      properties:
        amount:
          type: number
          description: The credit amount.
        beneficiary_bank_account_name:
          type: string
          description: The beneficiary bank account name, only available when transaction type is PAYMENT.
        beneficiary_bank_account_number:
          type: string
          description: The beneficiary bank account number, only available when transaction type is PAYMENT.
        client_request_id:
          type: string
          description: The original request id by client.
        created_at:
          type: string
          description: The time this transaction was created.
        currency:
          type: string
          description: The currency.
        id:
          type: string
          description: The id of this transaction.
        reason:
          type: string
          description: The note client add for itself.
        reference:
          type: string
          description: The reference to beneficiary.
        remitter_name:
          type: string
          description: The remitter name, only available when transaction type is DEPOSIT.
        remitting_bank:
          type: string
          description: The remitting bank name, only available when transaction type is DEPOSIT.
        status:
          type: string
          description: The status of this transaction, can be one of `NEW`, `SETTLED`, `CANCELED`.
        type:
          type: string
          description: The type of this transaction, can be one of `PAYMENT`, `CONVERSION`, `DEPOSIT`, `ADJUSTMENT`, `FEE`.
