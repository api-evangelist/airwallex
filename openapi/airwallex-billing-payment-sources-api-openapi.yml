paths:
  /api/v1/billing/payment_sources/create:
    post:
      description: 'Creates a **PaymentSource** using a linked payment method from a supported **Payment Service Provider (PSP)**.

        When **Airwallex Payments** is used as the PSP, you can create a **PaymentSource** with a **PaymentMethod** authorized for **merchant-initiated payments**. This authorization can be obtained in two ways:

        - **Indirectly**, by creating a **PaymentIntent** with `payment_consent.next_triggered_by=merchant`, and `payment_consent.merchant_trigger_reason=unscheduled`.

        - **Directly**, by creating a **PaymentConsent** with `next_triggered_by=merchant`, and `merchant_trigger_reason=unscheduled`.


        For more details, refer to the PaymentIntents API and PaymentConsents API documentation.'
      operationId: createPaymentSource
      requestBody:
        content:
          application/json:
            schema:
              required:
              - billing_customer_id
              - external_id
              - request_id
              type: object
              properties:
                billing_customer_id:
                  type: string
                  description: ID of the [Billing Customer](/docs/api/billing/billing_customers) that this Payment Source belongs to.
                external_id:
                  maxLength: 200
                  minLength: 0
                  type: string
                  description: ID of the [Payment Method](/docs/api/payments/payment_methods) associated with the Payment Source.
                linked_payment_account_id:
                  type: string
                  description: ID of the linked payment account to collect payment. You can find this ID in the Airwallex web app > Settings > Account details, within the Account Information section. Required if you have more than 1 payment account in your organisation.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of string key-value pairs that you can attach to this object for storing additional information.
                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Billing_PaymentSource'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
