    Billing_CustomerDataCollection:
      type: object
      properties:
        billing_address:
          pattern: ^(AUTO|REQUIRED)$
          type: string
          description: 'Controls whether the billing address will be collected during checkout.

            - `AUTO`: Billing address will only be collected when necessary. Specifically, when automatic tax is enabled, or tax_id is collected.

            - `REQUIRED`: Billing address will always be collected.

            Defaults to `AUTO`.'
        tax_id:
          pattern: ^(DISABLED|OPTIONAL_IF_SUPPORTED|REQUIRED_IF_SUPPORTED)$
          type: string
          description: 'Controls whether the tax ID will be collected for business customer during checkout. One of `OPTIONAL_IF_SUPPORTED`, `DISABLED`, `REQUIRED_IF_SUPPORTED`.

            - `DISABLED`: Tax id will not be collected.

            - `OPTIONAL_IF_SUPPORTED`: Tax id will be optionally collected in the supported countries, by displaying a checkbox "I am purchasing as business".

            - `REQUIRED_IF_SUPPORTED`: Tax id will always be collected if the country is in the supported list.

            Defaults to `OPTIONAL_IF_SUPPORTED`.'
      description: Provides configuration for the Billing Checkout to collect information from customers.
    CheckoutPaymentMethodSave:
      type: object
      properties:
        mode:
          type: string
          description: "Controls whether the payment method can be saved for future use. Possible values: `ENABLED`, `DISABLED`, or `COLLECT_CONSENT`.  \n`ENABLED`: The payment method will be saved for future use.  \n`DISABLED`: The payment method will not be saved.  \n`COLLECT_CONSENT`: The checkout UI asks the customer whether they want to save the payment method."
        next_triggered_by:
          type: string
          description: "Indicates who will use the saved payment source to trigger future payments. One of `MERCHANT` or `CUSTOMER`.  \nIf `MERCHANT`, a Payment Source is created for future use. If `CUSTOMER`, the payment method is saved only with the payment provider."
      description: Settings for saving this payment method for future use.
