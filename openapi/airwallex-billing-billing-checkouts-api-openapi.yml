components:
  schemas:
    Billing_HostedCompletionPage:
      required:
      - display
      type: object
      properties:
        display:
          type: boolean
          description: Whether to display the Airwallex-hosted completion page after checkout is completed and before the customer is redirected to `success_url`.
      description: Configuration for the Airwallex-hosted completion page. Only applicable when `ui_mode` is `HOSTED`.
    DiscountInstruction:
      required:
      - type
      type: object
      properties:
        coupon:
          $ref: '#/components/schemas/CouponDiscountDataRequest'
        type:
          type: string
          description: 'Specifies how to obtain the discount. One of: `COUPON`.'
    Billing_InvoiceDataResponse:
      type: object
      properties:
        days_until_due:
          type: integer
          description: Number of days from invoice finalization until payment is due.
          format: int32
        default_tax_percent:
          type: number
          description: The tax rate between 0 and 100(%) to be applied to invoices to be generated. The tax will be exclusive. Defaults to 0.
          maximum: 100
          minimum: 0
        due_at:
          type: string
          description: Due date set by the merchant for this invoice, if any.
        memo:
          type: string
          description: String used for merchants to share a custom message to their customers. Referenced as memo or invoice note in Webapp.
          maxLength: 200
          minLength: 0
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of key-value pairs that you can attach to this object for storing additional information.
          description: A set of key-value pairs that you can attach to this object for storing additional information.
      description: The settings of invoice to be passed to the invoice creation upon completion of the Billing Checkout in `PAYMENT` mode.
    CheckoutLineItem:
      required:
      - discounts
      type: object
      properties:
        discounts:
          type: array
          description: List of discounts to be applied to the line items. Discounts of line items are applied before subscription or invoice discounts. Currently, only one element is supported.
          items:
            $ref: '#/components/schemas/DiscountInstruction'
          maxItems: 1
          minItems: 0
        price_id:
          type: string
          description: ID of the [Price](/docs/api/billing/prices) object. Mutually exclusive with `rate_card_id`.
        quantity:
          type: integer
          description: The quantity of the line item being purchased.
          format: int32
          minimum: 1
        rate_card_id:
          type: string
          description: ID of the [Rate Card](/docs/api/billing/rate_cards) object. Mutually exclusive with `price_id`.
        rate_card_version:
          type: integer
          description: Pinned Rate Card version number. Present when `rate_card_id` is set.
          format: int32
        tax_percent:
          type: number
          description: The effective tax percent of this line item.
          maximum: 100
          minimum: 0
    Checkout:
      required:
      - automatic_tax_status
      - created_at
      - discounts
      - enable_automatic_tax
      - expires_at
      - id
      - line_items
      - linked_payment_account_id
      - mode
      - status
      - ui_mode
      - updated_at
      type: object
      properties:
        automatic_tax_status:
          type: string
          description: The automatic tax status of this checkout.
          enum:
          - APPLIED
          - LOCATION_NOT_SUPPORTED
          - LOCATION_NOT_REGISTERED_BY_MERCHANT
          - ADDRESS_INCOMPLETE
          - DISABLED
          x-enumDescriptions:
            APPLIED: The automatic tax is applied.
            LOCATION_NOT_SUPPORTED: Automatic tax calculation isn't supported in the customer's location.
            LOCATION_NOT_REGISTERED_BY_MERCHANT: The merchant isn't registered to collect tax in the customer's location.
            ADDRESS_INCOMPLETE: The customer address was insufficient or invalid to determine the correct tax.
            DISABLED: The automatic tax is disabled.
        back_url:
          type: string
          description: If set, the hosted checkout page displays a back button which allows customers to cancel the flow and be directed to this URL.
        billing_customer_id:
          type: string
