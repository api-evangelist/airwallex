openapi: 3.2.0
info:
  title: Airwallex Core Resources > Deposits API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Core Resources > Deposits
  description: Deposits are transfers made into your Airwallex account via Global Accounts, Airwallex Pay, or Aggregate Funds for adding funds or collecting funds from third parties.
  x-domain: Core Resources
  x-resource: Deposits
  x-urlPath: core_resources/deposits
paths:
  /api/v1/deposits/create:
    post:
      tags:
      - Core Resources > Deposits
      summary: 1|Create a Deposit Via Direct Debit
      description: Deposits funds into your Airwallex account via Direct Debit from a Linked Account.
      operationId: createDeposit
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - currency
              - funding_source_id
              - request_id
              properties:
                amount:
                  type: number
                  description: The amount of this deposit.
                currency:
                  type: string
                  description: The `currency` (3-letter ISO-4217 code) of this deposit.
                deposit_type:
                  type: string
                  description: The type of deposit you would like to create. If not specified, it will default to DIRECT_DEBIT.
                  enum:
                  - DIRECT_DEBIT
                  - FASTER_DIRECT_DEBIT
                funding_source_id:
                  type: string
                  description: The unique identifier of your Linked Account or Funding Source.
                reference:
                  type: string
                  description: A user specified reference that will be displayed to the bank account owner on the bank statement. 1-10 characters long for USD, 1-18 characters long for AUD.
                request_id:
                  type: string
                  description: Unique request identifier specified in the request. Should be valid UUID.
        description: Required information to initiate a deposit.
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositDtoV2'
        '400':
          description: '["field_required","invalid_argument"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/deposits/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
