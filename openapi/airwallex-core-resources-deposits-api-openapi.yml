  /api/v1/deposits:
    get:
      tags:
      - Core Resources > Deposits
      summary: 3|List all Deposits
      description: Returns a list of deposits made into your Airwallex wallet. You can filter the list by specifying a time period. If left unspecified or only the end date is specified, then deposits 30 days in arrears of today or the end date will be returned.
      operationId: listDeposits
      parameters:
      - name: from_created_at
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: '2017-04-01'
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: to_created_at
        in: query
        description: The end date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: 2017-04-01T03:52:34+0000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: Paged results.
                    items:
                      $ref: '#/components/schemas/DepositDtoV2'
        '400':
          description: '["field_required","invalid_argument"]'
          content:
