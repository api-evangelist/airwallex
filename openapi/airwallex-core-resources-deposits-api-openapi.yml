components:
  schemas:
    DepositPayerDigitalWallet:
      type: object
      required:
      - account_name
      - provider
      properties:
        account_name:
          type: string
          description: Account holder name of the payer's digital wallet.
        id_type:
          type: string
          description: Account identifier type of the payer's digital wallet.
        id_value:
          type: string
          description: Account identifier value of the payer's digital wallet.
        provider:
          type: string
          description: Service provider of the payer's digital wallet.
      description: The digital wallet of the payer.
    BankAccountCNCnapsCode:
      type: object
      properties:
        account_number:
          type: string
          description: Financial account number.
        cnaps_code:
          type: string
          description: Cnaps code.
      description: China cnaps code information.
    BankAccountPartial:
      type: object
      properties:
        account_number:
          type: string
          description: Financial account number.
        account_routing_type1:
          type: string
          description: Routing code type.
        account_routing_type2:
          type: string
          description: Routing code sub type.
        account_routing_value1:
          type: string
          description: Routing code type value.
        account_routing_value2:
          type: string
          description: Routing code sub type value.
      description: Partial bank information.
    DepositFee:
      type: object
      properties:
        amount:
          type: number
          description: Fee amount of this deposit.
        currency:
          type: string
          description: Fee `currency` (3-letter ISO-4217 code) of this deposit.
      description: Deposit fee.
    BankAccountAUBsb:
      type: object
      properties:
        account_number:
          type: string
          description: Financial account number.
        bsb:
          type: string
          description: BSB code.
      description: Australia BSB information.
    ProviderFailureDetails:
      type: object
      properties:
        code:
          type: string
          description: The original error code received from the local clearing system.
        local_clearing_system:
          type: string
          description: The local clearing system used for the direct debit deposit. Possible values are `AU_BECS`, `US_ACH`, `GB_BACS`, `EU_SEPA`.
        message:
          type: string
          description: The original error message received from the local clearing system.
      description: A set of original information received from the local clearing system.
    BankAccountDKBankCode:
      type: object
      properties:
        account_number:
          type: string
          description: Financial account number.
        bank_code:
          type: string
          description: Bank code.
      description: Denmark bank code information.
    DepositDtoV2:
      type: object
      properties:
        amount:
          type: number
          description: The amount of this deposit.
        created_at:
          type: string
          description: The date time in ISO8601 format when this deposit was created.
        currency:
          type: string
          description: The `currency` (3-letter ISO-4217 code) of this deposit.
        estimated_settled_at:
          type: string
          description: Estimated settlement time of this deposit. With ISO8601 format.
        failure_details:
          $ref: '#/components/schemas/Core_Resources_FailureDetails'
          description: Empty unless the deposit is in a failure status (`REJECTED`, `REVERSED`).
        fee:
          $ref: '#/components/schemas/DepositFee'
          description: Deposit fee.
        funding_source_id:
          type: string
          description: Funding Source unique identifier of this deposit. Applies to `DIRECT_DEBIT` deposit type. This is the same as your Linked Account unique identifier.
        global_account_id:
          type: string
          description: Global Account unique identifier of this deposit. Applies to `BANK_TRANSFER` deposit type. Nullable for deposits via DBS_HK GA.
        id:
          type: string
          format: uuid
          description: A unique identifier of this deposit.
        payer:
          $ref: '#/components/schemas/DepositPayer'
          description: The payer of this transfer deposit.
        provider_transaction_id:
          type: string
          description: The unique identifier on this deposit provided by the banking provider. Duplicates may occur in edge cases.
        reference:
          type: string
          description: A user specific reference that will be displayed to the bank account owner on the bank statement.
        settled_at:
          type: string
          description: Actual settlement time of this deposit. With ISO8601 format.
        status:
          type: string
          description: Status of this deposit.
          enum:
          - PENDING
          - SETTLED
          - REJECTED
          - REVERSED
        type:
          type: string
          description: Type of this deposit.
          enum:
          - BANK_TRANSFER
          - DIRECT_DEBIT
          - DIGITAL_WALLET_TRANSFER
          - AGGREGATE_FUNDS
          - STABLECOIN_TRANSFER
    DepositPayer:
      type: object
      properties:
        bank_account:
          $ref: '#/components/schemas/DepositPayerBankAccount'
          description: The bank account of the payer.
        country_code:
          type: string
          description: Country of the payer (2-letter ISO 3166-2 country code).
        digital_wallet:
          $ref: '#/components/schemas/DepositPayerDigitalWallet'
          description: The digital wallet of the payer.
        name:
          type: string
          description: The name of the payer.
        stablecoin_wallet:
          $ref: '#/components/schemas/DepositStablecoinWallet'
          description: The stablecoin wallet of the payer.
      description: The payer of this transfer deposit.
    BankAccountGBSortCode:
      type: object
      properties:
        account_number:
          type: string
          description: Financial account number.
        sort_code:
          type: string
          description: Sort code.
      description: Greate Britain sort code information.
    BankAccountJPBankCode:
      type: object
      properties:
        account_number:
          type: string
          description: Financial account number.
        bank_code:
          type: string
          description: Bank code.
        branch_code:
          type: string
          description: Branch code.
      description: Japan bank code information.
    BankAccountUSAch:
      type: object
      properties:
        account_number:
          type: string
          description: Financial account number.
        ach:
          type: string
          description: ACH routing number.
      description: United States ACH information.
    BankAccountBRBankCode:
      type: object
      properties:
        account_number:
          type: string
          description: Financial account number.
        bank_code:
          type: string
