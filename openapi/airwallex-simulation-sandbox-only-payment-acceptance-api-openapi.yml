  /api/v1/simulation/pa/payment_disputes/{id}/escalate:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Payment Acceptance
      summary: 4|Escalate a Payment Dispute
      description: By escalating a dispute, the evidence provided by the merchant is declined, and the dispute is escalated to the next stage.
      operationId: simulation_escalatePaymentDispute
      parameters:
      - name: id
        in: path
        description: PaymentDispute unique identifier.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - due_at
              properties:
                amount:
                  type: number
                  description: The adjusted amount of dispute.
                comment:
                  type: string
                  description: The text description of why the dispute is escalated.
                documents:
                  type: array
                  description: The documents explain why the dispute is escalated. The list of File unique identifiers submitted via File Service.
                  items:
                    type: string
                due_at:
                  type: string
                  format: date-time
                  description: The new due date of the dispute.
        description: escalate dispute request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationPaymentDispute'
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '500':
