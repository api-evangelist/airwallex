components:
  schemas:
    SimulationReasonDetails:
      type: object
      properties:
        description:
          type: string
          description: PaymentDispute reason description.
        original_code:
          type: string
          description: PaymentDispute reason code.
        type:
          type: string
          description: 'PaymentDispute reason type. Possible values: `CREDIT_NOT_PROCESSED`, `FRAUDULENT`, `DUPLICATE_CHARGE`, `PRODUCT_NOT_RECEIVED`, `PRODUCT_UNACCEPTABLE`, `UNRECOGNIZED_CHARGE`, `CANCELLED_PRODUCT`, `MISREPRESENTATION`, `COUNTERFEIT_PRODUCT`, `PROCESSING_ERRORS`, `AUTHORIZATION`, `NOT_RECOGNIZED`, `BANK_REJECTION`, `FUND_REVERSAL`, `CONSUMER_DISPUTE`, `POINT_OF_INTERACTION_ERROR` and `UNKNOWN`.'
      description: PaymentDispute reason.
    SimulationAcceptDetails:
      type: object
      properties:
        accepted_at:
          type: string
          format: date-time
