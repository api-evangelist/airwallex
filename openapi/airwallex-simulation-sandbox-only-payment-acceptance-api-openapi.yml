openapi: 3.2.0
info:
  title: Airwallex Simulation (Sandbox Only) > Payment Acceptance API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Simulation (Sandbox Only) > Payment Acceptance
  x-urlPath: simulation/payments
  description: Simulate shopper actions on dispute in the sandbox environment.
  x-domain: Simulation (Sandbox Only)
  x-resource: Payment Acceptance
paths:
  /api/v1/simulation/pa/shopper_actions/{action}:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Payment Acceptance
      summary: 1|Simulate a Shopper Action
      description: You can use this endpoint to simulate the shopper actions after obtaining a redirect URL for a PaymentIntent or PaymentConsent. Upon successful simulation of a shopper action on the given URL, a response with HTTP status `200 OK` and empty body will be returned. This endpoint is only available in the sandbox environment.
      operationId: simulation_createShopperAction
      x-oboSupported: false
      parameters:
      - name: action
        in: path
        description: "Action to simulate on a given redirect URL. Supported values are:  \n  \nPaymentIntent: `pay` and `reject`.  \n  \nPaymentConsent: `verify`."
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  description: The url with which shoppers actions will be simulated after redirection. Usually obtained from the response of [Confirm a PaymentIntent](/docs/api/payments/payment_intents/confirm) and [Verify a PaymentConsent](/docs/api/payments/payment_consents/verify).
        description: Request body for simulating shopper actions on a given URL.
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `operation_not_supported`.'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`.'
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/simulation/pa/shopper_actions/action
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          url: https://api.sandbox.airwallex.com/pa/sandbox/sg/mck_hkdmt2qn2gk5b13d15o
      x-scope:
      - scope: simulation:write
        group: Simulations
        resource_name: Simulations
      x-domain: Simulation (Sandbox Only)
      x-resource: Payment Acceptance
      x-urlPath: shopper_actions
      x-oauthSupported: true
      x-resourceLevel: account
  /api/v1/simulation/pa/payment_disputes/create:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Payment Acceptance
      summary: 2|Create a Payment Dispute
      description: By creating a dispute, we raise a dispute for the merchant to respond.
      operationId: simulation_createPaymentDispute
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - due_at
              - payment_intent_id
              - reason_code
              - stage
              properties:
                amount:
                  type: number
                  description: The amount of dispute in transaction currency. The original payment amount is used by default.
                comment:
                  type: string
                  description: The text description of why the dispute is raised.
                documents:
                  type: array
                  description: The documents explain why the dispute is raised. The list of File unique identifiers submitted via File Service.
                  items:
                    type: string
                due_at:
                  type: string
                  format: date-time
                  description: The due date of dispute.
                payment_intent_id:
                  type: string
                  description: The unique identifier of PaymentIntent to raise a dispute against.
                reason_code:
                  type: string
                  description: The reason code for the dispute. Must be a valid reason code for the given processor.
                stage:
                  type: string
                  description: The stage of dispute.
        description: create dispute request.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationPaymentDispute'
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '500':
          description: service_unavailable
