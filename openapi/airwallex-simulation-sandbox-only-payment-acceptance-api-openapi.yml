  /api/v1/simulation/pa/payment_disputes/{id}/resolve:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Payment Acceptance
      summary: 3|Resolve a Payment Dispute
      description: 'By resolving a dispute, the dispute transitions to the final status.


        - When `in_favor_of` = `MERCHANT`, the dispute becomes `WON` or `REVERSED`

        - When `in_favor_of` = `CUSTOMER`, the dispute becomes `LOST`.'
      operationId: simulation_resolvePaymentDispute
      parameters:
      - name: id
        in: path
        description: PaymentDispute unique identifier.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - in_favor_of
              properties:
                amount:
                  type: number
                  description: The resolved amount. The full disputed amount is used by default.
                comment:
                  type: string
                  description: The text explains why the dispute is resolved.
                in_favor_of:
                  type: string
                  description: The party who is in favor of when resolving the dispute.
                  enum:
                  - CUSTOMER
                  - MERCHANT
        description: resolve dispute request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationPaymentDispute'
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '500':
          description: service_unavailable
