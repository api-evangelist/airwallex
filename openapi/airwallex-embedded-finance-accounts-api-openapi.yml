  /api/v1/accounts/{id}/suspend:
    post:
      tags:
      - Embedded Finance > Accounts
      summary: 8|Suspend an Account
      description: Change an account status from ACTIVE to SUSPENDED, effectively suspending it. This is a temporary status change that can be reversed with Reactivate. For official account closure, use Create an offboarding instead. This status change also applies to all accounts under the same client legal entity. If multiple accounts are affected, the response will include account information for all impacted accounts.
      operationId: accounts_suspend
      x-oboSupported: false
      parameters:
      - name: id
        in: path
        description: Airwallex account unique identifier.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  description: The reason for the account suspension.
