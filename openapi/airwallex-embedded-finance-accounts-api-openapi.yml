openapi: 3.2.0
info:
  title: Airwallex Embedded Finance > Accounts API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Embedded Finance > Accounts
  description: The Accounts resource represents an Airwallex account, which serves as the main container for a customer’s financial data—including wallet balances, financial transactions, cards, and more. This resource allows customers to retrieve and update account information. For platform customers, it also supports onboarding and managing Connected Accounts.
  x-domain: Embedded Finance
  x-resource: Accounts
  x-urlPath: scale/accounts
paths:
  /api/v1/accounts/create:
    post:
      tags:
      - Embedded Finance > Accounts
      summary: 1|Create an Account
      description: Create a new Airwallex account for your users, merchants, subsidiaries, business partners or clients. You can append more information to the account after creation using the ‘update account’ endpoint. To append documents, please use the ‘file service’ endpoint. Once all the required information has been provided you can submit the account using the ‘Submit account for activation’ endpoint.
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_details:
                  type: object
                  description: Relevant information associated with Airwallex account.
                  properties:
                    attachments:
                      type: object
                      description: Supplementary files gathered during onboarding. May contain supplementary materials for BusinessEntity and BusinessPersons (UBO, etc).
                      properties:
                        additional_files:
                          type: array
                          description: Additional files.
                          items:
                            type: object
                            properties:
                              description:
                                type: string
                                description: Optional field for any additional notes or text description for the file.
                              file_id:
                                type: string
                                description: Unique identifier of file as provided in the response from the File Service API.
                              tag:
                                type: string
                                description: Tag of the additional file.
                                enum:
                                - DRIVERS_LICENSE_FRONT
                                - DRIVERS_LICENSE_BACK
                                - PERSONAL_ID_FRONT
                                - PERSONAL_ID_BACK
                                - PASSPORT
                                - MEDICARE_CARD
                                - OTHER
                    business_details:
                      type: object
                      description: General information about the business, such as its name, address, and other relevant details.
                      properties:
                        account_usage:
                          type: object
                          description: The intended purpose of the account, such as product usage and monthly turnover.
                          properties:
                            estimated_monthly_revenue:
                              type: object
                              description: The approximate amount of revenue a business generates in a month.
                              properties:
                                amount:
                                  type: string
                                  description: The approximate amount of revenue a business generates in a month.
                                currency:
                                  type: string
                                  description: Currency of the revenue. (3-letter ISO 4217 currency code).
                            product_reference:
                              type: array
                              description: "Intended product usage.  \n`ACCEPT_ONLINE_PAYMENTS`,`COLLECT_MARKETPLACE_PROCEEDS`,  \n`RECEIVE_TRANSFERS`,`GET_PAID`,`CONVERT_FUNDS`,  \n`MAKE_TRANSFERS`,`CREATE_CARDS`,`MANAGE_EXPENSES`,  \n`USE_AWX_API`,`TRANSFER_CNY_INBOUND`."
                              items:
                                type: string
                        as_trustee:
                          type: boolean
                          description: Whether this account is set up as a trustee on behalf of a trust.
                        attachments:
                          type: object
                          description: Reference to uploaded files of business documentation. (For file upload instructions, refer to 'File Service API'.).
                          properties:
                            business_documents:
                              type: array
                              description: All business documents, such as incorporation certificates, ownershipship structure, and other relevant documentation.
                              items:
                                type: object
                                properties:
                                  description:
                                    type: string
                                    description: Optional field for any additional notes or text description for the file.
                                  file_id:
                                    type: string
                                    description: Unique identifier of file as provided in the response from the File Service API.
                                  tag:
                                    type: string
                                    description: Tag of the business file.
                                    enum:
                                    - ACRA_COMPANY_PROFILE_DOCUMENT
                                    - ANNUAL_REPORT
                                    - ANNUAL_RETURN
                                    - ARTICLES_OF_ASSOCIATION
                                    - ASIC_CURRENT_COMPANY_EXTRACT
                                    - ASSUMED_NAME_CERTIFICATE
                                    - AUTHORIZED_SIGNATORY_DISCLOSURE
                                    - BUSINESS_LICENSE
                                    - CERTIFICATE_OF_INCORPORATION
                                    - CERTIFICATION_REGISTRATION
                                    - COMPANY_CERTIFICATE
                                    - COMPANY_CONSTITUTION
                                    - COMPANY_PROFILE
                                    - CONFIRMATION_STATEMENT
                                    - DIRECTOR_LIST
                                    - EIN_LETTER
                                    - LEGAL_NAME_AND_ADDRESS
                                    - OPERATING_AGREEMENT
                                    - PARTNERSHIP_AGREEMENT
                                    - REGISTRATION_CERTIFICATE
                                    - SHAREHOLDING_STRUCTURE_CHART
                                    - SUPPORTIVE_OTHER
                                    - TRUST_DEED
                                    - UNIT_HOLDER_REGISTER
                                    - UBO_SUPPORTIVE
                                    - THIRD_PARTY_SHAREHOLDING_DOCUMENT
                        business_address:
                          type: object
                          description: Address where the business operates and conducts its activities.
                          properties:
                            address_line1:
                              type: string
                              description: The first line of a physical address, typically including the street number and name of the building or residence. A P.O. box is not acceptable.
                            address_line2:
                              type: string
                              description: An optional field that can be used to capture additional information about the address, such as the apartment/ suite number, or floor number.
                            country_code:
                              type: string
                              description: '**Required for non-registered sole proprietors and businesses that do not have a business registration country.** Country code. (2-letter ISO 3166-2 country code).'
                            postcode:
                              type: string
                              description: Postcode or zip code. Only applicable if relevant to selected country.
                            state:
                              type: string
                              description: Name of state. Only applicable if relevant to selected country.
                            suburb:
                              type: string
                              description: Name of city/suburb.
                        business_identifiers:
                          type: array
                          description: Local business registration number i.e. an official signal of identification for the business.
                          items:
                            type: object
                            properties:
                              country_code:
                                type: string
                                description: Country code. (2-letter ISO 3166-2 country code).
                              number:
                                type: string
                                description: Local business registration number i.e. an official signal of identification for the business.
                              type:
                                type: string
                                description: Type of business registration number, depending on what's applicable to the country the business is registered in.
                                enum:
                                - BRN
                                - EIN
                                - SSN
                                - VAT
                                x-enumDescriptions:
                                  BRN: Business Registration Number
                                  EIN: Employer Identification Number
                                  SSN: Social Security Number
                                  VAT: Value Added Tax Number
                        business_name:
                          type: string
                          description: The official legal name of the business as registered with the relevant government authority.
                        business_name_english:
                          type: string
                          description: The official legal name of the business as registered with the relevant government authority. (in ASCII characters only, e.g. romanization of non-Latin characters).
                        business_name_trading:
                          type: string
                          description: Also known as a "doing business as" (DBA) name, refers to a name under which the business operates and conducts its activities, which may differ from its legal name.
                        business_start_date:
                          type: string
                          description: The date on which the business officially begins its operations in YYYY-MM-DD format.
                        business_structure:
                          type: string
                          description: Type of business structure.
                          enum:
                          - COMPANY
                          - CORPORATION
                          - GENERAL_PARTNERSHIP
                          - LIMITED_LIABILITY_COMPANY
                          - LIMITED_LIABILITY_PARTNERSHIP
                          - LIMITED_PARTNERSHIP
                          - PARTNERSHIP
                          - SELF_MANAGED_SUPER_FUND
                          - SOLE_PROPRIETOR
                          - NON_REGISTERED_SOLE_PROPRIETOR
                          - TRUST
                          - OTHER
                        contact_number:
                          type: string
                          description: Primary business phone number.
                        description_of_goods_or_services:
                          type: string
                          description: Free text description of goods or services. Max length is 500 characters.
                        explanation_for_high_risk_countries_exposure:
                          type: string
                          description: Free text description of business activities conducted in high-risk countries if any. Max length is 500 characters.
                        exports_goods_or_services:
                          type: boolean
                          description: Indicate whether the business engages in the export of goods and/or services.
                        fax_number:
                          type: string
                          description: Business fax number.
                        has_governing_document:
                          type: boolean
                          description: Indicate whether the NZ business has a governing document (e.g. a constitution, charter, rules, or a shareholders' agreement). Leave null when undeclared (do not default to false).
                        has_member_holding_public_office:
                          type: boolean
                          description: Indicate whether the customer, close family member, or business partner holds public office.
                        has_nominee_shareholders:
                          type: boolean
                          description: Indicate whether any of the individuals hold their shares on behalf of a third party.
                        has_prior_financial_institution_refusal:
                          type: boolean
                          description: Indicate whether the customer has been refused service from a financial institution due to ML/TF concerns.
                        has_ringgit_borrowing:
                          type: boolean
                          description: Indicate whether the business engages in domestic Ringgit borrowing.
                        industry_category_code:
                          type: string
                          description: The code of the industry category most aligned with your business. Please navigate to the 'Supporting Services' > 'Reference Data' > 'Industry categories' section for an endpoint to pull a tree of categories.
                        no_shareholders_with_over_25percent:
                          type: boolean
                          description: Attestation of ownership structure without shareholders holding above 25% shares.
                        operating_country:
                          type: array
                          description: The countries in which the business conducts its operations, such as selling products or services, or providing support to customers. Multiple country codes (2-letter ISO 3166-2 country code) may be provided.
                          items:
                            type: string
                        registration_address:
                          type: object
                          description: Address where the business is registered.
                          properties:
                            address_line1:
                              type: string
                              description: The first line of a physical address, typically including the street number and name of the building or residence. A P.O. box is not acceptable.
                            address_line2:
                              type: string
                              description: An optional field that can be used to capture additional information about the address, such as the apartment/ suite number, or floor number.
                            country_code:
                              type: string
                              description: '**Required for all business types except non-registered sole proprietors and businesses that do not have a business registration country.** If your business has no registration country, provide it in business_address.country_code instead. Country code. (2-letter ISO 3166-2 country code).'
                            postcode:
                              type: string
                              description: Postcode or zip code. Only applicable if relevant to selected country.
                            state:
                              type: string
                              description: Name of state. Only applicable if relevant to selected country.
                            suburb:
                              type: string
                              description: Name of city/suburb.
                        registration_address_english:
                          type: object
                          description: Address where the business is registered. (in ASCII characters only, e.g. romanization of non-Latin characters).
                          properties:
                            address_line1:
                              type: string
                              description: The first line of a physical address, typically including the street number and name of the building or residence. A P.O. box is not acceptable.
                            address_line2:
                              type: string
                              description: An optional field that can be used to capture additional information about the address, such as the apartment/ suite number, or floor number.
                            country_code:
                              type: string
                              description: Country code. (2-letter ISO 3166-2 country code).
                            postcode:
                              type: string
                              description: Postcode or zip code. Only applicable if relevant to selected country.
                            state:
                              type: string
                              description: Name of state. Only applicable if relevant to selected country.
                            suburb:
                              type: string
                              description: Name of city/suburb.
                        state_of_incorporation:
                          type: string
                          description: The state where the business incorporated, different from registration state. (2-letter ISO 3166-2 state code).
                        url:
                          type: string
                          description: Websites associated with the business, such as its official website, social media pages, or other online profiles.
                    business_person_details:
                      type: array
                      description: Information about the individuals that own or have a controlling interest in the business, or are authorized to act on behalf of the business. This list doesn't support partial update (i.e. one person of many), you need to pass the entire list for a successful update.
                      items:
                        type: object
                        properties:
                          attachments:
                            type: object
                            description: Reference to uploaded business person document. (For file upload instructions, refer to 'File Service API'.).
                            properties:
                              business_person_documents:
                                type: array
                                description: All personal documents, such as PPTA letter, change or name certificate, or other supporting documents.
                                items:
                                  type: object
                                  properties:
                                    description:
                                      type: string
                                      description: Optional field for any additional notes or text description for the file.
                                    file_id:
                                      type: string
                                      description: Unique identifier of file as provided in the response from the File Service API.
                                    tag:
                                      type: string
                                      description: Tag of the personal document.
                                      enum:
                                      - PERSON_PURPORTING_TO_ACT_AUTHORISATION_LETTER
                                      - PERSON_NAME_CHANGE_CERTIFICATE
                                      - APPLICANT_SIGNATURE
                                      - PROOF_OF_ADDRESS
                                      - VIDEO_SELFIE
                                      - PHOTO_SELFIE
                                      - SUPPORTIVE_OTHER
                                      - APPOINTMENT_DOCUMENT
                          date_of_birth:
                            type: string
                            format: date
                            description: Birth date of the business person in YYYY-MM-DD format. Required for US accounts.
                          email:
                            type: string
                            description: 'Email of the business person. Note: this field may not be visible in the embedded KYC component for all regions.'
                          first_name:
                            type: string
                            description: '**Required for submit.** First name of the business person. 1–250 characters.'
                          first_name_english:
                            type: string
                            description: First name of the business person (in ASCII characters only, e.g. romanization of non-Latin characters). Required if first_name contains non-ASCII characters.
                          identifications:
                            type: object
                            description: Details of the business person for identity verification, such as a passport, driver's license, or other government-issued unique identifier card. Required for all persons except director-only persons in AU/NZ, or when deferred identity verification is enabled.
                            properties:
                              primary:
                                type: object
                                description: '**Required when identifications is provided.** Details of the primary identification.'
                                properties:
                                  drivers_license:
                                    type: object
                                    description: Driver's license.
                                    properties:
                                      back_file_id:
                                        type: string
                                        description: File id of the photo of the back of the document.
                                      effective_at:
                                        type: string
                                        format: date
                                        description: Document effective as of this date in YYYY-MM-DD format.
                                      expire_at:
                                        type: string
                                        format: date
                                        description: Document expiry date in YYYY-MM-DD format.
                                      front_file_id:
                                        type: string
                                        description: File id of the photo of the front of the document.
                                      gender:
                                        type: string
                                        description: Gender listed on document.
                                      issuing_state:
                                        type: string
                                        description: Name of state where the license is issued. Only applicable if relevant to selected country.
                                      number:
                                        type: string
                                        description: Driver's license number.
                                      version:
                                        type: string
                                        description: Version listed on the document. Only applicable if relevant to selected country.
                                  identification_type:
                                    type: string
                                    description: '**Required.** Type of identification.'
                                    enum:
                                    - DRIVERS_LICENCE
                                    - PASSPORT
                                    - PERSONAL_ID
                                    - TAX_ID
                                  issuing_country_code:
                                    type: string
                                    description: '**Required** (optional if a document file is provided for OCR processing). Country where the identification document is issued. (2-letter ISO 3166-2 country code).'
                                  passport:
                                    type: object
                                    description: Passport.
                                    properties:
                                      effective_at:
                                        type: string
                                        format: date
                                        description: Document effective as of this date in YYYY-MM-DD format.
                                      expire_at:
                                        type: string
                                        format: date
                                        description: Document expiry date in YYYY-MM-DD format.
                                      front_file_id:
                                        type: string
                                        description: File id of the photo of the front of the document.
                                      mrz_line1:
                                        type: string
                                        description: First line of passport MRZ (machine-readable zone).
                                      mrz_line2:
                                        type: string
                                        description: Second line of passport MRZ (machine-readable zone).
                                      number:
                                        type: string
                                        description: Passport number.
                                  personal_id:
                                    type: object
                                    description: Other government-issued unique identifier card.
                                    properties:
                                      back_file_id:
                                        type: string
                                        description: File id of the photo of the back of the document.
                                      effective_at:
                                        type: string
                                        format: date
                                        description: Document effective as of this date in YYYY-MM-DD format.
                                      expire_at:
                                        type: string
                                        format: date
                                        description: Document expiry date in YYYY-MM-DD format.
                                      front_file_id:
                                        type: string
                                        description: File id of the photo of the front of the document.
                                      number:
                                        type: string
                                        description: Document unique identifier number.
                                  tax_id:
                                    type: object
                                    description: Tax unique identifier.
                                    properties:
                                      number:
                                        type: string
                                        description: '**Required** (optional if a document file is provided for OCR processing). Tax unique identifier number (e.g., SSN or ITIN for US persons).'
                                      type:
                                        type: string
                                        description: '**Required.** Tax unique identifier type.'
                                        enum:
                                        - SSN
                                        - VAT
                                        - ITIN
                                        - OTHERS
                              secondary:
                                type: object
                                description: Details of the secondary identity verification.
                                properties:
                                  drivers_license:
                                    type: object
                                    description: Driver's license.
                                    properties:
                                      back_file_id:
                                        type: string
                                        description: File id of the photo of the back of the document.
                                      effective_at:
                                        type: string
                                        format: date
                                        description: Document effective as of this date in YYYY-MM-DD format.
                                      expire_at:
                                        type: string
                                        format: date
                                        description: Document expiry date in YYYY-MM-DD format.
                                      front_file_id:
                                        type: string
                                        description: File id of the photo of the front of the document.
                                      gender:
                                        type: string
                                        description: Gender listed on document.
                                      issuing_state:
                                        type: string
                                        description: Name of state where the license is issued. Only applicable if relevant to selected country.
                                      number:
                                        type: string
                                        description: Driver's license number.
                                      version:
                                        type: string
                                        description: Version listed on the document. Only applicable if relevant to selected country.
                                  identification_type:
                                    type: string
                                    description: Type of identification.
                                    enum:
                                    - DRIVERS_LICENCE
                                    - PASSPORT
                                    - PERSONAL_ID
                                    - TAX_ID
                                  issuing_country_code:
                                    type: string
                                    description: Country where the license is issued. (2-letter ISO 3166-2 country code).
                                  passport:
                                    type: object
                                    description: Passport.
                                    properties:
                                      effective_at:
                                        type: string
                                        format: date
                                        description: Document effective as of this date in YYYY-MM-DD format.
                                      expire_at:
                                        type: string
                                        format: date
                                        description: Document expiry date in YYYY-MM-DD format.
                                      front_file_id:
                                        type: string
                                        description: File id of the photo of the front of the document.
                                      mrz_line1:
                                        type: string
                                        description: First line of passport MRZ (machine-readable zone).
                                      mrz_line2:
                                        type: string
                                        description: Second line of passport MRZ (machine-readable zone).
                                      number:
                                        type: string
                                        description: Passport number.
                                  personal_id:
                                    type: object
                                    description: Other government-issued unique identifier card.
                                    properties:
                                      back_file_id:
                                        type: string
                                        description: File id of the photo of the back of the document.
                                      effective_at:
                                        type: string
                                        format: date
                                        description: Document effective as of this date in YYYY-MM-DD format.
                                      expire_at:
                                        type: string
                                        format: date
                                        description: Document expiry date in YYYY-MM-DD format.
                                      front_file_id:
                                        type: string
                                        description: File id of the photo of the front of the document.
                                      number:
                                        type: string
                                        description: Document unique identifier number.
                                  tax_id:
                                    type: object
                                    description: Tax unique identifier.
                                    properties:
                                      number:
                                        type: string
                                        description: Tax unique identifier number.
                                      type:
                                        type: string
                                        description: Tax unique identifier type.
                                        enum:
                                        - SSN
                                        - VAT
                                        - ITIN
                                        - OTHERS
                          job_title:
                            type: string
                            description: Job title of the business person within the business.
                          last_name:
                            type: string
                            description: '**Required for submit.** Last name of the business person. 1–250 characters.'
                          last_name_english:
                            type: string
                            description: Last name of the business person (in ASCII characters only, e.g. romanization of non-Latin characters). Required if last_name contains non-ASCII characters.
                          live_selfie_file_id:
                            type: string
                            description: File id for live-photo of the individual.
                          middle_name:
                            type: string
                            description: Middle name of the business person.
                          middle_name_english:
                            type: string
                            description: Middle name of the business person (in ASCII characters only, e.g. romanization of non-Latin characters). Required if middle_name contains non-ASCII characters.
                          nationality:
                            type: string
                            description: Nationality of the business person. (2-letter ISO 3166-2 country code) Required for all persons except director-only persons in AU/NZ.
                          person_id:
                            type: string
                            description: Read-only. Unique Id of this person. Returned in responses after the person is created. Include this field when updating existing persons (API version 2023-06-01+) to update the correct record; omitting it creates a new person.
                            readOnly: true
                          phone_number:
                            type: string
                            description: 'A valid phone number for the business person. Note: this field may not be visible in the embedded KYC component for all regions.'
                          residential_address:
                            type: object
                            description: Residential address of the business person. Required for all persons except director-only persons in AU/NZ.
                            properties:
                              address_line1:
                                type: string
                                description: '**Required when residential_address is provided.** The first line of a physical address, typically including the street number and name of the building or residence. A P.O. box is not acceptable. For US addresses, must include a house/building number.'
                              address_line2:
                                type: string
                                description: An optional field that can be used to capture additional information about the address, such as the apartment/ suite number, or floor number.
                              country_code:
                                type: string
                                description: '**Required when residential_address is provided.** Country code. (2-letter ISO 3166-2 country code).'
                              postcode:
                                type: string
                                description: Postcode or zip code. Only applicable if relevant to selected country. Required for US accounts.
                              state:
                                type: string
                                description: Name of state. Only applicable if relevant to selected country. Required for US accounts (2-letter state code).
                              suburb:
                                type: string
                                description: Name of city/suburb.
                          roles:
                            type: array
                            description: '**Required for submit.** Roles of the business person. At least one role must be specified. Allowed values: `AUTHORISED_PERSON`, `BENEFICIAL_OWNER`, `CONTROLLING_PERSON`, `DIRECTOR`, `LEGAL_REPRESENTATIVE`, `SIGNATORY`. A maximum of one person can hold AUTHORISED_PERSON, CONTROLLING_PERSON, or LEGAL_REPRESENTATIVE. The order is not guaranteed in response.'
                            items:
                              type: string
                              enum:
                              - AUTHORISED_PERSON
                              - BENEFICIAL_OWNER
                              - CONTROLLING_PERSON
                              - DIRECTOR
                              - LEGAL_REPRESENTATIVE
                              - SIGNATORY
                    individual_details:
                      type: object
                      description: Individual details including name, including name, address, face photo, and documents.
                      properties:
                        account_usage:
                          type: object
                          description: Information on how the account will be used, such as sending/receiving countries and monthly volume.
                          properties:
                            card_usage:
                              type: array
                              description: "Ways in which the account will use Airwallex borderless cards.  \n`GENERAL_EXPENSES`, `BUSINESS_EXPENSES`, `EDUCATION`,  \n`TRAVEL_TRANSPORT`, `INSURANCE`, `SERVICES`,  \n`BILLS_UTILITIES`, `INVESTMENT`, `FEES_CHARGES`,  \n`HEALTHCARE`, `HOUSING`, `NO_CARD_USAGE`."
                              items:
                                type: string
                                enum:
                                - GENERAL_EXPENSES
                                - BUSINESS_EXPENSES
                                - EDUCATION
                                - TRAVEL_TRANSPORT
                                - INSURANCE
                                - SERVICES
                                - BILLS_UTILITIES
                                - INVESTMENT
                                - FEES_CHARGES
                                - HEALTHCARE
                                - HOUSING
                                - NO_CARD_USAGE
                            collection_country_codes:
                              type: array
                              description: Countries from which the account will be collecting funds. (2-letter ISO 3166-2 country code).
                              items:
                                type: string
