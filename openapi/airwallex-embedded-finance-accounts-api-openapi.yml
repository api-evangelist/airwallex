  /api/v1/accounts:
    get:
      tags:
      - Embedded Finance > Accounts
      summary: 4|List all Connected Accounts
      description: Get list of accounts connected to your platform. If you’re not a platform, the list is empty.
      operationId: listAccounts
      parameters:
      - name: account_status
        in: query
        description: The status of the account.
        required: false
        schema:
          type: string
          enum:
          - ACTION_REQUIRED
          - ACTIVE
          - CLOSED
          - CREATED
          - DORMANT
          - SUBMITTED
          - SUSPENDED
          x-enumDescriptions:
            ACTION_REQUIRED: Additional information or action is required to continue.
            ACTIVE: Account is active.
            CLOSED: Account has been closed.
            CREATED: Account has been created but not yet submitted.
            DORMANT: Account is inactive due to prolonged inactivity.
            SUBMITTED: Account has been submitted for review.
            SUSPENDED: Account is temporarily suspended.
      - name: from_created_at
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        schema:
          type: string
      - name: identifier
        in: query
        description: The identifier that the platform uses to identify a merchant, usually a unique merchant identifier.
        required: false
        schema:
          type: string
      - name: metadata
        in: query
        description: The metadata of the account. The value should be set in key:value format. (e.g., id:1).
        required: false
        schema:
          type: string
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        schema:
          type: integer
          format: int32
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100, maximum 500.
        required: false
        schema:
          type: integer
          format: int32
      - name: to_created_at
        in: query
        description: The end date of `created_at` in ISO8601 format (inclusive).
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: Paged results.
                    items:
                      $ref: '#/components/schemas/Account'
        '400':
          description: '["field_required","invalid_argument","validation_failed"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
