                  - store_description
                  - store_name
                  description: Relevant information associated with the store you are applying payment solutions for. For store field validation and error codes, see [store detail requirements](/docs/connected-accounts/onboarding/kyb-and-onboarding/native-api/store-detail-requirement).
                  properties:
                    cross_border_transaction_percent:
                      type: string
                      description: Percentage of products or services provided to international customers residing outside of where your business's registered.
                    dispute_percent:
                      type: string
                      description: Average dispute rate (percentage of total successful payments that are claimed as disputed charges by card schemes) of your store in the past three months.
                    employee_size:
                      type: integer
                      format: int32
                      description: Total number of staff in all stores.
                    estimated_transaction_volume:
                      type: object
                      required:
                      - average_amount_per_transaction
                      - currency
                      - max_amount_per_transaction
                      - monthly_transaction_amount
                      description: Your store's anticipated volume of transactions in the next 12 months with Airwallex.
                      properties:
                        average_amount_per_transaction:
                          type: string
                          description: The average transaction size of your store.
                        currency:
                          type: string
                          description: Currency of the transaction volume. (3-letter ISO 4217 currency code).
                        max_amount_per_transaction:
                          type: string
                          description: The maximum transaction size of your store.
                        monthly_transaction_amount:
                          type: string
                          description: The average monthly volume of your store.
                    financial_statements:
                      type: array
                      description: Additional documents about your store's financials.
                      items:
                        type: object
                        properties:
                          file_id:
                            type: string
                            description: Unique identifier of file as provided in the response from the File Service API.
                    fulfillment_days:
                      type: integer
                      format: int32
                      description: Number of days your customers will typically need to wait to receive their goods or services after paying for their orders.
                    industry_code:
                      type: string
                      description: The code of the industry category most aligned with your store. Please navigate to the 'Supporting Services' > 'Reference Data' > 'Industry categories' section for an endpoint to pull a tree of categories.
                    mcc:
                      type: string
                      description: Current or desired MCC for your store.
                    operating_models:
                      type: array
                      description: "The model of which our customers pay for their orders. Refer to https://www.airwallex.com/docs/payments/about-airwallex-payments/choose-your-payments-solution#what-is-your-payments-use-case  \nOne or more of `ONLINE_CHECKOUT`, `INVOICES_OR_CUSTOM_ORDER_LINKS`, `IN_PERSON`."
                      items:
                        type: string
                        enum:
                        - ONLINE_CHECKOUT
                        - INVOICES_OR_CUSTOM_ORDER_LINKS
                        - IN_PERSON
                    payment_distribution:
                      type: array
                      description: Anticipated transaction volume split by payment methods.
                      items:
                        type: object
                        properties:
                          payment_type:
                            type: string
                            description: Type of payment methods.
                            enum:
                            - CARDS
                            - BANK_DIRECT_DEBIT
                            - OTHER
                          percentage:
                            type: string
                            description: Percentage of anticipated transaction volume.
                    refund_percent:
                      type: string
                      description: Average refund rate (percentage of total successful payments that are refunded to your customers) of your store in the past three months.
                    selling_to_country_codes:
                      type: array
                      description: List of country codes where products are sold.
                      items:
                        type: string
                    shipping_from_country_codes:
                      type: array
                      description: List of country codes from which goods are shipped.
                      items:
                        type: string
                    store_address:
                      type: object
                      description: Physical address of the store.
                      properties:
                        address_line1:
                          type: string
                          description: The first line of a physical address, typically including the street number and name of the building or residence. A P.O. box is not acceptable.
                        address_line2:
                          type: string
                          description: An optional field that can be used to capture additional information about the address, such as the apartment/ suite number, or floor number.
                        country_code:
                          type: string
                          description: Country code. (2-letter ISO 3166-2 country code).
                        postcode:
                          type: string
                          description: Postcode or zip code. Only applicable if relevant to selected country.
                        state:
                          type: string
                          description: Name of state. Only applicable if relevant to selected country.
                        suburb:
                          type: string
                          description: Name of city/suburb.
                    store_description:
                      type: string
                      description: Free text description of your store's goods or services offerings. Max length is 500 characters.
                    store_name:
                      type: string
                      description: The trading name your store is operating as. This name will also appear on the receipts to your customers.
                    store_photos:
                      type: array
                      description: Store photos of shop front clearly displaying the company name or photo of building entrance as well as directory with company name listed.
                      items:
                        type: object
                        required:
                        - file_id
                        properties:
                          file_id:
                            type: string
                            description: All relevant store photos, if more than 1 physical store, provide one photo of each.
                    store_websites:
                      type: array
                      description: All websites associated with the store you are applying payment solutions for. They must be in the same industry selling the same or similar goods and services, otherwise you will need to submit another application as a different store.
                      items:
                        type: object
                        required:
                        - url
                        properties:
                          url:
                            type: string
                            description: Url of the store websites, including online store, marketplace stores, app-store links or other relevant websites.
                target:
                  type: string
                  description: Target of the amendment.
                  enum:
                  - account_details.store_details
                  - primary_contact
