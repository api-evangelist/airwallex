openapi: 3.2.0
info:
  title: Airwallex Core Resources > Global Accounts API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Core Resources > Global Accounts
  description: Global Accounts are foreign currency accounts that function as local bank accounts. They can be used to collect funds from around the world. You get account details that enable you to collect funds from various platforms such as Amazon, eBay and Shopify, among others. Global Accounts can also be used to top up your Airwallex balance.
  x-domain: Core Resources
  x-resource: Global Accounts
  x-urlPath: core_resources/global_accounts
paths:
  /api/v1/global_accounts/create:
    post:
      tags:
      - Core Resources > Global Accounts
      summary: 1|Create a Global Account
      description: Submit a request to create a new global account in your chosen currency. This global account can be used for the purpose of receiving funds from your payers via the local clearing system or swift system.
      operationId: createGlobalAccount
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - country_code
              - request_id
              - required_features
              properties:
                alternate_account_identifiers:
                  type: object
                  description: For a specific local clearing system, this serves as the unique alternate identifier for a global account.
                  properties:
                    email:
                      type: string
                      description: Applicable only for CA Global Accounts. [Supported Formats](/docs/global-treasury/get-started/global-accounts/manage-global-accounts#supported-email-format-under-alternate_account_identifiers).
                country_code:
                  type: string
                  description: Country of the global account (2-letter ISO 3166-2 country code).
                deposit_conversion_currency:
                  type: string
                  description: Target currency that incoming funds will be converted to. Applicable only when Global Account country is ID. [Supported currencies](/docs/transactional-fx/supported-regions-and-currencies) (3-letter ISO-4217 code).
                nick_name:
                  type: string
                  description: 'Nickname of the global account. Default: current account''s business name.'
                request_id:
                  type: string
                  description: Unique request identifier.
                required_features:
                  type: array
                  description: Required features of the global account.
                  items:
                    type: object
                    required:
                    - currency
                    properties:
                      currency:
                        type: string
                        description: Currency of the global account (3-letter ISO-4217 code).
                      transfer_method:
                        type: string
                        description: 'Transfer method in which a deposit can be received for the specified currency. Possible transfer methods are: `LOCAL`, `SWIFT`. Not applicable for stablecoin global accounts — field is absent from JSON for stablecoin entries.'
        description: Required information to create a global account.
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveGlobalAccount'
        '400':
          description: '["field_required","invalid_argument"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/global_accounts/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          alternate_account_identifiers:
            email: example@yourdomain.com
          country_code: GP
          deposit_conversion_currency: USD
          nick_name: GBP in UK for Subsidiary Company ABC
          request_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          required_features:
          - currency: GBP
            transfer_method: LOCAL
        response_body:
          account_name: <string>
          account_number: '88888888'
          account_type: Checking
          alternate_account_identifiers:
            email: example@yourdomain.com
          country_code: GP
          deposit_conversion_currency: USD
          iban: GB81LHVB04032900176471
          id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          institution:
            address: Old Street Yard
            branch_name: Wakatake ワカタケ
            city: London
            name: Saxo Payments A/S
            zip_code: 018982
          nick_name: GBP in UK for Subsidiary Company ABC
          request_id: 8d411ad4-aed6-1261-92fa-51225212e2e1
          required_features:
          - currency: GBP
            transfer_method: LOCAL
          status: ACTIVE
          supported_features:
          - alias_types: []
            currency: GBP
            local_clearing_system: ACH
            routing_codes:
            - type: sort_code
              value: 040329
            transfer_method: LOCAL
            type: DEPOSIT
          swift_code: SXPYDEHH
      x-scope:
      - scope: global_account:write
        group: Core Resources
        resource_name: Global Accounts
      x-domain: Core Resources
      x-resource: Global Accounts
      x-urlPath: create
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
