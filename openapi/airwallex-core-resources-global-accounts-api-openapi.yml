  /api/v1/global_accounts/{global_account_id}/aliases/create:
    post:
      tags:
      - Core Resources > Global Accounts
      summary: 7|Create an Alias for a Global Account
      description: 'Creates an alias for a Global Account to receive funds. Supported alias types include: `EMAIL`, `PHONE_NUMBER`, and `AUSTRALIAN_BUSINESS_NUMBER`. For alias types `EMAIL` or `PHONE_NUMBER`, a verification code will be sent via email or SMS respectively. You must submit this code for verification using the Submit Alias verification code endpoint to complete the alias creation process.'
      operationId: aliasesCreate
      parameters:
      - name: global_account_id
        in: path
        description: The unique ID of the Global Account.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - local_clearing_system
              - request_id
              - type
              - value
              properties:
                local_clearing_system:
                  type: string
                  description: Local clearing system to be registered with.
                request_id:
                  type: string
                  description: Unique request ID.
                type:
                  type: string
                  description: Alias type.
                value:
                  type: string
                  description: Alias value.
        description: Required information to create a global account alias.
        required: true
      responses:
        '201':
          description: Success
