  /api/v1/global_accounts:
    get:
      tags:
      - Core Resources > Global Accounts
      summary: 3|List all Global Accounts
      description: Get list of global accounts created by your Airwallex account.
      operationId: listGlobalAccount
      parameters:
      - name: country_code
        in: query
        description: Country of the global account (2-letter ISO 3166-2 country code).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: US
      - name: from_created_at
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: '2017-04-01'
      - name: nick_name
        in: query
        description: Nickname of the global account.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: Tom
      - name: page
        in: query
        description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of page_after (if not null) from the response to a subsequent call. To retrieve the previous page of results, pass the value of page_before (if not null) from the response to a subsequent call.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: required_features.currency
        in: query
        description: Currency that was specified during Global Account creation.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: USD
      - name: status
        in: query
        description: Status of the account.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: ACTIVE
      - name: supported_features.currency
        in: query
        description: Currency that is supported by the Global Account.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: USD
      - name: to_created_at
        in: query
        description: The end date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: 2017-04-01T03:52:34+0000
