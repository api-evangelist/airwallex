  /api/v1/global_accounts/{id}/generate_statement_letter:
    post:
      tags:
      - Core Resources > Global Accounts
      summary: 5|Generate Global Account Statement
      description: Generate global account statement letter, return as file stream.
      operationId: generateStatementLetter
      parameters:
      - name: id
        in: path
        description: Unique identifier of the global account.
        required: true
        schema:
          type: string
          format: uuid
          default: 46c22228-5831-4c53-a4fa-a3ab4954877c
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - account_statement_type
              properties:
                account_statement_type:
                  type: string
                  description: Type of account statement. One of `AMAZON`, `EBAY`, `COUPANG`, `GENERAL`.
                registration_info:
                  type: object
                  description: If account statement type is one of `AMAZON`, `EBAY`, `COUPANG`, the registration info field is required.
                  properties:
                    agreement:
                      type: boolean
                      description: "I confirm that the details are correct and match the details I provided to and appear on the platform. I agree and acknowledge that Airwallex will be relying on this information and my confirmation in the future, including for issuing account statements for platform.  \n  \nThis flag must be `true`."
                    registered_address:
                      type: object
                      description: Registered address info.
                      properties:
                        address:
                          type: string
                          description: Address line.
                        city:
                          type: string
                          description: City/Town.
                        country:
                          type: string
                          description: Country.
                        postcode:
                          type: string
                          description: Postcode.
                        state:
                          type: string
                          description: State/Province.
                    registered_email:
                      type: string
                      description: Registered email.
                    registered_name:
                      type: string
                      description: Registered owner/company name.
        description: globalAccountStatementLetterDto
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
                format: byte
            application/pdf:
              schema:
                type: string
                format: byte
        '400':
          description: '["field_required","invalid_argument"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            application/pdf:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/global_accounts/global_account_id/generate_statement_letter
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          account_statement_type: AMAZON
          registration_info:
            agreement: true
            registered_address:
              address: 15 William Street
              city: Melbourne
              country: Australia
              postcode: '3000'
              state: VIC
            registered_email: john.walker@gmail.com
            registered_name: John Walker
        response_body: <string>
