              NEXT_DAY_ACH: '12000'
            currency: USD
            effective_at: 2022-08-22T01:23:00+0000
            limit: 30000
            mandate_type: US_ACH_DEBIT
            requested_limit: 100000
            status: ACTIVE
            type: DIRECT_DEBIT_DEPOSIT
            updated_at: 2022-08-22T01:23:00+0000
      x-oauthSupported: false
