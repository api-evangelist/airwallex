  /api/v1/account_capabilities/apply:
    post:
      tags:
      - Account Capability > Account Capability
      summary: 2|Apply for Account Capabilities
      description: Apply for enhanced capabilities for Direct Debit from a Linked Account or as a Funding Source, such as a higher funding limit or Faster Direct Debit.
      operationId: apply
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - funding_limits
              - request_id
              properties:
                funding_limits:
                  type: array
                  description: Request to adjust your funding limit for different deposit types.
                  items:
                    type: object
                    required:
                    - currency
                    - limit
                    - type
                    properties:
                      currency:
                        type: string
                        description: Currency of the limit you would like to apply for.
                      limit:
                        type: number
                        description: The limit you would like to apply in the selected currency.
                      type:
                        type: string
                        description: Type of the limit you would like to apply for.
                        enum:
                        - DIRECT_DEBIT_DEPOSIT
                        - FASTER_DIRECT_DEBIT_DEPOSIT
                request_id:
                  type: string
                  description: A random string to differentiate each request.
        description: request
        required: true
      responses:
        '200':
          description: Requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestedResponse'
        '400':
          description: '["field_required","invalid_argument"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/account_capabilities/apply
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          funding_limits:
          - currency: USD
            limit: 30000
            type: DIRECT_DEBIT_DEPOSIT
          request_id: 71fae186-7b1c-4018-b709-3a7b7802054d
        response_body:
          result: <string>
      x-oauthSupported: false
      x-scope:
      - scope: account_capability:write
        group: Account Capabilities
        resource_name: Account Capabilities
      x-domain: Account Capability
      x-resource: Account Capability
      x-urlPath: apply
      x-oboSupported: true
      x-resourceLevel: account
      servers:
