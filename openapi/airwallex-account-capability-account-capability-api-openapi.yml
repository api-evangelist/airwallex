components:
  schemas:
    Details:
      type: object
      properties:
        reason_codes:
          type: array
          description: "Specific codes that indicate the reason a capability is disabled. \nFor more information on the codes related to payment method capabilities, refer to this [page](/docs/payments-for-platforms/connected-accounts/onboard-connected-accounts/kyb-and-onboarding/native-api)."
          items:
            type: string
        mcc:
          type: string
          description: The MCC applied by default for this payment method; the first of `mcc_candidates`. Only present for `payments_*` capabilities once an MCC has been assigned.
        mcc_candidates:
          type: array
          description: The approved MCCs for this payment method. The first equals `mcc`; the rest are alternates with no priority order. Only present for `payments_*` capabilities once an MCC has been assigned.
          items:
            type: string
      description: Details of this capability.
    FundingLimitResult:
      type: object
      required:
      - currency
      - limit
      - status
      - type
      properties:
        availables:
          type: object
          description: The remaining limit of direct debit schemas, possible keys are SAME_DAY_ACH, NEXT_DAY_ACH, FEDWIRE, BECS, NPP, BACS, SEPA, FPS, FAST, GIRO, BECS, EFT.
          additionalProperties:
            type: number
        currency:
          type: string
          description: Currency of the limit, it's the applied one, or default as per your owning entity.
        effective_at:
          type: string
          description: the timestamp at which the customer's funding limit becomes effective.
        limit:
          type: number
          description: The upper limit.
        mandate_type:
          type: string
          description: the settlement method or clearing system.
        requested_limit:
          type: number
          description: The under evaluating limit.
        status:
          type: string
          description: Current setting status.
          enum:
          - ACTIVE
          - REQUESTED
        type:
          type: string
          description: Deposit type, possible values are DIRECT_DEBIT, FASTER_DIRECT_DEBIT.
          enum:
          - DIRECT_DEBIT_DEPOSIT
          - FASTER_DIRECT_DEBIT_DEPOSIT
        updated_at:
          type: string
          description: Last update time.
    RequestedResponse:
      type: object
      required:
      - result
      properties:
        result:
          type: string
    Response:
      type: object
      required:
      - comment
      - id
      - status
      - updated_at
      properties:
        comment:
          type: string
          description: Additional details about the status of this capability.
        details:
          $ref: '#/components/schemas/Details'
          description: Details of this capability.
        entity_type:
          type: string
          description: The type of entity of your declarant, one of `INDIVIDUAL`, `BUSINESS`.
        id:
          type: string
          description: A unique identifier of the requested capability.
        status:
          type: string
          description: The status of this capability, one of `ENABLED`, `DISABLED`, `PENDING`.
        updated_at:
          type: string
          description: Last time this capability has been updated.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
