                      contact_email:
                        type: string
                        description: Declarant business email.
                      economic_category_code:
                        type: string
                        description: Economic category code for the Declarant business, one of `100`,`110`,`120`,`130`,`140`,`141`,`142`,`143`,`149`,`150`,`151`,`159`,`160`,`170`,`171`,`172`,`173`,`174`,`175`,`179`,`190`,`200`,`210`,`220`,`230`,`240`,`290`,`300`,`310`,`320`,`330`,`340`,`390`,`400`,`900`.
                      is_special_economic_zone:
                        type: boolean
                        description: Whether the business is registered in a special economic zone.
                      special_economic_zone_business_type:
                        type: string
                        description: Code to identify the specific special economic zone, one of `00`,`01`,`02`,`03`,`04`,`05`,`06`,`07`,`08`,`09`,`10`,`11`,`12`,`60`,`99`.
                  entity_type:
                    type: string
                    description: The type of entity of your declarant, one of `INDIVIDUAL`, `BUSINESS`.
                  id:
                    type: string
                    description: A unique identifier of the requested capability.
                  individual_declarant_info:
                    type: object
                    required:
                    - bank_details
                    - contact_email
                    - person_id
                    description: Declarant info as an individual.
                    properties:
                      bank_details:
                        type: object
                        required:
                        - account_number
                        - bank_name
                        - mobile_number
                        description: Details of Bank belong to the person assigned by `person_id`.
                        properties:
                          account_number:
                            type: string
                            description: Bank account number.
                          bank_name:
                            type: string
                            description: Bank name of the Declarant's bank account.
                          cnaps_code:
                            type: string
                            description: CNAPS routing code.
                          mobile_number:
                            type: string
                            description: Mobile number associated with the Declarant's bank account.
                      contact_email:
                        type: string
                        description: Declarant's personal email.
                      person_id:
                        type: string
                        format: uuid
                        description: Unique identifier of the legal representative or beneficial owner.
        description: Dynamic with specific capability id.
      responses:
        '200':
          description: acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '400':
          description: '[`"bad_request"`

            ,`"field_required"`

            `"invalid_person"`

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: payment_method
        name: Payment Method
        method: POST
        uri: /api/v1/account_capabilities/account_capability_id/enable
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          enroll_sme_program: true
          id: payments_mastercard
        response_body:
          comment: string
