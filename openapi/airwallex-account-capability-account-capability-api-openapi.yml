  /api/v1/account_capabilities/funding_limits:
    get:
      tags:
      - Account Capability > Account Capability
      summary: 4|List all Funding Limits
      description: Before initiating a Direct Debit from a Linked Account or as a Funding Source, you may wish to query the available funding limit or Faster Direct Debit limit.
      operationId: listFundingLimits
      parameters:
      - name: ccy
        in: query
        description: Specify the currency the limit will be displayed in. A single limit is applied for the entire customer, regardless of the display currency.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: effective_at
        in: query
        description: The timestamp at which the customer's funding limit becomes effective.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
      - name: mandate_type
        in: query
        description: The settlement method or clearing system.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_num
        in: query
        description: Page number.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: page_size
        in: query
        description: Page size.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: Paged results.
                    items:
                      $ref: '#/components/schemas/FundingLimitResult'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
