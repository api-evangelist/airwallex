tags:
- name: Issuing > Card Transaction Lifecycles
  description: 'A **lifecycle** is the top level of the three-level transaction model

    (**Lifecycle → Card Transaction → Transaction Event**).


    It is a container that groups all related card transactions and transaction events belonging to

    the same payment flow, based on network information. Lifecycles provide a network-level view

    of a payment along with aggregated billing amounts across all related card transactions and events.


    **Key characteristics:**

    * Lifecycles do not have a status. Use card transactions if you need guaranteed terminal statuses.

    * Grouping is **best-effort**: it depends on payment networks and acquirers providing consistent

    identifiers. For example, matched refunds link to the original lifecycle; unmatched refunds

    create a new one.

    * Use the lifecycle ID to retrieve all associated card transactions and transaction events.


    **Data retention:** Resources can be queried for a maximum of 2 years from creation.


    Learn more about the transaction lifecycle.'
