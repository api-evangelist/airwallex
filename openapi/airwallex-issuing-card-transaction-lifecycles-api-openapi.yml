components:
  schemas:
    NonPciLifecycle:
      type: object
      properties:
        billing_amounts:
          type: array
          description: Aggregated billing totals grouped by currency. Each entry contains cumulative amounts across all card transactions and transaction events within this lifecycle, including totals for authorized, debited, credited, declined, expired, pending, and reversed amounts.
          items:
            $ref: '#/components/schemas/NonPciAggregatedAmounts'
        card_id:
          type: string
          format: uuid
          description: Unique identifier of the card associated with this lifecycle.
        created_at:
          type: string
          description: Date and time when the lifecycle was created, in ISO 8601 format.
        id:
          type: string
          format: uuid
          description: Unique identifier of the lifecycle.
        updated_at:
          type: string
          description: Date and time when the lifecycle was last updated (e.g., when a new card transaction or transaction event was added), in ISO 8601 format.
    NonPciBookmarkedResultOfIssuingNonPciLifecycle:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NonPciLifecycle'
        page_after:
          type: string
          description: A marker for retrieving the next page of results. Include this value in the `page` request parameter to retrieve subsequent pages.
        page_before:
          type: string
          description: A marker for retrieving the previous page of results. Include this value in the `page` request parameter to retrieve previous pages.
    NonPciAggregatedAmounts:
      type: object
      properties:
        currency:
          type: string
          description: Three-letter ISO 4217 currency code for all amounts in this object.
        total_authorized:
          type: number
          description: Total amount authorized (funds reserved in the wallet).
        total_credited:
          type: number
          description: Total amount credited (funds returned to the wallet, e.g., refunds).
        total_debited:
          type: number
          description: Total amount debited (funds moved out of the wallet after clearing).
        total_declined:
          type: number
          description: Total amount declined (transaction amounts that were rejected).
        total_expired:
          type: number
          description: Total amount expired (authorized amounts that were never captured and have been released).
        total_pending:
          type: number
          description: Total amount still pending (outstanding authorized amount not yet cleared, reversed, or expired).
        total_reversed:
          type: number
          description: Total amount reversed (authorized amounts that were cancelled and released).
      description: Aggregated amounts in the card's billing currency (the currency of the cardholder's wallet). Includes totals for authorized, debited, credited, pending, and other states.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
