  /api/v1/connected_account_transfers:
    get:
      tags:
      - Embedded Finance > Connected Account Transfers
      summary: 3|List all Connected Account Transfers
      description: Get a list of connected account transfers created by your Airwallex account. The transfers returned are sorted by creation time.
      operationId: listConnectedAccountTransfers
      parameters:
      - name: currency
        in: query
        description: Currency (3-letter ISO-4217 code).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: USD
      - name: destination
        in: query
        description: Airwallex account unique identifier.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: from_created_at
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: '2017-04-01'
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100, minimum 10, maximum 2000.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: request_id
        in: query
        description: Transfer `request_id`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: status
        in: query
        description: 'Status of the transfer. One of: `NEW`, `SETTLED`, `PENDING`, `SUSPENDED`, `FAILED`.'
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: to_created_at
        in: query
        description: The end date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: 2017-04-01T03:52:34+0000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: Paged results.
                    items:
                      $ref: '#/components/schemas/ConnectedAccountTransfer'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid","credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
