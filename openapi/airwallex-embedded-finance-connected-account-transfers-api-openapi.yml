openapi: 3.2.0
info:
  title: Airwallex Embedded Finance > Connected Account Transfers API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Embedded Finance > Connected Account Transfers
  description: A Connected Account Transfer-transfers) can be used to send funds directly from a Platform Account or Connected Account to another Account connected to the same platform. Destination Connected Account must have passed KYC and be in state `ACTIVE`.
  x-domain: Embedded Finance
  x-resource: Connected Account Transfers
  x-urlPath: scale/connected_account_transfers
paths:
  /api/v1/connected_account_transfers/create:
    post:
      tags:
      - Embedded Finance > Connected Account Transfers
      summary: 1|Create a Connected Account Transfer
      description: Initiate a new connected account transfer to send funds from your Airwallex account to a connected account. Your Airwallex balance must cover the transfer amount or you will receive an “Insufficient Funds” error message.
      operationId: createConnectedAccountTransfer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - currency
              - destination
              - reason
              - reference
              - request_id
              properties:
                additional_info:
                  type: object
                  description: Additional information about the transaction.
                  properties:
                    card_payment_data:
                      type: object
                      description: Additional information about the card payment funding the connected account transfer.
                      properties:
                        amount:
                          type: string
                          description: The payment amount for this transaction.
                        brand:
                          type: string
                          description: 'The card brand. Possible enum values:'
                          enum:
                          - MASTERCARD
                          - VISA
                          - UNION_PAY
                          - AMERICAN_EXPRESS
                          - JCB
                          - DISCOVER
                          - DINERS_CLUB_INTERNATIONAL
                        card_issuing_country:
                          type: string
                          description: Country code where the card was issued (e.g., `US`, `GB`, `CN`).
                        card_token:
                          type: string
                          description: A unique token (GUID) representing the customer’s card number.
                        card_type:
                          type: string
                          description: 'The card type. Possible enum values:'
                          enum:
                          - CREDIT
                          - DEBIT
                          - PREPAID
                        cardholder_name:
                          type: string
                          description: The cardholder's name. Not applicable to `APPLE_PAY` and `GOOGLE_PAY`.
                        created_at:
                          type: string
                          description: The timestamp when the customer created the payment transaction.
                        deposit_id:
                          type: string
                          description: The unique identifier of the deposit that corresponds to the settlement into Airwallex's Global Account.
                        ip_address:
                          type: string
                          description: IP address (IPv4 or IPv6) of the payer’s device at the time of payment.
                        payment_method:
                          type: string
                          description: 'The payment method used for this transaction. Possible enum values:'
                          enum:
                          - APPLE_PAY
                          - GOOGLE_PAY
                          - CARD_ON_FILE
                        three_dsecure_outcome:
                          type: string
                          description: 'The outcome of a 3D Secure authentication process, which verifies the identity of a cardholder during an online purchase. Possible enum values:'
                          enum:
                          - ATTEMPTED
                          - AUTHENTICATED
                          - FAILED
                          - NOT_APPLICABLE
                          - NOT_REQUESTED
                    merchant_data:
                      type: object
                      description: Structured merchant information for nested-flow transfers.
                      properties:
                        business_name:
                          type: string
                          description: The merchant's official legal name.
                        business_registration_date:
                          type: string
                          description: The date when the merchant's business was registered, in `YYYY-MM-DD` format. For example, `2025-03-15`.
                        business_registration_number:
                          type: string
                          description: The merchant's Business Registration Number (BRN) or equivalent identifier.
                        business_trading_name:
                          type: string
                          description: The merchant's trading or DBA (doing business as) name.
                        industry_category_code:
                          type: string
                          description: The merchant's industry category code.
                        merchant_identifier:
                          type: string
                          description: The merchant's unique identifier on the platform.
                        registration_country:
                          type: string
                          description: The merchant's country of registration in ISO 3166-1 alpha-2 format. For example, `CN` or `HK`.
                        store_urls:
                          type: array
                          description: The merchant's store URL(s).
                          items:
                            type: string
                amount:
                  type: string
                  description: Amount of the transfer in `currency`, representing how much to transfer.
                currency:
                  type: string
                  description: Currency (3-letter ISO-4217 code).
                destination:
                  type: string
                  description: Airwallex account unique identifier.
                reason:
                  type: string
                  description: 'Reason for the transfer instruction.  One of: `wages_salary`, `donation_charitable_contribution`, `personal_remittance`, `transfer_to_own_account`, `pension`, `family_support`, `living_expenses`, `education_training`, `travel`, `investment_proceeds`, `investment_capital`, `loan_credit_repayment`, `taxes`, `goods_purchased`, `business_expenses`, `medical_services`, `professional_business_services`, `technical_services`, `other_services`, `construction`, `freight`, `real_estate`.'
                reference:
                  type: string
                  description: User specified reference that will be displayed to the beneficiary.  1-140 characters long.
                request_id:
                  type: string
                  description: Unique request identifier.  1-50 characters long.
        description: transferRequestDto.
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedAccountTransfer'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ,"insufficient_fund"

            ,"validation_failed"

            ,"request_id_duplicate"

            ,"bad_request"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid","credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/connected_account_transfers/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
