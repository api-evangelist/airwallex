            - EXPIRED_TRANSACTION_RFI_BENEFICIARY
            - DORMANCY_KYC_NO_RESPONSE_PAYER
            - DORMANCY_KYC_NO_RESPONSE_BENEFICIARY
            - WEBSITE_KYC_NO_RESPONSE_PAYER
            - WEBSITE_KYC_NO_RESPONSE_BENEFICIARY
            - WATCHLIST_RESTRICTION_PAYER
            - WATCHLIST_RESTRICTION_BENEFICIARY
            - OTHER_HIGH_RISK_PAYER
            - OTHER_HIGH_RISK_BENEFICIARY
