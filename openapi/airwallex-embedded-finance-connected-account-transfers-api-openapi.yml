components:
  schemas:
    CardPaymentData:
      type: object
      properties:
        amount:
          type: string
          description: The payment amount for this transaction.
        brand:
          type: string
          description: 'The card brand. Possible enum values:'
          enum:
          - MASTERCARD
          - VISA
          - UNION_PAY
          - AMERICAN_EXPRESS
          - JCB
          - DISCOVER
          - DINERS_CLUB_INTERNATIONAL
        card_issuing_country:
          type: string
          description: Country code where the card was issued (e.g., `US`, `GB`, `CN`).
        card_token:
          type: string
          description: A unique token (GUID) representing the customer’s card number.
        card_type:
          type: string
          description: 'The card type. Possible enum values:'
          enum:
          - CREDIT
          - DEBIT
          - PREPAID
        cardholder_name:
          type: string
          description: The cardholder's name. Not applicable to `APPLE_PAY` and `GOOGLE_PAY`.
        created_at:
          type: string
          description: The timestamp when the customer created the payment transaction.
        deposit_id:
          type: string
          description: The unique identifier of the deposit that corresponds to the settlement into Airwallex's Global Account.
        ip_address:
          type: string
          description: IP address (IPv4 or IPv6) of the payer’s device at the time of payment.
        payment_method:
          type: string
          description: 'The payment method used for this transaction. Possible enum values:'
          enum:
          - APPLE_PAY
          - GOOGLE_PAY
          - CARD_ON_FILE
        three_dsecure_outcome:
          type: string
          description: 'The outcome of a 3D Secure authentication process, which verifies the identity of a cardholder during an online purchase. Possible enum values:'
          enum:
          - ATTEMPTED
          - AUTHENTICATED
          - FAILED
          - NOT_APPLICABLE
          - NOT_REQUESTED
      description: Additional information about the card payment funding the connected account transfer.
    Embedded_Finance_AdditionalInfo:
      type: object
      properties:
        card_payment_data:
          $ref: '#/components/schemas/CardPaymentData'
          description: Additional information about the card payment funding the connected account transfer.
        merchant_data:
          $ref: '#/components/schemas/MerchantData'
          description: Structured merchant information for nested-flow transfers.
      description: Additional information about the transaction.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    MerchantData:
      type: object
      properties:
        business_name:
          type: string
          description: The merchant's official legal name.
        business_registration_date:
          type: string
          description: The date when the merchant's business was registered, in `YYYY-MM-DD` format. For example, `2025-03-15`.
        business_registration_number:
          type: string
          description: The merchant's Business Registration Number (BRN) or equivalent identifier.
        business_trading_name:
          type: string
          description: The merchant's trading or DBA (doing business as) name.
        industry_category_code:
          type: string
          description: The merchant's industry category code.
        merchant_identifier:
          type: string
          description: The merchant's unique identifier on the platform.
        registration_country:
          type: string
          description: The merchant's country of registration in ISO 3166-1 alpha-2 format. For example, `CN` or `HK`.
        store_urls:
          type: array
          description: The merchant's store URL(s).
          items:
            type: string
      description: Structured merchant information for nested-flow transfers.
    ConnectedAccountTransfer:
      type: object
      required:
      - amount
      - created_at
      - currency
      - destination
      - fee
      - id
      - reason
      - reference
      - request_id
      - short_reference_id
      - status
      - updated_at
      properties:
        additional_info:
          $ref: '#/components/schemas/Embedded_Finance_AdditionalInfo'
          description: Additional information about the transaction.
        amount:
          type: number
          description: Amount of the transfer in `currency` specified in the request.
        created_at:
          type: string
          description: The time this transfer was created.
        currency:
          type: string
          description: Currency (3-letter ISO-4217 code) specified in the request.
        destination:
          type: string
          description: Airwallex account unique identifier specified in the request.
        failure_reasons:
          type: array
          description: List of failure reason codes when status is FAILED.
          items:
            type: string
        fee:
          type: number
          description: Fee of the transfer in `currency` specified in the request.
        id:
          type: string
          description: Unique identifier for the transfer.
        reason:
          type: string
          description: Reason for the transfer instruction specified in the request.
        reference:
          type: string
          description: User specified reference that will be displayed to the beneficiary specified in the request.
        request_id:
          type: string
          description: Unique request identifier specified in the request.
        short_reference_id:
          type: string
          description: Short reference for support purposes.
        status:
          type: string
          description: 'Status of the transfer. One of: `NEW`, `SETTLED`, `PENDING`, `SUSPENDED`, `FAILED`.'
        updated_at:
          type: string
          description: The time this transfer was updated.
