    get:
      tags:
      - Core Resources > Balances
      summary: 1|List all Current Balances
      description: Get *available* and *pending* balances for every currency.
      operationId: listCurrent
      parameters:
      - name: account_type
        in: query
        description: 'The type of account to query. Supported values: `cash`, `yield`, `credit`.'
        required: false
        schema:
          type: string
          default: cash
      - name: x-on-behalf-of
        in: header
        description: Unique identifier of the connected sub account.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoreBankingWalletBalance'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
