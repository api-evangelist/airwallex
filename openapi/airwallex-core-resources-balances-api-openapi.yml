components:
  schemas:
    CoreBankingWalletBalance:
      type: object
      properties:
        account_type:
          type: string
          description: 'Account Type. One of: `cash`, `yield`, or `credit`.'
        available_amount:
          type: number
          description: 'For account type **CASH**, Available balance. Customer deposits will be added to the available balance once processed, including any settled conversions bought in this currency


            For account type **CREDIT**, the Available amount reflects the remaining credit you can use.


            For account type **YIELD**, Total market value of all holdings.'
        currency:
          type: string
          description: Currency of the account balance.
        pending_amount:
          type: number
          description: 'For account type **CASH**, amount that will become available once currency conversion(s) have been settled.


            For account type **YIELD**, amount that will become available once Yield order(s) have been settled.'
        prepayment_amount:
          type: number
          description: 'Prepayment balance. Amount of money that is held in your Airwallex account as collateral for future transfer/conversion.


            For account type **CASH** only.'
        reserved_amount:
          type: number
          description: 'Reserved balance. Amount of money that is held in your Airwallex account.


            For account type **CASH**, consist of pending outbound payment.


            For account type **CREDIT**, consist of card transactions authorized but not yet captured.'
        total_amount:
          type: number
          description: 'For account type **CASH**, Total account balance (Available + Pending + Reserved).


            For account type **CREDIT**, the total outstanding balance on the credit account. Negative sign indicates the amount owed.


            For account type **YIELD**, Total market value of all holdings. Equal to available amount.'
    CoreBankingBalanceHistory:
      type: object
      properties:
        account_type:
          type: string
          description: 'Account Type. One of: `cash`, `yield`, or `credit`.'
        amount:
          type: number
          description: The amount of this balance change.
        balance:
          type: number
          description: 'The balance after this balance change occurred.


            For account type **CASH** and **YIELD**, tracks spendable amount.


            For account type **CREDIT**, tracks utilized credit balance.'
        currency:
          type: string
          description: The currency of this balance change.
        description:
          type: string
          description: The description for this balance change.
        fee:
          type: number
          description: The fee amount occurred with same currency, the account who paid this fee will receive this field.
        id:
          type: string
          description: The Unique identifier of the balance activity.
        posted_at:
          type: string
          description: The time this change posted to balance.
        reference:
          type: string
          description: Reference associated with the originating transaction. The value is derived from the appropriate reference field on the source transaction and may vary depending on the transaction type. See [`reference` mappings](/docs/banking-as-a-service/reporting/reporting-api/balance-history-mappings).
        source:
          type: string
          description: The unique identifier of the source transaction.
        source_type:
          type: string
          description: 'The original transaction type. One of: `DEPOSIT`, `CONVERSION`, `PAYMENT`, `CHARGE`, `TRANSFER`, `ADJUSTMENT`, `FEE`, `ISSUING`, `PAYMENT_SETTLEMENT`, `PAYMENT_RESERVE`, `PAYMENT_REFUND`, `PAYMENT_REFUND_FAILED`, `DIRECT_DEBIT`, `PAYOUT`, `PURCHASE`, `BATCH_PAYOUT`, `YIELD`, `REPAYMENT`, `WITHHOLDING_TAX`.'
        transaction_type:
          type: string
          description: 'The transaction type of the balance history. One of: `PAYMENT`, `PRE_CHARGEBACK_ACCEPTED`, `REFUND_CHARGEBACK_RECEIVED`, `REFUND_CHARGEBACK_WITHDRAWN`, `SECOND_CAPTURE_WITHDRAWN`, `DISPUTE`, `SECOND_DISPUTE`, `DISPUTE_REVERSAL`, `DISPUTE_LOST`, `DISPUTE_WON`, `REFUND`, `REFUND_REVERSAL`, `REFUND_FAILURE`, `PAYMENT_RESERVE_HOLD`, `PAYMENT_RESERVE_RELEASE`, `PAYOUT`, `PAYOUT_FAILURE`, `PAYOUT_REVERSAL`, `CONVERSION_SELL`, `CONVERSION_BUY`, `CONVERSION_REVERSAL`, `DEPOSIT`, `DEPOSIT_REVERSAL`, `ADJUSTMENT`, `FEE`, `DD_CREDIT`, `DD_DEBIT`, `DC_CREDIT`, `DC_DEBIT`, `DC_DEBIT_REVERSAL`, `ISSUING_AUTHORISATION_HOLD`, `ISSUING_AUTHORISATION_RELEASE`, `ISSUING_CAPTURE`, `ISSUING_REFUND`, `SPLIT`, `SPLIT_REVERSAL`, `LENDER_FUNDS_BORROWED`, `LENDER_FUNDS_RETURNED`, `DIRECT_DEBIT`, `DIRECT_DEBIT_REVERSAL`, `HOLD`, `HOLD_RELEASE`, `RETURN_TO_FUNDING_SOURCE`, `PURCHASE`, `PURCHASE_REVERSAL`, `TRANSFER`, `PREPAYMENT`, `PREPAYMENT_RELEASE`, `REPAYMENT_DEDUCTION`, `REPAYMENT_FUNDING`, `TRANSFER_OUT`, `TRANSFER_IN`, `TRANSFER_OUT_REVERSAL`, `TRANSFER_IN_REVERSAL`, `WITHHOLDING_TAX`, `WITHHOLDING_TAX_REVERSAL`, `null`.'
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
