  /api/v1/balances/history:
    get:
      tags:
      - Core Resources > Balances
      summary: 2|Retrieve the Balance History
      description: Get balance history for an account based on the transaction currency. The response contains records where each record represents a change to the balance. You can filter results using the date range parameters, `from_post_at` and `to_post_at`, representing the time the balance change occurred in your Wallet. The date range should be within 7 days when using `page_num` to paginate through history. Alternatively, you can paginate using the `page` parameter to retrieve either the previous page or the next page of results.
      operationId: listHistory
      parameters:
      - name: account_type
        in: query
        description: 'The type of account to query. Supported values: `cash`, `yield`, `credit`.'
        required: false
        schema:
          type: string
          default: cash
      - name: currency
        in: query
        description: The transaction currency in 3-letter ISO-4217 format.
        required: false
        schema:
          type: string
      - name: from_post_at
        in: query
        description: The start date (inclusive) of the date range during which balance activity occurred in your Wallet. Specify the date in ISO8601 format. If not specified, `from_post_at` defaults to 7 days before `to_post_at`.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: 'A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call.

          To retrieve the next page of results, pass the value of `page_after` (if not null) from the response to a subsequent call.

          To retrieve the previous page of results, pass the value of `page_before` (if not null) from the response to a subsequent call.

          Passing `page=0` will override the 7 day default for null date ranges, enabling a complete search of the Wallet balance records.'
        required: false
        schema:
          type: string
      - name: page_num
        in: query
        description: The page number of the page to be retrieved. Page numbers range from 0 to a maximum value of 10000.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: A limit on the number of records to be returned on a page, between 10 and 2000. The default is 100.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: request_id
        in: query
        description: request_id from clients for the transaction.
        required: false
        schema:
          type: string
      - name: to_post_at
        in: query
        description: The end date (exclusive) of the date range during which the balance activity occurred in your Wallet. Specify the date in ISO8601 format. Defaults to today if neither this field nor from_post_at are specified. If from_post_at is specified, then to_post_at defaults to 7 days after the from_post_at date.
        required: false
        schema:
          type: string
      - name: x-on-behalf-of
        in: header
        description: Unique identifier of the connected sub account.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results in forward direction.
                  items:
                    type: array
                    description: List items.
                    items:
                      $ref: '#/components/schemas/CoreBankingBalanceHistory'
                  page_after:
                    type: string
                    description: A bookmark for use in pagination to retrieve the next page of results. Provide this identifier in the `page` request parameter in a subsequent call to retrieve the next page of results. The value will be null for the last page.
                  page_before:
                    type: string
                    description: A bookmark for use in pagination to retrieve the previous page of results. Provide this identifier in the `page` request parameter in a subsequent call to retrieve the previous page of results. The value will be null for the first page.
        '400':
          description: '["invalid_argument"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: '`forbidden`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: '`not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`service_unavailable`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
