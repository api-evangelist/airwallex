components:
  schemas:
    NonPciRemoteCallConfig:
      type: object
      properties:
        methods:
          type: array
          description: Individual remote call method configs.
          items:
            $ref: '#/components/schemas/NonPciMethodConfig'
        shared_secret:
          type: string
          description: Shared secret to verify remote call requests. Please note this field only return once when you init remote call config or request a new secret in the update request, get issuing setting always return null.
          readOnly: true
        url:
          type: string
          description: The base url for remote calls, which will be combined with the path supplied for individual methods.
      description: Remote call config. You will need to reach out to our support team to enable this feature for you.
    NonPciRemoteAuthConfig:
      type: object
      properties:
        created_at:
          type: string
          description: Remote auth config creation time.
        default_action:
          type: string
          description: Default action when remote auth failed.
          enum:
          - AUTHORIZED
          - DECLINED
        enabled:
          type: boolean
          description: Remote auth config enabled flag, Airwallex will start sending remote auth request to your endpoint once this flag is enabled.
        shared_secret:
          type: string
          description: Shared secret to verify our remote auth request. Please note this field only return once when you init remote auth config or request a new secret in the update request, get issuing setting always return null.
        updated_at:
          type: string
          description: Remote auth config last update time.
        url:
          type: string
          description: The url for your remote auth endpoint, we will send remote auth request to this endpoint when your config is enabled.
        version:
          type: integer
          format: int32
          description: Specifies the remote auth payload version (1 or 2).
      description: Remote authorization config. Please read the [remote auth product documentation](/docs/issuing/card-controls/remote-authorization) for more information. You will need to reach out to our support team to enable this feature for you.
    NonPciMethodConfig:
      type: object
      properties:
        name:
          type: string
          description: Name of the method being configured.
        path:
          type: string
          description: Path that will be combined with url for remote calls.
    NonPciTransactionUsage:
      type: object
      properties:
        transaction_scope:
          type: string
          description: 'Types of transaction scope. It can be one of: `ALL_TRANSACTIONS`, `ONLINE_TRANSACTION`, `CONTACTLESS_TRANSACTION`, `CONTACT_CHIP_TRANSACTION`, `MAGSTRIPE`, `CASH_WITHDRAWAL`, `BILL_PAYMENT`, `ACCOUNT_FUNDING`.'
        usage_scope:
          type: string
          description: 'Determines if a transaction can be made domestically and/or internationally. It can be one of: `ALL`, `INTERNATIONAL`, `DOMESTIC`.'
    NonPciSpendingLimitSettings:
      type: object
      properties:
        per_transaction_limits:
          type: array
          description: PerTransaction Limit settings for all supported base currency.
          items:
            $ref: '#/components/schemas/NonPciSpendingLimitSetting'
      description: 'Spending limit settings. The default and maximum limits can be modified by reaching out to an Account Services team member. '
    NonPciIssuingSetting:
      type: object
      required:
      - enable_auto_conversion
      - primary_currency
      - spending_limit_settings
      properties:
        blocked_transaction_usages:
          type: array
          description: Transaction usage settings. The default controls are set based on regulatory requirements and can only be reviewed by reaching out to an Account Services team member.
          items:
            $ref: '#/components/schemas/NonPciTransactionUsage'
        enable_auto_conversion:
          type: boolean
          description: Whether auto currency conversion is enabled.
        primary_currency:
          type: string
          description: The designated primary currency used as the funding source for auto currency conversion.
        remote_auth_settings:
          $ref: '#/components/schemas/NonPciRemoteAuthConfig'
          description: Remote authorization config. Please read the [remote auth product documentation](/docs/issuing/card-controls/remote-authorization) for more information. You will need to reach out to our support team to enable this feature for you.
        remote_call_config:
          $ref: '#/components/schemas/NonPciRemoteCallConfig'
          description: Remote call config. You will need to reach out to our support team to enable this feature for you.
        remote_provisioning_config:
          $ref: '#/components/schemas/NonPciRemoteProvisioningConfig'
          description: Digital wallet remote provisioning config. You will need to reach out to our support team to enable this feature for you.
        spending_limit_settings:
          $ref: '#/components/schemas/NonPciSpendingLimitSettings'
          description: 'Spending limit settings. The default and maximum limits can be modified by reaching out to an Account Services team member. '
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    NonPciSpendingLimitSetting:
      type: object
      properties:
        currency:
          type: string
          description: Currency code of the card spending limit setting.
        default:
          type: number
          description: Default card spending limit amount of no limit set when create/update card.
        maximum:
          type: number
          description: Maximum spending limit user can set for the card. When create/update card, if spending limit exceed this amount, the create/update card request will be rejected.
    NonPciRemoteProvisioningConfig:
      type: object
      properties:
        default_action:
          type: string
          description: Default action when remote provisioning attempt fails.
          enum:
          - UNKNOWN
          - CONDITIONAL_APPROVAL
          - GENERIC_DECLINE
        enabled:
          type: boolean
          description: Remote Provisioning config enabled flag, Airwallex will start sending remote provisioning requests to your endpoint once this flag is enabled.
      description: Remote provisioning config. You will need to reach out to our support team to enable this feature for you.
