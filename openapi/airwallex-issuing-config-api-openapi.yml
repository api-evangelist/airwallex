  x-urlPath: issuing/config
paths:
  /api/v1/issuing/config:
    get:
      tags:
      - Issuing > Config
      summary: 1|Retrieve the Issuing Config
      description: Retrieves the default issuing settings configured for your account.
      operationId: listConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonPciIssuingSetting'
        '400':
          description: '["field_required"

            ,"bad_request"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/issuing/config
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          blocked_transaction_usages:
          - transaction_scope: MAGSTRIPE
            usage_scope: INTERNATIONAL
          - transaction_scope: ONLINE_TRANSACTION
            usage_scope: ALL
          enable_auto_conversion: true
          primary_currency: USD
          remote_auth_settings:
            created_at: '2018-03-22T16:08:02+00:00'
            default_action: DECLINED
            enabled: true
            shared_secret: 50qJEcIBT36Fg5DU1pxV1HSAcTPDA8etZnb5fYObi70BcCT52q19PFxyfkXd
            updated_at: '2018-03-22T16:08:02+00:00'
            url: https://your.domain/remote-auth
          remote_call_config:
            methods:
            - name: Echo
              path: /echo
            shared_secret: 50qJEcIBT36Fg5DU1pxV1HSAcTPDA8etZnb5fYObi70BcCT52q19PFxyfkXd
            url: https://your.domain
          remote_provisioning_config:
            default_action: UNKNOWN
            enabled: true
          spending_limit_settings:
            per_transaction_limits:
            - currency: AUD
              default: 1000
              maximum: 1000
      x-oauthSupported: false
      x-scope:
      - scope: issuing.config:read
        group: Issuing
        resource_name: Config
      x-domain: Issuing
      x-resource: Config
      x-urlPath: retrieve
      x-oboSupported: true
      x-resourceLevel: account
