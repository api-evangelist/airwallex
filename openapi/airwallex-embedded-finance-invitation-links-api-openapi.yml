paths:
  /api/v1/accounts/invitation_links/create:
    post:
      tags:
      - Embedded Finance > Invitation Links
      summary: 1|Create an Account Invitation Link
      operationId: createInvitationLink
      x-oboSupported: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - mode
              properties:
                account_id:
                  type: string
                  description: Id of Airwallex account to be invited. Required for `scale_connect` mode, optional for `oauth2` mode. When provided, account must already be connected to partner or platform.
                mode:
                  type: string
                  description: Invitation link mode. One of `oauth2`, `scale_connect`.
                oauth2:
                  type: object
                  required:
                  - redirect_uri
                  - response_type
                  - scope
                  description: OAuth parameters, if invitation link mode is `oauth2`.
                  properties:
                    redirect_uri:
                      type: string
                      description: The platform callback URL redirected to after auth.
                    response_type:
                      type: string
                      description: This tells the Airwallex authorization server that the platform is initiating a Scale Invitation Link flow with OAuth mode. One of `code`.
                    scope:
                      type: array
                      description: The permissions the platform is requesting from the user.
                      items:
                        type: string
                    state:
                      type: string
                      description: The platform generates a random string and includes it in the request. It should then check that the same value is returned after the user authorizes the app. Max length is 100 characters.
                scale_connect:
                  type: object
                  required:
                  - redirect_uri
                  description: Scale connect parameters, if invitation link mode is `scale_connect`.
                  properties:
                    redirect_uri:
                      type: string
                      description: The platform callback URL redirected to after scale connect.
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to an Account object. This can be useful for storing additional information about the account in a structured format. You can specify up to 5 keys, with key names up to 20 characters long and values up to 150 characters long.
                  additionalProperties:
                    type: string
                identifier:
                  type: string
                  description: The identifier that the platform uses to identify a merchant, usually a unique merchant identifier. In oauth2 mode, identifier will be included in the query parameter when redirecting a user back to the client's redirect_uri. Max length is 1000 characters.
                prefilled_formdata:
                  type: array
                  description: Data pre-filled by platform during new user signup.
                  items:
                    type: object
                    required:
                    - field
                    - value
                    properties:
                      field:
                        type: string
                        description: the field name of pre filled form data.
                        enum:
                        - email
                        - first_name
                        - last_name
                        - mobile_number
                        - business_name
                        - country
                        - contact_name
                      value:
                        type: string
                        description: The field value of pre-filled form data.
                      verified:
                        type: boolean
                        description: Whether the platform has verified the value.
                      editable:
                        type: boolean
                        description: Whether the user can edit the value.
        description: link.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLink'
        '400':
          description: '["field_required","invalid_argument"]'
