          items:
            type: string
        state:
          type: string
          description: The platform generates a random string and includes it in the request. It should then check that the same value is returned after the user authorizes the app. Max length is 100 characters.
      description: OAuth parameters, if invitation link mode is `oauth2`.
    ConnectReq:
      type: object
      required:
      - redirect_uri
      properties:
        redirect_uri:
          type: string
          description: The platform callback URL redirected to after scale connect.
      description: Scale connect parameters, if invitation link mode is `scale_connect`.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    AccountLink:
      type: object
      required:
      - scale_connect
      properties:
        account_id:
          type: string
          description: Invite Airwallex account Id.
        created_at:
          type: string
          description: Time the account link was created.
          readOnly: true
        expire_at:
          type: string
          description: Time the account link will expire.
          readOnly: true
        id:
          type: string
          description: Airwallex account link unique identifier.
          readOnly: true
        identifier:
          type: string
          description: The identifier that the platform uses to identify a merchant, usually a unique merchant identifier. In oauth2 mode, identifier will be included in the query parameter when redirecting a user back to the client's redirect_uri. Max length is 1000 characters.
        metadata:
          type: object
          description: A set of key-value pairs that you can attach to an Account object. This can be useful for storing additional information about the account in a structured format. You can specify up to 5 keys, with key names up to 20 characters long and values up to 150 characters long.
          additionalProperties:
            type: string
        mode:
          type: string
          description: Invitation link mode.
          readOnly: true
        oauth2:
          $ref: '#/components/schemas/OauthReq'
          description: OAuth parameters, if invitation link mode is `oauth2`.
        prefilled_formdata:
          type: array
          description: Data pre-filled by platform during new user signup.
          items:
            $ref: '#/components/schemas/PrefilledFormData'
        scale_connect:
          $ref: '#/components/schemas/ConnectReq'
          description: Scale connect parameters, if invitation link mode is `scale_connect`.
        url:
          type: string
          description: URL provided by Airwallex for the end user to use in order to complete their OAuth 2.0 authorization.
          readOnly: true
    PrefilledFormData:
      type: object
      required:
      - field
      - value
      properties:
        field:
          type: string
          description: the field name of pre filled form data.
          enum:
          - email
          - first_name
          - last_name
          - mobile_number
          - business_name
          - country
          - contact_name
        value:
          type: string
          description: The field value of pre-filled form data.
        verified:
          type: boolean
          description: Whether the platform has verified the value.
        editable:
          type: boolean
          description: Whether the user can edit the value.
