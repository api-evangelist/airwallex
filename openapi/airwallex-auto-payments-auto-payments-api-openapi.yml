openapi: 3.2.0
info:
  title: Airwallex Auto Payments > Auto Payments API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Auto Payments > Auto Payments
  x-domain: Auto Payments
  x-resource: Auto Payments
  x-urlPath: auto_payments/auto_payments
paths:
  /api/v1/auto_payments/create:
    post:
      tags:
      - Auto Payments > Auto Payments
      summary: 1|Create an Auto Payment
      description: Create a new auto payment.
      operationId: createAutoPayment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - payment
              - request_id
              - schedule
              properties:
                payment:
                  type: object
                  required:
                  - amount
                  - condition
                  - reason
                  description: Details for the payment in the auto payment request.
                  properties:
                    amount:
                      type: object
                      description: The amount that will payout to beneficiary，one of `fixed_payout_amount`, `max_retained_balance`.
                      properties:
                        fixed_payout_amount:
                          type: number
                          description: The specific amount will payout to beneficiary.
                        max_retained_balance:
                          type: number
                          description: The maximum amount will retain on the wallet, the payout amount will be difference between available balance and max retained balance.
                    beneficiary_id:
                      type: string
                      format: uuid
                      description: An Airwallex beneficiary_id previously generated by utilising the Airwallex Contact API.
                    condition:
                      type: object
                      required:
                      - currency
                      - threshold
                      description: The condition set to trigger the automatic auto payout.
                      properties:
                        currency:
                          type: string
                          description: The currency of the threshold amount.
                        threshold:
                          type: object
                          required:
                          - balance_gt
                          description: The auto payout will be executed after the balance reach a specific level.
                          properties:
                            balance_gt:
                              type: number
                              description: The balance should be greater than the threshold amount.
                    fee_paid_by:
                      type: string
                      description: Denotes whether PAYER/BENEFICIARY will be liable for the payment fees, and it affects the actual amount the beneficiary receives. Once the PAYER was selected under the setting of max_retained_balance, the fee will deduct from retained balance; if the max_retained_balance set as zero, only BENEFICIARY can be selected to liable for the payment fees.
                    payer_id:
                      type: string
                      format: uuid
                      description: An Airwallex payer_id previously generated by utilising the Airwallex Contact API.
                    reason:
                      type: string
                      description: Reason for the payment instruction.
                    reference:
                      type: string
                      description: A user specified reference that will be displayed to the beneficiary on the payment transaction with their bank.
                    swift_charge_option:
                      type: string
                      description: (For SWIFT payments only), specify who should bear SWIFT charges, either `SHARED` (default) or `PAYER`.
                request_id:
                  type: string
                  description: Unique request identifier.  1-50 characters long.
                schedule:
                  type: object
                  required:
                  - execute_at
                  - time_interval
                  description: Indicate the frequency and specific time to execute an automatic payment.
                  properties:
                    effective_date_time:
                      type: string
                      description: The effective date time of the auto payout. Leave blank when the `ONCE` interval was set.
                    execute_at:
                      type: object
                      required:
                      - time
                      - time_zone
                      description: A specific time of the day to execute auto payout.
                      properties:
                        time:
                          type: string
                          description: Execution time with the format HH:MM.
                        time_zone:
                          type: string
                          description: A string containing the unique identifier of the time zone. These unique identifiers are defined by Unicode Common Locale Data Repository (CLDR) project, e.g., `Asia/Shanghai`, `Asia/Hong_Kong`, `Australia/Melbourne`, `Asia/Singapore`.
                    expiration_date_time:
                      type: string
                      description: The expiration date time of the auto payout. Leave blank when the `ONCE` interval was set.
                    monthly_anchor:
                      type: string
                      description: The specific date of a month to execute a monthly auto payout. Should be the number from 1-31, once 31 was set, it will be default as the last day of the month.
                    once_anchor:
                      type: string
                      description: The specific date to execute a once auto payout.
                    time_interval:
                      type: string
                      description: The frequency of the auto payout will execute once it meets the condition, can be one of `DAILY`, `WEEKLY`, `MONTHLY`, `ONCE`.
                    weekly_anchor:
                      type: string
                      description: The specific working day of a week to execute a weekly auto payout, can be one of `MONDAY`, `TUESDAY`, `WEDNESDAY`, `THURSDAY`, `FRIDAY`, `SATURDAY`, `SUNDAY`.
        description: request
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulePayment-2'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
