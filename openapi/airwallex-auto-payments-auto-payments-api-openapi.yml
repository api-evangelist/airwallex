  /api/v1/auto_payments:
    get:
      tags:
      - Auto Payments > Auto Payments
      summary: 3|List all Auto Payments
      description: Get list of auto payments from a specified creation date/time, with optional filters on end creation then auto payments one year in arrears of today or the *to* created_at date will be returned.
      operationId: listAutoPayments
      parameters:
      - name: from_created_at
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: '2017-04-01'
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: to_created_at
        in: query
        description: The end date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: 2017-04-01T03:52:34+0000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: Paged results.
