components:
  schemas:
    AccountingFieldSelection:
      type: object
      required:
      - source_id
      - type
      - value
      properties:
        source_id:
          type: string
          format: uuid
          description: Unique identifier of the selected general ledger (GL) account, tax code, or accounting field value.
        type:
          type: string
          description: Type of accounting field.
          enum:
          - GENERAL_LEDGER_ACCOUNT
          - TAX_CODE
          - OTHER
          x-enumDescriptions:
            GENERAL_LEDGER_ACCOUNT: General ledger (GL) account assigned to the line item.
            TAX_CODE: Tax code applied to the line item.
            OTHER: Custom accounting field defined in your ERP. The field name is provided in `name`.
        name:
          type: string
          description: Name of the accounting field in the ERP software. This field is populated only when `type` is set to `OTHER`.
        external_id:
          type: string
          description: External unique identifier of the accounting field value in the ERP.
        value:
          type: string
          description: Name of the accounting field value in the ERP.
        value_label:
          type: string
          description: Name of the accounting field value displayed in Airwallex.
    Comment:
      type: object
      required:
      - content
      - created_at
      properties:
        content:
          type: string
          description: Text body of the comment.
        created_by:
          type: string
          description: Email address of the user who created this comment. Used for attribution, notifications, and audit trail tracking.
        created_at:
          type: string
          description: Timestamp for when the resource was created in ISO8601 format.
      description: User comment or note providing additional context, clarification, or communication related to expenses, reimbursements, or approval workflows. Used for audit trails and collaboration.
    ExpenseLineItem:
      type: object
      required:
      - accounting_field_selections
      - id
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the expense line item.
        transaction_amount:
          type: string
          description: Amount of this line item in the transaction currency, including all taxes. Represents the actual expense amount for this specific component of the overall expense.
        description:
          type: string
          description: Optional description providing details about this specific line item. Helps explain what this component of the expense represents for accounting and approval purposes.
        accounting_field_selections:
          type: array
          description: Accounting and categorization fields assigned to this specific line item. Allows for different accounting treatment of individual components within a single expense.
          items:
            $ref: '#/components/schemas/AccountingFieldSelection'
      description: Individual line item within an expense representing a specific component or breakdown. Allows for detailed categorization and accounting treatment of different parts of a single expense.
    Expense:
      type: object
      required:
      - account_id
      - accounting_field_selections
      - approvers
      - attachments
      - billing_amount
      - billing_currency
      - card_id
      - card_type
      - card_transaction
      - comments
      - created_at
      - id
      - legal_entity_id
      - line_items
      - status
      - sync_status
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the expense.
        account_id:
          type: string
          description: Unique identifier of the Airwallex account that owns this expense. This determines which account the expense amount is debited from.
        legal_entity_id:
          type: string
          description: Unique identifier of the legal entity associated with this expense. Used for accounting segregation and compliance reporting across different legal entities.
        card_id:
          type: string
          format: uuid
          description: Unique identifier of the Airwallex card used to make this purchase. Links the expense to the specific card and cardholder for tracking and reporting.
        card_type:
          type: string
          description: Identifies whether the expense was made using a company card or an employee card. Possible values are `COMPANY` and `EMPLOYEE`.
          enum:
          - COMPANY
          - EMPLOYEE
          x-enumDescriptions:
            COMPANY: Expense made using a company card.
            EMPLOYEE: Expense made using an employee card.
        status:
          type: string
          description: Current approval status of the expense. Additional values may appear; implementations should handle unknown values gracefully.
          enum:
          - DRAFT
          - AWAITING_APPROVAL
          - REJECTED
          - APPROVED
          - ARCHIVED
          - DELETED
        card_transaction:
          $ref: '#/components/schemas/CardTransaction'
        sync_status:
          type: string
          description: Expense sync status.
          enum:
          - NOT_SYNCED
          - READY_TO_SYNC
          - SYNCED
          - SYNC_FAILED
        billing_currency:
          type: string
          description: Currency in which the billing amount is charged to your account. This is your account's primary currency, regardless of the original transaction currency.
        billing_amount:
          type: string
          description: Total amount charged to your account in billing currency, including any fees or currency conversion. This may differ from the original transaction amount.
        description:
          type: string
          description: Optional description or memo providing additional context about the expense. Often includes the business purpose or additional details about the purchase.
        merchant:
          type: string
          description: Name of the payee for this expense. Not linked to your accounting system.
        invoice_number:
          type: string
          description: Invoice number associated with the expense.
        approvers:
          type: array
          description: Email addresses of users authorized to approve this expense. An empty array indicates no approval is required or the expense has already been approved.
          items:
            type: string
            description: Email addresses of users authorized to approve this expense. An empty array indicates no approval is required or the expense has already been approved.
        created_at:
          type: string
          description: Timestamp for when the resource was created in ISO8601 format.
        updated_at:
          type: string
          description: Timestamp for when the resource was updated in ISO8601 format.
        settled_at:
          type: string
          description: Timestamp when the transaction was settled, in ISO8601 format. Null if transaction is still pending settlement.
        accounting_field_selections:
          type: array
          description: Merchant accounting field selection assigned to this expense for reporting and categorization in your accounting system.
          items:
            type: object
            required:
            - source_id
            - type
            - value
            properties:
              source_id:
                type: string
                format: uuid
                description: Unique identifier of the merchant associated with this expense.
              type:
                type: string
                description: Type of accounting field.
                enum:
                - MERCHANT
