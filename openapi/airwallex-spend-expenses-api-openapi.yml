        page_after:
          type: string
          description: A pointer to the end of the page list used in pagination to retrieve the next page of results.
        page_before:
          type: string
          description: A pointer to the start of the page list use in pagination to retrieve the previous page of results.
      description: Paginated list of expenses.
    Attendee:
