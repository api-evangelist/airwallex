  /api/v1/spend/expenses/{id}/sync:
    post:
      tags:
      - Spend > Expenses
      x-stage: beta
      summary: 3|Update Expense Sync Status
      description: 'Updates the sync status of an existing expense.


        A sync status can only move in the following directions:

        * `NOT_SYNCED` can move to `READY_TO_SYNC`, `SYNC_FAILED`, or `SYNCED`.

        * `READY_TO_SYNC` can move to `SYNCED` or `SYNC_FAILED`.

        * `SYNC_FAILED` can move to `SYNCED` or `READY_TO_SYNC`.

        * `SYNCED` is a final state and cannot move to any other status.


        `NOT_SYNCED` is the initial status of an expense and cannot be set through this endpoint.'
      operationId: syncExpenses
      parameters:
      - name: id
        in: path
        description: Unique identifier of the expense.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - sync_status
              properties:
                sync_status:
                  type: string
                  description: Expense sync status.
                  enum:
                  - READY_TO_SYNC
                  - SYNCED
                  - SYNC_FAILED
              description: Expense Update Payload.
        description: Update expense payload.
        required: true
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
