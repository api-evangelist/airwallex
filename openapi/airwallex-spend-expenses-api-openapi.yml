                  MERCHANT: Merchant accounting field selection.
              name:
                type: string
                description: Name of the accounting field in the ERP software. This field is not populated for merchant accounting field selections.
              external_id:
                type: string
                description: External unique identifier of the accounting field value in the ERP.
              value:
                type: string
                description: Name of the accounting field value in the ERP.
              value_label:
                type: string
                description: Name of the accounting field value displayed in Airwallex.
        attachments:
          type: array
          description: Receipt images and supporting documents uploaded for this expense. Commonly used for compliance and approval workflows.
          items:
            $ref: '#/components/schemas/Attachment'
        line_items:
          type: array
          description: Breakdown of the expense into detailed line items with individual accounting categories. The sum of all line item amounts should equal the total expense amount.
          items:
            $ref: '#/components/schemas/ExpenseLineItem'
        comments:
          type: array
          description: Conversation thread and notes about this expense, typically used for approval workflows and clarifications between cardholders and approvers.
          items:
            $ref: '#/components/schemas/Comment'
        attendees:
          type: array
          description: Attendees associated with this expense, including internal employees and external guests.
          items:
            $ref: '#/components/schemas/Attendee'
    CardTransaction:
      type: object
      required:
