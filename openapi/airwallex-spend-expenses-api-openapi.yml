      - currency
      - status
      properties:
        card_transaction_id:
          type: string
          format: uuid
          description: Unique identifier of the card transaction associated with the expense.
        status:
          type: string
          description: Transaction status.
          enum:
          - AUTHORIZED
          - CLEARED
          - REVERSED
          x-enumDescriptions:
            AUTHORIZED: Transaction has been authorized by the card network but not yet settled.
            CLEARED: Transaction has been settled and cleared.
            REVERSED: Transaction has been reversed or refunded.
        amount:
          type: string
          description: Amount of the original card transaction in the transaction currency.
        currency:
          type: string
          description: Currency of the original card transaction, as an ISO 4217 currency code.
      description: Details of the original card transaction associated with an expense, including the authorization status, amount, and currency.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    Attachment:
      type: object
      required:
      - content_type
      - created_at
      - file_name
      - file_url
      - id
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the attachment.
        content_type:
          type: string
          description: MIME type of the attached file. Common types include `image/jpeg`, `image/png`, and `application/pdf`.
        file_name:
          type: string
          description: Original filename of the uploaded attachment, including the file extension.
        file_url:
          type: string
          description: URL to access and download the attachment file.
        created_at:
          type: string
          description: Timestamp for when the resource was created in ISO8601 format.
      description: File attachment containing supporting documentation such as receipts, invoices, or other proof of expense. Used for compliance, audit trails, and approval workflows.
    ExpensePagination:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: List of items returned.
          items:
