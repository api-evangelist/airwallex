  /api/v1/spend/expenses/{id}/delete_line_items:
    post:
      tags:
      - Spend > Expenses
      summary: Delete Expense Line Items
      x-stage: preview
      description: Deletes between 1 and 100 expense line items. The operation is atomic. Line item totals may temporarily differ from the expense transaction amount, but must reconcile before the expense is submitted. Archived expenses cannot be edited.
      operationId: deleteExpenseLineItems
      parameters:
      - name: id
        in: path
        description: Unique identifier of the expense.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - line_item_ids
              properties:
                line_item_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Unique identifiers of the expense line items to delete.
                  items:
                    type: string
                    format: uuid
                    description: Unique identifier of an expense line item.
              description: Expense line items to delete.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Expense or line item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
