      summary: Update Expense Line Items
      x-stage: preview
      description: Updates between 1 and 100 expense line items. The operation is atomic. Line item totals may temporarily differ from the expense transaction amount, but must reconcile before the expense is submitted. Archived expenses cannot be edited.
