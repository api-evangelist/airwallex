openapi: 3.2.0
info:
  title: Airwallex Spend > Expenses API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Spend > Expenses
  description: Manages expenses associated with corporate card transactions. Supports approval workflows, receipt attachments, accounting field categorization, line item breakdowns, and sync with external accounting systems.
  x-domain: Spend
  x-resource: Expenses
  x-urlPath: spend/expenses
paths:
  /api/v1/spend/expenses/{id}/add_line_items:
    post:
      tags:
      - Spend > Expenses
      summary: Add Expense Line Items
      x-stage: preview
      description: Adds between 1 and 100 line items to an existing expense. Archived expenses cannot be edited.
      operationId: addExpenseLineItems
      parameters:
      - name: id
        in: path
        description: Unique identifier of the expense.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - line_items
              - request_id
              properties:
                request_id:
                  type: string
                  maxLength: 64
                  description: Unique identifier for this request to ensure idempotency.
                line_items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  description: Expense line items to create.
                  items:
                    type: object
                    required:
                    - transaction_amount
                    properties:
                      transaction_amount:
                        type: string
                        pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                        description: Non-negative line item amount in the expense transaction currency.
                      description:
                        type: string
                        description: Optional description of the expense line item.
                      accounting_field_selections:
                        type: array
                        description: Accounting field selections to assign to the expense line item.
                        items:
                          type: object
                          required:
                          - type
                          - source_id
                          properties:
                            type:
                              type: string
                              description: Type of selected accounting value.
                              enum:
                              - GENERAL_LEDGER_ACCOUNT
                              - TAX_CODE
                              - OTHER
                              x-enumDescriptions:
                                GENERAL_LEDGER_ACCOUNT: General ledger account that the line item is booked to.
                                TAX_CODE: Tax code applied to the line item.
                                OTHER: Custom accounting field defined in your ERP.
                            source_id:
                              type: string
                              format: uuid
                              description: 'Unique identifier of the accounting value to assign to this line item. The required value depends on `type`: use the `id` returned by [List GL accounts](/docs/api/accounting/general_ledger_accounts/gl_accounts) for `GENERAL_LEDGER_ACCOUNT`, [List tax codes](/docs/api/accounting/tax_codes/list) for `TAX_CODE`, or [List accounting field values](/docs/api/accounting/accounting_field_values/list) for `OTHER`.'
                          description: Accounting field selection to assign to the expense line item.
                    description: Expense line item to create.
              description: Expense line items to create and add to the expense.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Expense not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/spend/expenses/ba46f0ff-8081-4db6-8333-4e011fe9561d/add_line_items
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          request_id: ee939540-3203-4a2c-9172-89a566485dd9
          line_items:
          - transaction_amount: '60.50'
            description: Client dinner
            accounting_field_selections:
            - type: GENERAL_LEDGER_ACCOUNT
              source_id: c9fcfdee-f943-45c9-abaa-45df1601ae04
          - transaction_amount: '45.00'
            description: Taxi
        response_body:
          id: ba46f0ff-8081-4db6-8333-4e011fe9561d
          account_id: acct_a2y0pxz3m4k5hoZldn97hjzp
          legal_entity_id: le_U3jlHqQRNHWn2zAKeeT8sg
          card_id: 93eed14b-104d-4f40-ae1d-3633c6538276
          card_type: EMPLOYEE
          status: DRAFT
          card_transaction:
            status: CLEARED
            amount: '105.50'
            currency: USD
          sync_status: NOT_SYNCED
          billing_currency: USD
          billing_amount: '105.50'
          approvers: []
          created_at: '2025-01-01T00:00:00Z'
          updated_at: '2025-02-02T00:00:00Z'
          accounting_field_selections: []
          attachments: []
          line_items:
          - id: a12fca5e-4aeb-4adb-85b0-428b4f078aba
            transaction_amount: '60.50'
            description: Client dinner
            accounting_field_selections:
            - source_id: c9fcfdee-f943-45c9-abaa-45df1601ae04
              type: GENERAL_LEDGER_ACCOUNT
              external_id: '6000'
              value: Travel & Entertainment
              value_label: Travel & Entertainment
          - id: 9f10c7dc-3083-48c7-8c1a-bf8f76dcf600
            transaction_amount: '45.00'
            description: Taxi
            accounting_field_selections: []
          comments: []
      x-api-key-scope: org
      x-obo-supported: false
      x-domain: Spend
