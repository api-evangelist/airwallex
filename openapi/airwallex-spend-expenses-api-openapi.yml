      - name
      properties:
        external:
          type: boolean
          description: Indicates whether the attendee is external to the organization.
        name:
          type: string
          description: Name of the attendee.
        email:
          type: string
          description: Email address of the attendee. Present only when `external` is `false`.
      description: Attendee associated with an expense or reimbursement. Can be an internal employee or an external guest.
