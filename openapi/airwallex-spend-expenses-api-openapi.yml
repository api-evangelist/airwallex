  /api/v1/spend/expenses/{id}/update:
    post:
      tags:
      - Spend > Expenses
      x-stage: beta
      summary: Update an Expense
      description: Updates the coding and details of an existing expense, such as its description, merchant, invoice number, and attendees. Archived expenses cannot be edited.
      operationId: updateExpense
      parameters:
      - name: id
        in: path
        description: Unique identifier of the expense.
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  description: Description or memo for the expense.
                merchant:
                  type: string
                  description: Name of the payee for this expense. Not linked to your accounting system.
                invoice_number:
                  type: string
                  description: Invoice number associated with the expense.
                attendees:
                  type: array
                  description: List of attendees for the expense.
                  items:
                    type: object
                    required:
                    - external
                    properties:
                      external:
                        type: boolean
                        description: Whether the attendee is external to the organization.
                      name:
                        type: string
                        description: Name of the attendee. Required for external attendee.
                      email:
                        type: string
                        description: Email address of the attendee. Present only when external is false.
                    description: Attendee of the expense.
              description: Fields to update on the expense.
        required: true
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
