  /api/v1/linked_accounts/auth:
    post:
      tags:
      - Core Resources > Linked Accounts
      summary: 4|Generate a Linked Account Authentication
      description: Generates a Linked Account authentication. You will retrieve an authentication token with the specified Open Banking provider to verify the ownership of the external bank account, so that the external bank account owner may verify their access to the account.
      operationId: auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                egiro:
                  type: object
                  required:
                  - entity_type
                  - redirect_url
                  - reference
                  - swift_code
                  description: Required information to generate a EGIRO authentication.
                  properties:
                    entity_type:
                      type: string
                      description: Type of entity which owns this external bank account.
                      enum:
                      - BUSINESS
                      - INDIVIDUAL
                    redirect_url:
                      type: string
                      description: URL to receive authentication result and display the status.
                    reference:
                      type: string
                      description: Customer reference displayed in bank authorization item, with up to 25 characters.
                    swift_code:
                      type: string
                      description: SWIFT code.
                plaid:
                  type: object
                  required:
                  - client_name
                  - country_code
                  description: Required information to generate a Plaid authentication.
                  properties:
                    client_name:
                      type: string
                      description: The name of your business to be displayed in Plaid Modal. The maximum length of 30 characters. If a value longer than 30 characters is provided, Plaid Modal will display `This Application` instead.
                    country_code:
                      type: string
                      description: Two-letter [ISO 3166-2](https://en.wikipedia.org/wiki/ISO_3166-2) country code.
                    language:
                      type: string
                      description: The language that Plaid Modal should be displayed in. Two-letter [ISO 639-1](https://en.wikipedia.org/wiki/ISO_639-1) language code. Default is `en`.
                    link_customization_name:
                      type: string
                      description: The name of the Link customization configured on the Plaid Dashboard. If not specified, the `default` customization will be applied.
                    redirect_url:
                      type: string
                      description: URL to handle the Oauth verification flow.
                truelayer:
                  type: object
                  required:
                  - country_code
                  - provider_id
                  - redirect_url
                  description: Required information to generate a Truelayer authentication.
                  properties:
                    country_code:
                      type: string
                      description: Two-letter [ISO 3166-2](https://en.wikipedia.org/wiki/ISO_3166-2) country code.
                    provider_id:
                      type: string
                      description: Unique identifier of the financial institution as provided by Truelayer [here](https://auth.truelayer.com/api/providers).
                    redirect_url:
                      type: string
                      description: URL to handle the Oauth verification flow.
                type:
                  type: string
                  description: Specify a verification type for your external bank account.
                  enum:
                  - PLAID
                  - TRUELAYER
                  - EGIRO
                  - BASIQ
        description: request
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkedAccountAuth'
        '400':
          description: '["field_required","invalid_argument"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/linked_accounts/auth
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          egiro:
            entity_type: BUSINESS
            redirect_url: https://www.airwallex.com
            reference: https://www.airwallex.com
            swift_code: DBSSSGSG
          plaid:
            client_name: Airwallex
            country_code: US
            language: en
            link_customization_name: customized
            redirect_url: https://www.airwallex.com
          truelayer:
            country_code: GB
            provider_id: ob-monzo
            redirect_url: https://www.airwallex.com
          type: PLAID
        response_body:
          egiro:
            auth_url: https://edda.dbs.com/api/v1/edda/authorize/creation?parameterKey=valule
          plaid:
            expires_at: 2022-06-29T11:25:39+0000
            link_token: link-sandbox-463f3464-287c-4a75-adf2-85bc07c2dd89
          truelayer:
            auth_url: https://auth.truelayer-sandbox.com?client_id=sandbox-airwallex-5c4af6&redirect_uri=https://www.airwallex.com&provider_id=ob-monzo&state=6781472155828238&response_type=code&scope=info%20accounts%20balance%20offline_access
          type: PLAID
      x-scope:
      - scope: linked_account:write
        group: Core Resources
        resource_name: Linked Accounts
      x-domain: Core Resources
      x-resource: Linked Accounts
      x-urlPath: auth
      x-oauthSupported: true
