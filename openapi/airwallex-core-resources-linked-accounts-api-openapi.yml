                    end_date:
                      type: string
                      description: End date to expect to be paid from the Linked Account.
                    fixed_amount_per_transaction:
                      type: number
                      description: The fixed amount that may be paid from the Linked Account, per transaction.
                    max_amount_per_transaction:
                      type: number
                      description: Maximum amount that may be paid from the Linked Account, per transaction.
                    schedule:
                      type: object
                      required:
                      - period
                      - period_unit
                      description: The schedule for recurring transaction cycles. If no schedule is provided, the number of transactions allowed will be unlimited.
                      properties:
                        period:
                          type: integer
                          format: int32
                          description: The number of period units between recurring transaction cycles. For example, the transaction cycle is every quarter if period = 3 and period_unit = MONTH.
