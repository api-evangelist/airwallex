openapi: 3.2.0
info:
  title: Airwallex Core Resources > Linked Accounts API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Core Resources > Linked Accounts
  description: Linked Accounts are external financial accounts associated with your Airwallex account. You can use Linked Accounts to fund your Airwallex wallet via Direct Debit.
  x-domain: Core Resources
  x-resource: Linked Accounts
  x-urlPath: core_resources/linked_accounts
paths:
