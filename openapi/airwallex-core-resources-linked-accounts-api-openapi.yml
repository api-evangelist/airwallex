    post:
      tags:
      - Core Resources > Linked Accounts
      summary: 1|Create a Linked Account
      description: Links an external bank account to your Airwallex account. If you would like to use Open Banking as your verification method, please first call on the `linked_accounts/auth` endpoint to generate an authentication token.
