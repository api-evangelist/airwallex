  /api/v1/billing/credit_notes/preview:
    post:
      description: Preview a Credit Note that is linked to an Invoice.
      operationId: creditNotes_preview
      requestBody:
        content:
          application/json:
            schema:
              required:
              - invoice_id
              - line_items
              - reason
              - type
              type: object
              properties:
                custom_reason:
                  maxLength: 500
                  minLength: 0
                  type: string
                  description: An explanation for issuing the credit note when the reason is set to `OTHER`. This field is required if reason is `OTHER` and must be omitted or null for all other reason values.
                invoice_id:
                  type: string
                  description: ID of the [Invoice](/docs/api/billing/invoices).
                line_items:
                  maxItems: 100
                  minItems: 0
                  type: array
                  description: A list of credit note line items to preview.
                  items:
                    type: object
                    properties:
                      amount:
                        maximum: 9999999999
                        minimum: 0
                        type: number
                        description: 'The amount of the credit note line item. You can specify either the `amount` directly, or the pair of `quantity` and `unit_amount`. When the `invoice_line_item_id` is null, this amount is proportionally distributed across all invoice line items based on their `remaining_creditable_amount`. '
                      description:
                        maxLength: 500
                        minLength: 0
                        type: string
                        description: Description of the line item being credited.
                      invoice_line_item_id:
                        type: string
                        description: ID of the Invoice Line Item.
                      invoice_line_item_group_id:
                        type: string
                        description: A unique identifier that groups all related line items from a single tiered price. Used to credit by group instead of by individual line item. Mutually exclusive with `invoice_line_item_id`. When specified, `invoice_line_item_id`, `amount`, and `unit_amount` must be null. A single request cannot include both an `invoice_line_item_group_id` and any of its constituent `invoice_line_item_id`s. For `GRADUATED` prices, the credit amount is recalculated based on the remaining quantity. If the adjusted quantity no longer reaches a tier, associated fees (including flat fees) are automatically credited. For `VOLUME` prices, no tier adjustment is applied.
                      metadata:
                        type: object
                        additionalProperties:
                          type: string
                          description: A set of key-value pairs that you can attach to this object for storing additional information.
                        description: A set of key-value pairs that you can attach to this object for storing additional information.
                      quantity:
                        minimum: 1
                        type: integer
                        description: The number of units of product being credited.
                        format: int32
                      tax_included:
                        type: boolean
                        description: Whether the `amount` or `unit_amount` are inclusive of taxes or exclusive of taxes. Only can set the value to true for `unit_amount` when the price of the associated invoice line item is also tax inclusive. Defaults to false.
                      unit_amount:
                        maximum: 9999999999
                        minimum: 0
                        type: number
                        description: 'The amount to be credited per product unit. This `unit_amount` will be multiplied by the `quantity` to get the full amount to credit for this line item. You can specify either the `amount` directly, or the pair of `quantity` and `unit_amount`. Only applicable when the `invoice_line_item_id` is not null.


                          Defaults to the unit amount of the invoice line item when `quantity` is provided.'
                memo:
                  maxLength: 500
                  minLength: 0
                  type: string
                  description: Customer-facing text that appears on the credit note PDF.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of key-value pairs that you can attach to this object for storing additional information.
                  description: A set of key-value pairs that you can attach to this object for storing additional information.
                reason:
                  pattern: ^(PRODUCT_RETURN|ORDER_CHANGE|PRODUCT_OR_SERVICE_UNSATISFACTORY|BILLING_ERROR|GOODWILL_GESTURE|OTHER)$
                  type: string
                  description: 'Reason for issuing this credit note, one of: `PRODUCT_RETURN`, `ORDER_CHANGE`, `PRODUCT_OR_SERVICE_UNSATISFACTORY`, `BILLING_ERROR`, `GOODWILL_GESTURE`, `OTHER`.'
                type:
                  pattern: ^(BEFORE_PAYMENT|AFTER_PAYMENT)$
                  type: string
                  description: 'The type of the credit note, one of: `BEFORE_PAYMENT`, `AFTER_PAYMENT`.'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNotePreview'
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 5|Preview a Credit Note
      tags:
      - Billing > Credit Notes
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/billing/credit_notes/preview
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          custom_reason: Customer requested adjustment
          invoice_id: inv_hkpd49cskgblns6iimw
          line_items:
          - amount: 20
            description: Customer generated description of the item.
            invoice_line_item_id: iit_hkpd49cskgblnsnzgm1
            metadata:
              foo: bar
            quantity: 10
            tax_included: false
            unit_amount: 2
          - description: Customer generated description of the item.
            invoice_line_item_group_id: aaea4c0e-d8b4-4b19-b249-ca28d7e17d54
            metadata:
              foo: bar
            quantity: 10
            tax_included: false
          memo: Credit note memo.
          metadata:
            foo: bar
          reason: PRODUCT_RETURN
          type: BEFORE_PAYMENT
        response_body:
          adjustment_amount: 50
          billing_customer_id: bcus_hkpd7fedfgb004apkvs
          currency: USD
          custom_reason: Customer requested adjustment
          invoice_id: inv_hkpd49cskgblns6iimw
          line_items:
          - amount: 10
            currency: CNY
            description: Customer generated description of the item.
            discount_amounts:
            - amount: 10
              applied_discount_id: disc_hkpdkcmxdgazzq53jbk
            invoice_line_item_id: iit_hkpd49cskgblnsnzgm1
            metadata: {}
            quantity: 1
            tax_amount: 10
            tax_breakdown:
            - name: GST
              tax_amount: 10
              tax_percent: 10
              taxable_amount: 100
            unit_amount: 10
          memo: Credit note memo.
          metadata:
            foo: bar
          reason: PRODUCT_RETURN
          refund_amount: 25
          total_amount: 110
          total_discount_amounts:
          - amount: 10
            applied_discount_id: disc_hkpdkcmxdgazzq53jbk
          total_tax_amount: 10
          type: BEFORE_PAYMENT
      x-resourceLevel: org
      x-oboSupported: false
      x-scope:
      - scope: billing.credit_note:read
        group: Billing
        resource_name: Credit Notes
      - scope: billing.credit_note:write
        group: Billing
        resource_name: Credit Notes
      x-domain: Billing
      x-resource: Credit Notes
      x-urlPath: preview
      x-oauthSupported: true
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
  /api/v1/billing/credit_notes/{id}/finalize:
    post:
      description: Finalize a draft Credit Note. If the type is `BEFORE_PAYMENT`, the `refund_amount` and `out_of_band_amount` must be null. If the type is `AFTER_PAYMENT`, you will need to allocate the `total_amount` of the credit note to either `refund_amount` or `out_of_band_amount`.
      operationId: creditNotes_finalize
      parameters:
      - description: ID of the Credit Note object.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                out_of_band_amount:
                  type: number
                  description: Amount credited outside of Airwallex. Only applicable when the `type` is `AFTER_PAYMENT`.
                refund_amount:
                  type: number
                  description: Amount credited with refund. Only applicable when the `type` is `AFTER_PAYMENT`.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '404':
          description: 'Not Found. Possible error codes: `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 6|Finalize a Credit Note
      tags:
      - Billing > Credit Notes
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/billing/credit_notes/credit_note_id/finalize
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          out_of_band_amount: 0
          refund_amount: 100.3
