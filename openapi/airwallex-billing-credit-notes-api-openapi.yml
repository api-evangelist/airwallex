openapi: 3.2.0
info:
  title: Airwallex Billing > Credit Notes API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Billing > Credit Notes
  description: Issue a Credit Note to adjust the amount of a finalized invoice.
  x-domain: Billing
  x-resource: Credit Notes
  x-urlPath: billing/credit_notes
paths:
  /api/v1/billing/credit_notes/create:
    post:
      description: Create a Credit Note that is linked to an Invoice.
      operationId: createCreditNote
      requestBody:
        content:
          application/json:
            schema:
              required:
              - invoice_id
              - reason
              - request_id
              - type
              type: object
              properties:
                custom_reason:
                  maxLength: 500
                  minLength: 0
                  type: string
                  description: An explanation for issuing the credit note when the reason is set to `OTHER`. This field is required if reason is `OTHER` and must be omitted or null for all other reason values.
                invoice_id:
                  type: string
                  description: ID of the [Invoice](/docs/api/billing/invoices).
                memo:
                  maxLength: 500
                  minLength: 0
                  type: string
                  description: Customer-facing text that appears on the credit note PDF.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of key-value pairs that you can attach to this object for storing additional information.
                  description: A set of key-value pairs that you can attach to this object for storing additional information.
                reason:
                  pattern: ^(PRODUCT_RETURN|ORDER_CHANGE|PRODUCT_OR_SERVICE_UNSATISFACTORY|BILLING_ERROR|GOODWILL_GESTURE|OTHER)$
                  type: string
                  description: 'Reason for issuing this credit note, one of: `PRODUCT_RETURN`, `ORDER_CHANGE`, `PRODUCT_OR_SERVICE_UNSATISFACTORY`, `BILLING_ERROR`, `GOODWILL_GESTURE`, `OTHER`.'
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
                type:
                  pattern: ^(BEFORE_PAYMENT|AFTER_PAYMENT)$
                  type: string
                  description: 'The type of the credit note, one of: `BEFORE_PAYMENT`, `AFTER_PAYMENT`.'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Create a Credit Note
      tags:
      - Billing > Credit Notes
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/billing/credit_notes/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          custom_reason: Customer requested adjustment
          invoice_id: inv_hkpd49cskgblns6iimw
          memo: Credit note memo.
          metadata:
            foo: bar
          reason: PRODUCT_RETURN
          request_id: ee939540-3203-4a2c-9172-89a566485dd9
          type: BEFORE_PAYMENT
        response_body:
          adjustment_amount: 50
          billing_customer_id: bcus_hkpd7fedfgb004apkvs
          created_at: 2022-01-01T10:15:30+0000
          currency: USD
          custom_reason: Customer requested adjustment
          finalized_at: 2022-12-05T10:15:30+0000
          id: crn_hkpda1313adfadfa
          invoice_id: inv_hkpd49cskgblns6iimw
          memo: Credit note memo.
          metadata:
            foo: bar
          number: CRN-591726CD-01
          out_of_band_amount: 25
          pdf_url: https://creditnote.airwallex.com/billing/creditnotes/pdf?s=jwt_token
          reason: PRODUCT_RETURN
          refund_amount: 25
          refund_status: SUCCEEDED
          status: FINALIZED
          total_amount: 100
          total_discount_amounts:
          - amount: 10
            applied_discount_id: disc_hkpdkcmxdgazzq53jbk
          total_tax_amount: 0
          type: BEFORE_PAYMENT
          updated_at: 2022-01-01T10:15:30+0000
          voided_at: 2022-12-05T10:15:30+0000
      x-resourceLevel: org
      x-oboSupported: false
      x-scope:
      - scope: billing.credit_note:write
        group: Billing
        resource_name: Credit Notes
      x-domain: Billing
      x-resource: Credit Notes
      x-urlPath: create
      x-oauthSupported: true
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
