        name: page
        required: false
        schema:
          type: string
      - description: Number of Credit Notes to be listed per page. Defaults to 20.
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
