                owner_email:
                  type: string
                  description: Email of the purchase order owner.
                recurrence:
                  type: object
                  required:
                  - frequency
                  - iterations
                  properties:
                    frequency:
                      type: string
                      description: Frequency for recurring purchase orders.
                      enum:
                      - WEEKLY
                      - MONTHLY
                      - QUARTERLY
                      - YEARLY
                    iterations:
                      type: integer
                      format: int32
                      description: Number of occurrences for recurring purchase orders.
                  description: Defines the schedule and duration for a recurring purchase order.
                line_items:
                  type: array
                  description: List of line items in the purchase order.
                  items:
                    type: object
                    required:
                    - quantity
                    - unit_price
                    properties:
                      description:
                        type: string
                        description: Description of the line item.
                      quantity:
                        type: string
                        description: Unit quantity of the line item.
                      unit_price:
                        type: string
                        description: Unit price of the line item (tax-exclusive). Tax is applied separately based on the selected tax rate.
                      accounting_field_selections:
                        type: array
                        description: List of accounting fields selected for the line item.
                        items:
                          type: object
                          required:
                          - type
                          - source_id
                          properties:
                            type:
                              type: string
                              description: Type of accounting field selection.
                              enum:
                              - GENERAL_LEDGER_ACCOUNT
                              - TAX_CODE
                              - OTHER
                              x-enumDescriptions:
                                GENERAL_LEDGER_ACCOUNT: General ledger (GL) account assigned to the line item.
                                TAX_CODE: Tax code applied to the line item.
                                OTHER: Custom accounting field defined in your ERP.
                            source_id:
                              type: string
                              format: uuid
                              description: 'Unique identifier of the general ledger (GL) account, tax code, or accounting field value to assign to this line item. The required `id` depends on `type`: use [List General Ledger Accounts](/docs/api/accounting/general_ledger_accounts/list) for `GENERAL_LEDGER_ACCOUNT`, [List Tax Codes](/docs/api/accounting/tax_codes/list) for `TAX_CODE`, or [List Accounting Field Values](/docs/api/accounting/accounting_field_values/list) for `OTHER`.'
                          description: List of accounting fields selected for the line item.
                    description: Purchase order line item request.
                description:
                  type: string
                  description: Description of the purchase order.
                note:
                  type: string
                  description: Note for the purchase order.
                net_payment_terms_in_days:
                  type: integer
                  format: int32
                  description: Net payment terms in days.
                promise_date:
                  type: string
                  description: Date when the vendor will deliver the goods or services. This can be either ISO8601 Date or DateTime format. Dates without time are interpreted as midnight UTC.
