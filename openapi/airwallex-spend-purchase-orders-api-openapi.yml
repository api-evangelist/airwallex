          description: URL to access and download the attachment file.
        created_at:
          type: string
          description: Timestamp for when the resource was created in ISO8601 format.
      description: File attachment containing supporting documentation such as receipts, invoices, or other proof of expense. Used for compliance, audit trails, and approval workflows.
