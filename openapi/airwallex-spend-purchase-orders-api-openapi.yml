        name:
          type: string
          description: Name of the accounting field in the ERP software. This field is populated only when `type` is set to `OTHER`.
        external_id:
          type: string
          description: External unique identifier of the accounting field value in the ERP.
        value:
          type: string
          description: Name of the accounting field value in the ERP.
        value_label:
