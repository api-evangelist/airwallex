openapi: 3.2.0
info:
  title: Airwallex Spend > Purchase Orders API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Spend > Purchase Orders
  description: Manages purchase orders for tracking vendor commitments and spend. Supports creation, retrieval, listing with filters, and sync status updates for integration with external accounting systems.
  x-domain: Spend
  x-resource: Purchase Orders
  x-urlPath: spend/purchase_orders
paths:
  /api/v1/spend/purchase_orders/create:
    post:
      tags:
      - Spend > Purchase Orders
      x-stage: beta
      summary: 1|Create a Purchase Order
      description: Creates a new purchase order.
      operationId: createPurchaseOrder
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - billing_currency
              - external_id
              - legal_entity_id
              - line_items
              - purchase_order_number
              - request_id
              - sync_status
              - vendor_id
              properties:
                request_id:
                  type: string
                  description: Unique identifier for this request to ensure idempotency. To prevent accidental duplication, clients should generate a random UUID.
                external_id:
                  type: string
                  description: External identifier for this purchase order in your system.
                legal_entity_id:
                  type: string
                  description: Unique identifier of the legal entity associated with the purchase order.
                vendor_id:
                  type: string
                  format: uuid
                  description: Unique identifier of the vendor associated with the purchase order.
                purchase_order_number:
                  type: string
                  description: Unique reference number for the purchase order.
                sync_status:
                  type: string
                  description: Sync status for an accounting system.
                  enum:
                  - NOT_SYNCED
                  - SYNCED
                  - SYNC_FAILED
                billing_currency:
                  type: string
                  description: Currency code for the purchase order.
