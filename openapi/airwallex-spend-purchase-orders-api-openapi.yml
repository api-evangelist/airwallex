        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: The number of items returned per page, between 1 and 100. The default is 100.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: from_created_at
        in: query
        description: Filter by purchase orders created after this timestamp (inclusive) in ISO8601 format. If not specified, defaults to last 30 days from `to_created_at`.
        required: false
        schema:
          type: string
      - name: to_created_at
        in: query
        description: Filter by purchase orders created before this timestamp (exclusive) in ISO8601 format. If not specified, defaults to now.
        required: false
        schema:
          type: string
      - name: from_updated_at
        in: query
        description: Filter by purchase orders updated after this timestamp (inclusive) in ISO8601 format.
        required: false
        schema:
          type: string
      - name: to_updated_at
        in: query
