  /api/v1/audit_log/security_audit_logs:
    get:
      tags:
      - Security > Activity Log
      summary: 1|Security Audit Logs
      x-stage: early_access
      description: 'Use this endpoint to get a list of security audit logs of the login account.


        Security audit logs includes activity related to: User management actions, User login actions, API key actions, 2FA actions, Login credential changes.'
      operationId: listSecurityAuditLogs
      x-oboSupported: false
      parameters:
      - name: end_event_time
        in: query
        description: The end date the audit log event time in ISO8601 format (exclusive), if not provided, default to from_event_time plus 180 days.
        required: false
        schema:
          type: string
      - name: from_event_time
        in: query
        description: The start date of the audit log event time in ISO8601 format (inclusive), default and earliest value 2024-02-06T00:00:00+0800.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Page bookmark.
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Page size, default 100 if not provided, valid value 1-2000.
        required: false
        schema:
          type: integer
          format: int32
          default: 100
