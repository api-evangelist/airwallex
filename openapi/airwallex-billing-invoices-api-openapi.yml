openapi: 3.2.0
info:
  title: Airwallex Billing > Invoices API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Billing > Invoices
  description: An Invoice represents an official request for payment that details products or services purchased, pricing and payment instructions. It can be issued directly (one-time invoices) or via a Subscription (recurring invoices).
  x-domain: Billing
  x-resource: Invoices
  x-urlPath: billing/invoices
paths:
  /api/v1/billing/invoices/create:
    post:
      description: Creates a one-off Invoice.
      operationId: createInvoice
      requestBody:
        content:
          application/json:
            schema:
              required:
              - billing_customer_id
              - currency
              - request_id
              type: object
              properties:
                billing_customer_id:
                  type: string
                  description: ID of the [Billing Customer](/docs/api/billing/billing_customers) who will be charged.
                collection_method:
                  pattern: ^(CHARGE_ON_CHECKOUT|OUT_OF_BAND|AUTO_CHARGE)$
                  type: string
                  description: Specify how payment is collected, one of `AUTO_CHARGE`, `CHARGE_ON_CHECKOUT` or `OUT_OF_BAND`.
                currency:
                  type: string
                  description: The currency of the Invoice in 3-letter ISO-4217 format.
                days_until_due:
                  type: integer
                  description: Number of days from invoice finalization until payment is due. Only one of `days_until_due` and `due_at` should be passed.
                  format: int32
                default_tax_percent:
                  maximum: 100
                  minimum: 0
                  type: number
                  description: The tax percent between `0` and `100` to be applied to each Line Item's price. The tax will be exclusive. Defaults to `0`.
                discounts:
                  maxItems: 1
                  minItems: 0
                  type: array
                  description: List of discounts to be applied to the invoice. Invoice line item discounts are applied before invoice discounts. Currently, only one element is supported.
                  items:
                    required:
                    - coupon
                    - type
                    type: object
                    properties:
                      coupon:
                        required:
                        - id
                        type: object
                        description: Coupon to redeem into a discount for this resource. Only required when `type` = `COUPON`.
                        properties:
                          id:
                            type: string
                            description: Id of the Coupon object.
                      type:
                        pattern: ^(COUPON)$
                        type: string
                        description: 'Specifies how to obtain the discount. One of: `COUPON`.'
                due_at:
                  type: string
                  description: Due date set by the merchant for this invoice, if any. Only one of `days_until_due` and `due_at` should be passed.
                enable_automatic_tax:
                  type: boolean
                  description: Whether automatic tax is enabled for this invoice. When enabled, the system attempts to calculate taxes automatically. Defaults to `false`.
                footer:
                  type: string
                  description: Additional payment instructions or supplementary information that merchants can share with their customers. Displayed in the Invoice PDF.
                legal_entity_id:
                  type: string
                  description: ID of the legal entity to be used as billing entity. You can find this ID in the Airwallex web app > Settings. Required if you have more than 1 entity in your organisation.
                linked_payment_account_id:
                  type: string
                  description: ID of the linked payment account to collect payment. You can find this ID in the Airwallex web app > Settings > Account details, within the Account Information section. If `collection_method` is `CHARGE_ON_CHECKOUT` and your organisation has only one payment account, it will be automatically populated with that account by default.
                memo:
                  maxLength: 500
                  minLength: 0
                  type: string
                  description: String used for merchants to share a custom message to their customers. Referenced as memo or invoice note in Webapp.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of string key-value pairs that you can attach to this object for storing additional information.
                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                number:
                  type: string
                  description: Unique invoice number specified by the merchant. If omitted, Airwallex generates one automatically.
                payment_options:
                  type: object
                  description: Payment settings of this Invoice. Only applicable if collection_method is `CHARGE_ON_CHECKOUT`.
                  properties:
                    payment_method_save:
                      type: object
                      description: Settings for saving this payment method for future use.
                      properties:
                        mode:
                          type: string
                          description: "Controls whether the payment method can be saved for future use. Possible values: `ENABLED`, `DISABLED`, or `COLLECT_CONSENT`.  \n`ENABLED`: The payment method will be saved for future use.  \n`DISABLED`: The payment method will not be saved.  \n`COLLECT_CONSENT`: The digital invoice UI asks the customer whether they want to save the payment method. Only applicable to cards."
                        next_triggered_by:
                          type: string
                          description: "Indicates who will use the saved payment source to trigger future payments. One of `MERCHANT` or `CUSTOMER`.  \nIf `MERCHANT`, a Payment Source is created for future use. If `CUSTOMER`, the payment method is saved only with the payment provider."
                    payment_method_types:
                      type: array
                      description: "Specify which payment methods to display on the digital invoice page and set their display order. Only methods supported for the specified currency and the customer's country code will appear on the digital invoice page.  \nPossible enum values: `afterpay`, `airwallex_pay`, `alfamart`, `alipaycn`, `alipayhk`, `applepay`, `atome`, `au_pay`, `axs_kiosk`, `bancontact`, `bank_transfer`, `bigc`,`bitpay`, `bkash`, `blik`, `boost`, `card`, `cash_app_pay`, `dana`, `doku_ewallet`, `dragonpay`, `duit_now`, `d_barai`, `enets`, `eps`, `esun`, `family_mart`, `fps`, `fpx`, `gcash`, `giropay`, `googlepay`, `go_pay`, `grabpay`, `hi_life`, `ideal`, `indomaret`, `jenius_pay`, `kakaopay`, `klarna`, `konbini`, `korean_local_card`, `laybuy`, `line_pay`, `linkaja`, `maxima`, `merpay`, `multibanco`, `mybank`, `narvesen`, `naver_pay`, `online_banking`, `ovo`, `p24`, `paybybankapp`, `payco`, `payeasy`, `payeasy_atm`, `payme`, `paypal`, `paypay`, `paypost`, `paysafecard`, `paysafecash`, `paysera`, `payu`, `pay_now`, `perlas_terminals`, `permatanet`, `permata_atm`, `pix`, `poli`, `prompt_pay`, `rabbit_line_pay`, `rakuten_pay`, `safetypay`, `samsung_pay`, `sam_kiosk`, `satispay`, `seven_eleven`, `shopee_pay`, `skrill`, `sofort`, `spei`, `tesco_lotus`, `tng`, `toss_pay`, `truemoney`, `trustly`, `twint`, `upi`, `venmo`, `verkkopankki`, `wechatpay`, `zip`."
                      items:
                        type: string
                        description: "Specify which payment methods to display on the digital invoice page and set their display order. Only methods supported for the specified currency and the customer's country code will appear on the digital invoice page.  \nPossible enum values: `afterpay`, `airwallex_pay`, `alfamart`, `alipaycn`, `alipayhk`, `applepay`, `atome`, `au_pay`, `axs_kiosk`, `bancontact`, `bank_transfer`, `bigc`,`bitpay`, `bkash`, `blik`, `boost`, `card`, `cash_app_pay`, `dana`, `doku_ewallet`, `dragonpay`, `duit_now`, `d_barai`, `enets`, `eps`, `esun`, `family_mart`, `fps`, `fpx`, `gcash`, `giropay`, `googlepay`, `go_pay`, `grabpay`, `hi_life`, `ideal`, `indomaret`, `jenius_pay`, `kakaopay`, `klarna`, `konbini`, `korean_local_card`, `laybuy`, `line_pay`, `linkaja`, `maxima`, `merpay`, `multibanco`, `mybank`, `narvesen`, `naver_pay`, `online_banking`, `ovo`, `p24`, `paybybankapp`, `payco`, `payeasy`, `payeasy_atm`, `payme`, `paypal`, `paypay`, `paypost`, `paysafecard`, `paysafecash`, `paysera`, `payu`, `pay_now`, `perlas_terminals`, `permatanet`, `permata_atm`, `pix`, `poli`, `prompt_pay`, `rabbit_line_pay`, `rakuten_pay`, `safetypay`, `samsung_pay`, `sam_kiosk`, `satispay`, `seven_eleven`, `shopee_pay`, `skrill`, `sofort`, `spei`, `tesco_lotus`, `tng`, `toss_pay`, `truemoney`, `trustly`, `twint`, `upi`, `venmo`, `verkkopankki`, `wechatpay`, `zip`."
                payment_source_id:
                  type: string
                  description: "ID of the [Payment Source](/docs/api/billing/payment_sources) to pay for the invoice. Required when `collection_method` is `AUTO_CHARGE`.  \nIf `collection_method` is `CHARGE_ON_CHECKOUT`, a Payment Source is automatically created during invoice payment when `payment_options.payment_method_save.next_triggered_by` is `MERCHANT` and `payment_options.payment_method_save.mode` is `ENABLED`, or when it is `COLLECT_CONSENT` and the customer has given consent."
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
                ui_options:
                  type: object
                  description: UI configuration for the digital invoice page.
                  properties:
                    theme_id:
                      type: string
                      description: ID of the theme to apply to this invoice, overriding the theme configured for its legal entity. You can find the theme ID in the Airwallex web app under Settings > Themes.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Create an Invoice
      tags:
      - Billing > Invoices
      x-examples:
