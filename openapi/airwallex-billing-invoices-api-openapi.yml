          type: string
          description: ID of the [Billing Customer](/docs/api/billing/billing_customers) who this Invoice is issued to.
        collection_method:
          type: string
          description: Specify how payment is collected, one of `AUTO_CHARGE`, `CHARGE_ON_CHECKOUT` or `OUT_OF_BAND`.
        created_at:
          type: string
