            id: inv_hkpd49cskgblns6iimw
            last_payment_attempt_at: 2022-12-05T10:15:30+0000
            legal_entity_id: le_ib2DZgZJN72T7bObvNuMYQ
            linked_payment_account_id: acct_ncI2nypPKSq2VXKxscAcg
            memo: Invoice memo.
