components:
  schemas:
    InvoicePaymentMethodSave:
      type: object
      properties:
        mode:
          type: string
          description: "Controls whether the payment method can be saved for future use. Possible values: `ENABLED`, `DISABLED`, or `COLLECT_CONSENT`.  \n`ENABLED`: The payment method will be saved for future use.  \n`DISABLED`: The payment method will not be saved.  \n`COLLECT_CONSENT`: The digital invoice UI asks the customer whether they want to save the payment method."
        next_triggered_by:
          type: string
          description: "Indicates who will use the saved payment source to trigger future payments. One of `MERCHANT` or `CUSTOMER`.  \nIf `MERCHANT`, a Payment Source is created for future use. If `CUSTOMER`, the payment method is saved only with the payment provider."
      description: Settings for saving this payment method for future use.
    CursorPaginationClientApiResponseInvoiceItem:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/InvoiceItem'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    InvoiceDeleted:
      required:
      - deleted
      - id
      type: object
      properties:
        deleted:
          type: boolean
          description: Indicates whether the delete command was executed successfully.
        id:
          type: string
          description: ID of the Invoice object.
    PriceLot:
      required:
      - rounding_mode
      - size
      type: object
      properties:
        rounding_mode:
          pattern: ^UP$
          type: string
          description: Specifies how to round the calculated lots when the total quantity is not an exact multiple of the size. One of `UP`.
        size:
          minimum: 2
          type: integer
          description: The amount of quantity that constitutes a single billable lot.
          format: int32
      description: Defines how quantity is grouped into billable lots. The unit_amount is then applied per lot. If not set, quantity is treated as the number of billable lots. Only applicable for `PER_UNIT` price.
    Invoice:
      required:
      - amount_due
