          description: Payment settings of this Invoice. Only applicable if collection_method is `CHARGE_ON_CHECKOUT`.
        payment_source_id:
          type: string
          description: "ID of the [Payment Source](/docs/api/billing/payment_sources) to pay for the invoice.  \nIf `collection_method` is `CHARGE_ON_CHECKOUT`, a Payment Source is automatically created during invoice payment when `payment_options.payment_method_save.next_triggered_by` is `MERCHANT` and `payment_options.payment_method_save.mode` is `ENABLED`, or when it is `COLLECT_CONSENT` and the customer has given consent."
        payment_status:
          type: string
