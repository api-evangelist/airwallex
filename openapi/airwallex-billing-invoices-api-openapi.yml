  /api/v1/billing/invoices/{id}/update:
    post:
      description: Updates a draft Invoice. Only fields provided in the request are updated, while omitted fields remain unchanged. Array fields are fully replaced if included. Set a field to null or an empty string (for strings) to clear its value.
      operationId: updateInvoice
      parameters:
      - description: ID of the Invoice object.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                billing_customer_id:
                  type: string
                  description: ID of the [Billing Customer](/docs/api/billing/billing_customers) who this Invoice is to be issued to.
                collection_method:
                  pattern: ^(CHARGE_ON_CHECKOUT|OUT_OF_BAND|AUTO_CHARGE)$
                  type: string
                  description: Specify how payment is collected, one of `AUTO_CHARGE`, `CHARGE_ON_CHECKOUT` or `OUT_OF_BAND`.
                currency:
                  type: string
                  description: The currency of the Invoice in 3-letter ISO-4217 format.
                days_until_due:
                  type: integer
                  description: Number of days from invoice finalization until payment is due. Only one of `days_until_due` and `due_at` should be passed.
                  format: int32
                default_tax_percent:
                  maximum: 100
                  minimum: 0
                  type: number
                  description: The tax percent between `0` and `100` to be applied to each Line Item's price. The tax will be exclusive.
                discounts:
                  type: array
                  description: Desired set of invoice-level discounts. If provided, replaces all existing discounts. Currently, only one element is supported.
                  items:
                    required:
                    - coupon
                    type: object
                    properties:
                      coupon:
                        required:
                        - id
                        type: object
                        description: Coupon to redeem into a discount for this resource. Only required when `type` = `COUPON`.
                        properties:
                          id:
                            type: string
                            description: Id of the Coupon object.
                      type:
                        pattern: ^(COUPON)$
                        type: string
                        description: 'Specifies how to obtain a new discount. One of: `COUPON`.'
                due_at:
                  type: string
                  description: Due date set by the merchant for this invoice, if any. Only one of `days_until_due` and `due_at` should be passed.
                enable_automatic_tax:
                  type: boolean
                  description: Whether automatic tax is enabled for this invoice. When enabled, the system attempts to calculate taxes automatically.
                footer:
                  type: string
                  description: Additional payment instructions or supplementary information that merchants can share with their customers. Displayed in the Invoice PDF.
                legal_entity_id:
                  type: string
                  description: ID of the legal entity to be used as billing entity. You can find this ID in the Airwallex web app > Settings.
                linked_payment_account_id:
                  type: string
                  description: ID of the linked payment account to collect payment. You can find this ID in the Airwallex web app > Settings > Account details, within the Account Information section. Required if `collection_method` is `CHARGE_ON_CHECKOUT` when the invoice is finalized.
                memo:
                  type: string
                  description: String used to describe the object. Referenced as memo or invoice note in Webapp.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of key-value pairs that you can attach to an invoice object. It can be useful for storing additional information about the invoice in a structured format.
                  description: A set of key-value pairs that you can attach to an invoice object. It can be useful for storing additional information about the invoice in a structured format.
                payment_options:
                  type: object
                  description: Payment settings of this Invoice. Only applicable if collection_method is `CHARGE_ON_CHECKOUT`.
                  properties:
                    payment_method_save:
                      type: object
                      description: Settings for saving this payment method for future use.
                      properties:
                        mode:
                          type: string
                          description: "Controls whether the payment method can be saved for future use. Possible values: `ENABLED`, `DISABLED`, or `COLLECT_CONSENT`.  \n`ENABLED`: The payment method will be saved for future use.  \n`DISABLED`: The payment method will not be saved.  \n`COLLECT_CONSENT`: The digital invoice UI asks the customer whether they want to save the payment method. Only applicable to cards."
