  /api/v1/billing/invoices:
    get:
      description: Retrieves a list of Invoices based on the query parameters.
      operationId: listInvoices
      parameters:
      - description: ID of the [Billing Customer](/docs/api/billing/billing_customers) who the invoice is addressed to.
        in: query
        name: billing_customer_id
        required: false
        schema:
          type: string
      - description: ID of the [Subscription](/docs/api/billing/subscriptions) which generated this invoice, if any.
        in: query
        name: subscription_id
        required: false
        schema:
          type: string
      - description: Status of the invoice. Once the invoice is created, it will be defaulted to `DRAFT`, and once the invoice is finalized, it will turn to `FINALIZED`. When an invoice is voided, it will become `VOIDED`.
        in: query
        name: status
        required: false
        schema:
          type: string
      - description: Status of the payment for the invoice, one of `UNPAID` and `PAID`.
        in: query
        name: payment_status
        required: false
        schema:
          type: string
      - description: The start date of `created_at` in ISO8601 format (inclusive).
        in: query
        name: from_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The end date of `created_at` in ISO8601 format (exclusive).
        in: query
        name: to_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not `null`) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not `null`) from the response to a subsequent call.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: Number of Invoices per page. Defaults to `20`.
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginationClientApiResponseInvoice'
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 3|List all Invoices
