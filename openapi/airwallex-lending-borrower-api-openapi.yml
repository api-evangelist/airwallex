  /api/v1/lending/lenders/{lender_id}/borrowers/{borrower_id}/update:
    post:
      tags:
      - Lending > Borrower
      x-stage: beta
      summary: 4|Update Borrower Settings
      description: Updated the settings for the specified borrower that is connected to the specified lender by a lender-borrower relationship. Settings that do not need to be updated can be omitted.
      operationId: updateBorrower
      x-oboSupported: false
      parameters:
      - name: borrower_id
        in: path
        description: Borrower unique identifier.
        required: true
        schema:
          type: string
      - name: lender_id
        in: path
        description: Lender unique identifier.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                credit:
                  type: object
                  required:
                  - borrower_settings
                  description: Request structure specific to updating credit borrowers (required when updating credit borrower).
                  properties:
                    borrower_settings:
                      type: object
                      description: Credit settings.
                      properties:
