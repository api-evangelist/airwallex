components:
  schemas:
    CoreBankingGetBorrowersListResponseRes:
      type: object
      properties:
        hasMore:
          type: boolean
          description: A flag which identifies whether there are more results.
        items:
          type: array
          description: List items.
          items:
            $ref: '#/components/schemas/CoreBankingBorrowerRes'
    CoreBankingBorrowerCreditSettings:
      type: object
      properties:
        activation_status:
          type: string
          description: Enable/Disable credit.
          enum:
          - ACTIVE
          - INACTIVE
        credit_limits:
          type: array
          description: Credit limits by currency.
          items:
            $ref: '#/components/schemas/CoreBankingCreditLimit'
      description: Credit settings for borrower.
    CoreBankingBorrowerRes:
      type: object
      properties:
        account_id:
          type: string
          description: Airwallex account unique identifier of the borrower.
        balances:
          type: array
          description: Balances of borrower's account.
          items:
            $ref: '#/components/schemas/CoreBankingBorrowerBalances'
        borrower_type:
          type: string
          description: Borrower type.
          enum:
          - CREDIT
        credit:
          $ref: '#/components/schemas/CoreBankingBorrowerCreditDetails'
          description: Detail structure specific to credit borrowers (omitted when borrower_type is not credit).
        id:
          type: string
          description: Borrower unique identifier.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    CoreBankingBorrowerBalances:
      type: object
      properties:
        available_amount:
          type: number
          description: Available balance for standard deposit transactions.
        available_credit:
          type: number
          description: Amount of credit still available before limit is exceeded, null for borrowers that are not credit borrowers.
        currency:
          type: string
          description: Balance currency.
        reserved_amount:
          type: number
          description: Amount reserved for use in future transactions.
        utilized_credit:
          type: number
          description: Amount currently used in credit, null for borrowers that are not credit borrowers.
    CoreBankingCreditLimit:
      type: object
      properties:
        currency:
          type: string
          description: Credit limit currency.
        limit:
          type: number
          description: Credit limit.
    CoreBankingBorrowerCreditDetails:
      type: object
      properties:
        borrower_settings:
          $ref: '#/components/schemas/CoreBankingBorrowerCreditSettings'
          description: Credit settings for borrower.
      description: Detail structure specific to credit borrowers (omitted when borrower_type is not credit).
