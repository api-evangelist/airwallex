  /api/v1/issuing/transaction_disputes/{id}/update:
    post:
      tags:
      - Issuing > Transaction Disputes
      summary: 4|Update a Transaction Dispute
      description: A dispute that has been created can be updated via this API. In the DRAFT status, all the fields in the dispute can be updated. Once a dispute is submitted, only new evidence or explanation can be added to the dispute.
      operationId: updateTransactionDispute
      parameters:
      - name: id
        in: path
        description: The unique identifier for this dispute.
        required: true
        schema:
          type: string
          format: uuid
          default: 6c2dc266-09ad-4235-b61a-767c7cd6d6e0
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                additional_info:
                  type: object
                  description: Additional information related to the dispute, such as relevant dates.
                  properties:
                    actual_delivery_date:
                      type: string
                      description: The date on which the cardholder actually received the goods or service. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_NOT_AS_DESCRIBED or GOODS_DAMAGED.
                    attempted_return_date:
                      type: string
                      description: The date on which the cardholder attempted to return the goods or service. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_NOT_AS_DESCRIBED or GOODS_DAMAGED.
                    card_charge_permission_withdrawn_date:
                      type: string
                      description: The date on which the cardholder withdrew permission for the card charge (e.g. cancelled a subscription or recurring payment). Strongly recommended to set this field when dispute reason is RECURRING_CANCELED.
                    expected_delivery_date:
                      type: string
                      description: The date by which the cardholder expected to receive the goods or service. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_NOT_RECEIVED or GOODS_SERVICE_CANCELED.
                    order_cancellation_date:
                      type: string
                      description: The date on which the goods, service, or reservation was cancelled. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_CANCELED.
                    returned_date:
                      type: string
                      description: The date on which the cardholder returned the goods or service. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_NOT_AS_DESCRIBED or GOODS_DAMAGED.
                amount:
                  type: number
                  description: The disputed amount. This value can be updated only when dispute status = DRAFT. Once a dispute is submitted, this cannot be updated.
                evidence_files:
                  type: array
                  description: A list of file id that contains the evidence for the dispute. The file id can be retrieved after uploading the supporting document via [POST Upload a file](/docs/api/supporting_services/file_service/upload_files).
                  items:
                    type: string
                notes:
                  type: string
                  description: The explanation on why the cardholder is disputing the transaction can be provided here.
                reason:
                  type: string
                  description: The reason for raising the dispute. This value can be updated only when dispute status = DRAFT. Once a dispute is submitted, this cannot be updated.
                  enum:
                  - SUSPECTED_FRAUD
                  - UNAUTHORIZED_TRANSACTION
                  - DUPLICATED_TRANSACTION
                  - PAID_BY_OTHER_MEANS
                  - GOODS_SERVICE_NOT_AS_DESCRIBED
                  - GOODS_DAMAGED
                  - GOODS_SERVICE_NOT_RECEIVED
                  - REFUND_UNPROCESSED
                  - GOODS_SERVICE_CANCELED
                  - RECURRING_CANCELED
                  - OTHER
                request_id:
                  type: string
                  format: uuid
                  description: A unique request identifier specified by the client. Requests with the same request_id will be ignored. This allows requests to be replayed if the client is unsure of the outcome, e.g. due to network issues, system failures, etc.
        description: request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonPciTransactionDispute'
        '400':
          description: '["field_required"

            ,"bad_request"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
