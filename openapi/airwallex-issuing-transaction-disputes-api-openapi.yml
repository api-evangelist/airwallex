openapi: 3.2.0
info:
  title: Airwallex Issuing > Transaction Disputes API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Issuing > Transaction Disputes
  description: You can create a dispute for a card transaction. You can also update/submit/cancel it.
  x-domain: Issuing
  x-resource: Transaction Disputes
  x-urlPath: issuing/transaction_disputes
paths:
  /api/v1/issuing/transaction_disputes/create:
    post:
      tags:
      - Issuing > Transaction Disputes
      summary: 1|Create a Transaction Dispute
      description: Creates a dispute for a card transaction in a draft status. The dispute can be updated multiple times before submission to Airwallex for assessment. The transaction dispute object is the resource of a card transaction dispute raised to Airwallex.It contains all the information related to a dispute such as amount, status and update history.
      operationId: createTransactionDispute
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - card_transaction_event_id
              properties:
                additional_info:
                  type: object
                  description: Additional information for the dispute.
                  properties:
                    actual_delivery_date:
                      type: string
                      description: The date on which the cardholder actually received the goods or service. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_NOT_AS_DESCRIBED or GOODS_DAMAGED.
                    attempted_return_date:
                      type: string
                      description: The date on which the cardholder attempted to return the goods or service. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_NOT_AS_DESCRIBED or GOODS_DAMAGED.
                    card_charge_permission_withdrawn_date:
                      type: string
                      description: The date on which the cardholder withdrew permission for the card charge (e.g. cancelled a subscription or recurring payment). Strongly recommended to set this field when dispute reason is RECURRING_CANCELED.
                    expected_delivery_date:
                      type: string
                      description: The date by which the cardholder expected to receive the goods or service. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_NOT_RECEIVED or GOODS_SERVICE_CANCELED.
                    order_cancellation_date:
                      type: string
                      description: The date on which the goods, service, or reservation was cancelled. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_CANCELED.
                    returned_date:
                      type: string
                      description: The date on which the cardholder returned the goods or service. Strongly recommended to set this field when dispute reason is GOODS_SERVICE_NOT_AS_DESCRIBED or GOODS_DAMAGED.
                amount:
                  type: number
                  description: 'The amount to be disputed. If not specified, the dispute will take the billing amount as the dispute amount. If specified, the specified amount is used as the dispute amount for partial dispute. The specified amount cannot be larger than the billing amount. Note: The dispute currency is always in the billing currency of the transaction.'
                card_transaction_event_id:
                  type: string
                  format: uuid
                  description: The unique identifier for the card transaction event to be disputed.
                evidence_files:
                  type: array
                  description: A list of file id that contains the evidence for the dispute. The file id can be retrieved after uploading the supporting document via [POST Upload a file](/docs/api/supporting_services/file_service/upload_files).
                  items:
                    type: string
                notes:
                  type: string
                  description: The explanation on why the cardholder is disputing the transaction can be provided here.
                reason:
                  type: string
                  description: 'The reason for raising the dispute. It can be one of: `SUSPECTED_FRAUD`, `UNAUTHORIZED_TRANSACTION`, `DUPLICATED_TRANSACTION`, `PAID_BY_OTHER_MEANS`, `GOODS_SERVICE_NOT_AS_DESCRIBED`, `GOODS_DAMAGED`, `GOODS_SERVICE_NOT_RECEVIED`, `REFUND_UNPROCESSED`, `GOODS_SERVICE_CANCELED`, `RECURRING_CANCELED`, `OTHER`. Learn more about the [dispute reasons](/docs/issuing/transactions/handle-transaction-disputes#dispute-reasons).'
                  enum:
                  - SUSPECTED_FRAUD
                  - UNAUTHORIZED_TRANSACTION
                  - DUPLICATED_TRANSACTION
                  - PAID_BY_OTHER_MEANS
                  - GOODS_SERVICE_NOT_AS_DESCRIBED
                  - GOODS_DAMAGED
                  - GOODS_SERVICE_NOT_RECEIVED
                  - REFUND_UNPROCESSED
                  - GOODS_SERVICE_CANCELED
                  - RECURRING_CANCELED
                  - OTHER
                reference:
                  type: string
                  description: A value can be added for your internal reference. Maximum 20 characters.
        description: request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonPciTransactionDispute'
        '400':
          description: '["field_required"

            ,"bad_request"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
