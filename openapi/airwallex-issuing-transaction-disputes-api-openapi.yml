      summary: 3|List all Transaction Disputes
      description: Retrieve all transaction disputes. Filter for results using the parameters available.
      operationId: listTransactionDisputes
      parameters:
      - name: card_transaction_event_id
        in: query
        description: The unique identifier for the disputed card transaction event.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: card_transaction_id
        in: query
        description: The unique identifier for the disputed card transaction.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: detailed_status
        in: query
        description: The detailed status of the dispute life cycle between Airwallex and the card scheme.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - DISPUTE_FILED
          - PRE_ARB_RECEIVED
          - PRE_ARB_DECLINED_BY_ISSUER
          - ARBITRATION_RECEIVED
          - DISPUTE_DECLINED
          - PRE_ARB_DELIVERED
          - PRE_ARB_DECLINED_BY_ACQUIRER
          - ARB_DELIVERED
          - WON
          - LOST
      - name: from_created_at
        in: query
        description: The minimum created_at, in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
      - name: from_updated_at
        in: query
        description: The minimum updated_at, in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        description: Page bookmark to specify the position of page start.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: '0'
      - name: page_size
        in: query
        description: Number of dispute per page.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: reason
        in: query
        description: The reason for raising the dispute. Learn more about the [dispute reasons](/docs/issuing/transactions/handle-transaction-disputes#dispute-reasons).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - SUSPECTED_FRAUD
          - UNAUTHORIZED_TRANSACTION
          - DUPLICATED_TRANSACTION
          - PAID_BY_OTHER_MEANS
          - GOODS_SERVICE_NOT_AS_DESCRIBED
          - GOODS_DAMAGED
          - GOODS_SERVICE_NOT_RECEIVED
          - REFUND_UNPROCESSED
          - GOODS_SERVICE_CANCELED
          - RECURRING_CANCELED
          - OTHER
      - name: reference
        in: query
        description: A value added for your internal reference.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: status
        in: query
        description: The latest status of the dispute. Learn more about the [dispute statuses](/docs/issuing/transactions/handle-transaction-disputes/dispute-statuses).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - DRAFT
          - EXPIRED
          - SUBMITTED
          - REJECTED
          - CANCELED
          - IN_PROGRESS
          - WON
          - LOST
      - name: to_created_at
