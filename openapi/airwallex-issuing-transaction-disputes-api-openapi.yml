        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
      - name: updated_by
        in: query
        description: The party who updated the dispute.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - CUSTOMER
          - AIRWALLEX
