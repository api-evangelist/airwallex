paths:
  /api/v1/accounting/gl_accounts/create:
    post:
      tags:
      - Accounting > General Ledger Accounts
      summary: 1|Create a General Ledger Account
      description: Creates a new General Ledger (GL) account for coding Airwallex Spend transactions.
      operationId: createGLAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              - value
              properties:
                request_id:
                  type: string
                  description: Unique identifier for this request to ensure idempotency. Generate a random UUID to prevent accidental duplication.
                code:
                  type: string
                  description: General ledger account code.
                value:
                  type: string
                  description: General ledger account name.
                value_label:
                  type: string
                  description: Airwallex display name for the general ledger account.
                external_id:
                  type: string
                  description: External ID from the accounting system.
                legal_entity_ids:
                  type: array
                  description: Legal entity IDs to which this general ledger account applies. Omit this field when it applies to all legal entities.
                  items:
                    type: string
      responses:
        '201':
          description: General ledger account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GLAccount'
        '400':
          description: Invalid request.
        '500':
          description: Internal server error.
