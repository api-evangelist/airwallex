openapi: 3.2.0
info:
  title: Airwallex Payouts > Transfers API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payouts > Transfers
  description: A transfer resource is created when you send funds to a beneficiary, it details the beneficiary, bank details, the amount being paid, its status and other relevant information. You can also create the transfer by using the beneficiary unique identifier which was previously created using Beneficiary resource.
  x-domain: Payouts
  x-resource: Transfers
  x-urlPath: payouts/transfers
paths:
  /api/v1/transfers/create:
    post:
      tags:
      - Payouts > Transfers
      summary: 1|Create a Transfer
      description: 'Create a new transfer to a beneficiary. The transfer can either include an underlying conversion when the transfer currency varies from the source currency, or will not include a conversion when the transfer currency and source currency match.


        We have created a dynamic schema that will return required fields based on some key criteria that we need to determine the destination of the transfer and the route it will take to reach that destination.


        **Transfer Fee**


        By default, payer is responsible for the transfer fee but may be passed onto the beneficiary by setting `fee_paid_by` to `BENEFICIARY`. The `fee_paid_by` flag affects the total amount the payer has to pay, and the amount the beneficiary receives.


        The fee component is calculated by the system and is communicated back via `fee_currency` and `fee_amount` in the API response. The actual amounts both parties pay and receive are represented by `amount_payer_pays` and `amount_beneficiary_receives` respectively.


        **Approvals**


        Creating a transfer to be submitted for approval is available upon request. When a transfer including a conversion is submitted for approval, values for `amount_beneficiary_receives`, `amount_payer_pays`, `fee_amount`, `transfer_amount` and `source_amount` in the response are tentative based on the exchange rate at the time of creation until the transfer status changes to `SCHEDULED`, at which point the exchange rate is confirmed. When the transfer status transitions to `SCHEDULED`, if the `transfer_date` is a past date, its value will get updated.'
      operationId: createTransfer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              - reference
              - request_id
              - transfer_currency
              properties:
                application_fee_options:
                  type: array
                  description: The application fee options applied to the transfer.
                  items:
                    type: object
                    properties:
                      amount:
                        type: string
                        description: A positive integer specifying the amount of the fee expressed in the smallest unit of the currency. e.g. cents for USD. This field is required only when type is FIXED.
                      currency:
                        type: string
                        description: "Specify the currency of the application fee in ISO 4217 currency code format, e.g., USD, AUD. This field is required when the type is FIXED.  \nWhen the type is PERCENTAGE and source_type is CONVERSION, the currency for the conversion if specified must be from the currency pair. If the currency is unspecified, the contra currency of the quote will be used."
                      metadata:
                        type: object
                        description: The metadata of the application fee. The value should be set in key:value format. (e.g., id:1).
                        additionalProperties:
                          type: string
                      percentage:
                        type: string
                        description: "Required if the type is PERCENTAGE, and the value to be provided depends on the transaction context.  \nFX Conversions: The value acts as a markup on the FX rate, increasing the conversion cost by the specified percentage.  \nOthers: The value represents a direct fee calculated as a percentage of the transaction amount."
                      source_type:
                        type: string
                        description: Specify type of the source transaction.
                        enum:
                        - CONVERSION
                        - TRANSFER
                      type:
                        type: string
                        description: Define the type of fee calculation. If the `source_type` is `CONVERSION`, then the type must be `PERCENTAGE`.
                        enum:
                        - FIXED
                        - PERCENTAGE
                beneficiary:
                  type: object
                  description: Details for the beneficiary in the transfer request. If beneficiary_id provided in the transfer request then beneficiary should be empty.
                  properties:
                    additional_info:
                      type: object
                      description: Additional information about the beneficiary.
                      properties:
                        business_area:
                          type: string
                          description: Category of business activity.
                        business_phone_number:
                          type: string
                          description: Business phone number.
                        business_registration_number:
                          type: string
                          description: Business registration number.
                        external_identifier:
                          type: string
                          description: The identifier that you use to identify a beneficiary, usually a unique identifier. This field can be used to link transfers or beneficiaries to other records such as tax form details for filing purposes.
                        legal_rep_bank_account_number:
                          type: string
                          description: Legal representative's personal bank account number used for declaration purposes. No funds will be sent to this account number.
                        legal_rep_first_name_in_chinese:
                          type: string
                          description: Legal representative first name in chinese.
                        legal_rep_id_number:
                          type: string
                          description: Legal representative id number.
                        legal_rep_last_name_in_chinese:
                          type: string
                          description: Legal representative last name in chinese.
                        legal_rep_mobile_number:
                          type: string
                          description: Legal representative’s mobile number associated with their bank account.
                        personal_email:
                          type: string
                          description: Personal email.
                        personal_first_name_in_chinese:
                          type: string
                          description: Beneficiary's first name in Chinese.
                        personal_id_number:
                          type: string
                          description: Personal unique identifier number.
                        personal_id_type:
                          type: string
                          description: Personal unique identifier type.
                        personal_last_name_in_chinese:
                          type: string
                          description: Beneficiary's last name in Chinese.
                        personal_mobile_number:
                          type: string
                          description: Personal mobile number.
                        recipient_account_id:
                          type: string
                          description: Account unique identifier of the recipient account used for payout processing. The account must be active and have `customer_agreements.terms_and_conditions.service_agreement_type` set to `RECIPIENT` (verify via [Retrieve account details API](/docs/api/scale/accounts/detail)).
                        security_question:
                          type: string
                          description: Security question. Required when the email address is not registered with Interac e-Transfer autodeposit.
                        security_question_answer:
                          type: string
                          description: Security question answer. Required when the email address is not registered with Interac e-Transfer autodeposit.
                    address:
                      type: object
                      description: Beneficiary's address details.
                      properties:
                        city:
                          type: string
                          description: Beneficiary's city.
                        country_code:
                          type: string
                          description: Beneficiary's country code (2-letter ISO 3166-2 country code).
                        postcode:
                          type: string
                          description: Beneficiary's post code.
                        state:
                          type: string
                          description: Beneficiary's state.
                        street_address:
                          type: string
                          description: Beneficiary's street address.
                    bank_details:
                      type: object
                      required:
                      - account_currency
                      - account_name
                      - bank_country_code
                      description: Beneficiary's bank account details where the payment will be credited.
                      properties:
                        account_currency:
                          type: string
                          description: Account Currency.
                        account_name:
                          type: string
                          description: Account holder name of the beneficiary’s bank account.
                        account_name_alias:
                          type: string
                          description: The beneficiary’s account name known in the payment system. This is only supported in some regions and transfer methods. See detailed definitions in the [Payouts Product Docs](/docs/payouts/beneficiaries/create-beneficiaries).
                        account_number:
                          type: string
                          description: Account number, mostly for non-european countries, either account_number or iban should be filled.
                        account_routing_type1:
                          type: string
                          description: Routing code type.
                        account_routing_type2:
                          type: string
                          description: Routing code sub type.
                        account_routing_value1:
                          type: string
                          description: Routing code value.
                        account_routing_value2:
                          type: string
                          description: Routing code sub type value.
                        bank_account_category:
                          type: string
                          description: bank account type.
                        bank_branch:
                          type: string
                          description: Specific branch of bank account.
                        bank_country_code:
                          type: string
                          description: Bank country code (2-letter ISO 3166-2 country code).
                        bank_name:
                          type: string
                          description: Bank name of the beneficiary's bank account.
                        bank_state:
                          type: string
                          description: Bank State.
                        bank_street_address:
                          type: string
                          description: Bank street address.
                        binding_mobile_number:
                          type: string
                          description: The mobile number tied to the Beneficiary's bank account.
                        fingerprint:
                          type: string
                          description: Fingerprint of current beneficiary's bank account.
                        iban:
                          type: string
                          description: International bank account number, mostly for european countries.
                        intermediary_bank_name:
                          type: string
                          description: Bank name of the beneficiary's intermediary bank.
                        intermediary_bank_swift_code:
                          type: string
                          description: Intermediary bank SWIFT code / BIC,Should contain alphanumeric characters only, Should be a valid and supported SWIFT code / BIC.
                        local_clearing_system:
                          type: string
                          description: 'Which clearing system should be used for this local bank transfer.


                            Please refer to our [payout guide](https://airwallex.com/guides/payout) for details about each option.


                            We suggest explicitly specifying this value, however if it''s not provided we will select a default (using the specified account routing type and/or what''s most often the best option).'
                        swift_code:
                          type: string
                          description: Bank swift code.
                    card:
                      type: object
                      required:
                      - cardholder_name
                      - token
                      description: Beneficiary's card details where the payment will be credited.
                      properties:
                        brand:
                          type: string
                          description: Card brand.
                          readOnly: true
                        cardholder_name:
                          type: string
                          description: Cardholder name.
                        currency:
                          type: string
                          description: Card currency.
                          readOnly: true
                        expiry_month:
                          type: string
                          description: Expiry month.
                        expiry_year:
                          type: string
                          description: Expiry year.
                        number:
                          type: string
                          description: Card number.
                          readOnly: true
                        token:
                          type: string
                          description: Tokenised card number, which can be retrieved from Airwallex beneficiary component.
                    company_name:
                      type: string
                      description: Company name of the beneficiary.
                    date_of_birth:
                      type: string
                      description: beneficiary date of birth.
                    digital_wallet:
                      type: object
                      required:
                      - account_name
                      - id_type
                      - id_value
                      - provider
                      description: Beneficiary's digital wallet details where the payment will be credited.
                      properties:
                        account_name:
                          type: string
                          description: Account holder name of the beneficiary’s digital wallet.
                        country_code:
                          type: string
                          description: Digital wallet country code (2-letter ISO 3166-2 country code).
                        id_type:
                          type: string
                          description: Account identifier type of the beneficiary’s digital wallet.
                        id_value:
                          type: string
                          description: Account identifier value of the beneficiary’s digital wallet.
                        provider:
                          type: string
                          description: Service provider of the beneficiary's digital wallet.
                    stablecoin_wallet:
                      type: object
                      required:
                      - asset
                      - network
                      - address
                      properties:
                        asset:
                          type: string
                          description: Stablecoin asset type, e.g., `USDC`.
                        network:
                          type: string
                          description: Blockchain network, e.g., `ETHEREUM`.
                        address:
                          type: string
                          description: Blockchain wallet address of the beneficiary. Sending stablecoins to an incorrect wallet address or unsupported network will result in the irreversible loss of funds. Always verify the recipient wallet address and network before initiating a transfer.
                    entity_type:
                      type: string
                      description: Entity type of the beneficiary.
                    first_name:
                      type: string
                      description: First name of the beneficiary.
                    last_name:
                      type: string
                      description: Last name of the beneficiary.
                    type:
                      type: string
                      description: 'Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds. Possible values: `BANK_ACCOUNT`, `DIGITAL_WALLET`, `CARD`, `STABLECOIN_WALLET`.'
                beneficiary_id:
                  type: string
                  description: An Airwallex `beneficiary_id` previously generated by utilizing the Airwallex Contact API.  This may be provided in place of the `beneficiary` object and should be empty if the beneficiary fields are provided.
                client_data:
                  type: string
                  description: Free text field available to you; can be populated with any additional identifiers that may be required for the transfer.
                fee_paid_by:
                  type: string
                  description: Denotes whether `PAYER`/`BENEFICIARY` will be liable for the transfer fees, and it affects the actual amount the beneficiary receives.
                lock_rate_on_create:
                  type: boolean
                  description: Customers could choose whether to use confirmed rates for scheduled transfer with conversion. This field should only be specified when a conversion is involved.If customers do not specify this field, the default value is true. This field can either be specified to be TRUE when creating a transfer with currency conversions at a confirmed rate or FALSE if an unconfirmed rate is wanted.
                metadata:
                  type: object
                  description: A set of key-value pairs for storing your own data together with the transfer.
                  additionalProperties:
                    type: string
                payer:
                  type: object
                  required:
                  - address
                  - entity_type
                  description: Details for the payer in the transfer request. If payer_id provided in the transfer request then payer should be empty.
                  properties:
                    additional_info:
                      type: object
                      description: Additional information about the payer.
                      properties:
                        business_registration_number:
                          type: string
                          description: Business registration number.
                        business_registration_type:
                          type: string
                          description: Type of business as registered with the local government authority.
                        external_id:
                          type: string
                          description: Unique identifier of the person in your company.
                        personal_email:
                          type: string
                          description: Personal email.
                        personal_id_number:
                          type: string
                          description: Personal unique identifier number.
                    address:
                      type: object
                      required:
                      - country_code
                      description: Payer's address details.
                      properties:
                        city:
                          type: string
                          description: Payer's city.
                        country_code:
                          type: string
                          description: Payer's country code (2-letter ISO 3166-2 country code).
                        postcode:
                          type: string
                          description: Payer's post code.
                        state:
                          type: string
                          description: Payer's state.
                        street_address:
                          type: string
                          description: Payer's street address.
                    company_name:
                      type: string
                      description: Company name of the payer.
                    date_of_birth:
                      type: string
                      description: Payer's date of birth.
                    entity_type:
                      type: string
                      description: Entity type of the payer.
                    first_name:
                      type: string
                      description: First name of the payer.
                    last_name:
                      type: string
                      description: Last name of the payer.
                payer_id:
                  type: string
                  description: An Airwallex payer_id previously generated by utilising the Airwallex Contact API.  This may be provided in place of the payer section and should be empty if the payer fields are provided.
                quote_id:
                  type: string
                  description: quote id from a previously created lockfx quote.
                reason:
                  type: string
                  description: Reason for the transfer instruction.
                reference:
                  type: string
                  description: A user specified reference that will be displayed to the beneficiary on the transfer transaction with their bank.
                remarks:
                  type: string
                  description: Additional information about this transfer, which will not be passed to the beneficiary.
                request_id:
                  type: string
                  description: "A unique request ID specified by the client.  Payout creation requests with a `request_id` that has been used in the past 7 days are treated as duplicated payout and cannot be processed. When you are not sure about the outcome of a payout creation request, e.g. when there are network issues or system failures such as timeout, you can try to get a payout with this `request_id` to find out.    \nNote: Can be non-UUID as long as it is unique among the requests within the past 7 days."
                source_amount:
                  type: string
                  description: Source amount in `source_currency`.
                source_currency:
                  type: string
                  description: Source currency, i.e. the currency that the Payer uses to fund the transfer (3-letter ISO-4217 code).
                swift_charge_option:
                  type: string
                  description: (For SWIFT transfers only), specify who should bear SWIFT charges, either `SHARED` (default) or `PAYER`.
                transfer_amount:
                  type: string
                  description: Transfer amount in `transfer_currency`.
                transfer_currency:
                  type: string
                  description: Transfer currency, i.e. the currency that the beneficiary receives (3-letter ISO-4217 code).
                transfer_date:
                  type: string
                  description: Date when transfer should be made.
                transfer_method:
                  type: string
                  description: Transfer method, i.e. SWIFT, LOCAL.
        description: createTransferRequestDto.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: '["request_id_duplicate"

            ,"declaration_required"

            ,"amount_beneficiary_receives_below_limit"

            ,"amount_below_transfer_method_limit"

            ,"source_amount_below_account_limit"

            ,"transfer_amount_below_account_limit"

            ,"amount_beneficiary_receives_above_cumulative_limit"

            ,"amount_above_transfer_method_limit"

            ,"source_amount_above_account_limit"

            ,"transfer_amount_above_account_limit"

            ,"fee_unknown"

            ,"service_unavailable"

            ,"currency_pair_invalid"

            ,"order_info_unsupported"

            ,"order_reconciliation_failed"

            ,"transfer_currency_unsupported"

            ,"source_currency_unsupported"

            ,"open_position_limit_exceeded"

            ,"balance_insufficient"

            ,"payout_method_unsupported"

            ,"payer_unsupported"

            ,"validation_failed"

            ,"quote_id_invalid"

            ,"quote_id_required"

            ,"beneficiary_type_unsupported"

            ,"order_amount_insufficient"

            ,"quote_expired"

            ,"transfer_date_invalid"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '409':
          description: '["request_pending"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
