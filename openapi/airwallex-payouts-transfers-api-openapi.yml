components:
  schemas:
    ProviderFailureDetails:
      type: object
      properties:
        code:
          type: string
          description: The original error code received from the local clearing system.
        local_clearing_system:
          type: string
          description: The local clearing system used for the direct debit deposit. Possible values are `AU_BECS`, `US_ACH`, `GB_BACS`, `EU_SEPA`.
        message:
          type: string
          description: The original error message received from the local clearing system.
      description: A set of original information received from the local clearing system.
    Payouts_Payer:
      type: object
      required:
      - address
      - entity_type
      properties:
        additional_info:
          $ref: '#/components/schemas/PayerAdditionalInfo'
          description: Additional information about the payer.
        address:
          $ref: '#/components/schemas/PayerAddress'
          description: Payer's address details.
