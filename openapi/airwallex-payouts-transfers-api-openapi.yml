  /api/v1/transfers:
    get:
      tags:
      - Payouts > Transfers
      summary: 3|List all Transfers
      description: Get list of transfers from a specified creation date/time, with optional filters on end creation date/time, buy/sell currency and status. Alternatively, one or neither of the *from* or *to* created_at request fields needs to be populated. In the event that neither or only the to created_at fields are populated, then transfers 30 days in arrears of today or the *to* created_at date will be returned.
      operationId: listTransfers
      parameters:
      - name: batch_transfer_id
        in: query
        description: Batch transfer unique identifier.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
          default: 55713d04-c569-4510-abb7-5b47d2423a84
      - name: beneficiary_id
        in: query
        description: Beneficiary unique identifier.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
          default: 55713d04-c569-4510-abb7-5b47d2423a84
      - name: from_created_at
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: '2022-12-01T20:00:00Z'
      - name: page
        in: query
        description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of page_after (if not null) from the response to a subsequent call. To retrieve the previous page of results, pass the value of page_before (if not null) from the response to a subsequent call. The 30-day limit will be removed if `page` is present in the request. Passing page=0 on the very first page will override the 30 days default for null date ranges, enabling a complete search of the transfers.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Number of results per page, defaultValue 2000.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 2000
      - name: request_id
        in: query
        description: Transfer `request_id`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: short_reference_id
      - name: short_reference_id
        in: query
        description: Transfer `short_reference_id`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: short_reference_id
      - name: status
        in: query
        description: Status of the transfer.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: PROCESSING
      - name: to_created_at
        in: query
        description: The end date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: '2022-12-31T20:00:00Z'
      - name: transfer_currency
        in: query
        description: Transfer currency.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: USD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorBasedPagedQueryResultDtoOfTransfer'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
