      description: Pay U information.
    AuthenticationData:
      type: object
      properties:
        authentication_type:
          type: string
          description: 'The method used to authenticate this transaction. Possible values: passkey, 3ds, none.'
        avs_result:
          type: string
          description: AVS result.
        cvc_result:
          type: string
          description: CVC result.
        ds_data:
