  /api/v1/pa/payment_intents/{id}/capture:
    post:
      tags:
      - Payment Acceptance > Payment Intents
      summary: 6|Capture a Payment Intent
      description: Capture funds that have been confirmed but have not yet been captured or have only been captured partially. A Payment Intent is capturable if `auto_capture=false` and its `next_action` indicates that capture is required.
      operationId: capture
      parameters:
      - name: id
        in: path
        description: Payment Intent unique identifier.
        required: true
