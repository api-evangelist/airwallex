          description: Last time at which this Payment Intent was cancelled. Only present when the Payment Intent was successfully cancelled, i.e. status is `CANCELLED`.
        captured_amount:
          type: number
          description: Amount that captured from this Payment Intent.
        client_secret:
          type: string
          description: "Payment Intent's client secret for browser or app. Returned by Payment Intent create API or Payment Intent retrieve API \n\nThe provided client_secret is valid for 60 minutes."
