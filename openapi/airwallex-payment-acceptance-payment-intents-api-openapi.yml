        authentication_data:
          $ref: '#/components/schemas/AuthenticationData'
          description: Authentication data which contains AVS result, CVC result, three domain secure result and fraud evaluation result.
        authorization_code:
          type: string
          description: Authorization response code from issuer when the payment is authorized successfully.
        captured_amount:
          type: number
          description: Captured amount.
        created_at:
          type: string
          format: date-time
          description: Time at which this Payment Attempt was created.
        currency:
          type: string
          description: Currency of the Payment Attempt.
        dcc_data:
          $ref: '#/components/schemas/Dcc'
          description: Present when DCC amount is available and DCC currency is different from Payment Intent currency. DCC could be conducted either by third party or Airwallex when using Airwallex DCC product.
        failure_code:
          type: string
          description: Payment Attempt failure code. One of `authentication_failed`, `capture_failed`, `authorization_failed`, `provider_unavailable`, `system_unavailable`, `fraud_rejected`.
        failure_details:
          $ref: '#/components/schemas/Payment_Acceptance_FailureDetails'
          description: Failure details. Only applicable when status is FAILED.
        id:
          type: string
          description: Unique identifier for the Payment Attempt.
        merchant_advice_code:
          type: string
          description: An advice code from issuer to provide more details about the payment. It can be useful when implementing a retry logic for declined payments.
        merchant_order_id:
          type: string
          description: Merchant order unique identifier of the Payment Attempt.
        payment_consent_id:
          type: string
          description: Payment Consent unique identifier of the Payment Attempt.
        payment_intent_id:
          type: string
          description: Payment Intent unique identifier of the Payment Attempt.
        payment_method:
          $ref: '#/components/schemas/AttemptPaymentMethodDetail'
          description: Payment Method used by the Payment Attempt.
        payment_method_options:
          $ref: '#/components/schemas/PaymentMethodOption'
          description: Options for Payment Method.
        payment_method_transaction_id:
          type: string
          description: The unique transaction identifier for a Payment Attempt, assigned by the payment provider (card issuers or local payment method providers such as Google Pay, i DEAL, etc.).
        provider_original_response_code:
          type: string
          description: The original response code from the payment method provider (or issuer for card).
        provider_original_response_description:
          type: string
          description: Human-readable description of `provider_original_response_code`, describing the reason returned by the issuer.
        provider_transaction_id:
          type: string
          description: "Deprecated.  \n  \nUse `payment_method_transaction_id` instead."
        refunded_amount:
          type: number
          description: Refunded amount.
        settle_via:
          type: string
          description: "Through which channel the merchant will get this payment settled. Possible values are `airwallex`, `paypal`, `amex`. \n\nIf `airwallex` is returned, this payment will be settled to merchant's Airwallex wallet, otherwise it will be settled externally."
        status:
          type: string
          description: '

            - **RECEIVED**: The Payment Attempt has been created upon request.

            - **AUTHENTICATION_REDIRECTED**: The Payment Attempt is waiting for further customer action of authentication, e.g. 3DS verification and QR code scan.

            - **PENDING_AUTHORIZATION**: The Payment Attempt authorization request has been accepted and is pending the final result from the provider.

            - **AUTHORIZED**: The Payment Attempt was successfully authorized. It will either be automatically captured or require a manual capture to finalize the payment. Please be aware that capturing the payment is not possible if the Payment Intent status is **PENDING_REVIEW**.

            - **CAPTURE_REQUESTED**: The Payment Attempt has been successfully requested for capture. The payment is complete.

            - **EXPIRED**: The Payment Attempt expired after the allowed payment time. Please create a new Payment Attempt to retry.

            - **CANCELLED**: The Payment Attempt has been cancelled. The previously authorized amount (if any) will be returned to the customer.

            - **FAILED**: The Payment Attempt has failed. Please create a new Payment Attempt to retry.

            - **SETTLED**: Airwallex has received the settlement from the provider. We will settle the funds in your wallet.

            - **PAID**: Airwallex has settled the funds in your wallet.

            '
        terminal_id:
          type: string
          description: Airwallex terminal unique identifier used to process the payment attempt.
        updated_at:
          type: string
          format: date-time
          description: Last time at which this Payment Attempt was updated or operated on.
      description: Latest Payment Attempt that was created under the Payment Intent.
    Payu:
