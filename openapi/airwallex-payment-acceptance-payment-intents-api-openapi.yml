                              driver_nationality:
                                type: string
                                description: Nationality of the driver (ISO 3166-1 alpha-2 code).
                              driver_phone:
                                type: string
                                description: Driver phone number.
                              drop_off_address:
                                type: object
                                required:
                                - city
                                - country_code
                                - street
                                description: The return address of this rental.
                                properties:
                                  city:
                                    type: string
                                    description: City of the address. Maximum of 100 characters.
                                  country_code:
                                    type: string
                                    description: The two-letter country code in ISO 3166-1 alpha-2 format.
                                  postcode:
                                    type: string
                                    description: Postcode of the address. Maximum of 10 characters.
                                  state:
                                    type: string
                                    description: State or province of the address. Maximum of 100 characters.
                                  street:
                                    type: string
                                    description: Street of the address. Maximum of 1000 characters.
                              drop_off_at:
                                type: string
                                description: Rental drop-off time, in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
                              insurances:
                                type: array
                                description: The list of insurances.
                                items:
                                  type: object
                                  required:
                                  - company
                                  - price
                                  - type
                                  properties:
                                    company:
