                  type: string
                  description: The unique identifier of the customer making a payment for this Payment Intent. This field is required if the Payment Intent is created for recurring payments. Leave this field empty if the customer is unknown (guest checkout) or if the customer details are provided via the customer object. If only `additional_info` is provided in the customer object for the Payment Intent, you can still include `customer_id` in the request.
