                              scheduled_arrival_at:
                                type: string
                                description: The estimated arrival datetime in ISO 8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
                              scheduled_departure_at:
                                type: string
                                description: The departure datetime in ISO 8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
                        car_rentals:
                          type: array
                          description: The details of the car rental.
                          items:
                            type: object
                            required:
                            - agreement_number
                            - driver_name
                            - driver_nationality
