openapi: 3.2.0
info:
  title: Airwallex Payment Acceptance > Payment Intents API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payment Acceptance > Payment Intents
  description: 'A **Payment Intent** guides you through the process of collecting a payment from your customer. It tracks a payment when your customer first checks out, through to when payment is successfully paid by your customer. A Payment Intent transitions through a number of states throughout the customer''s payment journey.


    You may specify the following on a Payment Intent.


    1. How much the payment is for? Denoted by `amount` and `currency`.

    2. Who is making the payment? This is described by the optional `customer_id` field.

    3. Which Payment Method to use? Denoted by `payment_method`.


    You/your customer will get back the following hints at different stages of the payment process:


    1. The available Payment Methods.

    2. The Payment Method attached to this customer (if `customer_id` is set).


    A combination of `status` and `next_action` guide you and your customers through the payment process, including triggering additional authentication flows as required.


    Data Retention Policy: You can query and operate Payment Intent resources for a maximum of 2 years since creation.'
  x-domain: Payment Acceptance
  x-resource: Payment Intents
  x-urlPath: payments/payment_intents
paths:
  /api/v1/pa/payment_intents/create:
    post:
      tags:
      - Payment Acceptance > Payment Intents
      summary: 1|Create a Payment Intent
      description: Start collecting payment from your customer by creating a Payment Intent. The payment `amount` and `currency`, as well as the merchant order unique identifier must be provided.
      operationId: createPaymentIntent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - currency
              - merchant_order_id
              - request_id
              properties:
                additional_info:
                  type: object
                  description: Additional info for the transaction.
                  properties:
                    account_funding_data:
                      type: object
                      required:
                      - type
                      description: Additional info for account funding transactions to ensure compliance with card networks.
                      properties:
                        recipient:
                          type: object
                          description: Details of the recipient for this account funding transaction.
                          properties:
                            account_number:
                              type: string
                              description: Account number of the recipient receiving funds. If you are funding a card, provide the first six digits and last four digits of the card number (e.g., "411111xxxxxxxx1111").
                            address:
                              type: object
                              required:
                              - country_code
                              description: Address of the recipient.
                              properties:
                                city:
                                  type: string
                                  description: City of the address.
                                country_code:
                                  type: string
                                  description: The two-letter country code in ISO 3166-1 alpha-2 format.
                                line1:
                                  type: string
                                  description: Address line1.
                                line2:
                                  type: string
                                  description: Address line2.
                                postcode:
                                  type: string
                                  description: Postcode of the address.
                                state:
                                  type: string
                                  description: State or province of the address.
                            first_name:
                              type: string
                              description: First name of the recipient.
                            last_name:
                              type: string
                              description: Last name of the recipient.
                            middle_name:
                              type: string
                              description: Middle name of the recipient.
                        sender:
                          type: object
                          description: Details of the sender for this account funding transaction.
                          properties:
                            address:
                              type: object
                              required:
                              - country_code
                              description: Address of the sender.
                              properties:
                                city:
                                  type: string
                                  description: City of the address.
                                country_code:
                                  type: string
                                  description: The two-letter country code in ISO 3166-1 alpha-2 format.
                                line1:
                                  type: string
                                  description: Address line1.
                                line2:
                                  type: string
                                  description: Address line2.
                                postcode:
                                  type: string
                                  description: Postcode of the address.
                                state:
                                  type: string
                                  description: State or province of the address.
                            date_of_birth:
                              type: string
                              description: 'The sender’s date of birth. Format: YYYY-MM-DD (e.g., "1989-07-15").'
                            first_name:
                              type: string
                              description: First name of the sender.
                            last_name:
                              type: string
                              description: Last name of the sender.
                            middle_name:
                              type: string
                              description: Middle name of the sender.
                        transfer_between_own_accounts:
                          type: boolean
                          description: Indicates whether the transfer is between the customer's own accounts. If true, Airwallex will compare the cardholder's name and the recipient's name, and will trigger 3DS if the names do not match.
                        type:
                          type: string
                          description: "Account funding transaction type. Possible values: \n\n- **ACCOUNT_TO_ACCOUNT_TRANSFER**: An account-to-account transfer, either within the same financial institution or to a different one.\n- **STORED_VALUE_DIGITAL_WALLET_TRANSFER**: Adding funds to or cashing out a Stored Value Digital Wallet (SVDW) account.\n- **STAGED_DIGITAL_WALLET_TRANSFER**: Funding a Staged Digital Wallet before the cardholder makes a purchase.\n- **PREPAID_CARD_TOP_UP**: Prepaid card or gift card top-up (adding value to an eligible reloadable prepaid card or funding the cardholder’s own prepaid account).\n- **LIQUID_ASSET_PURCHASE**: Funds transfer for the acquisition of liquid assets (for example, stocks, shares, foreign currency and cryptocurrency).\n"
                    customer_activity_data:
                      type: object
                      description: (Optional) Additional customer information to be sent to the external risk control system. This information may increase the success rate of your transactions if provided.
                      properties:
                        account_type:
                          type: string
                          description: Customer account type. One of `GUEST`, `PRIVATE`, `BUSINESS`, `VIP`, `MERCHANT_OPERATED`, `TRIAL`, `MERCHANT_EMPLOYEE`, `PREMIUM_PAID`, `SMALL_BUSINESS`, `AGENT`.
                        first_successful_order_date:
                          type: string
                          description: Date at which the customer completes the first order on the merchant's site.
                        last_login_ip_address:
                          type: string
                          description: The public IP address used by the customer in the last login.
                        last_modified_at:
                          type: string
                          description: The last time at which the customer modified their account in the merchant's system. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
                        linked_social_networks:
                          type: array
                          description: Social network data related to the customer.
                          items:
                            type: object
                            properties:
                              email:
                                type: string
                                description: The customer's email address on the social network.
                              name:
                                type: string
                                description: 'The social network used by the customer. Can be one of: `FACEBOOK`, `GOOGLE`, `TWITTER`, `REDDIT`, `PINTEREST`, `WECHAT`, `QQ`, `TWITCH`, `APPLE`, `DRIBBBLE`, `GITHUB`, `LINKEDIN`, `MAKER_STUDIOS`, `STACK_EXCHANGE`, `VIMEO`, `STEAM`, `OTHER`, `KAKAO`, `NAVER`, `GRAB`, `JKOPAY`, `LINE`, `OTHER`.'
                              profile_id:
                                type: string
                                description: The customer's profile unique identifier on the social network.
                        purchase_summaries:
                          type: array
                          description: The purchase summaries of this customer with different payment methods in the merchant's system for risk analysis.
                          items:
                            type: object
                            required:
                            - payment_method_type
                            properties:
                              currency:
                                type: string
                                description: The currency of successful purchase volume in 3-letter ISO 4217 currency code. Please refer to [supported currencies](/docs/payments/supported-currencies).
                              first_successful_purchase_date:
                                type: string
                                description: The date on which the customer completed their first purchase in the merchant's system with the specified payment method type.
                              last_successful_purchase_date:
                                type: string
                                description: The date on which the customer completed their last purchase in the merchant's system with the specified payment method type.
                              payment_method_type:
                                type: string
                                description: Payment method type, one of `affirm`, `afterpay`, `atome`, `klarna`, and `other`.
                              successful_purchase_amount:
                                type: number
                                description: Total volume of successful purchases. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
                              successful_purchase_count:
                                type: integer
                                format: int32
                                description: Total number of successful purchases.
                        registered_via_social_media:
                          type: boolean
                          description: Whether the customer registers through social media. Default to `false`.
                        registration_date:
                          type: string
                          description: Date at which the customer registers on the merchant's site.
                        registration_ip_address:
                          type: string
                          description: The public IP address used by the customer when registering on the merchant's site.
                    enhanced_scheme_data:
                      type: object
                      description: Level 2 & Level 3 data that will be sent to card schemes. By providing Level 2 or Level 3 data with your transactions, you may be able to qualify for reduced interchange rates.
                      properties:
                        customer:
                          type: object
                          description: Details of the customer making a payment for this Payment Intent.
                          properties:
                            first_name:
                              type: string
                              description: First name of the customer.
                            last_name:
                              type: string
                              description: Last name of the customer.
                            reference:
                              type: string
                              description: A reference number or code supplied by the cardholder to the merchant, which could be used for invoice management at the cardholder's side. Maximum of 17 characters.
                        customer_tax_identifier:
                          type: string
                          description: Tax identifier of the customer. Maximum of 13 characters.
                        duty_amount:
                          type: number
                          description: The total charges for any import or export duty included in the transaction. This amount must be expressed in the original currency of the transaction.
                        invoice_reference:
                          type: string
                          description: Invoice reference number. Maximum of 17 characters.
                        local_tax_amount:
                          type: number
                          description: The amount of state or provincial tax on the transaction amount. This amount must be expressed in the original currency of the transaction.
                        merchant_tax_identifier:
                          type: string
                          description: Tax identifier of the merchant. This can be a VAT / GST / other tax related identifier. Maximum of 20 characters.
                        national_tax_amount:
                          type: number
                          description: The amount of national tax on the transaction amount. This amount must be expressed in the original currency of the transaction.
                        products:
                          type: array
                          description: Product list.
                          items:
                            type: object
                            properties:
                              code:
                                type: string
                                description: Merchant’s product identifier code. Maximum of 12 characters.
                              commodity_code:
                                type: string
                                description: The [UNSPSC Commodity Code](https://www.ungm.org/Public/UNSPSC) for the product. Maximum of 12 characters.
                              description:
                                type: string
                                description: Product description. Maximum of 26 characters.
                              discount_amount:
                                type: number
                                description: The discount amount for the product. This amount must be expressed in the original currency of the transaction.
                              quantity:
                                type: integer
                                format: int32
                                description: Product quantity.
                              tax_percent:
                                type: number
                                description: The tax rate percentage for the product. Should be less than 100, up to 2 decimal places.
                              total_amount:
                                type: number
                                description: The total amount for the product. This amount must be expressed in the original currency of the transaction.
                              total_tax_amount:
                                type: number
                                description: The total amount of tax for the product. This amount must be expressed in the original currency of the transaction.
                              unit:
                                type: string
                                description: The unit of measure code used for the product. Maximum of 12 characters.
                              unit_price:
                                type: number
                                description: Product unit price. This amount must be expressed in the original currency of the transaction.
                        shipping:
                          type: object
                          description: Shipping information.
                          properties:
                            address:
                              type: object
                              required:
                              - country_code
                              description: Shipping address.
                              properties:
                                city:
                                  type: string
                                  description: City of the address. Maximum of 100 characters.
                                country_code:
                                  type: string
                                  description: The two-letter country code in ISO 3166-1 alpha-2 format.
                                postcode:
                                  type: string
                                  description: Postcode of the address. Maximum of 10 characters.
                                state:
                                  type: string
                                  description: State or province of the address. Maximum of 100 characters.
                                street:
                                  type: string
                                  description: Street of the address. Maximum of 1000 characters.
                            date:
                              type: string
                              description: The date the goods were shipped to the destination, in YYYY-MM-DD format.
                            fee_amount:
                              type: number
                              description: Shipping fee amount. This amount must be expressed in the same currency as the transaction amount.
                            from_postcode:
                              type: string
                              description: The postcode of the location the goods are being shipped from. Maximum of 10 characters.
                        summary_commodity_code:
                          type: string
                          description: The first 2,4 or 6 digits of  [UNSPSC Commodity Code](https://www.ungm.org/Public/UNSPSC) that best categorizes the items being purchased. If the items belong to different categories, choose a category that best represents the items. Maximum of 15 characters.
                        total_tax_amount:
                          type: number
                          description: The total amount of sales tax or value added tax (VAT) on the transaction amount. This amount must be expressed in the original currency of the transaction.
                        vat_invoice_reference:
                          type: string
                          description: Value added tax invoice reference number. Maximum of 15 characters.
