      - Payment Acceptance > Payment Intents
      summary: 8|Increment Authorization for a Payment Intent
      description: Allows you to authorize additional funds on an existing Payment Intent before capture. This is useful when the final payment amount is not known upfront, such as in hotel or car rental scenarios. Only a single capture and clearing occurs for the final authorized amount.
      operationId: incrementAuthorization
      parameters:
      - name: id
        in: path
        description: Payment Intent unique identifier.
        required: true
        schema:
          type: string
          default: int_e65tkXCSzJrsMpTrzoFrjaau53
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - amount
              - request_id
              properties:
                amount:
                  type: number
                  description: The new total amount to authorize, which must be greater than the previously authorized total amount on this Payment Intent. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
        description: Payment Intent incremental authorization request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentSingle'
        '201':
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `invalid_status_for_operation`, `operation_not_supported, `provider_unavailable`, `configuration_error`, `risk_declined`, `provider_declined`, `issuer_declined`.'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url), `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
