    PaymentAttempt:
      type: object
      properties:
        acquirer_reference_number:
          type: string
          description: Acquirer reference number of the card payment. Will be populated after the payment attempt has transitioned to the `CAPTURE_REQUESTED` or `SETTLED` status.
        amount:
