                                  postcode:
                                    type: string
                                    description: Postcode of the address. Maximum of 10 characters.
                                  state:
                                    type: string
                                    description: State or province of the address. Maximum of 100 characters.
                                  street:
                                    type: string
                                    description: Street of the address. Maximum of 1000 characters.
                              arena_name:
                                type: string
                                description: The name of the venue.
                              arena_seat_number:
                                type: string
                                description: The seat number of the venue.
                              company:
                                type: string
                                description: The name of the company arranging the event.
                              customer_name:
                                type: string
                                description: The name of the customer.
                              customer_title:
                                type: string
                                description: The title used before the customer’s  name. One of mr, ms, and mrs.
                              ends_at:
                                type: string
                                description: The event's end date and time in ISO 8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
                              name:
                                type: string
                                description: The name of the event.
                              starts_at:
                                type: string
                                description: The event's start date and time in ISO 8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
                              type:
                                type: string
                                description: The category or type of the event.
                    online_travel_agency_data:
                      type: object
                      description: The additional information for online travel agency data.
                      properties:
                        accommodations:
                          type: array
                          description: The details of accommodation.
                          items:
                            type: object
                            required:
