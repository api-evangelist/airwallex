          description: 3DS data.
        fraud_data:
          $ref: '#/components/schemas/FraudData'
          description: Fraud data.
        passkey_setup_status:
          type: string
          description: 'Status of payment passkey setup for the card/device used in the transaction, during cardholder authentication. Possible values: `SETUP_COMPLETED`, `ALREADY_SETUP`, `FAILED_TO_SETUP`, `NOT_TRIGGERED`

            - `SETUP_COMPLETED`: Payment passkey was successfully set up.

            - `ALREADY_SETUP`: Payment passkey was already set up for this card/device combination in a previous transaction.

            - `FAILED_TO_SETUP`: Attempted to set up a payment passkey, but the setup failed.

            - `NOT_TRIGGERED`: Payment passkey setup was not supported or not applicable for this transaction (transaction was not processed via the passkey flow).'
        sca_exemption:
          $ref: '#/components/schemas/ScaExemption'
          description: SCA exemption indicators for this transaction.
      description: Authentication data which contains AVS result, CVC result, three domain secure result and fraud evaluation result.
