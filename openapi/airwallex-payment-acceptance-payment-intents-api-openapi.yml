                external_recurring_data:
                  type: object
                  required:
                  - triggered_by
                  description: 'Some merchants prefer to maintain the recurring payments on their own instead of using **Payment Consent**. Providing this data indicates the request is an external recurring payment.

                    Only effective when the `payment_method.type` is `card`, `applepay`, `googlepay`.'
                  properties:
                    initial_payment:
                      type: boolean
                      description: 'Set this to `true` if it is the initial transaction request in a recurring series.


                        Default: `false`.'
                    lifecycle_id:
                      type: string
                      description: 'The Mastercard **Transaction Link Identifier (TLID)**, assigned when the original payment in a recurring series is authorized, carried as ISO 8583 DE 105 Subfield 1. Provide it on subsequent merchant-initiated payments so issuers can link the series to the original authorization.


                        - Pass it only on subsequent recurring payments over `card` where `triggered_by` is `merchant` and `initial_payment` is `false`.'
                    merchant_trigger_reason:
                      type: string
                      description: 'Indicate if this subsequent payment is scheduled. Only applicable when `triggered_by` is `merchant`. One of `scheduled`, `unscheduled`, `installments`.


                        Default: `scheduled`.'
                    original_transaction_id:
                      type: string
                      description: 'The original transaction reference which can be provided to increase the odds of getting approved by issuer when `triggered_by` is `merchant` (not in customer''s presence).

                        Do not pass this value when `initial_payment` is `true` or if you are not clear about the valid formats (as listed below).

                        - Visa (`card`) - 15 digits unique ID Visa assigns to the response of the original authorization request, i.e. `123456789012345`

                        - Mastercard (`card`) - 13 characters trace id (DE 63 Subfield 1 & 2 + DE 15) from the response of the original authorization request, i.e. `MCC123ABC0101`.

                        '
                    terms_of_use:
                      type: object
                      required:
                      - payment_amount_type
                      description: Terms to specify how this Payment Consent will be used.
                      properties:
                        billing_cycle_charge_day:
                          type: integer
                          format: int32
                          description: The granularity per billing cycle. Required when payment_schedule.period_unit is WEEK, MONTH, or YEAR. (e.g. charge_day_per_billing_cycle= 5, payment_schedule.period_unit  = MONTH, payment_schedule.period = 1 if collect payment on the 5th of each month).
                        end_date:
                          type: string
                          description: End date to expect payment request.
                        first_payment_amount:
                          type: number
                          description: The first payment. It could include the costs associated with the first debited amount.Optional if payment agreement type is `VARIABLE`.
                        fixed_payment_amount:
                          type: number
                          description: The fixed payment amount that can be charged for a single payment.Required if payment agreement type is `FIXED`.
                        max_payment_amount:
                          type: number
                          description: The maximum payment amount that can be charged for a single payment.Optional if payment agreement type is `VARIABLE`.
                        min_payment_amount:
                          type: number
                          description: The minimum payment amount that can be charged for a single payment.Optional if payment agreement type is `VARIABLE`.
                        payment_amount_type:
                          type: string
                          description: 'The agreed type of amounts for subsequent payment. Should be one of `FIXED`, `VARIABLE`.


                            - **FIXED**: payment amount is fixed. A specific amount is required.

                            - **VARIABLE**: payment amount is variable at each collection. A max limit is recommended.'
                        payment_currency:
                          type: string
                          description: The currency of this payment. Please refer to [supported currencies](/docs/payments/supported-currencies).
                        payment_schedule:
                          type: object
                          properties:
                            period:
                              type: integer
                              format: int32
                              description: The number of period units between billing cycles. For example, the payment cycle is one month if period=1 and period_unit=MONTH. Required when merchant_trigger_reason = scheduled.
                            period_unit:
                              type: string
                              description: Specifies billing frequency. One of `DAY`, `WEEK`,  `MONTH`, and `YEAR`. Required when merchant_trigger_reason = scheduled.
                        start_date:
                          type: string
                          description: Start date to expect payment request.
                        total_billing_cycles:
                          type: integer
                          format: int32
                          description: 'The total number of billing cycles. For example, the mandate will last for 1 year if `total_billing_cycles`=12, `payment_schedule.period`=1 and `payment_schedule.period_unit`=MONTH if the `merchant_trigger_reason` is `scheduled`. Merchant can bill customers 12 times when `total_billing_cycles`=12 if the `merchant_trigger_reason` is `unscheduled`The mandate will continue indefinitely if total_billing_cycles is null. '
                    triggered_by:
                      type: string
                      description: The party who initiated this subsequent payment request. One of `merchant`, `customer`.
