                            - check_in_date
                            - check_out_date
                            - guest_nationality
                            - guest_phone
                            - name
                            - room_type
                            - type
                            properties:
                              address:
                                type: object
                                required:
                                - city
                                - country_code
                                - postcode
                                - street
                                description: The address of this accommodation.
                                properties:
                                  city:
                                    type: string
                                    description: City of the address. Maximum of 100 characters.
                                  country_code:
                                    type: string
                                    description: The two-letter country code in ISO 3166-1 alpha-2 format.
                                  postcode:
                                    type: string
                                    description: Postcode of the address. Maximum of 10 characters.
                                  state:
                                    type: string
                                    description: State or province of the address. Maximum of 100 characters.
                                  street:
                                    type: string
                                    description: Street of the address. Maximum of 1000 characters.
                              check_in_date:
                                type: string
                                description: Check-in date, in YYYY-MM-DD format.
                              check_out_date:
                                type: string
                                description: Check-out date, in YYYY-MM-DD format.
                              early_checkin:
                                type: boolean
                                description: Indicates if early check-in was paid for.
                              guest_email:
                                type: string
                                description: Guest email address for communication and confirmations.
                              guest_name:
                                type: string
                                description: Full legal name of the guest.
                              guest_nationality:
                                type: string
                                description: Nationality of the guest (ISO 3166-1 alpha-2 code).
                              guest_phone:
                                type: string
                                description: Guest phone number.
                              late_checkout:
                                type: boolean
                                description: Indicates if late checkout was paid for.
                              name:
                                type: string
                                description: Name of the accommodation.
                              pre_tax_amount:
                                type: number
                                description: Accommodation amount excluding tax.
                              ratings:
                                type: array
                                description: Hotel rating(s) (from various sources).
                                items:
                                  type: object
                                  properties:
                                    score:
                                      type: string
