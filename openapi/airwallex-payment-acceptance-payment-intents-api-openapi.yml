          description: Payment amount. This is the order amount you would like to charge your customer.
        cancellation_reason:
          type: string
          description: Reason for cancelling the Payment Intent. Only present when the Payment Intent was successfully cancelled, i.e. status is `CANCELLED`.
        cancelled_at:
          type: string
          format: date-time
          description: Last time at which this Payment Intent was cancelled. Only present when the Payment Intent was successfully cancelled, i.e. status is `CANCELLED`.
        captured_amount:
          type: number
          description: Amount that captured from this Payment Intent.
        client_secret:
          type: string
          description: "Payment Intent's client secret for browser or app. Returned by Payment Intent create API or Payment Intent retrieve API \n\nThe provided client_secret is valid for 60 minutes."
        connected_account_id:
          type: string
          description: Account identifier of the connected account.
        conversion_quote_id:
          type: string
          description: The unique identifier of the conversion quote applied to the intent.
        created_at:
          type: string
          format: date-time
          description: Time at which this Payment Intent was created.
        currency:
          type: string
          description: Amount currency.
        customer:
          $ref: '#/components/schemas/CustomerDetails'
          description: 'The details of the customer who is making a business payment for this Payment Intent, in which case it''s not desired to create a Customer API resource. '
        customer_id:
          type: string
          description: The unique identifier of the Customer who is paying for this Payment Intent.
        descriptor:
          type: string
          description: Descriptor that will be displayed to the customer.
        funds_split_data:
          type: array
          description: The data that will create funds splits automatically after the Payment Intent succeeds.
          items:
            $ref: '#/components/schemas/FundsSplitData'
        id:
          type: string
          description: Unique identifier for the Payment Intent.
        invoice_id:
          type: string
          description: Invoice unique identifier.
        latest_payment_attempt:
          $ref: '#/components/schemas/PaymentAttemptId'
          description: Latest Payment Attempt that was created under the Payment Intent.
        merchant_category_code:
          type: string
          description: Four-digit code to categorize the business or service. This field is only applicable for approved merchants to specify an alternative category code.
        merchant_order_id:
          type: string
          description: The order unique identifier created in merchant's order system that corresponds to this Payment Intent.
        merchant_website_url:
          type: string
          description: URL of the merchant's website where the customer is completing the transaction.
        metadata:
          type: object
          description: A set of key-value pairs that you can attach to this Payment Intent. You can specify up to 50 keys with key names up to 50 characters long and values up to 500 characters long.
          additionalProperties:
            type: string
        next_action:
          $ref: '#/components/schemas/Payment_Acceptance_NextAction'
          description: Next action for merchant.
        order:
          $ref: '#/components/schemas/Payment_Acceptance_PurchaseOrder'
          description: Purchase order related to this Payment Intent.
        payment_consent:
          $ref: '#/components/schemas/PaymentConsentOptions'
          description: The associated **Payment Consent** to set up along with the Payment Intent.
        payment_consent_id:
          type: string
          description: Unique identifier of the Payment Consent related to this Payment Intent.
        payment_link_id:
          type: string
          description: Payment Link unique identifier (if this intent was created by Payment Link).
        payment_method_options:
          $ref: '#/components/schemas/PaymentMethodOptionsForCreate'
          description: Options for Payment Method.
        request_id:
          type: string
          description: Unique request identifier specified by the merchant in the last operation.
        return_url:
          type: string
          description: The web page URL or application scheme URI to redirect the customer after payment authentication.
        risk_control_options:
          $ref: '#/components/schemas/RiskControlOptions'
          description: Risk Control Options.
        status:
          type: string
          description: "Please note that this list of statuses is not exhaustive, you should be prepared to handle intent statuses beyond those explicitly mentioned.\n\n- **REQUIRES_PAYMENT_METHOD**: The Payment Intent is waiting for the [confirm](/docs/api/payments/payment_intents/confirm) request.\n  - This status is returned right after the Payment Intent is created or the previous Payment Attempt has failed or expired.\n- **REQUIRES_CUSTOMER_ACTION**: The Payment Intent is waiting for further customer action of authentication, e.g. 3DS verification and QR code scan. Please check the `next_action`.\n- **PENDING_REVIEW**: The Payment Intent was successfully authorized, but it is currently under review for risk compliance.\n- **REQUIRES_CAPTURE**: The Payment Intent is waiting for your [capture](/docs/api/payments/payment_intents/capture) to complete the payment.\n- **PENDING**: The Payment Intent is pending the final result from the provider. No further action is required.\n- **SUCCEEDED**: The Payment Intent has succeeded. The payment is complete.\n- **CANCELLED**: The Payment Intent has been canceled by your [request](/docs/api/payments/payment_intents/cancel). The payment is closed.\n"
        triggered_by:
          type: string
          description: "Indicates who initiated the payment — the `merchant` or the `customer`.\n- `merchant`: The payment is initiated by the merchant to collect a subsequent payment where the customer is not in session.\n- `customer`: The payment is initiated by the customer using stored payment method details. \n"
        updated_at:
          type: string
          format: date-time
          description: Last time at which this Payment Intent was updated or operated on.
