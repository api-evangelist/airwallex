                              room_type:
                                type: string
                                description: Type of room. For example `Presidential Suite`, `Single Room`, `Double Room`, `Suite`.
                              tax_amount:
                                type: number
                                description: Taxes and fees applied to the accommodation price.
                              type:
                                type: string
                                description: Type of accommodation. For example `Hotel`, `Hostel`, `Resort`, `Apartment`.
                        buses:
                          type: array
                          description: The details of the buses travel.
                          items:
                            type: object
                            required:
                            - arrival_city
                            - class_of_service
                            - departure_city
                            - passenger_name
