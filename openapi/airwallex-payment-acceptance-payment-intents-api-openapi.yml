                        expiry_year:
                          type: string
                          description: Four digit number representing the card’s expiration year. Required when `pan_entry_mode` is `manual_entry`.
                        fallback:
                          type: boolean
                          description: "The default is `false`. Set to `true` when:  \n- Chip card at a chip-capable terminal was unable to process transactions using data on the chip or magnetic strip and use entry mode `manual`.  \n- Chip card at a chip-capable terminal was unable to process transactions using data on the chip and use entry mode `contact_magnetic_stripe_card`."
                        fallback_reason:
                          type: string
                          description: "Fallback reason applicable when `fallback` is `true`.  \nSet to `chip_read_failure` when all of the following conditions are met:  \n- The transaction is initiated at a chip-capable terminal.  \n- `pan_entry_mode` is `magstripe`.  \n- The previous transaction initiated by the terminal was an unsuccessful chip read."
