  /api/v1/pa/payment_intents/{id}/cancel:
    post:
      tags:
      - Payment Acceptance > Payment Intents
      summary: 9|Cancel a Payment Intent
      description: 'A Payment Intent can be cancelled when it is in one of these statuses: `REQUIRES_PAYMENT_METHOD`, `REQUIRES_CUSTOMER_ACTION`, `REQUIRES_CAPTURE`.


        Any outstanding, un-captured funds will be refunded once cancelled.'
      operationId: paymentIntents_cancel
      parameters:
      - name: id
        in: path
        description: Payment Intent unique identifier.
        required: true
        schema:
          type: string
          default: int_e65tkXCSzJrsMpTrzoFrjaau53
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                cancellation_reason:
                  type: string
                  description: The reason for canceling the Payment Intent.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
        description: Payment Intent cancellation request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentSingle'
        '201':
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request`, `invalid_status_for_operation`, `provider_unavailable`, `provider_declined`, `issuer_declined`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url), `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
