  /api/v1/pa/payment_intents/{id}/update:
    post:
      tags:
      - Payment Acceptance > Payment Intents
      summary: 4|Update a Payment Intent
      description: 'Update properties on a Payment Intent.


        Some properties are only allowed to be updated in `REQUIRES_PAYMENT_METHOD` or `REQUIRES_CUSTOMER_ACTION` status. Depending on which properties you update and the status of Payment Intent, you might need to confirm the Payment Intent again. For example, updating the `currency` and `amount` in `REQUIRES_CUSTOMER_ACTION` status always requires you to confirm the Payment Intent again.


        The update behavior follows these principles:

        1\. Omitted fields in the request payload will be ignored and have no impact on the existing value.

        2\. Provided fields in the request payload will be merged to the existing data(except for array fields, it will be a full replacement).

        3\. Conditional fields can be nullified by passing a null value or empty value(for string type only).'
