                          type: string
                          description: Key serial number while using DUKPT for PIN encryption.
                        number:
                          type: string
                          description: Card number. Required when `pan_entry_mode` is `manual_entry`.
                        pan_entry_mode:
                          type: string
                          description: "The way the terminal reads the card information.  \n- `manual_entry`: Manually keyed into POS terminal.  \n- `chip`: Read from direct contact with a chip card.  \n- `magstripe`: Read from direct contact with magnetic stripe card.  \n- `contactless_chip`: Read from a contactless interface using chip data.  \n- `contactless_magstripe`: Read from a contactless interface using magnetic stripe data (MSD)."
                        terminal_info:
                          type: object
                          required:
