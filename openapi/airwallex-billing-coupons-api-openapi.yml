  /api/v1/billing/coupons:
    get:
      description: Get a list of coupons.
      operationId: listCoupons
      parameters:
      - description: "Specified how to calculate the discount amount when applied, one of \n- `FLAT`: fixed amount off.\n- `PERCENTAGE`: percentage off."
        in: query
        name: discount_model
        required: false
        schema:
          type: string
      - description: '`true` if the coupon is available to be applied to objects. `false` otherwise.'
        in: query
        name: active
        required: false
        schema:
          type: boolean
      - description: "Determines how long the coupon's discount remains active after being applied. Possible values: \n- `ONCE`: Applies only to the first charge of a subscription or a one-off invoice.\n- `CUSTOM`: Applies to all charges within a specified number of billing cycles, as defined by duration.\n- `INDEFINITELY`: Applies to all future charges for the subscription until it is removed."
        in: query
        name: duration_type
        required: false
        schema:
          type: string
      - description: The start time of expires_at in ISO8601 format (inclusive).
        in: query
        name: from_expires_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The end time of expires_at in ISO8601 format (exclusive).
        in: query
        name: to_expires_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The start time of created_at in ISO8601 format (inclusive).
        in: query
        name: from_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The end time of created_at in ISO8601 format (exclusive).
        in: query
        name: to_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not `null`) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not `null`) from the response to a subsequent call.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: Number of results per page. Defaults to 20.
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
