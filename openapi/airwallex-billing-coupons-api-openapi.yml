  /api/v1/billing/coupons/{id}/update:
    post:
      description: Updates a coupon. Before first redemption, all fields can be adjusted; after redemption, only non-billing fields (name, description, expires_at, metadata) can be updated to maintain contractual integrity.
      operationId: updateCoupon
      parameters:
      - description: ID of the Coupon object.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                active:
                  type: boolean
                  description: Whether the coupon is active and can be redeemed. Set to false to deactivate the coupon.
                amount_off:
                  type: number
                  description: "The fixed amount to deduct when `discount_model` is `FLAT`.\n This field cannot be updated once the coupon has been redeemed."
                currency:
                  type: string
                  description: "The currency of `amount_off` when `discount_model` is `FLAT`. \nThis field cannot be updated once the coupon has been redeemed."
                description:
                  type: string
                  description: Description of the coupon providing business context.
                discount_model:
                  pattern: ^(FLAT|PERCENTAGE)$
                  type: string
                  description: "Specified how to calculate the discount amount when applied, one of \n- `FLAT`: fixed amount off.\n- `PERCENTAGE`: percentage off.\nThis field cannot be updated once the coupon has been redeemed."
                duration:
                  required:
                  - period
                  - period_unit
                  type: object
                  description: "The duration of the coupon to apply, when `duration_type`is `CUSTOM`. `null` if `duration_type` is `ONCE` or `INDEFINITELY`. \nThis field cannot be updated once the coupon has been redeemed."
                  properties:
                    period:
                      minimum: 1
                      type: integer
                      description: The number of `period_unit`.
                      format: int32
                    period_unit:
                      pattern: ^(DAY|WEEK|MONTH|YEAR)$
                      type: string
                      description: Specifies duration. One of `DAY`, `WEEK`, `MONTH`, `YEAR`.
                duration_type:
                  pattern: ^(ONCE|CUSTOM|INDEFINITELY)$
                  type: string
                  description: "Determines how long the coupon's discount remains active after being applied. Possible values: \n- `ONCE`: Applies only to the first charge of a subscription or a one-off invoice.\n- `CUSTOM`: Applies to all charges within a specified number of billing cycles, as defined by duration.\n- `INDEFINITELY`: Applies to all future charges for the subscription until it is removed.\nThis field cannot be updated once the coupon has been redeemed."
                expires_at:
                  type: string
                  description: Time after which the coupon can no longer be redeemed.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of string key-value pairs that you can attach to this object for storing additional information.
                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                name:
                  type: string
                  description: Name of the coupon.
                percentage_off:
                  maximum: 100
                  minimum: 0
                  type: number
                  description: "The percentage to deduct when discount_model is PERCENTAGE. \nThis field cannot be updated once the coupon has been redeemed."
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 4|Update a Coupon
      tags:
      - Billing > Coupons
