paths:
  /api/v1/billing/coupons/create:
    post:
      description: Creates a new coupon template that can be redeemed in purchases.
      operationId: createCoupon
      requestBody:
        content:
          application/json:
            schema:
              required:
              - discount_model
              - duration_type
              - name
              - request_id
              type: object
              properties:
                amount_off:
                  maximum: 9999999999
                  minimum: 0
                  type: number
                  description: The fixed amount to deduct when `discount_model` is `FLAT`.
                currency:
                  type: string
                  description: The currency of `amount_off` when `discount_model` is `FLAT`.
                description:
                  type: string
                  description: Description of the coupon providing business context.
                discount_model:
                  pattern: ^(FLAT|PERCENTAGE)$
                  type: string
                  description: "Specified how to calculate the discount amount when applied, one of \n- `FLAT`: fixed amount off.\n- `PERCENTAGE`: percentage off."
                duration:
                  required:
                  - period
                  - period_unit
                  type: object
                  description: The duration of the coupon to apply, when `duration_type`is `CUSTOM`. `null` if `duration_type` is `ONCE` or `INDEFINITELY`.
                  properties:
                    period:
                      minimum: 1
                      type: integer
                      description: The number of `period_unit`.
                      format: int32
                    period_unit:
                      pattern: ^(DAY|WEEK|MONTH|YEAR)$
                      type: string
                      description: Specifies duration. One of `DAY`, `WEEK`, `MONTH`, `YEAR`.
                duration_type:
                  pattern: ^(ONCE|CUSTOM|INDEFINITELY)$
                  type: string
                  description: "Determines how long the coupon's discount remains active after being applied. Possible values: \n- `ONCE`: Applies only to the first charge of a subscription or a one-off invoice.\n- `CUSTOM`: Applies to all charges within a specified number of billing cycles, as defined by duration.\n- `INDEFINITELY`: Applies to all future charges for the subscription until it is removed."
                expires_at:
                  type: string
                  description: Time after which the coupon can no longer be redeemed.
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of string key-value pairs that you can attach to this object for storing additional information.
                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                name:
                  maxLength: 200
                  minLength: 0
                  type: string
                  description: Name of the coupon.
                percentage_off:
                  maximum: 100
                  minimum: 0
                  type: number
                  description: The percentage between 0 to 100 to be applied to deduct when `discount_model` is `PERCENTAGE`.
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Create a Coupon
      tags:
      - Billing > Coupons
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/billing/coupons/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          amount_off: 10
          currency: USD
          description: 20% off for Black Friday.
          discount_model: PERCENTAGE
          duration:
            period: 3
            period_unit: MONTH
          duration_type: CUSTOM
          expires_at: 2026-12-31T23:59:59+0000
          metadata:
            campaign: bf-2026
          name: Black Friday 20% Off
          percentage_off: 20
          request_id: ee939540-3203-4a2c-9172-89a566485dd9
        response_body:
          active: true
          amount_off: 10
          created_at: <date-time>
          currency: USD
          description: 20% off for Black Friday.
          discount_model: PERCENTAGE
          duration:
            period: 3
            period_unit: MONTH
          duration_type: CUSTOM
          expires_at: 2026-12-31T23:59:59+0000
          id: coup_abc123
          metadata:
            campaign: bf-2026
          name: Black Friday 20% Off
          percentage_off: 20
          times_redeemed: 0
          updated_at: <date-time>
