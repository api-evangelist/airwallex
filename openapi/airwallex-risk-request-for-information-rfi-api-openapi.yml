  /api/v1/rfis:
    get:
      tags:
      - Risk > Request for Information (RFI)
      summary: 2|List all RFIs
      description: Returns a list of RFIs raised for your Airwallex account, sorted by the RFI creation date in descending order.
      operationId: listRequestForInformationRfi
      parameters:
      - name: end_created_at
        in: query
        description: The end date of created_at in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: from_created_at
        in: query
        description: The start date of created_at in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page
        in: query
        description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of page_after (if not null) from the response to a subsequent call. To retrieve the previous page of results, pass the value of page_before (if not null) from the response to a subsequent call.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_size
        in: query
        description: A limit on the number of records to be returned on a page, between 1 and 2000. The default is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
      - name: statuses
        in: query
        description: List of RFI status separated by `,`. One of `ACTION_REQUIRED`, `ANSWERED`, `CLOSED`.
        required: false
        allowEmptyValue: false
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: types
        in: query
        description: List of RFI types separated by `,`. Currently only supports `KYC`, `KYC_ONGOING`, `CARDHOLDER`, `TRANSACTION` and `PAYMENT_ENABLEMENT` type.
        required: false
        allowEmptyValue: false
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRfiSessionQueryResult'
        '400':
          description: '["invalid_argument"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: '["internal_server_error"]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
