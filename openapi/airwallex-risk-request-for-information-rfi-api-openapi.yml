  /api/v1/rfis/{id}/respond:
    post:
      tags:
      - Risk > Request for Information (RFI)
      summary: 3|Respond to an RFI
      description: Allows you to respond to an RFI request by providing the required answers.
      operationId: respond
      parameters:
      - name: id
        in: path
        description: Unique identifier of the RFI.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                questions:
                  type: array
                  description: List of questions.
                  items:
                    type: object
                    properties:
                      answer:
                        type: object
                        description: Response to the question.
                        properties:
                          address:
                            type: object
                            description: Response for `ADDRESS` type.
                            properties:
                              address_line1:
                                type: string
                                description: The first line of a physical address, typically including the street number and name of the building or residence. A P.O. box is not acceptable.
                              address_line2:
                                type: string
                                description: An optional field that can be used to capture additional information about the address, such as the apartment/ suite number, or floor number.
                              country_code:
                                type: string
                                description: Country code. (2-letter ISO 3166-2 country code).
                              postcode:
                                type: string
                                description: Postcode or zip code. Only applicable if relevant to selected country.
                              state:
                                type: string
                                description: Name of state. Only applicable if relevant to selected country.
                              suburb:
                                type: string
                                description: Name of city/suburb.
                          attachments:
                            type: array
                            description: Response for `ATTACHMENT` type.
                            items:
                              type: object
                              properties:
                                file_id:
                                  type: string
                                  description: File id provided in the response from the File Service API.
                          comment:
                            type: string
                            description: Comment for this response.
                          confirmed:
                            type: boolean
                            description: Response for `CONFIRMATION` type.
                          identity_document:
                            type: object
                            description: Response for `IDENTITY_DOCUMENT` type.
                            properties:
                              back_file_id:
                                type: string
                                description: File id of the photo of the back of the document.
                              front_file_id:
                                type: string
                                description: File id of the photo of the front of the document.
                              issuing_country:
                                type: string
                                description: Country issuing the document. (2-letter ISO 3166-2 country code).
                              number:
                                type: string
                                description: Identity number.
                              type:
                                type: string
                                description: Type of identity document. One of `DRIVING_LICENSE`,`PASSPORT`,`IDENTITY_CARD`,`MEDICARE_CARD`,`SSN`,`ITIN`.
                          text:
                            type: string
                            description: Response for `TEXT` type.
                          type:
                            type: string
                            description: The type of response to the question.
                            enum:
                            - TEXT
                            - ATTACHMENT
                            - IDENTITY_DOCUMENT
                            - CONFIRMATION
                            - LIVENESS
                            - ADDRESS
                      id:
                        type: string
                        description: Unique identifier for the question.
        description: RFI response.
        required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfiSession'
        '400':
          description: '["invalid_state_for_operation"

