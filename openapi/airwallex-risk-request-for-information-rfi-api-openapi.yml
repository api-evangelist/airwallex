          description: 'The type of the source. Type of values and their corresponding API:



            -   `PERSON`: [Get account by ID](/docs/api/scale/accounts/retrieve)


            -   `BUSINESS`: match `account_details.business_person_details.person_id` with the source id

            -   `INDIVIDUAL`: match `account_details.individual_details.person_id` with the source id

            -   If there is no matched person on your account, this indicates that Airwallex has introduced a new individual during the review process. Once verification is complete, this person will be added to your account.


            -   `CARDHOLDER`: [Get cardholder details](/docs/api/issuing/cardholders/retrieve)

            -   `PAYMENT_INTENT`: [Retrieve a PaymentIntent](/docs/api/payments/payment_intents/retrieve)


            For `TRANSACTION` RFI:


            -   `CHARGE`: [Get a charge by ID](/docs/api/scale/charges/retrieve)

            -   `CONNECTED_ACCOUNT_TRANSFER`: [Get a connected account transfer by ID](/docs/api/scale/connected_account_transfers/retrieve)

            -   `DIRECT_DEBIT`: [Get direct debit by ID](/docs/api/core_resources/direct_debits/retrieve)

            -   `DEPOSIT`: [Get a deposit by ID](/docs/api/core_resources/deposits/retrieve)

            -   `TRANSFER`: [Get a transfer by ID](/docs/api/payouts/transfers/retrieve).'
