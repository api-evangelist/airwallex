openapi: 3.2.0
info:
  title: Airwallex Simulation (Sandbox Only) > Deposits API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Simulation (Sandbox Only) > Deposits
  description: 'You can receive funds into your Airwallex Wallet via bank transfers to Global Accounts or direct debits from Linked Accounts.


    The Global Accounts deposit simulation API allows you to simulate a deposit from an external bank account in the sandbox environment.


    The Direct Debit deposit simulation APIs allow you to transition Direct Debit deposit statuses in the sandbox environment.'
  x-domain: Simulation (Sandbox Only)
  x-resource: Deposits
  x-urlPath: simulation/deposits
paths:
  /api/v1/simulation/deposit/create:
