  /api/v1/simulation/deposits/{deposit_id}/reverse:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Deposits
      summary: 2|Reverse a Direct Debit Deposit
      description: Creates a new direct debit deposit in the `SETTLED` state with an amount that offsets the original amount, i.e. negative value, and also deactivates the Linked Account. The original direct debit deposit will remain in the `SETTLED` state.
      operationId: simulation_reverse
      parameters:
      - name: deposit_id
        in: path
        description: Unique identifier of the direct debit deposit.
        required: true
        schema:
          type: string
          format: uuid
          default: dd745da6-d48a-4347-87c2-3c33b920f5b1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '404':
          description: not_found
        '500':
          description: service_unavailable
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/simulation/deposits/deposit_id/reverse
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body: false
      x-scope:
      - scope: simulation:write
        group: Simulations
        resource_name: Simulations
      x-domain: Simulation (Sandbox Only)
      x-resource: Deposits
      x-urlPath: reverse
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
  /api/v1/simulation/deposits/{deposit_id}/settle:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Deposits
      summary: 3|Settle a Direct Debit Deposit
      description: Settles a pending deposit by transitioning the direct debit deposit status from `PENDING` to `SETTLED`.
      operationId: simulation_settle
      parameters:
      - name: deposit_id
        in: path
        description: Unique identifier of the direct debit deposit.
        required: true
        schema:
          type: string
          format: uuid
          default: dd745da6-d48a-4347-87c2-3c33b920f5b1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '404':
          description: not_found
        '500':
          description: service_unavailable
      x-examples:
