        group: Simulations
        resource_name: Simulations
      x-domain: Simulation (Sandbox Only)
      x-resource: Deposits
      x-urlPath: settle
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
  /api/v1/simulation/deposits/{deposit_id}/reject:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Deposits
      summary: 4|Reject a Direct Debit Deposit
      description: Rejects a pending deposit by transitioning the direct debit deposit status from `PENDING` to `REJECTED`.
      operationId: simulation_reject
      parameters:
      - name: deposit_id
        in: path
        description: Unique identifier of the direct debit deposit.
        required: true
        schema:
          type: string
          format: uuid
          default: dd745da6-d48a-4347-87c2-3c33b920f5b1
