      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Deposits
      summary: 1|Create a Global Account Deposit
      description: You can use this endpoint to simulate deposits into your global account. This is only available in the sandbox environment.
      operationId: simulation_createDeposit
