  /api/v1/pa/payment_links:
    get:
      tags:
      - Payment Acceptance > Payment Links
      summary: 3|List all Payment Links
      description: Retrieves a list of payment links that a merchant has created previously.
      operationId: listPaymentLinks
      parameters:
      - name: active
        in: query
        description: The payment link's active status, either `true` or `false`.
        required: false
        schema:
          type: boolean
      - name: from_created_at
        in: query
        description: Specifies start time (inclusive) in ISO 8601 for a range query by created timestamp.
        required: false
        schema:
          type: string
          format: date-time
          default: '2021-08-01T00:00:00Z'
      - name: page_num
        in: query
        description: Page number starting from 0.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          default: 0
      - name: page_size
        in: query
        description: Number of payment links to be listed per page.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 1000
          default: 100
      - name: reusable
        in: query
        description: Specifies whether the payment link can be used once or multiple times.
        required: false
        schema:
          type: boolean
      - name: status
        in: query
        description: Status of the payment link, one of `UNPAID` or `PAID`.
        required: false
        schema:
          type: string
      - name: to_created_at
        in: query
        description: Specifies end time (exclusive) in ISO 8601 for a range query by created timestamp.
        required: false
        schema:
          type: string
          format: date-time
          default: '2021-08-17T11:00:00Z'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: List items.
                    items:
                      $ref: '#/components/schemas/PaymentLink'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
