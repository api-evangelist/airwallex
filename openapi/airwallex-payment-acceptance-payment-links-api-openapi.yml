                  description: The payment currency. For Fixed pricing only.
                default_currency:
                  type: string
                  description: The default payment currency from the list of `supported_currencies`. The shopper can change the payment currency during checkout. For Flexible pricing only.
                description:
                  type: string
                  description: The additional description text that appears under the title in the payment checkout page.
                  minLength: 0
                  maxLength: 500
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to the Payment Link for storing additional information.
                  additionalProperties:
                    type: string
                reference:
                  type: string
                  description: A reference only visible to the merchant.
                  minLength: 0
                  maxLength: 200
                supported_currencies:
                  type: array
                  description: List of supported currencies the shopper may choose from. For Flexible pricing only.
                  items:
                    type: string
                ui_options:
                  type: object
                  description: UI configuration for the payment checkout page.
                  properties:
                    theme_id:
                      type: string
                      description: ID of the theme to apply to this payment link, overriding the theme configured for its account. You can find the theme ID in the Airwallex web app under Settings > Themes.
                title:
                  type: string
                  description: The title of the payment link that is displayed in the payment checkout page.
                  minLength: 0
                  maxLength: 200
        description: Request to update the payment link.
        required: true
      responses:
        '200':
          description: OK
