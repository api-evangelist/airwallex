components:
  schemas:
    PaymentLink:
      type: object
      properties:
        active:
          type: boolean
          description: The payment link’s active status, either `true` or `false`.
        amount:
          type: number
          description: The payment amount for Fixed pricing.
        collectable_shopper_info:
          $ref: '#/components/schemas/CollectableShopperInfo'
          description: Every payment link requires the shopper to enter their name and email address. Additionally, you can request information for the following fields on each payment link.
        created_at:
          type: string
          format: date-time
          description: Timestamp in ISO 8601 format when the payment link was created.
        currency:
          type: string
          description: The payment currency for Fixed pricing.
        customer_id:
          type: string
          description: The Customer who is paying for this Payment Link. Only applicable for links with `reusable` equals to `false`. This field is required if you want the payer to see the payment methods saved in the previous checkouts.
        default_currency:
          type: string
          description: The default currency for Flexible pricing.
        description:
          type: string
          description: The additional description text that appears under the title in the payment checkout page.
        expires_at:
          type: string
          format: date-time
          description: Payment link expiry timestamp in ISO 8601 format.
        id:
          type: string
          format: uuid
          description: Payment link unique identifier.
        latest_successful_payment_intent_id:
          type: string
          description: Payment Intent unique identifier of the latest payment (if any) successfully paid by your shopper via the payment link.
        metadata:
          type: object
          description: A set of key-value pairs that you can attach to the Payment Link for storing additional information.
          additionalProperties:
            type: string
        reference:
          type: string
          description: A reference only visible to the merchant.
        reusable:
          type: boolean
          description: Specifies whether the payment link can be used once or multiple times.
        status:
          type: string
          description: Status of the payment link, one of `UNPAID` or `PAID`. The payment link transitions from `UNPAID` to `PAID` when a payment is received.
        successful_payment_intent_count:
          type: integer
          format: int64
          description: The number of Payment Intents successfully paid by your shopper via the payment link.
        supported_currencies:
          type: array
          description: The supported currencies for Flexible pricing.
          items:
            type: string
        ui_options:
          type: object
          description: UI configuration for the payment checkout page.
          properties:
            theme_id:
              type: string
              description: ID of the theme to apply to this payment link, overriding the theme configured for its account.
        title:
          type: string
          description: The title of the payment link that is displayed in the payment checkout page.
        updated_at:
          type: string
          format: date-time
          description: Timestamp in ISO 8601 format when the payment link was last updated.
        url:
          type: string
          description: The payment URL to the checkout page.
    CollectableShopperInfo:
      type: object
      properties:
        billing_address:
          type: boolean
          description: Defaults to `false`. If true, the shopper is required to input their billing address.
        message:
          type: boolean
          description: Defaults to `true`. This is an optional field for the shopper to leave a message with their payment.
        phone_number:
          type: boolean
          description: Defaults to `false`. If true, the shopper is required to input their phone number.
        reference:
          type: boolean
          description: Defaults to `false`. If true, the shopper is required to input a reference.
        shipping_address:
          type: boolean
          description: Defaults to `false`. If true, the shopper is required to input their shipping address.
      description: Every payment link requires the shopper to enter their name and email address. Additionally, you can request information for the following fields on each payment link.
