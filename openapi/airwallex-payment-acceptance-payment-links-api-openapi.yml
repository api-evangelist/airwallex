openapi: 3.2.0
info:
  title: Airwallex Payment Acceptance > Payment Links API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payment Acceptance > Payment Links
  description: 'The **Payment Links** API allows you to accept payments from shoppers using a payment link URL. The payment link URL takes your shopper to an Airwallex hosted secure checkout page where they can make the payment with their preferred payment method.


    The Payment Link supports two pricing options:


    1. Fixed pricing - Both the payment `amount` and `currency` are locked. The shopper must pay the exact amount in the given currency.

    2. Flexible pricing - The shopper chooses to pay from a list of supported currencies you specify and decide on the exact amount to pay.'
  x-domain: Payment Acceptance
  x-resource: Payment Links
  x-urlPath: payments/payment_links
paths:
  /api/v1/pa/payment_links/create:
    post:
      tags:
      - Payment Acceptance > Payment Links
      summary: 1|Create a Payment Link
      description: Create a new payment link.
      operationId: createPaymentLink
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reusable
              - title
              properties:
                amount:
                  type: number
                  description: The payment amount. For Fixed pricing only.
                collectable_shopper_info:
                  type: object
                  description: Every payment link requires the shopper to enter their name and email address. Additionally, you can request information for the following fields on each payment link.
                  properties:
                    billing_address:
                      type: boolean
                      description: Defaults to `false`. If true, the shopper is required to input their billing address.
                    message:
                      type: boolean
                      description: Defaults to `true`. This is an optional field for the shopper to leave a message with their payment.
                    phone_number:
                      type: boolean
                      description: Defaults to `false`. If true, the shopper is required to input their phone number.
                    reference:
                      type: boolean
                      description: Defaults to `false`. If true, the shopper is required to input a reference.
                    shipping_address:
                      type: boolean
                      description: Defaults to `false`. If true, the shopper is required to input their shipping address.
                connected_account_id:
                  type: string
                  description: 'Airwallex assigned account identifier of the connected entity(another account which is linked with platform). It is to be used by the platform to indicate the connected entity in the transaction where platform is the owner of transaction. Notice: This can not be used with x-on-behalf-of header together.'
                currency:
                  type: string
                  description: The payment currency. For Fixed pricing only.
                customer_id:
                  type: string
                  description: The Customer who is paying for this Payment Link. Only applicable for links with `reusable` equals to `false`. This field is required if you want the payer to see the payment methods saved in the previous checkouts.
                default_currency:
                  type: string
                  description: The default payment currency from the list of `supported_currencies`. The shopper can change the payment currency during checkout. For Flexible pricing only.
                description:
                  type: string
                  description: The additional description text that appears under the title in the payment checkout page.
                  minLength: 0
                  maxLength: 500
                expires_at:
                  type: string
                  format: date-time
                  description: Payment link expiry timestamp in ISO 8601 format.
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to the Payment Link for storing additional information.
                  additionalProperties:
                    type: string
                reference:
                  type: string
                  description: A reference only visible to the merchant.
                  minLength: 0
                  maxLength: 200
                reusable:
                  type: boolean
                  description: Specifies whether the payment link can be used once or multiple times.
                supported_currencies:
                  type: array
                  description: List of supported currencies the shopper may choose from. For Flexible pricing only.
                  items:
                    type: string
                ui_options:
                  type: object
                  description: UI configuration for the payment checkout page.
                  properties:
                    theme_id:
                      type: string
                      description: ID of the theme to apply to this payment link, overriding the theme configured for its account. You can find the theme ID in the Airwallex web app under Settings > Themes.
                title:
                  type: string
                  description: The title of the payment link that is displayed in the payment checkout page.
                  minLength: 0
                  maxLength: 200
        description: Request to create a new payment link.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '201':
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `configuration_error`, `resource_not_found`(invalid `customer_id`)'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/pa/payment_links/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          amount: 165.15
          collectable_shopper_info:
            billing_address: false
            message: true
            phone_number: false
            reference: false
            shipping_address: false
          connected_account_id: acct_4lnVokTfP3ulKDlzLDJdjg
          currency: EUR
          customer_id: cus_ps8e0ZgQzd2QnCxVpzJrHD6KOVu
          default_currency: EUR
          description: shoes and dress.
          expires_at: '2021-11-04T16:00:00Z'
          metadata:
            customer_id: '12345678'
          reference: '1529'
          reusable: false
          supported_currencies:
          - EUR
          - AUD
          ui_options:
            theme_id: tm_sgpdvff8whip0bfgzzt
          title: 'Order #1529'
        response_body:
          active: true
          amount: 165.15
          collectable_shopper_info:
            billing_address: false
            message: true
            phone_number: false
            reference: false
            shipping_address: false
          created_at: '2021-08-17T11:00:00+00:00'
          currency: EUR
          customer_id: cus_ps8e0ZgQzd2QnCxVpzJrHD6KOVu
          default_currency: EUR
          description: shoes and dress.
          expires_at: '2021-11-04T16:00:00+00:00'
          id: 475dc845-bc7c-47eb-b2b0-52782b9d078d
          latest_successful_payment_intent_id: int_e65tkXCSzJrsMpTrzoFrjaau53
          metadata:
            customer_id: '12345678'
          reference: '1529'
          reusable: true
          status: PAID
          successful_payment_intent_count: 1
          supported_currencies:
          - EUR
          - AUD
          ui_options:
            theme_id: tm_sgpdvff8whip0bfgzzt
          title: 'Order #1529'
          updated_at: '2021-08-17T11:05:00+00:00'
          url: https://pay.airwallex.com/hkdab0d955b5
      x-scope:
      - scope: payment_acceptance:write
        group: Payment Acceptance
        resource_name: Payment Acceptance
      - scope: payment_link:write
        group: Payment Acceptance
        resource_name: Payment Links
      x-domain: Payment Acceptance
      x-resource: Payment Links
      x-urlPath: create
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
