      summary: 6|Activate a Payment Link
      description: Activates an inactive payment link.
      operationId: paymentLinks_activate
      parameters:
      - name: id
        in: path
        description: Payment link unique identifier.
        required: true
        schema:
          type: string
          format: uuid
          default: 475dc845-bc7c-47eb-b2b0-52782b9d078d
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '201':
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `invalid_status_for_operation`, `configuration_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url), `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/pa/payment_links/payment_link_id/activate
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          active: true
          amount: 165.15
          collectable_shopper_info:
            billing_address: false
