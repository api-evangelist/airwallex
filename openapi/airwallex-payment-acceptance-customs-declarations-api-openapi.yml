components:
  schemas:
    CustomsDetails:
      type: object
      required:
      - customs_code
      - merchant_customs_name
      - merchant_customs_number
      properties:
        customs_code:
          type: string
          description: China customs code, please refer to here for information https://www.airwallex.com/docs/payments/apac/wechat-pay/customs-declaration,https://www.airwallex.com/docs/payments/apac/alipay/customs-declaration.
        merchant_customs_name:
          type: string
          description: Merchant's registered name in customs system. Maximum length is 256.
        merchant_customs_number:
          type: string
          description: Merchant's registered number in customs system. Maximum length is 32.
      description: Customs details.
    SubOrder:
      type: object
      required:
      - amount
      - currency
      - order_number
      - shipping_fee
      properties:
        amount:
          type: number
          description: The total amount of your sub_order, shipping fee shall be included, unit is Yuan. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
        currency:
          type: string
          description: Currency for the suborder, only CNY supported now.
        order_number:
          type: string
          description: Suborder number in merchant system. Maximum length is 128.
        provider_order_id:
          type: string
          description: 'The unique transaction identifier assigned by the provider for your sub_order. Please use this field as the provider transaction no. for your order information/shipment information’s declaration. Example of our providers: Cards, WeChat, Alipay etc.'
        shipping_fee:
          type: number
          description: Suborder transport fee, unit is Yuan.
      description: Suborder info, required for each customs declaration.
    CustomsDeclaration:
      type: object
      properties:
        awx_request_id:
          type: string
          description: Request unique identifier generated by Air Wallex send to the provider for a Payment Attempt.
        created_at:
          type: string
          format: date-time
          description: Time at which the Customs Declaration was created.
        customs_details:
          $ref: '#/components/schemas/CustomsDetails'
          description: Customs details.
        customs_status_message:
          type: string
          description: Additional status message from customs.
        id:
          type: string
          description: Unique identifier for the Customs Declaration.
        payment_method_type:
          type: string
          description: Payment method type of the Payment Attempt.
        provider_transaction_id:
          type: string
          description: 'The unique transaction identifier assigned by the provider for a payment attempt. Example of our providers: Cards, WeChat, Alipay etc.'
        request_id:
          type: string
          description: Unique request identifier specified by the merchant in the last operation.
        shopper_identity_check_result:
          type: string
          description: Identity check result of the shopper.
        status:
          type: string
          description: Customs processing status, UNDECLARED/PROCESSING/SUCCESS/FAIL.
        sub_order:
          $ref: '#/components/schemas/SubOrder'
          description: Suborder info, required for each customs declaration.
        updated_at:
          type: string
          format: date-time
          description: Last time at which the Customs Declaration was updated or operated on.
        verification_department_code:
          type: string
          description: Verification department code.
        verification_department_transaction_id:
          type: string
          description: Transaction unique identifier returned by verification department.
