  /api/v1/pa/customs_declarations/{id}/update:
    post:
      tags:
      - Payment Acceptance > Customs Declarations
      summary: 3|Update a Customs Declaration
      description: Update an existing customs declaration. `SHANGHAI_CBT` does not support update after a successful declaration.
      operationId: updateCustomsDeclaration
      parameters:
      - name: id
        in: path
        description: id.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                customs_code:
                  type: string
                  description: China customs code.
                merchant_customs_name:
                  type: string
                  description: Merchant's registered name in customs system. Maximum length is 256.
                merchant_customs_number:
                  type: string
                  description: Merchant's registered number in customs system. Maximum length is 32.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
                shopper_details:
                  type: object
                  required:
                  - shopper_id
                  - shopper_name
                  description: Shopper details. Will be used to update shopper identity check information.
                  properties:
                    shopper_id:
                      type: string
                      description: Mainland China unique identifier of the shopper.
                    shopper_name:
                      type: string
                      description: Name of the shopper in simplified Chinese.
                sub_order_amount:
                  type: number
                  description: Suborder amount. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
        description: Customs declaration update request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsDeclaration'
        '201':
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `invalid_status_for_operation`, `provider_declined`, `provider_unavailable`'
        '401':
