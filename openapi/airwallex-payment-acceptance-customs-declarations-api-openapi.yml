openapi: 3.2.0
info:
  title: Airwallex Payment Acceptance > Customs Declarations API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payment Acceptance > Customs Declarations
  description: The **Customs Declaration** API help merchants to complete customs clearance process as regulation required. This API applies only to China customs requirements and workflows.
  x-domain: Payment Acceptance
  x-resource: Customs Declarations
  x-urlPath: payments/customs_declarations
paths:
  /api/v1/pa/customs_declarations/create:
    post:
      tags:
      - Payment Acceptance > Customs Declarations
      summary: 1|Create a Customs Declaration
      description: Start the declaration process by creating a customs declaration. Please note that sub_order fields are required. If there is no need to split your original order, please fill the sub_order fields with your original order information for declaration. In this case, remember to use the provider_order_id in the response for your order information/shipment information declaration.
      operationId: createCustomsDeclaration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - customs_details
              - payment_intent_id
              - request_id
              properties:
                customs_details:
                  type: object
                  required:
                  - customs_code
                  - merchant_customs_name
                  - merchant_customs_number
                  description: Customs details.
                  properties:
                    customs_code:
                      type: string
                      description: China customs code, please refer to here for information https://www.airwallex.com/docs/payments/apac/wechat-pay/customs-declaration,https://www.airwallex.com/docs/payments/apac/alipay/customs-declaration.
                    merchant_customs_name:
                      type: string
                      description: Merchant's registered name in customs system. Maximum length is 256.
                    merchant_customs_number:
                      type: string
                      description: Merchant's registered number in customs system. Maximum length is 32.
                payment_intent_id:
                  type: string
                  description: Unique identifier of the payment intent on which customs declaration will be created.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
                shopper_details:
                  type: object
                  required:
                  - shopper_id
                  - shopper_name
                  description: Shopper details. Will be used for shopper identity check.
                  properties:
                    shopper_id:
                      type: string
                      description: Mainland China unique identifier of the shopper.
                    shopper_name:
                      type: string
                      description: Name of the shopper in simplified Chinese.
                sub_order:
                  type: object
                  required:
                  - amount
                  - currency
                  - order_number
                  - shipping_fee
                  description: Suborder info, required when there are split orders.
                  properties:
                    amount:
                      type: number
                      description: The total amount of your sub_order, shipping fee shall be included, unit is Yuan. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
                    currency:
                      type: string
                      description: Currency for the suborder, only CNY supported now.
                    order_number:
                      type: string
                      description: Suborder number in merchant system. Maximum length is 128.
                    provider_order_id:
                      type: string
                      description: 'The unique transaction identifier assigned by the provider for your sub_order. Please use this field as the provider transaction no. for your order information/shipment information’s declaration. Example of our providers: Cards, WeChat, Alipay etc.'
                    shipping_fee:
                      type: number
                      description: Suborder transport fee, unit is Yuan.
        description: Customs declaration request.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsDeclaration'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request`, `resource_already_exists`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/pa/customs_declarations/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        request_body:
          request_id: ac88c53b-f1bd-479b-a1b8-2686db548b39
          payment_intent_id: int_hkpdskz7vg1xc7uscdj
          customs_details:
            customs_code: GUANGZHOU_ZS
            merchant_customs_name: Airwallex
            merchant_customs_number: C129000000
          sub_order:
            amount: 10
            currency: USD
            order_number: o100001213
            provider_order_id: T912345678901234569
            shipping_fee: 0
        status_code: 201
        reason_phrase: Created
        response_body:
          id: cdc_hkpdkjd4t98sa
          request_id: ac88c53b-f1bd-479b-a1b8-2686db548b39
          status: UNDECLARED
          payment_method_type: card
          provider_transaction_id: t202401091234567890123456789
          awx_request_id: '1234567890123456789'
          verification_department_code: OTHERS
          verification_department_transaction_id: tx1202401091234567890123456789
          customs_details:
            customs_code: GUANGZHOU_ZS
            merchant_customs_number: C129000000
            merchant_customs_name: Airwallex
          sub_order:
            order_number: o100001213
            provider_order_id: T912345678901234569
            amount: 10
            shipping_fee: 0
            currency: USD
          shopper_identity_check_result: UNCHECKED
          created_at: '2024-01-31T06:59:10+00:00'
          updated_at: '2024-01-31T06:59:10+00:00'
      x-scope:
      - scope: customs_declaration:write
