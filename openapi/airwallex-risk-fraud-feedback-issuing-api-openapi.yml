tags:
- name: Risk > Fraud Feedback (Issuing)
  description: 'The **Fraud Feedback** API may be used to confirm whether an issuing transaction was authorized or not authorized by the cardholder. A transaction confirmed to be authorized will allow Airwallex to better understand the cardholder''s transaction patterns and increase the success rate of similar transactions. A transaction confirmed not to have been authorized by the cardholder will be labelled as fraudulent and the card will be blocked.


    Please note all future transactions on a blocked card will be blocked. If you require a card to be unblocked please contact support.


    Frozen cards may be unfrozen via the update a Card API.'
