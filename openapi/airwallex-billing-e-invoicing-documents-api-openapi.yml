            - file_name: invoice_2026_001.xml
              file_url: https://invoice.airwallex.com/billing/e_invoicing_documents/attachment?s=jwt_token
              created_at: 2026-08-19T08:30:15+0000
            - file_name: invoice_2026_001.pdf
              file_url: https://invoice.airwallex.com/billing/e_invoicing_documents/attachment?s=jwt_token
