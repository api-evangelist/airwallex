  /api/v1/billing/e_invoicing_documents:
    get:
      description: Retrieves a list of E-Invoicing Documents based on the query parameters.
      operationId: listEInvoicingDocuments
      x-oboSupported: false
      parameters:
      - description: Type of the underlying billing document, one of `INVOICE` or `CREDIT_NOTE`.
        in: query
        name: type
        required: true
        schema:
          type: string
          enum:
          - INVOICE
          - CREDIT_NOTE
      - description: Regulatory processing status, one of `PROCESSING`, `SUCCEEDED` or `FAILED`.
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PROCESSING
          - SUCCEEDED
          - FAILED
      - description: The start date of `created_at` in ISO8601 format (inclusive).
        in: query
        name: from_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The end date of `created_at` in ISO8601 format (exclusive).
        in: query
        name: to_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The start date of `updated_at` in ISO8601 format (inclusive).
        in: query
        name: from_updated_at
        required: false
        schema:
          type: string
          format: date-time
      - description: The end date of `updated_at` in ISO8601 format (exclusive).
        in: query
        name: to_updated_at
        required: false
        schema:
          type: string
          format: date-time
      - description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not `null`) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not `null`) from the response to a subsequent call.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: Number of E-Invoicing Documents per page. Defaults to `20`.
        in: query
        name: page_size
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CursorPaginationClientApiResponseEInvoicingDocument'
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 2|Get list of E-Invoicing Documents
      tags:
      - Billing > E-Invoicing Documents
      x-examples:
