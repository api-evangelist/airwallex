        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EInvoicingDocument'
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '404':
          description: 'Not Found. Possible error codes: `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Retrieve an E-Invoicing Document
      tags:
      - Billing > E-Invoicing Documents
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/billing/e_invoicing_documents/einv_hkpd49cskgblns6iimw
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
