components:
  schemas:
    EInvoicingDocument:
      required:
      - id
      - type
      - status
      - attachments
      - errors
      - created_at
      - updated_at
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the E-Invoicing Document.
        type:
          type: string
          description: Type of the underlying billing document.
          enum:
          - INVOICE
          - CREDIT_NOTE
          x-enumDescriptions:
            INVOICE: The underlying billing document is an [Invoice](/docs/api/billing/invoices).
            CREDIT_NOTE: The underlying billing document is a [Credit Note](/docs/api/billing/credit_notes).
        status:
          type: string
          description: Current regulatory processing status. When `FAILED`, see `errors` for details.
          enum:
          - PROCESSING
          - SUCCEEDED
          - FAILED
          x-enumDescriptions:
            PROCESSING: Regulatory processing is in progress.
            SUCCEEDED: Regulatory processing completed successfully.
            FAILED: Regulatory processing failed. See `errors` for details.
        attachments:
          type: array
          description: Downloadable regulatory artifacts. Empty when no artifact has been produced.
          items:
            required:
            - file_name
            - file_url
            - created_at
            type: object
            properties:
              file_name:
                type: string
                description: Original file name, including the file extension.
              file_url:
                type: string
                description: URL to access and download the attachment file.
              created_at:
                type: string
                description: Time when the attached file record was created, in ISO8601 format.
                format: date-time
        original_customer_response:
          type: string
          description: The customer's original response to the E-Invoice. `null` when no response has been received.
        errors:
          type: array
          description: Errors from the latest failed processing attempt. Empty unless `status` is `FAILED`.
          items:
            required:
            - code
            - message
            type: object
            properties:
              code:
                type: string
                description: Stable, machine-readable error code.
              source:
                type: string
                description: Name of the request parameter or resource field that caused the error, when available.
              message:
                type: string
                description: Human-readable description of the error. Do not use this field for programmatic decisions.
              details:
                type: object
                additionalProperties:
                  type: string
                description: Conditional key-value object containing additional details about the error.
        invoice_id:
          type: string
          description: ID of the source [Invoice](/docs/api/billing/invoices). Set only when `type` is `INVOICE`, otherwise `null`.
        credit_note_id:
          type: string
          description: ID of the source [Credit Note](/docs/api/billing/credit_notes). Set only when `type` is `CREDIT_NOTE`, otherwise `null`.
        created_at:
          type: string
          description: Time when the E-Invoicing Document was created, in ISO8601 format.
          format: date-time
        updated_at:
          type: string
          description: Time when the E-Invoicing Document was last updated, in ISO8601 format.
          format: date-time
    CursorPaginationClientApiResponseEInvoicingDocument:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/EInvoicingDocument'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
