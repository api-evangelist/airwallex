components:
  schemas:
    SimulationPaymentScenario:
      type: object
      required:
      - description
      - name
      properties:
        description:
          type: string
          description: The description of the payment scenario.
        name:
          type: string
          description: The name of the payment scenario.
    SimulationPaymentIntentInfo:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          description: The unique identifier of the payment intent.
        status:
          type: string
          description: The status of the payment intent.
      description: The payment intent that has been confirmed.
    SimulationConfirmPaymentIntent:
      type: object
      required:
      - payment_intent
      - terminal_id
      properties:
        payment_intent:
          $ref: '#/components/schemas/SimulationPaymentIntentInfo'
          description: The payment intent that has been confirmed.
        terminal_id:
          type: string
          description: Terminal unique identifier.
    SimulationGenerateActivationCode:
      type: object
      required:
      - activation_code
      - expires_at
      properties:
        activation_code:
          type: string
          description: The activation code read from the terminal.
        expires_at:
          type: integer
          format: int64
          description: Expiration time of the activation code.
    SimulationAvailableScenarioNames:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          description: All available payment scenarios.
          items:
            $ref: '#/components/schemas/SimulationPaymentScenario'
    SimulationTerminalStatus:
      type: object
      required:
      - connection_status
      - terminal_id
      properties:
        connection_status:
          type: string
          description: Terminal device connection status.
          enum:
          - CONNECTED
          - DISCONNECTED
        terminal_id:
          type: string
          description: Terminal unique identifier.
