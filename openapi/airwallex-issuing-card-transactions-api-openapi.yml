components:
  schemas:
    NonPciMerchantWithEnrichment:
      type: object
      properties:
        additional_merchant_info:
          $ref: '#/components/schemas/NonPciAdditionalMerchantInfo-2'
          description: Supplemental details providing richer context on the merchant and its brand. Learn more about [merchant brand controls](/docs/issuing/card-controls/authorization-controls/merchant-brand-transaction-categories).
        category_code:
          type: string
          description: The Merchant Category Code (MCC).
        city:
          type: string
          description: The city of the merchant.
        country:
          type: string
          description: The country of the merchant.
        identifier:
          type: string
          description: Unique identifier for the merchant.
        name:
          type: string
          description: The short name of the merchant.
        postcode:
          type: string
          description: The postal code of the merchant.
        state:
          type: string
          description: The state or province of the merchant.
      description: Details about the merchant where the transaction occurred, including enriched brand information.
    NonPciBookmarkedResultOfIssuingNonPciCardTransaction:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NonPciCardTransaction'
        page_after:
          type: string
          description: A marker for retrieving the next page of results. Include this value in the `page` request parameter to retrieve subsequent pages.
        page_before:
          type: string
          description: A marker for retrieving the previous page of results. Include this value in the `page` request parameter to retrieve previous pages.
    NonPciFeeDetail:
      type: object
      properties:
        amount:
          type: number
          description: Fee amount.
        currency:
          type: string
          description: Currency in which the fee is charged (3-letter ISO-4217 code).
        type:
          type: string
          description: 'Fee type. One of: `ATM_ACCESS_FEE`.'
    NonPciAdditionalMerchantInfo-2:
      type: object
      properties:
        merchant_brand_category_id:
          type: integer
          format: int32
          description: The unique identifier associated with the merchant category.
        merchant_brand_id:
          type: string
          format: uuid
          description: The unique identifier for the merchant brand.
        merchant_brand_name:
          type: string
          description: The full legal or common name of the merchant.
        merchant_brand_subcategory_id:
          type: integer
          format: int32
          description: The unique identifier associated with the merchant's sub-category.
        merchant_logo_url:
          type: string
          description: URL of the merchant's logo for display purposes.
      description: Supplemental details providing richer context on the merchant and its brand. Learn more about [merchant brand controls](/docs/issuing/card-controls/authorization-controls/merchant-brand-transaction-categories).
    NonPciSimpleDigitalWalletToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the digital token.
        payment_method:
          type: string
          description: 'Payment method used. One of: `APPLE_PAY`, `GOOGLE_PAY`, `CARD_ON_FILE`.'
      description: Details of the digital wallet token used for the transaction, if applicable.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    NonPciAggregatedAmounts:
      type: object
      properties:
        currency:
          type: string
          description: Three-letter ISO 4217 currency code for all amounts in this object.
        total_authorized:
          type: number
          description: Total amount authorized (funds reserved in the wallet).
        total_credited:
          type: number
          description: Total amount credited (funds returned to the wallet, e.g., refunds).
        total_debited:
          type: number
          description: Total amount debited (funds moved out of the wallet after clearing).
        total_declined:
          type: number
          description: Total amount declined (transaction amounts that were rejected).
        total_expired:
          type: number
          description: Total amount expired (authorized amounts that were never captured and have been released).
        total_pending:
          type: number
          description: Total amount still pending (outstanding authorized amount not yet cleared, reversed, or expired).
        total_reversed:
          type: number
          description: Total amount reversed (authorized amounts that were cancelled and released).
      description: Aggregated amounts in the card's billing currency (the currency of the cardholder's wallet). Includes totals for authorized, debited, credited, pending, and other states.
    NonPciCardTransaction:
      type: object
      properties:
        billing_amounts:
          $ref: '#/components/schemas/NonPciAggregatedAmounts'
          description: Aggregated amounts in the card's billing currency (the currency of the cardholder's wallet). Includes totals for authorized, debited, credited, pending, and other states.
        card_id:
          type: string
          format: uuid
          description: Unique identifier of the card associated with this card transaction.
        created_at:
          type: string
          description: Date and time when the card transaction was created, in ISO 8601 format.
        digital_wallet_token:
          $ref: '#/components/schemas/NonPciSimpleDigitalWalletToken'
          description: Details of the digital wallet token used for the transaction, if applicable.
        expiry_date:
          type: string
          description: 'The date and time when the current authorization is set to expire, in ISO 8601 format. After expiry, reserved funds are released. Note: the status may not update to `EXPIRED` immediately after this time.'
        failure_reason:
          type: string
          description: The reason the transaction was declined. Only present when `status` is `DECLINED`. Learn more about [transaction failure reasons](/docs/issuing/transactions/transaction-failure-reasons).
        fee_details:
          type: array
          description: Fees applied to this card transaction, such as ATM fees or foreign transaction fees.
          items:
            $ref: '#/components/schemas/NonPciFeeDetail'
        fund_direction:
          type: string
          description: 'The direction of funds relative to the cardholder''s wallet. One of: `DEBIT`, `CREDIT`, or `NO_MOVEMENT`.'
        id:
          type: string
          format: uuid
          description: Unique identifier of the card transaction.
        lifecycle_id:
          type: string
          format: uuid
          description: Unique identifier of the lifecycle this card transaction belongs to. Use this to retrieve all related card transactions (e.g., a purchase and its refund).
        masked_card_number:
          type: string
          description: The masked primary account number (PAN) of the card.
        merchant:
          $ref: '#/components/schemas/NonPciMerchantWithEnrichment'
          description: Details about the merchant where the transaction occurred, including enriched brand information.
        status:
          type: string
          description: 'The current status of the card transaction. `AUTHORIZED` is non-terminal; all other statuses are terminal. One of: `AUTHORIZED`, `CLEARED`, `DECLINED`, `EXPIRED`, `REVERSED`, `VERIFIED`.'
        transaction_amounts:
          $ref: '#/components/schemas/NonPciAggregatedAmounts'
          description: Aggregated amounts in the merchant's transaction currency (the currency used at the point of sale).
        updated_at:
          type: string
          description: Date and time when the card transaction was last updated, in ISO 8601 format.
