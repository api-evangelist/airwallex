  /api/v1/issuing/card_transactions:
    get:
      tags:
      - Issuing > Card Transactions
      summary: 2|List all Card Transactions
      description: Retrieve a paginated list of card transactions. Each card transaction includes its status, fund direction, merchant details, and aggregated billing amounts. Use the `lifecycle_id` filter to retrieve all card transactions within a specific lifecycle, or `status` to filter by transaction status.
      operationId: listCardTransactions
      parameters:
      - name: billing_currency
        in: query
        description: Filter by billing currency (3-letter ISO 4217 code).
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: card_id
        in: query
        description: Filter by card. Only returns card transactions associated with this card.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: from_created_at
        in: query
        description: Filter for items created after this date in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
      - name: lifecycle_id
        in: query
        description: Filter by lifecycle. Only returns card transactions belonging to this lifecycle.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not null) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not null) from the response to a subsequent call.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Number of related objects to be listed per page. The maximum is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: status
        in: query
        description: Filter by status. One of `AUTHORIZED`, `CLEARED`, `DECLINED`, `EXPIRED`, `REVERSED`, or `VERIFIED`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - AUTHORIZED
          - CLEARED
          - DECLINED
          - EXPIRED
          - REVERSED
          - VERIFIED
          - UNKNOWN
      - name: to_created_at
        in: query
        description: Filter for items created before this date in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
