tags:
- name: Issuing > Card Transactions
  description: 'A **card transaction** is the middle level of the three-level transaction model

    (**Lifecycle → Card Transaction → Transaction Event**).


    It groups related transaction events and represents Airwallex''s interpretation of a single card

    transaction. Each card transaction has a guaranteed terminal status and a fund direction, making it

    the recommended level for tracking payment outcomes without implementing custom grouping logic.


    **Statuses:** `AUTHORIZED` (non-terminal), `CLEARED`, `REVERSED`, `EXPIRED`, `DECLINED`,

    `VERIFIED` (terminal).


    **Fund directions:** `DEBIT`, `CREDIT`, or `NO_MOVEMENT`.


    All card transactions within the same payment flow share a common lifecycle ID.


    **Data retention:** Resources can be queried for a maximum of 2 years from creation.


    Learn more about the transaction lifecycle.'
  x-domain: Issuing
  x-resource: Card Transactions
  x-urlPath: issuing/card_transactions
paths:
