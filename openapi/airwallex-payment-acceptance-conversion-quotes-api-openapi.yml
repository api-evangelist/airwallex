  description: 'A conversion quote locks the conversion rate between the merchant and shopper currencies for a certain period of time. Merchants can repeatedly use it to price payments in the shopper''s local currency during its validity period. Please refer to our product documentation for integration details.


    Data Retention Policy: You can query Conversion Quote resources for a maximum of 31 days since creation.'
