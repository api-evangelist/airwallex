paths:
  /api/v1/pa/conversion_quotes/create:
    post:
      tags:
      - Payment Acceptance > Conversion Quotes
      summary: 1|Create a Conversion Quote
      description: Create a new conversion quote for converting from merchant currency to shopper currency.
      operationId: createConversionQuote
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - merchant_currency
              - request_id
              - shopper_currency
              properties:
                merchant_currency:
                  type: string
                  description: The currency used by the merchant for pricing or payment (3-letter ISO 4217 code).
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
                shopper_currency:
                  type: string
                  description: The currency that the shopper prefers to use (3-letter ISO-4217 code).
                validity_period:
                  type: string
                  description: The period for which the conversion quote remains valid. If not specified, the default value is `HR_1`.
                  enum:
                  - HR_1
                  - HR_24
        description: Conversion Quote Create Request.
        required: true
      responses:
        '201':
          description: Created
          content:
