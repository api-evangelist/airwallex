tags:
- name: Supporting Services > Reference Data
  description: Reference data made available to support the usage of the Airwallex platform.
  x-domain: Supporting Services
  x-resource: Reference Data
  x-urlPath: supporting_services/reference_data
paths:
  /api/v1/reference/industry_categories:
    get:
      tags:
      - Supporting Services > Reference Data
      summary: 1|Industry Categories
      description: Get a tree of industry categories and associated codes and questions.
      operationId: listIndustryCategories
      x-oboSupported: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IndustryCategoryV3Item'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/reference/industry_categories
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
        - answer: 'Yes'
          name: Digital and tech
          question: <string>
          type: LIST
          value: <string>
          values:
          - name: Financial data and research
            type: code
            value: ICCV3_0002XX
          - name: Game
            type: question
            question: Does your product contain Transferable Virtual Assets (TVA) such as tools, ski...
            values:
            - answer: 'Yes'
              type: code
              value: ICCV3_000300
            - answer: 'No'
              type: code
              value: ICCV3_000301
      x-domain: Supporting Services
      x-resource: Reference Data
      x-urlPath: industry_categories
      x-oauthSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
  /api/v1/reference/invalid_conversion_dates:
    get:
      tags:
      - Supporting Services > Reference Data
      summary: 2|Invalid Conversion Dates
      description: Gets a list of invalid conversion dates for a specified `currency_pair`.
      operationId: listInvalidConversionDates
      parameters:
      - name: currency_pair
        in: query
        description: Currency pair to get the invalid conversion dates for.
        required: true
        allowEmptyValue: false
        schema:
          type: string
          default: AUDUSD
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidConversionDates'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/reference/invalid_conversion_dates
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          currency_pair: AUDUSD
          invalid_conversion_dates:
          - date: '2017-12-25'
            reason: Christmas Day
      x-domain: Supporting Services
      x-resource: Reference Data
      x-urlPath: invalid_conversion_dates
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
  /api/v1/reference/supported_currencies:
    get:
      tags:
      - Supporting Services > Reference Data
      summary: 3|Supported Currencies
      description: Gets the client-specific list of currencies that can be bought or sold.
      operationId: listSupportedCurrencies
      responses:
        '200':
          description: OK
          content:
            application/json:
