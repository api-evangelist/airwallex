  /api/v1/reference/order_items/expiring_quota:
    get:
      tags:
      - Supporting Services > Reference Data
      summary: 4|Retrieve the Expiring Transfer or Deposit Limit
      description: Get available transfer or deposit limit that is about to expire in the next week.
      operationId: retrieveExpiringQuota
      parameters:
      - name: type
        in: query
        description: type.
        required: false
        schema:
          type: string
          enum:
          - CN_INBOUND
          - ID_OUTBOUND
          - VN_OUTBOUND
          default: CN_INBOUND
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpiringQuota'
        '400':
          description: Bad request. Data provided is either incomplete or malformed.
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
