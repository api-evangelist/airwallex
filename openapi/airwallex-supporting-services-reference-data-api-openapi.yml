  /api/v1/reference/order_items/quota:
    get:
      tags:
      - Supporting Services > Reference Data
      summary: 5|Retrieve the Transfer or Deposit Limit
      description: Get available transfer or deposit limit.
      operationId: retrieveQuota
      parameters:
      - name: type
        in: query
        description: type.
        required: false
        schema:
          type: string
          enum:
          - CN_INBOUND
          - ID_OUTBOUND
          - VN_OUTBOUND
          default: CN_INBOUND
      responses:
