      x-scope:
      - scope: reference.order_item:read
        group: Supporting Services
        resource_name: Order Items
      - scope: reference.order_item:write
        group: Supporting Services
        resource_name: Order Items
      x-domain: Supporting Services
      x-resource: Reference Data
