components:
  schemas:
    OrderQuota:
      type: object
      required:
      - available_order_amount
      - currency
      - history_order_amount
      properties:
        available_order_amount:
          type: number
          description: Available order amount of the account.
        currency:
          type: string
          description: Currency of the account order amount.
        history_order_amount:
          type: number
          description: history order amount of the account.
    ConvertableCurrencies:
      type: object
      required:
      - buy_currencies
      - sell_currencies
      properties:
        buy_currencies:
          type: array
          description: List of buyable currencies.
          items:
            type: string
        sell_currencies:
          type: array
          description: List of sellable currencies.
          items:
            type: string
      description: Supported currencies for conversion.
    InvalidConversionDate:
      type: object
      required:
      - date
      - reason
      properties:
        date:
          type: string
          format: date
          description: The invalid conversion date.
        reason:
          type: string
          description: Reason as to why the date is invalid.
    SupportedCurrencies:
      type: object
      required:
      - conversion
      properties:
        conversion:
          $ref: '#/components/schemas/ConvertableCurrencies'
          description: Supported currencies for conversion.
    InvalidConversionDates:
      type: object
      required:
      - currency_pair
      - invalid_conversion_dates
      properties:
        currency_pair:
          type: string
          description: Currency pair that the invalid conversion dates are applicable to.
        invalid_conversion_dates:
          type: array
          description: List of invalid conversion dates.
          items:
            $ref: '#/components/schemas/InvalidConversionDate'
    ExpiringQuota:
      type: object
      required:
      - currency
      - expire_by
      - expiring_order_amount
      properties:
        currency:
          type: string
          description: Currency of the account order amount.
        expire_by:
          type: string
          description: Expired date for this these order amount.
        expiring_order_amount:
          type: number
          description: Expiring available order amount of the account.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    IndustryCategoryV3Item:
      type: object
      properties:
        answer:
          type: string
          description: "The answer to the question. \nOnly for CODE items under QUESTION items."
          enum:
          - 'Yes'
          - 'No'
        name:
          type: string
          description: "Name of the industry category item. \nIt's null for CODE items under QUESTION items."
        question:
          type: string
          description: "The question to determine a industry category code. \nOnly for QUESTION items."
        type:
          type: string
          description: Type of the industry category item.
          enum:
          - LIST
          - CODE
          - QUESTION
        value:
          type: string
          description: "The code identifying this industry category. \nOnly for CODE items."
        values:
          type: array
          description: "Industry category items under the current item. \nOnly for LIST items and QUESTION items."
          items:
            $ref: '#/components/schemas/IndustryCategoryV3Item'
