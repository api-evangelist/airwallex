  /api/v1/reference/order_items/upload:
    post:
      tags:
      - Supporting Services > Reference Data
      summary: 6|Increase Transfer or Deposit Limit
      description: 'Increase your transfer or deposit limit by providing cross-border sales order information. Before uploading, please learn about payout limits or deposit limits.


        Type CN_INBOUND needs to be enabled before calling this endpoint, please contact your Account Manager. You may provide up to 500 items with each request.'
      operationId: uploadOrderItems
      parameters:
      - name: allow_partial_success
        in: query
        description: Allow any order items that pass validation to be used for increasing the limit. If `false`, all order items must pass validation or the request will be rejected. Defaults to `false`.
        required: false
        allowEmptyValue: false
        schema:
          type: boolean
          default: false
      - name: types
        in: query
        description: Type of limit(s) to increase. Support any of `CN_INBOUND`, `ID_OUTBOUND`, defaults to `CN_INBOUND`.
        required: false
        allowEmptyValue: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - CN_INBOUND
            - ID_OUTBOUND
            - VN_OUTBOUND
          enum:
          - CN_INBOUND
          - ID_OUTBOUND
          - VN_OUTBOUND
          default: CN_INBOUND
      - name: x-jwt-oauth-client-id
        in: header
        description: x-jwt-oauth-client-id.
        required: false
        schema:
          type: string
      - name: x-jwt-type
        in: header
        description: x-jwt-type.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                - category
                - currency
                - item_name
                - item_quantity
                - item_unit_price
                - item_url
                - line_total
                - order_datetime
                - order_id
                - shipment_provider
                - shipment_tracking_number
                properties:
                  category:
                    type: string
                    description: Category of your sales order. One of `goods_trade_online`, `goods_trade_offline`, `services_trade_education_and_training`, `services_trade_international_logistics`, `services_trade_software`, `services_trade_professional`, `services_trade_travel`, `services_trade_travel_and_hospitality`.
                  currency:
                    type: string
                    description: Order currency in ISO format, One of `AED`,`ALL`,`AMD`,`ANG`,`AOA`,`ARS`,`AUD`,`AWG`,`AZN`,`BAM`,`BBD`,`BDT`,`BGN`,`BIF`,`BMD`,`BND`,`BOB`,`BRL`,`BSD`,`BTN`,`BWP`,`BZD`,`CAD`,`CHF`,`CLP`,`COP`,`CRC`,`CVE`,`CZK`,`DJF`,`DKK`,`DOP`,`DZD`,`EGP`,`ERN`,`ETB`,`EUR`,`FJD`,`FKP`,`GBP`,`GEL`,`GHS`,`GIP`,`GMD`,`GNF`,`GTQ`,`GYD`,`HKD`,`HNL`,`HRK`,`HUF`,`IDR`,`ILS`,`INR`,`ISK`,`JMD`,`JOD`,`JPY`,`KES`,`KGS`,`KHR`,`KMF`,`KRW`,`KWD`,`KYD`,`KZT`,`LAK`,`LBP`,`LKR`,`LRD`,`LSL`,`LYD`,`MAD`,`MDL`,`MGA`,`MKD`,`MNT`,`MOP`,`MRU`,`MUR`,`MVR`,`MWK`,`MXN`,`MYR`,`NAD`,`NIO`,`NOK`,`NPR`,`NZD`,`OMR`,`PAB`,`PEN`,`PGK`,`PHP`,`PKR`,`PLN`,`PYG`,`QAR`,`RON`,`RSD`,`RWF`,`SAR`,`SBD`,`SCR`,`SEK`,`SGD`,`SHP`,`SLL`,`SRD`,`STN`,`SVC`,`SZL`,`THB`,`TJS`,`TMT`,`TND`,`TOP`,`TRY`,`TTD`,`TWD`,`TZS`,`UAH`,`UGX`,`USD`,`UYU`,`UZS`,`VND`,`VUV`,`WST`,`XAF`,`XCD`,`XOF`,`XPF`,`ZAR`,`ZMW`.
                  description:
                    type: string
                    description: Description of the order.
                  item_name:
                    type: string
                    description: Item name (min. 2 character and max. 256 characters).
                  item_quantity:
                    type: number
                    description: Quantity of the item, must be an integer.
                  item_reference:
                    type: string
                    description: Short reference for reconciliation purposes, which will not be passed to external parties.
                  item_unit_price:
                    type: number
                    description: Item's unit price.
                  item_url:
                    type: string
                    description: URL of the item (min. 1 characters and max. 1000 characters).
                  line_total:
                    type: number
                    description: Line total of the item.
                  order_datetime:
                    type: string
                    description: Order date time in ISO format, (formatted in ISO08601 datetime format), no more than 350 days old.
                  order_id:
                    type: string
                    description: Order unique identifier (min. 1 characters and max. 50 characters).
                  shipment_provider:
                    type: string
                    description: Name of the logistics provider.
                  shipment_tracking_number:
                    type: string
                    description: Tracking number issued by the logistics provider (min. 5 characters and max. 35 characters).
        description: orderItemDtos
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/reference/order_items/upload
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
        - category: goods_trade_online
          currency: IDR
          description: book
          item_name: book
          item_quantity: 1
          item_reference: ac3342a4a9434ba69a91bb1c9966b477
          item_unit_price: 19.38
          item_url: <string>
          line_total: 100
          order_datetime: 2021-09-16T03:52:34+0000
          order_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          shipment_provider: <string>
          shipment_tracking_number: EG420386995JP
      x-scope:
      - scope: reference.order_item:write
        group: Supporting Services
        resource_name: Order Items
      x-domain: Supporting Services
      x-resource: Reference Data
      x-urlPath: upload_order_items
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
