paths:
  /api/v1/accounting/accounting_field_values/create:
    post:
      tags:
      - Accounting > Accounting Field Values
      summary: 1|Create an Accounting Field Value
      description: Creates a new accounting field value for coding Airwallex Spend transactions.
      operationId: createAccountingFieldValue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              - accounting_field_id
              - value
              properties:
                request_id:
                  type: string
                  description: Unique identifier for this request to ensure idempotency. Generate a random UUID to prevent accidental duplication.
                accounting_field_id:
                  type: string
                  format: uuid
                  description: Unique identifier of the parent accounting field.
                value:
                  type: string
                  description: Accounting field value name.
                value_label:
                  type: string
                  description: Airwallex display name for the accounting field value.
                external_id:
                  type: string
                  description: External ID from the accounting system.
                legal_entity_ids:
                  type: array
                  description: Legal entity IDs to which this accounting field value applies. Omit this field when it applies to all legal entities.
                  items:
                    type: string
      responses:
        '201':
          description: Accounting field value created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingFieldValue'
        '400':
          description: Invalid request.
        '404':
          description: Not found.
        '500':
          description: Internal server error.
