  /api/v1/pa/refunds:
    get:
      tags:
      - Payment Acceptance > Refunds
      summary: 3|List all Refunds
      description: List all Refunds.
      operationId: listRefunds
      parameters:
      - name: connected_account_id
        in: query
        description: Optional Airwallex-assigned identifier of the connected account to filter by. Only applicable to platforms.
        required: false
        schema:
          type: string
      - name: currency
        in: query
        description: Refund currency.
        required: false
        schema:
          type: string
          default: USD
      - name: from_created_at
        in: query
        description: The start time of `created_at` in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2017-03-01T03:52:34+00:00'
      - name: page_num
        in: query
        description: Page number starting from 0.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of Refunds to be listed per page. Default value is 10. Maximum is 1000. The value greater than the maximum will be capped to the maximum.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: payment_attempt_id
        in: query
        description: Payment Attempt unique identifier of the Refunds.
        required: false
        schema:
          type: string
          default: att_e65tkXCSzJrsMpTrzoFrjaau53
      - name: payment_intent_id
        in: query
        description: Payment Intent unique identifier of the Refunds.
        required: false
        schema:
          type: string
          default: int_e65tkXCSzJrsMpTrzoFrjaau53
      - name: status
        in: query
        description: Refund status.
        required: false
        schema:
          type: string
          default: SETTLED
      - name: to_created_at
        in: query
        description: The end time of `created_at` in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2017-04-01T03:52:34+00:00'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: List items.
                    items:
                      $ref: '#/components/schemas/Refund'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
