tags:
- name: Payment Acceptance > Refunds
  description: 'The **Refund** API allows you to refund a succeeded payment back to the payment method used by your customer. The refund amount must be equal to or less than the amount specified in the original Payment Intent/Payment Attempt.


    Multiple Refunds can be created until the full amount is refunded.


    Data Retention Policy: You can query Refund resources for a maximum of 2 years since creation.'
  x-domain: Payment Acceptance
  x-resource: Refunds
  x-urlPath: payments/refunds
paths:
  /api/v1/pa/refunds/create:
    post:
      tags:
      - Payment Acceptance > Refunds
      summary: 1|Create a Refund
      description: Create a Refund against a Payment Intent/Payment Attempt.
      operationId: createRefund
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                amount:
                  type: number
                  description: Amount of the Refund. If not specified, it will be same as the remaining amount that has been captured but not yet refunded. Please refer to [supported currencies](/docs/payments/supported-currencies) for supported minor units.
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to the Refund. You can specify up to 50 keys with key names up to 50 characters long and values up to 500 characters long.
                  additionalProperties:
                    type: string
                payment_attempt_id:
                  type: string
                  description: Payment Attempt unique identifier against which this Refund is created. Either this or the `payment_intent_id` must be provided.
                payment_intent_id:
                  type: string
                  description: Payment Intent unique identifier against which this Refund is created. Either this or the `payment_attempt_id` must be provided.
                reason:
                  type: string
                  description: Reason of the Refund. Maximum length is 128.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
        description: Refund creation request.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request`, `invalid_status_for_operation`, `amount_above_limit`, `operation_not_supported`, `resource_not_found`(invalid `payment_attempt_id` or `payment_intent_id`)'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/pa/refunds/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        request_body:
          payment_attempt_id: att_hkpdskz7vg1xc7uscdj
          reason: Return goods
          amount: 10
          request_id: 962dbd83-5e7b-4185-b668-596834395c12
        status_code: 201
        reason_phrase: Created
        response_body:
          id: rfd_hkpdbybkch3ovunwjy1_1raukh
          request_id: 962dbd83-5e7b-4185-b668-596834395c12
          payment_intent_id: int_hkpdskz7vg1xc7uscdj
          payment_attempt_id: att_hkpdskz7vg1xc7uscdj
          amount: 10
          currency: USD
          reason: Return goods
          status: RECEIVED
          created_at: '2021-01-31T06:57:10+00:00'
          updated_at: '2021-01-31T07:01:10+00:00'
      x-scope:
      - scope: payment_acceptance:write
        group: Payment Acceptance
        resource_name: Payment Acceptance
      x-domain: Payment Acceptance
