      summary: 2|Retrieve a Refund
      description: Retrieve a Refund by unique identifier.
      operationId: retrieveRefund
      parameters:
      - name: id
        in: path
        description: Refund unique identifier.
        required: true
        schema:
          type: string
          default: rfd_ps8e0ZgQzd2QnCxVpzJrHD6KOVu
      responses:
        '200':
          description: OK
          content:
            application/json:
