components:
  schemas:
    Payment_Acceptance_FailureDetails:
      type: object
      properties:
        code:
          type: string
          description: The failure code returned by Airwallex.
        details:
          type: object
          description: Additional details that may include `original_response_code`, `original_response_message` from provider, and other contextual information such as card details, risk factors, etc. depending on the specific error code.
        message:
          type: string
          description: The failure description.
        trace_id:
          type: string
          description: The unique identifier for tracing the failure.
      description: Failure details. Only applicable when status is FAILED.
    Refund:
      type: object
      properties:
        acquirer_reference_number:
          type: string
          description: A unique number that tags a credit or debit card transaction when it goes from the merchant's bank through to the cardholder's bank.
        amount:
          type: number
          description: Amount to be refunded.
        connected_account_id:
          type: string
          description: Account identifier of the connected account.
        created_at:
          type: string
          format: date-time
          description: Time at which the Refund was created.
        currency:
          type: string
          description: Currency of the Refund.
        failure_details:
          $ref: '#/components/schemas/Payment_Acceptance_FailureDetails'
          description: Failure details. Only applicable when status is FAILED.
        id:
          type: string
          description: Unique identifier for the Refund.
        metadata:
          type: object
          description: A set of key-value pairs that you can attach to the Refund. You can specify up to 50 keys with key names up to 50 characters long and values up to 500 characters long.
          additionalProperties:
            type: string
        payment_attempt_id:
          type: string
          description: Unique identifier of Payment Attempt on which the Refund is created.
        payment_intent_id:
          type: string
          description: Unique identifier of Payment Intent on which the Refund is created.
        reason:
          type: string
          description: Reason of the Refund.
        request_id:
          type: string
          description: Unique request identifier specified by the merchant in the last operation.
        status:
          type: string
          description: "Status of the Refund. One of `RECEIVED`, `ACCEPTED`, `SETTLED` or `FAILED` \n\n- **RECEIVED**: The Refund is created, which means the requested refund amount is valid and the payment is not in dispute.\n- **ACCEPTED**: The Refund has been accepted by the payment method provider and can be considered completed.\n- **SETTLED**: The Refund has been reconciled and will show up in the Airwallex settlement report.\n- **FAILED**: The Refund has been rejected, which can be caused by the insufficient Airwallex receivable/available balance, or by the provider for more channel-specific reasons.\n"
        updated_at:
          type: string
          format: date-time
          description: Last time at which the Refund was updated.
