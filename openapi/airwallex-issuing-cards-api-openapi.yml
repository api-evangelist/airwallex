        allowEmptyValue: false
        schema:
          type: string
          enum:
          - PENDING
          - FAILED
          - INACTIVE
          - ACTIVE
          - LOST
          - STOLEN
          - CLOSED
          - BLOCKED
          - EXPIRED
          - UNKNOWN
