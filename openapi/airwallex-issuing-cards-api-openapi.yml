components:
  schemas:
    PciError:
      type: object
      required:
      - code
      - source
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    NonPciAuthorizationControls:
      type: object
      required:
      - allowed_transaction_count
      - transaction_limits
      properties:
        active_from:
          type: string
          description: If provided, authorizations prior to this time will be rejected.
        active_to:
          type: string
          description: If provided, authorizations after this time will be rejected.
        allowed_currencies:
          type: array
          description: Allowed Currencies for transactions. Please note if this field is absent from request payload, or has a value of `null` or empty array `[]`, then all transaction currencies will be allowed.
          items:
            type: string
        allowed_merchant_brands:
          $ref: '#/components/schemas/NonPciAllowedMerchantBrands'
          description: Allowed Merchant Brands rules for transactions. Please note if this field is absent from request payload, then transactions from all merchant brands will be allowed.
        allowed_merchant_categories:
          type: array
          description: Allowed Merchant Category Codes. Please note if this field is absent from request payload, or has a value of `null` or empty array `[]`, then all merchant categories will be allowed.
          items:
            type: string
        allowed_merchant_countries:
          type: array
          description: Allowed Merchant Countries for transactions. Please note if this field is absent from request payload, or has a value of `null` or empty array `[]`, then transactions from all merchant countries will be allowed (although some may still be blocked by our risk team).
          items:
            type: string
        allowed_transaction_count:
          type: string
          description: Specifies whether this card is a Single or Multiple Use card. Single Use means that the card can only be used for 1 successful debit transaction.
          enum:
          - SINGLE
          - MULTIPLE
        blocked_transaction_usages:
          type: array
          description: "List of disabled transaction usages, based on transaction_scope and usage_scope values. Please note if this field is absent from request payload or has a value of `null`, then all transaction usages will be allowed unless a default configration is added.  \n  \nYou can add multiple transaction_scope and usage_scope values. The most restrictive scope(s) would apply."
          items:
            $ref: '#/components/schemas/NonPciTransactionUsage'
        transaction_limits:
          $ref: '#/components/schemas/NonPciTransactionLimits'
          description: Transaction limits for the card. Multiple transaction limits can be configured based on single currency. Each transaction will be checked against the limits with interval after currency conversion rate applied.
      description: Spend controls that determine the rules and restrictions to check for transaction authorizations.
    NonPciPrimaryContactDetail:
      type: object
      properties:
        email:
          type: string
          description: The email address of the primary contact of the new card.
        full_name:
          type: string
          description: Full name of the primary contact of the new card.
        mobile_number:
          type: string
          description: The mobile number of the primary contact of the new card.
      description: Details of the primary contact of the card.
    NonPciDeliveryDetails:
      type: object
      properties:
        delivery_mode:
          type: string
          description: '`MAIL`: Delivery of the card is delivered via mail shipment. Tracking may or may not be provided.

            `EXPRESS`: Delivery of the card is tracked and delivered via express shipment. A tracking_link will always be provided.

            '
          enum:
          - MAIL
          - EXPRESS
          - UNKNOWN
        delivery_vendor:
          type: string
          description: Delivery vendor of this card.
          enum:
          - UNKNOWN
          - AU_POST
          - EMS
          - HK_POST
          - CITY_LINK
          - DHL
          - CN_POST
          - PL_POST
          - USPS
          - FEDEX
        mobile_number:
          type: string
          description: The mobile number for the card delivery.
        preferred_delivery_mode:
          type: string
          description: The delivery mode customer selected when the Create Card API is called.
          enum:
          - MAIL
          - EXPRESS
          - UNKNOWN
        status:
          type: string
          description: See [Delivery Status](/docs/issuing/manage-cards/retrieve-physical-card-delivery-details) for definitions.
          enum:
          - PENDING
          - PRINTED
          - FAILED_TO_PRINT
          - DISPATCHED
          - IN_TRANSIT
          - OUT_FOR_DELIVERY
          - DELIVERED
          - DELIVERY_FAILED
          - DELIVERY_DELAYED
          - UNKNOWN
        status_description:
          type: string
          description: 'A brief description of the status.

            '
        tracked:
          type: boolean
          description: Specifies if the delivery of the card is tracked. If `true`, a tracking link will be provided when status becomes `DISPATCHED`.
        tracking_link:
          type: string
          description: Tracking link of the card.
        tracking_number:
          type: string
          description: Delivery tracking number of this card.
        updated_at:
          type: string
          format: date-time
          description: Last update time of the delivery details.
      description: Delivery detail of the card. Only available for physical cards.
    NonPciAddress:
      type: object
      required:
      - city
      - country
      - line1
      - postcode
      properties:
        city:
          type: string
          description: City of address.
        country:
          type: string
          description: ISO country code of address.
        line1:
          type: string
          description: Address line 1.
        line2:
          type: string
          description: Address line 2.
        postcode:
          type: string
          description: Address postcode or ZIP code.
        state:
          type: string
          description: Address state or region.
      description: Optional postal address of physical card delivery.
    NonPciTransactionUsage:
      type: object
      properties:
        transaction_scope:
          type: string
          description: 'Types of transaction scope. It can be one of: `ALL_TRANSACTIONS`, `ONLINE_TRANSACTION`, `CONTACTLESS_TRANSACTION`, `CONTACT_CHIP_TRANSACTION`, `MAGSTRIPE`, `CASH_WITHDRAWAL`, `BILL_PAYMENT`, `ACCOUNT_FUNDING`.'
        usage_scope:
          type: string
          description: 'Determines if a transaction can be made domestically and/or internationally. It can be one of: `ALL`, `INTERNATIONAL`, `DOMESTIC`.'
    NonPciTransactionLimits:
      type: object
      required:
      - limits
      properties:
        cash_withdrawal_limits:
          type: array
          description: "Cash withdrawal transaction limits are based on interval and amount.  \n  \nIf the daily limit is not set, the default daily limit amount for the selected limit currency will be used. The default daily limit amount is part of the account setting. To change the default daily limit amount, please reach out to your account manager.  \n  \nPlease note that the cash withdrawal transaction limits apply exclusively to cash withdrawals and are imposed to help manage potential liability for the account holder and for Airwallex. The account holder may be liable for any unauthorised spending on the card, so please apply the limits responsibly.  \n  \n**Important**: This limit will only appear if you have cash withdrawals enabled. Please speak to your account manager if you would like to enable cash withdrawals."
          items:
            $ref: '#/components/schemas/NonPciSpendingLimit'
        currency:
          type: string
          description: 'Currency for transaction limits (3-letter ISO-4217 code). Will use USD if not set. Examples of valid base currencies are USD, AUD, GBP, EUR, CNY, HKD, SGD, NZD, JPY, CAD, CHF. More currencies may be available for your account: you may query the full list by calling the [Get issuing config](/docs/api/issuing/config/retrieve) endpoint.'
        limits:
          type: array
          description: "Transaction limits are based on interval and amount.  \n  \nIf the per transaction limit is not set, the default per transaction limit amount for the selected limit currency will be used. The default per transaction amount is part of account settings. To change the default per transaction limit, please reach out to your account manager.  \n  \nThe account holder may be liable for any unauthorised spending on the card, so please apply limits responsibly."
          items:
            $ref: '#/components/schemas/NonPciSpendingLimit'
      description: Transaction limits for the card. Multiple transaction limits can be configured based on single currency. Each transaction will be checked against the limits with interval after currency conversion rate applied.
    NonPciRemainingLimit:
      type: object
      required:
      - amount
      - interval
      - remaining
      properties:
        amount:
          type: number
          description: Transaction limit amount.
        interval:
          type: string
          description: 'Transaction limit interval. One of: `PER_TRANSACTION`, `DAILY`, `WEEKLY`, `MONTHLY`, `ALL_TIME`.'
        remaining:
          type: number
          description: Remaining amount of transaction limit for that interval. Refunds are always restored to active limits (each refund will increase the limit balance). Please check product doc for more details.
    PciCardPci:
      type: object
      required:
      - card_number
      - cvv
      - expiry_month
      - expiry_year
      - name_on_card
      properties:
        card_number:
          type: string
          description: Card Number.
        cvv:
          type: string
          description: Card Verification Value.
        expiry_month:
          type: integer
          format: int32
          description: Card Expiry Month.
        expiry_year:
          type: integer
          format: int32
          description: Card Expiry Year.
        name_on_card:
          type: string
          description: Name printed on card.
    NonPciAllowedMerchantBrands:
      type: object
      properties:
        categories:
          type: array
          description: Allowed Merchant Brands Categories for transactions. These must be provided using the codes defined in the [Merchant Brands Controls product page](/docs/issuing/card-controls/authorization-controls/merchant-brand-transaction-categories). Please note if this field is absent from request payload, or has a value of `null` or empty array `[]`, then transactions from all merchant brand categories will be allowed.
          items:
            type: string
        ids:
          type: array
          description: Allowed Merchant Brand identifiers for transactions. Please note if this field is absent from request payload, or has a value of `null` or empty array `[]`, then transactions from all merchant brand ids will be allowed. You can search for Merchant Brands ids using the [Merchant Brands API](/docs/api/issuing/merchant_brands/retrieve).
          items:
            type: string
            format: uuid
        subcategories:
          type: array
          description: Allowed Merchant Brands Subcategories for transactions. These must be provided using the codes defined in the [Merchant Brands Controls product page](/docs/issuing/card-controls/authorization-controls/merchant-brand-transaction-categories). Please note if this field is absent from request payload, or has a value of `null` or empty array `[]`, then transactions from all merchant brand subcategories will be allowed.
          items:
            type: string
      description: Allowed Merchant Brands rules for transactions. Please note if this field is absent from request payload, then transactions from all merchant brands will be allowed.
    NonPciRemainingLimits:
      type: object
      properties:
        cash_withdrawal_limits:
          type: array
          description: Remaining Cash Withdrawal Limits for Intervals.
          items:
            $ref: '#/components/schemas/NonPciRemainingLimit'
        currency:
          type: string
          description: Currency of transaction limits (3-letter ISO-4217 code).
        limits:
          type: array
          description: Remaining limits for Intervals.
          items:
            $ref: '#/components/schemas/NonPciRemainingLimit'
    NonPciCardProgram:
      type: object
      properties:
        card_profile_id:
          type: string
          format: uuid
          description: Unique identifier of the card profile used to create this card, if one was applied. When `card_profile_id` is supplied in the Create Card request, the card's program and card art are resolved from that profile.
          x-stage: preview
        interchange_percent:
          type: string
          description: Interchange percent of the card - This is only available for `sub_type="B2B_TRAVEL"` cards. Interchange can vary from 0.8 to 1.9, with increments of 0.1.
        purpose:
          type: string
          enum:
          - CONSUMER
          - COMMERCIAL
          x-enumDescriptions:
            CONSUMER: A card used for personal purposes backed by funding belonging to an individual.
            COMMERCIAL: A card used for business purposes backed by funding belonging to a business.
        sub_type:
          type: string
          description: Sub type of the program - This is used for specific products under the defined program types. e.g `B2B_TRAVEL` which designates BINs for travel use cases (E.g OTAs).
          enum:
          - GOOD_FUNDS_CREDIT
          - B2B_TRAVEL
          - UNKNOWN
        type:
          type: string
          description: Card type - `PREPAID`, `DEBIT`, `CREDIT` or `DEFERRED_DEBIT`. `DEFERRED_DEBIT` is Deferred Debit card available for OTA (Online Travel Agent) customers only in UK/Europe countries. If card type is not set, the default card type which is a part of your account setting will be used.
          enum:
          - UNKNOWN
          - DEBIT
          - PREPAID
          - CREDIT
          - DEFERRED_DEBIT
      description: Card program.
    NonPciAlertSettings:
      type: object
      properties:
        low_remaining_transaction_limit:
          $ref: '#/components/schemas/NonPciAlertSettingEntry'
          description: 'Configures an alert for when the remaining spending limit dips below a specified percentage. When enabled, a webhook notification will be triggered if the remaining limit falls below the defined threshold. Note that:


            - Only one notification per spend limit interval will be sent. A webhook is triggered only when the threshold is crossed, and further spending below the threshold will not trigger additional notifications. Example: if the percent enabled is 10, a webhook will be sent once the remaining limit is at or less than 10%.

            - If the spend limit has been updated, a new notification will be sent when the new threshold is crossed.

            - This alert only applies to multiple use cards.

            - If not specified, this setting will be enabled by default with ``enabled`` set to ``true`` and ``percent`` set to an account specific default value.'
      description: Contains alert configuration settings for the card.
    PciApiProvisioning:
      type: object
      required:
      - card_id
      properties:
        card_id:
          type: string
          description: Identifier of the provisioned card.
        activation_data:
          type: string
          description: Present when `type` is `apple_pay`. Activation data to return to Apple PassKit.
        encrypted_pass_data:
          type: string
          description: Present when `type` is `apple_pay`. Encrypted pass data to return to Apple PassKit to complete provisioning.
        ephemeral_public_key:
          type: string
          description: Present when `type` is `apple_pay`. Ephemeral public key to return to Apple PassKit.
        expiration_date:
          $ref: '#/components/schemas/IssuingPciExpirationDate'
          description: Present when `type` is `google_pay`. Expiration date of the provisioned token.
        enc_address:
          type: string
          description: Present when `type` is `google_pay`, when available. Encrypted billing address.
        last4:
          type: string
          description: Present when `type` is `google_pay` or `samsung_pay`. Last four digits of the tokenized card.
        opaque_payment_card:
          type: string
          description: Present when `type` is `google_pay` or `samsung_pay`. Opaque payment card payload to pass to the wallet SDK.
        google_opaque_payment_card:
          type: string
          description: Present when `type` is `google_pay`. Used for push provisioning.
        card_type:
          type: string
          description: Present when `type` is `samsung_pay`. Card network / type.
        vcard_id:
          type: string
          description: Present when `type` is `samsung_pay`.
    NonPciAlertSettingEntry:
      type: object
      required:
      - enabled
      - percent
      properties:
        enabled:
          type: boolean
          description: Indicates whether the alert is active.
        percent:
          type: integer
          format: int32
          description: Specifies the percentage threshold for the alert.
      description: 'Configures an alert for when the remaining spending limit dips below a specified percentage. When enabled, a webhook notification will be triggered if the remaining limit falls below the defined threshold. Note that:


        - Only one notification per spend limit interval will be sent. A webhook is triggered only when the threshold is crossed, and further spending below the threshold will not trigger additional notifications. Example: if the percent enabled is 10, a webhook will be sent once the remaining limit is at or less than 10%.

        - If the spend limit has been updated, a new notification will be sent when the new threshold is crossed.

        - This alert only applies to multiple use cards.

        - If not specified, this setting will be enabled by default with ``enabled`` set to ``true`` and ``percent`` set to an account specific default value.'
    NonPciCard:
      type: object
      properties:
        activate_on_issue:
          type: boolean
          description: Set this to `true` to activate the physical card when it is created. This will enable use of the card while it’s being delivered to the cardholder. Virtual cards will always be activated upon creation.
        auto_close_date:
          type: string
          format: date
          description: The date on which the card is automatically closed, at the start of that day (00:00 GMT). The date is in the format YYYY-MM-DD. Returns `null` if no automatic closure is scheduled.
        additional_cardholder_ids:
          type: array
          description: The ID of additional cardholders of this card. Only valid if `is_personalized` is `false`.
          items:
            type: string
            format: uuid
        alert_settings:
          $ref: '#/components/schemas/NonPciAlertSettings'
          description: Contains alert configuration settings for the card.
        all_card_versions:
          type: array
          description: Contains information about all versions of a card. A version changes with change in PAN.
          items:
            $ref: '#/components/schemas/NonPciCardVersion'
        authorization_controls:
          $ref: '#/components/schemas/NonPciAuthorizationControls'
          description: Spend controls that determine the rules and restrictions to check for transaction authorizations.
        brand:
          type: string
          description: Card Brand.
        card_id:
          type: string
          format: uuid
          description: Unique Identifier for the card.
        card_number:
          type: string
          description: Masked card number.
        card_status:
          type: string
          description: Current card status. See [Card Status](/docs/issuing/get-started/create-cards/card-statuses) for definitions.
          enum:
          - PENDING
          - FAILED
          - INACTIVE
          - ACTIVE
          - LOST
          - STOLEN
          - CLOSED
          - BLOCKED
          - EXPIRED
          - UNKNOWN
        card_version:
          type: integer
          format: int32
          description: Current version of the card.
        cardholder_id:
          type: string
          format: uuid
          description: The unique identifier of the cardholder this card is associated with if it is an individual card.
        client_data:
          type: string
          description: Client data which will be stored against the card record in Airwallex.
        created_at:
          type: string
          format: date-time
          description: Creation time of the card.
        created_by:
          type: string
          description: The creator of the card.
        delivery_details:
          $ref: '#/components/schemas/NonPciDeliveryDetails'
          description: Delivery detail of the card. Only available for physical cards.
        form_factor:
          type: string
          description: Form of the card.
          enum:
          - PHYSICAL
          - VIRTUAL
        funding_source_id:
          type: string
          format: uuid
          description: A unique identifier that links a card to its designated funding source. This unique identifier determines which funding source will be accessed for the deduction of funds during transactions. The `funding_source_id` can be retrieved from the client's account manager. If `funding_source_id` is not provided, the default funding source would be the account's wallet.
        is_personalized:
          type: boolean
          description: Determines whether the card should be assigned to a singular individual or to the business with multiple cardholders who are authorized to use the card. Note - only personalized cards can be created as physical and added to digital wallet providers.
        metadata:
          type: object
          description: A set of key-value pairs that can be attached to the Card. You can specify up to 20 keys, with key names up to 20 characters long and values up to 150 characters long.
          additionalProperties:
            type: string
        name_on_card:
          type: string
          description: Name to be printed on card.
        nick_name:
          type: string
          description: A nick name for the card.
        note:
          type: string
          description: Notes that are to be stored against the card request (for client reference).
        postal_address:
          $ref: '#/components/schemas/NonPciAddress'
          description: Optional postal address of physical card delivery.
        primary_contact_details:
          $ref: '#/components/schemas/NonPciPrimaryContactDetail'
          description: Details of the primary contact of the card.
        program:
          $ref: '#/components/schemas/NonPciCardProgram'
          description: Card program.
        purpose:
          type: string
          description: The purpose of the card's usage. Only available for expense cards.
          enum:
          - SUBSCRIPTIONS
          - OFFICE_SUPPLIES
          - MARKETING_EXPENSES
          - TRAVEL_EXPENSES
          - CLIENT_EXPENSES
          - TEAM_EXPENSES
          - ONLINE_PURCHASING
          - BUSINESS_EXPENSES
          - OTHER
        request_id:
          type: string
          description: 'A unique request identifier specified by the client. Requests with the same request_id will be ignored. This allows requests to be replayed if client is unsure of the outcome, e.g. due to network issues, system failures, etc.  Note: Can be non-UUID as long as it is unique between requests.'
        updated_at:
          type: string
          format: date-time
          description: Last update time of the card.
    NonPciCardSummary:
