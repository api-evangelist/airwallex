      tags:
      - Issuing > Cards
      summary: 2|Retrieve a Card
      description: Retrieve Card details.
      operationId: retrieveCard
      parameters:
      - name: id
        in: path
        description: Unique Identifier for the card.
        required: true
        schema:
          type: string
          format: uuid
          default: 6c2dc266-09ad-4235-b61a-767c7cd6d6ea
      responses:
        '200':
          description: OK
          content:
