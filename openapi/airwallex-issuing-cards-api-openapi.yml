  /api/v1/issuing/cards/{id}/provision_digital_token:
    post:
      tags:
      - Issuing > Cards
      summary: 6|Provision a Card to a Digital Wallet
      description: 'Provisions a card into a digital wallet for in-app (push) provisioning. Available only to accounts with white-label digital wallets enabled.


        The request body is wallet-specific and selected by the `type` field. The interactive form shows a single body shape, so the per-type request bodies are documented here:


        **`apple_pay`** (Apple Wallet / PassKit provisioning):

        - `device_certs` (array): device certificate chain, leaf certificate first

        - `nonce_signature` (string): signature over the nonce

        - `nonce` (string): one-time nonce


        **`google_pay`** (Google Pay provisioning):

        - `device_id` (string): stable device identifier from the Google Pay SDK

        - `client_customer_id` (string): wallet account holder identifier


        **`samsung_pay`** (Samsung Pay provisioning):

        - `device_id` (string): stable device identifier from the Samsung Pay SDK

        - `client_customer_id` (string): wallet account holder identifier.'
      operationId: provisionDigitalToken
      parameters:
      - name: id
        in: path
        description: Unique Identifier for the card.
        required: true
        schema:
          type: string
          default: 7f687fe6-dcf4-4462-92fa-80335301d9d2
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  description: Digital wallet type.
                  enum:
                  - apple_pay
                  - google_pay
                  - samsung_pay
                device_certs:
                  type: array
                  description: Required when `type` is `apple_pay`. Device certificate chain from the Apple Wallet (PassKit) provisioning request, leaf certificate first.
                  items:
                    type: string
                nonce:
                  type: string
                  description: Required when `type` is `apple_pay`. One-time nonce supplied by Apple PassKit.
                nonce_signature:
                  type: string
                  description: Required when `type` is `apple_pay`. Signature over the nonce, supplied by Apple PassKit.
                client_customer_id:
                  type: string
