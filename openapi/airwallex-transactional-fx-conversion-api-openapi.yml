info:
  title: Airwallex Transactional FX > Conversion API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Transactional FX > Conversion
  description: The Conversion resources provide capability to create transactions that convert from one currency into another. The transaction will result in a debit and credit against your wallet balances. Both Quotes and Rates transactions can be created using the Conversion resources.
  x-domain: Transactional FX
  x-resource: Conversion
  x-urlPath: transactional_fx/conversion
paths:
  /api/v1/fx/conversions/create:
    post:
      tags:
      - Transactional FX > Conversion
      summary: 1|Create a Conversion
      description: 'Create a new conversion to be executed within your Airwallex wallet. To associate a conversion with a payout, use the Payment API. (Note: Some exotic currencies require conversions to be associated with payouts.)


        If using Quotes, users must provide a valid Quote ID in the conversion request. The key details of the conversion request such as buy_currency, sell_currency, and conversion_date (if specified) must match the quote details. Otherwise, users can leave the Quote ID field blank, resulting in the conversion being executed at the current market rate.


        On a conversion, populate both `buy_currency` and `sell_currency`, but define only one of either `buy_amount` or `sell_amount`. This populated amount defines the dealt (also known as fixed) side of the conversion. The other amount will be computed by Airwallex based on the exchange rate of the conversion. The minimum conversion limit per conversion is USD $1.'
      operationId: createConversion
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - buy_currency
              - request_id
              - sell_currency
              properties:
                application_fee_options:
                  type: array
                  description: The application fee options applied to the transaction.
                  items:
                    type: object
                    properties:
                      amount:
                        type: string
                        description: A positive integer specifying the amount of the fee expressed in the smallest unit of the currency. e.g. cents for USD. This field is required only when type is FIXED.
                      currency:
                        type: string
                        description: "Specify the currency of the application fee in ISO 4217 currency code format, e.g., USD, AUD. This field is required when the type is FIXED.  \nWhen the type is PERCENTAGE and source_type is CONVERSION, the currency for the conversion if specified must be from the currency pair. If the currency is unspecified, the contra currency of the quote will be used."
                      metadata:
                        type: object
                        description: The metadata of the application fee. The value should be set in key:value format. (e.g., id:1).
                        additionalProperties:
                          type: string
                      percentage:
                        type: string
                        description: "Required if the type is PERCENTAGE, and the value to be provided depends on the transaction context.  \nFX Conversions: The value acts as a markup on the FX rate, increasing the conversion cost by the specified percentage.  \nOthers: The value represents a direct fee calculated as a percentage of the transaction amount."
                      source_type:
                        type: string
                        description: Specify type of the source transaction.
                        enum:
                        - CONVERSION
                        - TRANSFER
                      type:
                        type: string
                        description: Define the type of fee calculation. If the `source_type` is `CONVERSION`, then the type must be `PERCENTAGE`.
                        enum:
                        - FIXED
                        - PERCENTAGE
                buy_amount:
                  type: string
                  description: Amount in `buy_currency` that the client buys. Must be specified if `sell_amount` is not specified.
                buy_currency:
                  type: string
                  description: Currency that the client buys (in 3-letter ISO-4217 format).
                conversion_date:
                  type: string
                  description: Date on which the conversion will be settled. `conversion_date` defaults to current date, if funding is available, unless specified.
                funding_source:
                  type: object
                  required:
                  - id
                  description: The funding information for this conversion. By default (when the funding object is not specified), conversions will source funds from the wallet.
                  properties:
                    debit_type:
                      type: string
                      description: The type of deposit you would like to create. If not specified, it will default to DIRECT_DEBIT.
                      enum:
                      - DIRECT_DEBIT
                      - FASTER_DIRECT_DEBIT
                    id:
                      type: string
                      description: The funding source unique identifier only supports Linked Accounts. Please provide the unique identifier of your Linked Account as returned in [Create a Linked Account](/docs/api/core_resources/linked_accounts/create). Note that if not specified, the funding source will default to your Wallet.
                metadata:
                  type: object
                  description: A set of key-value pairs for storing your own data together with the conversion.
                  additionalProperties:
                    type: string
                quote_id:
                  type: string
                  description: Provide a valid Quote unique identifier if you want the conversion executed at the `client_rate` returned in the quote.
                request_id:
                  type: string
                  description: Client-generated idempotency key. Must be unique per request attempt. Conversion requests with the same `request_id` will be rejected. Parameter supports a maximum of 64 characters.
                sell_amount:
                  type: string
                  description: Amount in `sell_currency` that the client sells. Must be specified if `buy_amount` is not specified.
                sell_currency:
                  type: string
                  description: Currency that the client sells (in 3-letter ISO-4217 format).
        description: request
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversion'
        '400':
          description: '["amount_above_limit"

            ,"amount_below_limit"

            ,"conflict_original_ccy"

            ,"expired_quote"

            ,"field_required"

            ,"invalid_argument"

            ,"invalid_endpoint"

            ,"invalid_quote_id"

            ,"invalid_settlement_date"

            ,"operation_failed"

            ,"unsupported_currency"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
