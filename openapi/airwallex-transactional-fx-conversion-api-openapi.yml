            conversion_date: '2017-03-22'
            conversion_id: d9af1614-a6a1-4d45-aae7-6858fc6d9ede
            created_at: 2017-03-20T10:08:12+1100
            currency_pair: AUDUSD
            dealt_currency: USD
            mid_rate: 0.761223
            rate_details:
            - buy_amount: 10000
              level: CLIENT
              rate: 0.781523
              sell_amount: 12794.27
            request_id: 67f687fe-dcf4-4462-92fa-20335301d9d8
            sell_amount: 12794.27
            sell_currency: AUD
            settlement_cutoff_at: 2017-03-22T14:00:00+1100
            short_reference_id: 20170608-AF3GJ9
            status: SETTLED
            updated_at: 2017-03-20T14:00:01+1100
      x-scope:
      - scope: fx.conversion:read
        group: Transactional FX
        resource_name: Conversion
      x-domain: Transactional FX
      x-resource: Conversion
      x-urlPath: list
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
