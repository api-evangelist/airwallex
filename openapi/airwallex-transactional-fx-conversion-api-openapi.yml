  /api/v1/fx/conversions:
    get:
      tags:
      - Transactional FX > Conversion
      summary: 3|List all Conversions
      description: Retrieve conversions, using any combination of optional queryable parameters below. You may specify none, one of, or both `from_created_at` or `to_created_at` parameters. If none of these parameters are specified, results for the last 31 days will be returned. If only one of these parameters are specified, we will assume a 31-day range to calculate the other, undefined parameter. The conversions are returned in descending order, with the most recent transactions appearing first. Each queryable parameter below supports only one defined value at a time.
      operationId: listConversion
      parameters:
      - name: buy_currency
        in: query
        description: Currency that the client bought (in 3-letter ISO-4217 format).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: AUD
      - name: from_created_at
        in: query
        description: The starting value for specifying a date range for results to be returned. The date range is specific to conversion creation (a conversion's `created_at` date). Specify a starting `created_at` date (in ISO-8601 format). This starting date is inclusive of the range.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: '2017-04-01'
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: request_id
        in: query
        description: Client-supplied conversion `request_id` (idempotency key).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: request_id
      - name: sell_currency
        in: query
        description: Currency that the client sold (in 3-letter ISO-4217 format).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: USD
      - name: status
        in: query
        description: Status of the conversion. Can be one of`SCHEDULED`, `OVERDUE`, `CANCELLED`, `SETTLED`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: SCHEDULED
      - name: to_created_at
        in: query
        description: The ending value for specifying a date range for results to be returned. The date range is specific to conversion creation (a conversion's `created_at` date). Specify an ending `created_at` date (in ISO-8601 format). This ending date is inclusive of the range.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: 2017-04-01T03:52:34+0000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: Paged results.
                    items:
                      $ref: '#/components/schemas/Conversion'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/fx/conversions
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          has_more: false
          items:
          - application_fee_options:
            - amount: '5'
              currency: AUD
              percentage: '0.1'
              source_type: TRANSFER
              type: FIXED
            application_fees:
            - amount: '5'
