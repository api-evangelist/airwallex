components:
  schemas:
    Conversion:
      type: object
      required:
      - awx_rate
      - buy_amount
      - buy_currency
      - client_rate
      - conversion_date
      - conversion_id
      - created_at
      - currency_pair
      - dealt_currency
      - mid_rate
      - request_id
      - sell_amount
      - sell_currency
      - settlement_cutoff_at
      - short_reference_id
      - status
      - updated_at
      properties:
        application_fee_options:
          type: array
          description: The application fee options applied to the transaction.
          items:
            $ref: '#/components/schemas/ApplicationFeeOption'
        application_fees:
          type: array
          description: Application fees in this transaction.
          items:
            $ref: '#/components/schemas/ApplicationFee'
        awx_rate:
          type: number
          description: For reference purposes only. This is a reference rate Airwallex compiles by analyzing prices across multiple banking providers and independent rate publishers.
        buy_amount:
          type: number
          description: The amount in `buy_currency` that was bought by the client.
        buy_currency:
          type: string
          description: Currency that the client bought (in 3-letter ISO-4217 format).
        client_rate:
          type: number
          description: The transaction execution rate of the conversion. This is the rate at which the client is charged.
        conversion_date:
          type: string
          description: Date on which the conversion will be settled. `conversion_date` defaults to current date, if funding is available, unless specified.
        conversion_id:
          type: string
          format: uuid
          description: Airwallex-generated unique identifier for the conversion record.
        created_at:
          type: string
          description: The time at which the conversion was created. Follows the [same timestamp format](/docs/api/data_types) as the rest of Airwallex’s APIs.
        currency_pair:
          type: string
          description: The currency pair associated with `awx_rate` and `client_rate`.
        dealt_currency:
          type: string
          description: Dealt denotes the fixed side of the conversion request. If `buy_amount` was specified, then `buy_currency`; else, `sell_currency` (in 3-letter ISO-4217 format).
        funding:
          $ref: '#/components/schemas/Transactional_FX_Funding'
          description: The funding information for this conversion.
        funding_source:
          $ref: '#/components/schemas/FundingSource'
          description: The funding information for this conversion.
        mid_rate:
          type: number
          description: For reference purposes only. This rate represents the midpoint of the current bid and ask price.
        quote_id:
          type: string
          description: The Quote used to execute the conversion. Echoes the request’s Quote unique identifier, if provided.
        rate_details:
          type: array
          description: Breakdown of rates at different user levels.
          items:
            $ref: '#/components/schemas/RateDetail'
        request_id:
          type: string
          description: Echoes request’s client-supplied request unique identifier (idempotency key).
        sell_amount:
          type: number
          description: The amount in `sell_currency` that was sold by the client.
        sell_currency:
          type: string
          description: Currency that the client sold (in 3-letter ISO-4217 format).
        settlement_cutoff_at:
          type: string
          description: This is latest time by which the `sell_amount` in `sell_currency` needs to be available in Airwallex account balance for the conversion to be successfully settled.
        short_reference_id:
          type: string
          description: Shortened transaction unique identifier for ease of use within Web GUI and with Airwallex support.
        status:
          type: string
          description: Status of the conversion. Can be one of `SCHEDULED`, `CANCELLED`, `OVERDUE`, `SETTLED`.
        updated_at:
          type: string
          description: The time at which the conversion was last updated (including status changes). Follows the [same timestamp format](/docs/api/data_types) as the rest of Airwallex’s APIs.
    ApplicationFeeOption:
      type: object
      properties:
        amount:
          type: string
          description: A positive integer specifying the amount of the fee expressed in the smallest unit of the currency. e.g. cents for USD. This field is required only when type is FIXED.
        currency:
          type: string
          description: "Specify the currency of the application fee in ISO 4217 currency code format, e.g., USD, AUD. This field is required when the type is FIXED.  \nWhen the type is PERCENTAGE and source_type is CONVERSION, the currency for the conversion if specified must be from the currency pair. If the currency is unspecified, the contra currency of the quote will be used."
        metadata:
          type: object
          description: The metadata of the application fee. The value should be set in key:value format. (e.g., id:1).
          additionalProperties:
            type: string
        percentage:
          type: string
          description: "Required if the type is PERCENTAGE, and the value to be provided depends on the transaction context.  \nFX Conversions: The value acts as a markup on the FX rate, increasing the conversion cost by the specified percentage.  \nOthers: The value represents a direct fee calculated as a percentage of the transaction amount."
        source_type:
          type: string
          description: Specify type of the source transaction.
          enum:
          - CONVERSION
          - TRANSFER
        type:
          type: string
          description: Define the type of fee calculation. If the `source_type` is `CONVERSION`, then the type must be `PERCENTAGE`.
          enum:
          - FIXED
          - PERCENTAGE
    RateDetail:
      type: object
      properties:
        buy_amount:
          type: number
          description: The total amount being bought at the respective level.
        level:
          type: string
          enum:
          - CLIENT
          - AWX
          - PLATFORM_CLIENT
        rate:
          type: number
          description: The exchange rate from the respective level's perspective.
        sell_amount:
          type: number
          description: The total amount being sold at the respective level.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    ApplicationFee:
      type: object
      properties:
        amount:
          type: string
          description: The application fee amount.
        currency:
          type: string
          description: The currency of the application fee.
        source_type:
          type: string
          description: Specify the type of source transaction for this application fee.
          enum:
          - CONVERSION
          - TRANSFER
    FundingSource:
      type: object
      required:
      - id
      properties:
        debit_type:
          type: string
          description: The type of deposit you would like to create. If not specified, it will default to DIRECT_DEBIT.
          enum:
          - DIRECT_DEBIT
          - FASTER_DIRECT_DEBIT
        id:
          type: string
          description: The funding source unique identifier only supports Linked Accounts. Please provide the unique identifier of your Linked Account as returned in [Create a Linked Account](/docs/api/core_resources/linked_accounts/create). Note that if not specified, the funding source will default to your Wallet.
      description: The funding information for this conversion.
    Transactional_FX_Funding:
      type: object
      properties:
        debit_type:
          type: string
          enum:
          - DIRECT_DEBIT
          - FASTER_DIRECT_DEBIT
        failure_reason:
          type: string
          description: Empty unless the funding is in an error state.
        funding_source_id:
          type: string
          description: The id of the funding source, it can be null if using a wallet.
        status:
          type: string
          description: The funding statuses of this conversion.
      description: The funding information for this conversion.
