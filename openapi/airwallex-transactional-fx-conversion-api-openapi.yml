        method: POST
        uri: /api/v1/fx/conversions/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          application_fee_options:
