components:
  schemas:
    DelayedPlan:
      type: object
      properties:
        delay_in_days:
          type: integer
          format: int32
          description: the number of days that transaction amount will be held in your reserve account before they are released.
      description: '`DELAYED` reserve plan.'
    ConvertibleShopperCurrencies:
      type: object
      properties:
        items:
          type: array
          description: A list of shopper currencies available for currency conversion. Each currency is represented by a 3-letter ISO-4217 code.
          items:
            type: string
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    BankResources:
      type: object
      properties:
        logo_url:
          type: string
          description: URLs of the bank logos.
      description: The resources provided to render your bank list.
    ApplePayRegisteredDomains:
      type: object
      properties:
        items:
          type: array
          description: All registered domains.
          items:
            type: string
    ReservePlan:
      type: object
      properties:
        delayed:
          $ref: '#/components/schemas/DelayedPlan'
          description: '`DELAYED` reserve plan.'
        delayed_rolling:
          $ref: '#/components/schemas/DelayedRollingPlan'
          description: '`DELAYED_ROLLING` reserve plan.'
        rolling:
          $ref: '#/components/schemas/RollingPlan'
          description: '`ROLLING` reserve plan.'
        type:
          type: string
          description: "The type of the reserve plan. Possible values:  \n  \n\n-   `DELAYED`: All funds will settle to your wallet `delayed.delay_in_days` days after transaction.\n-   `ROLLING`: `rolling.rolling_percentage` percent of funds will be held for `rolling.rolling_window_in_days` days, while the rest will settle in 2-3 days after transaction.\n-   `DELAYED_ROLLING`: Combination of `DELAYED` and `ROLLING` reserve plans. All funds will be held for `delayed_rolling.delay_in_days` days and `delayed_rolling.rolling_percentage` percent of funds will be held for additional `delayed_rolling.rolling_window_in_days` after transaction."
    PaymentMethodTypeConfig:
      type: object
      properties:
        active:
          type: boolean
          description: Indicate whether the payment method type is active.
        flows:
          type: array
          description: The supported flows for the payment method type and the transaction mode. One of `qrcode`, `mobile_web`, `mobile_app`.
          items:
            type: string
        name:
          type: string
          description: 'The type of payment method. Can be `card`, `wechatpay`, `alipaycn`, `alipayhk`, `kakaopay`, `tng`, `truemoney`, `dana`, `gcash`, etc. '
        transaction_currencies:
          type: array
          description: The supported transaction currencies for the payment method type and the transaction mode.
          items:
            type: string
        transaction_mode:
          type: string
          description: 'Indicate in which mode you trigger transactions with the payment method type. One of `oneoff`, `recurring`.

            '
    RollingPlan:
      type: object
      properties:
        rolling_percentage:
          type: number
          description: the percentage of the transaction amount that will be held in the reserve account.
        rolling_window_in_days:
          type: integer
          format: int32
          description: the number of days that the reserved funds will be held before they are released.
      description: '`ROLLING` reserve plan.'
    DelayedRollingPlan:
      type: object
      properties:
        delay_in_days:
          type: integer
          format: int32
          description: the number of days that transaction amount will be held in your reserve account after transaction.
        rolling_percentage:
          type: number
          description: the percentage of the transaction amount that will be held in the reserve account after `delay_in_days`.
        rolling_window_in_days:
          type: integer
          format: int32
          description: the number of days that the reserved funds will be held in the reserve account after `delay_in_days`.
      description: '`DELAYED_ROLLING` reserve plan.'
    BankConfig:
      type: object
      required:
      - bank_name
      - display_name
      - resources
      properties:
        bank_name:
          type: string
          description: The code name of the bank. Pass it to confirm Payment Intent if `bank_name` is needed.
        display_name:
          type: string
          description: The bank name for display.
        resources:
          $ref: '#/components/schemas/BankResources'
          description: The resources provided to render your bank list.
