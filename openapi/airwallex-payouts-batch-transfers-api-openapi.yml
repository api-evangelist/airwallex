openapi: 3.2.0
info:
  title: Airwallex Payouts > Batch Transfers API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payouts > Batch Transfers
  description: A batch transfer resource is created when you want to create multiple transfers with one fund deduction from your funding source. You can create a batch transfer first, and then add items into this batch. You can only input one funding source in a batch. Beneficiary information is contained in each item in the batch.
  x-domain: Payouts
  x-resource: Batch Transfers
  x-urlPath: payouts/batch_transfers
paths:
  /api/v1/batch_transfers/create:
    post:
      tags:
      - Payouts > Batch Transfers
      summary: 1|Create a Batch Transfer
      description: Create a new batch transfer.
      operationId: createBatchTransfer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                funding_source:
                  type: object
                  description: Specify funding source for the batch. If not set, default is wallet.
                  properties:
                    deposit_type:
                      type: string
                      description: The type of deposit you would like to create, either DIRECT_DEBIT or FASTER_DIRECT_DEBIT. If not specified, it will default to DIRECT_DEBIT.
                    id:
                      type: string
                      format: uuid
                      description: The funding source unique identifier only supports Linked Accounts. Please provide the unique identifier of your Linked Account as returned in [Create a Linked Account](/docs/api/core_resources/linked_accounts/create). Note that if not specified, the funding source will default to your Wallet.
                    reference:
                      type: string
                      description: A user specified reference that will be displayed to the Direct Debit bank account owner on the bank statement.
                metadata:
                  type: object
                  description: A set of key-value pairs for storing your own data together with the batch transfer.
                  additionalProperties:
                    type: string
                name:
                  type: string
                  description: The name of the batch transfer.
                remarks:
                  type: string
                  description: Additional information about this batch transfer, which will not be passed to the beneficiary.
                request_id:
                  type: string
                  description: A unique batch payout reference specified by the client. Batch payout create requests with the same request_id will be rejected.
                transfer_date:
                  type: string
                  description: If you are using your Wallet as the funding source, you can specify a current or future date (ISO 8601 format) for when the batch transfer items should be processed. If left blank, the transfer date will default to the earliest possible date.
        description: createBatchDto.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransfer'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/batch_transfers/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          funding_source:
            deposit_type: DIRECT_DEBIT
            id: 8365ea88-2946-4877-abe1-e02a1015288d
            reference: DD for batch transfer 12345
          metadata:
            order_id: 0123456789
          name: batch-name
          remarks: Any information
          request_id: 7f687fe6-dcf4-4462-92fa-80335301d911
          transfer_date: '2024-01-24'
        response_body:
          funding:
            deposit_type: DIRECT_DEBIT
            failure_details:
              code: insufficient_funds
              iso_code: AM04
              provider_failure_details:
                code: R01
                local_clearing_system: US_ACH
                message: INSUFFICIENT FUNDS
            failure_reason: regulatory_reason
            funding_source_id: b3856846-31b0-44d8-855d-e0eedf532282
            reference: DD for batch transfer 12345
            status: FUNDED
          id: d9af1614-a6a1-4d45-aae7-6858fc6d9ede
          metadata:
            order_id: 0123456789
          name: batch-name
          quote_summary:
            expires_at: 2024-01-24T18:03:02+1100
            last_quoted_at: 2024-01-24T18:00:02+1100
            quotes:
            - amount_beneficiary_receives: 200
              amount_payer_pays: 1005
              client_rate: 5
              currency_pair: AUDUSD
              fee_amount: 5
              fee_currency: USD
              source_currency: USD
              transfer_currency: AUD
            validity: MIN_1
          remarks: Any information
          request_id: 7f687fe6-dcf4-4462-92fa-80335301d911
          short_reference_id: B231018-TMA1RTC
          status: SCHEDULED
          total_item_count: 100
          transfer_date: '2024-01-24'
          updated_at: 2024-01-24T18:00:02+1100
          valid_item_count: 99
      x-scope:
      - scope: transfer:write
        group: Authentication
        resource_name: Embedded Components - Transfers
      x-domain: Payouts
      x-resource: Batch Transfers
      x-urlPath: create
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
  /api/v1/batch_transfers/{id}:
    get:
      tags:
      - Payouts > Batch Transfers
      summary: 2|Retrieve a Batch Transfer
      description: Retrieve details of a batch transfer by specifying the batch transfer `id`.
      operationId: retrieveBatchTransfer
      parameters:
      - name: id
        in: path
        description: Unique identifier of the batch transfer to retrieve.
        required: true
        schema:
          type: string
          format: uuid
          default: d9af1614-a6a1-4d45-aae7-6858fc6d9ede
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTransfer'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/batch_transfers/batch_transfer_id
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          funding:
            deposit_type: DIRECT_DEBIT
            failure_reason: regulatory_reason
            funding_source_id: b3856846-31b0-44d8-855d-e0eedf532282
            reference: DD for batch transfer 12345
            status: FUNDED
          id: d9af1614-a6a1-4d45-aae7-6858fc6d9ede
          metadata:
            order_id: 0123456789
          name: batch-name
          quote_summary:
            expires_at: 2024-01-24T18:03:02+1100
            last_quoted_at: 2024-01-24T18:00:02+1100
            quotes:
            - amount_beneficiary_receives: 200
              amount_payer_pays: 1005
              client_rate: 5
              currency_pair: AUDUSD
              fee_amount: 5
              fee_currency: USD
              source_currency: USD
              transfer_currency: AUD
            validity: MIN_1
          remarks: Any information
          request_id: 7f687fe6-dcf4-4462-92fa-80335301d911
          short_reference_id: B231018-TMA1RTC
          status: SCHEDULED
          total_item_count: 100
          transfer_date: '2024-01-24'
          updated_at: 2024-01-24T18:00:02+1100
          valid_item_count: 99
      x-scope:
      - scope: transfer:read
        group: Payouts
        resource_name: Transfers
      x-domain: Payouts
      x-resource: Batch Transfers
      x-urlPath: retrieve
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
  /api/v1/batch_transfers:
    get:
      tags:
      - Payouts > Batch Transfers
      summary: 3|List all Batch Transfers
      description: Retrieve batch transfers with optional filters on request id, status, or pagination parameters (page, page_size).
      operationId: listBatchTransfers
      parameters:
      - name: page
        in: query
        description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of page_after (if not null) from the response to a subsequent call. To retrieve the previous page of results, pass the value of page_before (if not null) from the response to a subsequent call.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Number of results per page, default and max value is 50.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 50
      - name: request_id
        in: query
        description: Batch transfer `request_id`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: short_reference_id
        in: query
        description: Batch transfer `short_reference_id`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: status
        in: query
        description: The batch transfer status.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorBasedPagedQueryResultDtoOfBatchTransfer'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/batch_transfers
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          items:
          - funding:
              deposit_type: DIRECT_DEBIT
              failure_details:
                code: insufficient_funds
                iso_code: AM04
                provider_failure_details:
                  code: R01
                  local_clearing_system: US_ACH
                  message: INSUFFICIENT FUNDS
              failure_reason: regulatory_reason
              funding_source_id: b3856846-31b0-44d8-855d-e0eedf532282
              reference: DD for batch transfer 12345
              status: FUNDED
            id: d9af1614-a6a1-4d45-aae7-6858fc6d9ede
            metadata:
              order_id: 0123456789
            name: batch-name
            quote_summary:
              expires_at: 2024-01-24T18:03:02+1100
              last_quoted_at: 2024-01-24T18:00:02+1100
              quotes:
              - amount_beneficiary_receives: 200
                amount_payer_pays: 1005
                client_rate: 5
                currency_pair: AUDUSD
                fee_amount: 5
                fee_currency: USD
                source_currency: USD
                transfer_currency: AUD
            remarks: Any information
            request_id: 7f687fe6-dcf4-4462-92fa-80335301d911
            short_reference_id: B231018-TMA1RTC
            status: SCHEDULED
            total_item_count: 100
            transfer_date: '2024-01-24'
            updated_at: 2024-01-24T18:00:02+1100
            valid_item_count: 99
          page_after: <string>
          page_before: <string>
      x-scope:
      - scope: transfer:read
