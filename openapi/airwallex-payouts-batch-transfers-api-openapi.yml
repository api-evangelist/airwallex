components:
  schemas:
    ProviderFailureDetails:
      type: object
      properties:
        code:
          type: string
          description: The original error code received from the local clearing system.
        local_clearing_system:
          type: string
          description: The local clearing system used for the direct debit deposit. Possible values are `AU_BECS`, `US_ACH`, `GB_BACS`, `EU_SEPA`.
        message:
          type: string
          description: The original error message received from the local clearing system.
      description: A set of original information received from the local clearing system.
    Payouts_Payer:
      type: object
      required:
      - address
      - entity_type
      properties:
        additional_info:
          $ref: '#/components/schemas/PayerAdditionalInfo'
          description: Additional information about the payer.
        address:
          $ref: '#/components/schemas/PayerAddress'
          description: Payer's address details.
        company_name:
          type: string
          description: Company name of the payer.
        date_of_birth:
          type: string
          description: Payer's date of birth.
        entity_type:
          type: string
          description: Entity type of the payer.
        first_name:
          type: string
          description: First name of the payer.
        last_name:
          type: string
          description: Last name of the payer.
      description: Details for the payer in the transfer request. If payer_id provided in the transfer request then payer should be empty.
    CursorBasedPagedQueryResultDtoOfBatchTransfer:
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/BatchTransfer'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    BatchTransfer:
      type: object
      required:
      - id
      - request_id
      - short_reference_id
      - status
      - total_item_count
      - updated_at
      - valid_item_count
      properties:
        funding:
          $ref: '#/components/schemas/BatchFunding'
          description: The funding information of this batch transfer.
        id:
          type: string
          description: System generated batch transfer id.
        metadata:
          type: object
          description: A set of key-value pairs for storing your own data together with the batch transfer.
          additionalProperties:
            type: string
        name:
          type: string
          description: The name of the batch transfer.
        quote_summary:
          $ref: '#/components/schemas/QuoteSummary'
          description: Summary of all transfer quotes in the batch. Quotes are consolidated based on currency pairs.
        remarks:
          type: string
          description: Additional information about this batch transfer, which will not be passed to the beneficiary.
        request_id:
          type: string
          description: A unique batch transfer reference specified by the client.
        short_reference_id:
          type: string
          description: System generated batch short reference id.
        status:
          type: string
          description: '[Batch transfer statuses](/docs/payouts/batch-transfers/create-a-batch-transfer/batch-transfer-statuses), can be one of: `DRAFTING`, `IN_APPROVAL`, `APPROVAL_RECALLED`, `APPROVAL_REJECTED`, `APPROVAL_BLOCKED`, `SCHEDULED`, `OVERDUE`, `BOOKING`, `PARTIALLY_BOOKED`, `BOOKED`, `FAILED`, `CANCELLATION_REQUESTED`, `CANCELLED`.'
        total_item_count:
          type: integer
          format: int32
          description: The total count of items within the batch transfer.
        transfer_date:
          type: string
          description: Date when batch transfer is scheduled to be processed.
        updated_at:
          type: string
          description: The time this batch transfer was last updated.
        valid_item_count:
          type: integer
          format: int32
          description: The total count of valid batch transfer items contained. Invalid items will also be stored in the batch, you can use add_items and delete_items API to update it or execute without those invalid items.
    CursorBasedPagedQueryResultDtoOfBatchTransferItem:
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/BatchTransferItem'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    BankDetails:
      type: object
      required:
      - account_currency
      - account_name
      - bank_country_code
      properties:
        account_currency:
          type: string
          description: Account Currency.
        account_name:
          type: string
          description: Account holder name of the beneficiary’s bank account.
        account_name_alias:
          type: string
          description: The beneficiary’s account name known in the payment system. This is only supported in some regions and transfer methods. See detailed definitions in the [Payouts Product Docs](/docs/payouts/beneficiaries/create-beneficiaries).
        account_number:
          type: string
          description: Account number, mostly for non-european countries, either account_number or iban should be filled.
        account_routing_type1:
          type: string
          description: Routing code type.
        account_routing_type2:
          type: string
          description: Routing code sub type.
        account_routing_value1:
          type: string
          description: Routing code value.
        account_routing_value2:
          type: string
          description: Routing code sub type value.
        bank_account_category:
          type: string
          description: bank account type.
        bank_branch:
          type: string
          description: Specific branch of bank account.
        bank_country_code:
          type: string
          description: Bank country code (2-letter ISO 3166-2 country code).
        bank_name:
          type: string
          description: Bank name of the beneficiary's bank account.
        bank_state:
          type: string
          description: Bank State.
        bank_street_address:
          type: string
          description: Bank street address.
        binding_mobile_number:
          type: string
          description: The mobile number tied to the Beneficiary's bank account.
        fingerprint:
          type: string
          description: Fingerprint of current beneficiary's bank account.
        iban:
          type: string
          description: International bank account number, mostly for european countries.
        intermediary_bank_name:
          type: string
          description: Bank name of the beneficiary's intermediary bank.
        intermediary_bank_swift_code:
          type: string
          description: Intermediary bank SWIFT code / BIC,Should contain alphanumeric characters only, Should be a valid and supported SWIFT code / BIC.
        local_clearing_system:
          type: string
          description: 'Which clearing system should be used for this local bank transfer.


            Please refer to our [payout guide](https://airwallex.com/guides/payout) for details about each option.


            We suggest explicitly specifying this value, however if it''s not provided we will select a default (using the specified account routing type and/or what''s most often the best option).'
        swift_code:
          type: string
          description: Bank swift code.
      description: Beneficiary's bank account details where the payment will be credited.
    BeneficiaryAdditionalInfo:
      type: object
      properties:
        business_area:
          type: string
          description: Category of business activity.
        business_phone_number:
          type: string
          description: Business phone number.
        business_registration_number:
          type: string
          description: Business registration number.
        external_identifier:
          type: string
          description: The identifier that you use to identify a beneficiary, usually a unique identifier. This field can be used to link transfers or beneficiaries to other records such as tax form details for filing purposes.
        legal_rep_bank_account_number:
          type: string
          description: Legal representative's personal bank account number used for declaration purposes. No funds will be sent to this account number.
        legal_rep_first_name_in_chinese:
          type: string
          description: Legal representative first name in chinese.
        legal_rep_id_number:
          type: string
          description: Legal representative id number.
        legal_rep_last_name_in_chinese:
          type: string
          description: Legal representative last name in chinese.
        legal_rep_mobile_number:
          type: string
          description: Legal representative’s mobile number associated with their bank account.
        personal_email:
          type: string
          description: Personal email.
        personal_first_name_in_chinese:
          type: string
          description: Beneficiary's first name in Chinese.
        personal_id_number:
          type: string
          description: Personal unique identifier number.
        personal_id_type:
          type: string
          description: Personal unique identifier type.
        personal_last_name_in_chinese:
          type: string
          description: Beneficiary's last name in Chinese.
        personal_mobile_number:
          type: string
          description: Personal mobile number.
        recipient_account_id:
          type: string
          description: Account unique identifier of the recipient account used for payout processing. The account must be active and have `customer_agreements.terms_and_conditions.service_agreement_type` set to `RECIPIENT` (verify via [Retrieve account details API](/docs/api/scale/accounts/detail)).
        security_question:
          type: string
          description: Security question. Required when the email address is not registered with Interac e-Transfer autodeposit.
        security_question_answer:
          type: string
          description: Security question answer. Required when the email address is not registered with Interac e-Transfer autodeposit.
      description: Additional information about the beneficiary.
    PayerAddress:
      type: object
      required:
      - country_code
      properties:
        city:
          type: string
          description: Payer's city.
        country_code:
          type: string
          description: Payer's country code (2-letter ISO 3166-2 country code).
        postcode:
          type: string
          description: Payer's post code.
        state:
          type: string
          description: Payer's state.
        street_address:
          type: string
          description: Payer's street address.
      description: Payer's address details.
    ErrorDetails:
      type: object
      properties:
        code:
          type: string
          description: Unique numeric identifier of the specific validation error encountered.
        params:
          type: object
          description: Additional parsable information relating to the specific validation error where applicable, e.g. minimum and maximum character length.
        source:
          type: string
          description: The specific field within the request that has failed.
    Payouts_Beneficiary:
      type: object
      properties:
        additional_info:
          $ref: '#/components/schemas/BeneficiaryAdditionalInfo'
          description: Additional information about the beneficiary.
        address:
          $ref: '#/components/schemas/BeneficiaryAddress'
          description: Beneficiary's address details.
        bank_details:
          $ref: '#/components/schemas/BankDetails'
          description: Beneficiary's bank account details where the payment will be credited.
        card:
          $ref: '#/components/schemas/Payouts_Card'
          description: Beneficiary's card details where the payment will be credited.
        company_name:
          type: string
          description: Company name of the beneficiary.
        date_of_birth:
          type: string
          description: beneficiary date of birth.
        digital_wallet:
          $ref: '#/components/schemas/DigitalWallet'
          description: Beneficiary's digital wallet details where the payment will be credited.
        entity_type:
          type: string
          description: Entity type of the beneficiary.
        first_name:
          type: string
          description: First name of the beneficiary.
        last_name:
          type: string
          description: Last name of the beneficiary.
        stablecoin_wallet:
          $ref: '#/components/schemas/StablecoinWallet'
          description: Beneficiary's stablecoin wallet details where the payment will be credited.
        type:
          type: string
          description: Type of the beneficiary, indicating the type of account or method through which the beneficiary receives funds.
      description: Details of the beneficiary.
    TransferDraft:
      type: object
      required:
      - amount_beneficiary_receives
      - amount_payer_pays
      - beneficiary
      - fee_amount
      - fee_currency
      - fee_paid_by
      - payer
      - reason
      - reference
      - request_id
      - short_reference_id
      - source_amount
      - source_currency
      - transfer_amount
      - transfer_currency
      - transfer_date
      - transfer_method
      properties:
        amount_beneficiary_receives:
          type: number
          description: The total amount (in transfer `transfer_currency`) the beneficiary receives for this transfer, and is governed by value specified in `fee_paid_by`, i.e. if `fee_paid_by` is `PAYER`, then the beneficiary receives the exact same `transfer_amount` since payer is responsible for the transfer fee.  Otherwise, beneficiary receives `transfer_amount - fee` as the fee is implicitly passed onto the beneficiary.
        amount_payer_pays:
          type: number
          description: The total amount (in `source_currency`) the payer has to pay for making this transfer. For example, if `fee_paid_by` is `PAYER` and FX conversion is not involved, then this is the sum of `transfer_amount + fee` as the payer is responsible for the fee.  Otherwise this field is the same as `transfer_amount`.
        application_fee_options:
          type: array
          description: The application fee options applied to the transfer.
          items:
            $ref: '#/components/schemas/ApplicationFeeOption'
        application_fees:
          type: array
          description: Application fees in this transfer.
          items:
            $ref: '#/components/schemas/ApplicationFee'
        beneficiary:
          $ref: '#/components/schemas/Payouts_Beneficiary'
          description: Details of the beneficiary.
        beneficiary_id:
          type: string
          format: uuid
          description: beneficiary_id of the beneficiary contact used to create this transfer.
        fee_amount:
          type: number
          description: The transfer fee (in `source_currency`) for sending this transfer.
        fee_currency:
          type: string
          description: The transfer fee currency. This should always equal to the `source_currency`.
        fee_paid_by:
          type: string
          description: Denotes whether `PAYER` / `BENEFICIARY` will be liable for the the transfer fee.  Defaults to `PAYER` unless field is populated in the request.
        metadata:
          type: object
          description: A set of key-value pairs for storing your own data together with the transfer.
          additionalProperties:
            type: string
        payer:
          $ref: '#/components/schemas/Payouts_Payer'
          description: Details of the payer.
        payer_id:
          type: string
          format: uuid
          description: payer_id of the payer contact used to create this transfer.
        reason:
          type: string
          description: Reason for the transfer instruction.
        reference:
          type: string
          description: Bank transfer reference to be shown on beneficiary's bank transaction history.
        remarks:
          type: string
          description: Additional information about this transfer, which will not be passed to the beneficiary.
        request_id:
          type: string
          description: A unique request identifier specified in the transfer request.
        short_reference_id:
          type: string
          description: Short transfer reference for support purposes.
        source_amount:
          type: number
          description: Amount to be received.
        source_currency:
          type: string
          description: Copied from the request if specified.
        transfer_amount:
          type: number
          description: Amount to be paid.
        transfer_currency:
          type: string
          description: Currency the transfer should be made in (3-letter ISO-4217 code).
        transfer_date:
          type: string
          description: Date when transfer should be made (Copied from the request if specified).
        transfer_method:
          type: string
          description: Copied from the request if specified.  Otherwise the system will populate this field automatically.
      description: Transfer draft preview after obtaining a quote. It will no longer be available once batch transfer is booked.
    ApplicationFeeOption:
      type: object
      properties:
        amount:
          type: string
          description: A positive integer specifying the amount of the fee expressed in the smallest unit of the currency. e.g. cents for USD. This field is required only when type is FIXED.
        currency:
          type: string
          description: "Specify the currency of the application fee in ISO 4217 currency code format, e.g., USD, AUD. This field is required when the type is FIXED.  \nWhen the type is PERCENTAGE and source_type is CONVERSION, the currency for the conversion if specified must be from the currency pair. If the currency is unspecified, the contra currency of the quote will be used."
        metadata:
          type: object
          description: The metadata of the application fee. The value should be set in key:value format. (e.g., id:1).
          additionalProperties:
            type: string
        percentage:
          type: string
          description: "Required if the type is PERCENTAGE, and the value to be provided depends on the transaction context.  \nFX Conversions: The value acts as a markup on the FX rate, increasing the conversion cost by the specified percentage.  \nOthers: The value represents a direct fee calculated as a percentage of the transaction amount."
        source_type:
          type: string
          description: Specify type of the source transaction.
          enum:
          - CONVERSION
          - TRANSFER
        type:
          type: string
          description: Define the type of fee calculation. If the `source_type` is `CONVERSION`, then the type must be `PERCENTAGE`.
          enum:
          - FIXED
          - PERCENTAGE
    ApplicationFee:
      type: object
      properties:
        amount:
          type: string
          description: The application fee amount.
        currency:
          type: string
          description: The currency of the application fee.
        source_type:
          type: string
          description: Specify the type of source transaction for this application fee.
          enum:
          - CONVERSION
          - TRANSFER
    Payouts_FailureDetails:
      type: object
      properties:
        code:
          type: string
          description: Error code (details can be found [here](/docs/global-treasury/receive-funds/add-funds-via-direct-debits-from-linked-accounts/direct-debit-deposit-error-codes)).
        iso_code:
          type: string
          description: Error code [ISO 20022](https://www.iso20022.org/about-iso-20022) (details can be found [here](/docs/global-treasury/receive-funds/add-funds-via-direct-debits-from-linked-accounts/direct-debit-deposit-error-codes)).
        provider_failure_details:
          $ref: '#/components/schemas/ProviderFailureDetails'
          description: A set of original information received from the local clearing system.
      description: Details about why the funding has failed. Only present when the funding is in a failure state.
    DigitalWallet:
      type: object
      required:
      - account_name
      - id_type
      - id_value
      - provider
      properties:
        account_name:
          type: string
          description: Account holder name of the beneficiary’s digital wallet.
        country_code:
          type: string
          description: Digital wallet country code (2-letter ISO 3166-2 country code).
        id_type:
          type: string
          description: Account identifier type of the beneficiary’s digital wallet.
        id_value:
          type: string
          description: Account identifier value of the beneficiary’s digital wallet.
        provider:
          type: string
          description: Service provider of the beneficiary's digital wallet.
      description: Beneficiary's digital wallet details where the payment will be credited.
    BeneficiaryAddress:
      type: object
      properties:
        city:
          type: string
          description: Beneficiary's city.
        country_code:
          type: string
          description: Beneficiary's country code (2-letter ISO 3166-2 country code).
        postcode:
          type: string
          description: Beneficiary's post code.
        state:
          type: string
          description: Beneficiary's state.
        street_address:
          type: string
          description: Beneficiary's street address.
      description: Beneficiary's address details.
    BatchFunding:
      type: object
      required:
      - status
      properties:
        deposit_type:
          type: string
          description: 'Can be one of: `FASTER_DIRECT_DEBIT`, `DIRECT_DEBIT`.'
        failure_details:
          $ref: '#/components/schemas/Payouts_FailureDetails'
          description: Details about why the funding has failed. Only present when the funding is in a failure state.
        funding_source_id:
          type: string
          description: The id of the funding source, it can be null if using a wallet.
        reference:
          type: string
          description: 'A user specified reference that will be displayed to the Direct Debit bank account owner on the bank statement. '
        status:
          type: string
          description: The [Funding statuses](/docs/payouts/batch-transfers/create-a-batch-transfer/batch-transfer-statuses#funding-statuses) of this batch transfer, can be one of `SCHEDULED`, `PROCESSING`, `FUNDED`, `FAILED`, `REVERSED`.
      description: The funding information of this batch transfer.
    QuoteSummary:
      type: object
      required:
      - expires_at
      - last_quoted_at
      properties:
        expires_at:
          type: string
          description: The time this batch transfer's quote will expire.
        last_quoted_at:
          type: string
          description: The time this batch transfer last quoted.
        quotes:
          type: array
          description: The quote details of the batch transfer.
          items:
            $ref: '#/components/schemas/QuoteDetails'
        validity:
          type: string
          description: Quote validity period in the request.
          enum:
          - MIN_1
          - MIN_15
          - MIN_30
          - HR_1
          - HR_4
          - HR_8
          - HR_24
      description: Summary of all transfer quotes in the batch. Quotes are consolidated based on currency pairs.
    PayerAdditionalInfo:
      type: object
      properties:
        business_registration_number:
          type: string
          description: Business registration number.
        business_registration_type:
          type: string
          description: Type of business as registered with the local government authority.
        external_id:
          type: string
          description: Unique identifier of the person in your company.
        personal_email:
          type: string
          description: Personal email.
        personal_id_number:
          type: string
          description: Personal unique identifier number.
      description: Additional information about the payer.
    BatchTransferItem:
      type: object
      required:
      - id
      - request_id
      - status
      - updated_at
      properties:
        errors:
          type: array
          description: Any detailed error codes if status is `VALIDATION_FAILED` or `BOOKING_FAILED`.
          items:
            $ref: '#/components/schemas/ErrorDetails'
        id:
          type: string
          description: System generated batch transfer item id, can be used to delete batch items.
        request_id:
          type: string
          description: Original request_id of the user for the batch item.
        status:
          type: string
          description: 'Batch transfer item statuses, can be one of: `VALIDATION_FAILED`, `VALIDATED`, `BOOKING`, `BOOKED`, `BOOKING_FAILED`.'
        transfer_draft:
          $ref: '#/components/schemas/TransferDraft'
          description: Transfer draft preview after obtaining a quote. It will no longer be available once batch transfer is booked.
        transfer_id:
          type: string
          description: System generated transaction id of the batch item, if not booked, return null.
        updated_at:
          type: string
          description: The time this batch transfer was last updated.
    QuoteDetails:
      type: object
      properties:
        amount_beneficiary_receives:
          type: number
          description: Total amount beneficiary will need receive quoted in `transfer_currency`.
        amount_payer_pays:
          type: number
          description: Total amount payer need to pays quoted in `source_currency`.
        client_rate:
          type: number
          description: Conversion rate. If pure transfer, it will be null.
        currency_pair:
          type: string
          description: Currency pair related with the conversion rate. If pure transfer, it will be null.
        fee_amount:
          type: number
          description: Total fee for this quote.
        fee_currency:
          type: string
          description: Fee currency.
        source_currency:
          type: string
          description: Source currency, i.e. the currency that the Payer uses to fund the transfer (3-letter ISO-4217 code).
        transfer_currency:
          type: string
