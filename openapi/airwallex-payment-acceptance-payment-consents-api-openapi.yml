components:
  schemas:
    BacsDirectDebitAddress:
      type: object
      required:
      - line1
      - postcode
      - town
      properties:
        country_code:
          type: string
          description: Country code of the address. Use the two-character ISO Standard Country Codes. One of `GB`, `US`. Default to `GB` if not provided.
        line1:
          type: string
          description: House number and street name, e.g., `777 Casino Drive`.
        line2:
          type: string
          description: Locality name, e.g., `Apartment 123`.
        postcode:
          type: string
          description: Postcode of the address.
        state:
          type: string
          description: State or province of the address. Should be provided if country code is `US`. Use the two-character ISO3166-2:US state code.
        town:
          type: string
          description: Post town.
      description: Account holder's address.
    BacsDirectDebitMandate:
      type: object
      properties:
        ddi_reference:
          type: string
          description: Reference of the Direct Debit instrument.
        service_user_number:
          type: string
          description: A unique six-digit number used to identify a business paying or receiving money through a Bacs Direct Debit transaction.
      description: BACS Direct Debit mandate information.
    AuthenticationMethod:
      type: object
      required:
      - type
      properties:
        emv:
          $ref: '#/components/schemas/Emv'
          description: EMV data.
        three_ds:
          $ref: '#/components/schemas/ThreeDomainSecure'
          description: 3D-Secure authentication data.
        type:
          type: string
          description: The authentication method type. One of `CRYPTOGRAM_3DS`, `PAN_ONLY`.
      description: Authentication method.
    Applepay:
      type: object
      properties:
        billing:
          $ref: '#/components/schemas/Billing'
          description: Billing information.
        lifecycle_id:
          type: string
          description: Identifier used to link the transaction to the original or previous transaction in a subscription or card-on-file chain. Currently supported only for Mastercard.
        payment_data_type:
          type: string
          description: Type of the payment data details. One of `tokenized_card` or `encrypted_payment_token`.
        tokenized_card:
          $ref: '#/components/schemas/TokenizedCard'
          description: Payment data with the tokenized card details.
      description: Apple pay information.
    Payment_Acceptance_Address:
      type: object
      required:
      - country_code
      properties:
        city:
          type: string
          description: City of the address. Maximum of 100 characters.
        country_code:
          type: string
          description: The two-letter country code in ISO 3166-1 alpha-2 format.
        postcode:
          type: string
          description: Postcode of the address. Maximum of 10 characters.
        state:
          type: string
          description: State or province of the address. Maximum of 100 characters.
        street:
          type: string
          description: Street of the address. Maximum of 1000 characters.
      description: The billing address as it appears on the credit card issuer’s records.
    ThreeDomainSecure:
      type: object
      required:
      - online_payment_cryptogram
      properties:
        eci_indicator:
          type: string
          description: Electronic Commerce Indicator, as defined by 3-D Secure.
        online_payment_cryptogram:
          type: string
          description: Online payment cryptogram, as defined by 3-D Secure.
      description: 3D-Secure authentication data.
    MicroDepositResult:
      type: object
      properties:
        status:
          type: string
          description: The status of micro_deposit.
      description: The result of micro deposit.
    BecsDirectDebit:
      type: object
      properties:
        account_number:
          type: string
          description: 4-9 digits number to identify a bank account in Australia.
        bsb_number:
          type: string
          description: 6-digit Bank-State-Branch number.
        business_account:
          type: boolean
          description: Indicate whether the account is a business account.
        micro_debit:
          $ref: '#/components/schemas/MicroDebitResult'
          description: The result of micro debit.
        micro_deposit:
          $ref: '#/components/schemas/MicroDepositResult'
          description: The result of micro deposit.
        owner_email:
          type: string
          description: Account holder's email.
        owner_name:
          type: string
          description: Account holder name.
      description: BECS Direct Debit information.
    SepaDirectDebitMandate:
      type: object
      properties:
        creditor_identifier:
          type: string
          description: A unique number used to identify a business paying or receiving money through a SEPA Direct Debit transaction.
        reference:
          type: string
          description: Reference of the Direct Debit mandate.
      description: SEPA Direct Debit mandate information.
    Alipaycn:
      type: object
      properties:
        flow:
          type: string
          description: One of `qrcode`, `mobile_web`, `mobile_app`, `mini_program`.
        os_type:
          type: string
          description: ios, android.
        shopper_login_id:
          type: string
          description: Alipay's User Login Id (Shopper) for Payment Consent Verification.
        user_id:
          type: string
          description: Unique identifier of a user in payment method provider side. Only present after the payment has been completed or the consent has been verified.
        channel:
          type: string
          description: 'Payment channel. Default: `ecom`.'
          enum:
          - pos
          - ecom
          x-enumDescriptions:
            pos: A point-of-sale (POS) transaction.
            ecom: A online e-commerce transaction.
      description: Alipay CN information.
    PaymentConsent:
      type: object
      required:
      - created_at
      - customer_id
      - id
      - next_triggered_by
      - request_id
      - status
      - updated_at
      properties:
        client_secret:
          type: string
          description: "Payment Consent's client secret for browser or app. Only returned by Payment Consent create API. \n\nThe provided client_secret is valid for 60 minutes."
        connected_account_id:
          type: string
          description: Account identifier of the connected account.
        created_at:
          type: string
          format: date-time
          description: Time at which this Payment Consent was created.
        customer_id:
          type: string
          description: Unique identifier from Airwallex of the customer who will make the payment with this Payment Consent.
        disable_reason:
          type: string
          description: Disable reason. Only applicable when status is `DISABLED`.
        failure_reason:
          $ref: '#/components/schemas/FailureReason'
          description: Verification failure reason. Only applicable when status is `REQUIRES_PAYMENT_METHOD` and `REQUIRES_CUSTOMER_ACTION`.
        id:
          type: string
          description: Unique identifier of this Payment Consent.
        initial_payment_intent_id:
          type: string
          description: Unique identifier of the initial Payment Intent confirmed with this Payment Consent.
        mandate:
          $ref: '#/components/schemas/Payment_Acceptance_Mandate'
          description: An authorization from shopper to merchant to debit payments from their bank account.
        merchant_trigger_reason:
          type: string
          description: Only applicable when `next_triggered_by` is `merchant`. One of `scheduled`, `unscheduled`, `installments`.
        metadata:
          type: object
          description: A set of key-value pairs that can be attached to this Payment Consent. You can specify up to 50 keys with key names up to 50 characters long and values up to 500 characters long.
        next_action:
          $ref: '#/components/schemas/PaymentConsentNextAction'
          description: Next action for merchant.
        next_triggered_by:
          type: string
          description: The party to trigger subsequent payments. One of `merchant`, `customer`.
        payment_method:
          $ref: '#/components/schemas/PaymentMethodDetailsForConsent'
          description: Payment Method information attached for subsequent payments.
        request_id:
          type: string
          description: Unique request identifier specified by the merchant.
        status:
          type: string
          description: "\n- **REQUIRES_PAYMENT_METHOD**: Populate `payment_method` when calling **verify**.\n  - This value is returned if `payment_method` is either null, or the `payment_method` has failed during verify, and a different `payment_method` should be provided.\n- **REQUIRES_CUSTOMER_ACTION**: Pending customer action, see `next_action` for details.\n- **PENDING**: The mandate of the Payment Consent has been submitted. It only occurs when payment method type is `bacs_direct_debit`. You need to wait for the final result. The status will become `DISABLED` if the mandate is rejected or `VERIFIED` if the mandate is accepted.\n- **PAUSED**: The active mandate of the Payment Consent has been paused. The Payment Consent can be paused only when the previous status was `VERIFIED`. It only occurs when payment method type is `payto`. The status will become `DISABLED` if the mandate is canceled or `VERIFIED` if the mandate is resumed.\n- **VERIFIED**: The Payment Consent has been verified and it can be used for subsequent payments.\n- **DISABLED**: The Payment Consent is disabled. You cannot verify it again.\n"
        terms_of_use:
          $ref: '#/components/schemas/TermsOfUse'
          description: 'The terms of this consent. '
        updated_at:
          type: string
          format: date-time
          description: Time at which this Payment Consent was last updated.
    TermsOfUse:
      type: object
      required:
      - payment_amount_type
      properties:
        billing_cycle_charge_day:
          type: integer
          format: int32
          description: The granularity per billing cycle. Required when payment_schedule.period_unit is WEEK, MONTH, or YEAR. (e.g. charge_day_per_billing_cycle= 5, payment_schedule.period_unit  = MONTH, payment_schedule.period = 1 if collect payment on the 5th of each month).
        end_date:
          type: string
          description: End date to expect payment request.
        first_payment_amount:
          type: number
          description: The first payment. It could include the costs associated with the first debited amount.Optional if payment agreement type is `VARIABLE`.
        fixed_payment_amount:
          type: number
          description: The fixed payment amount that can be charged for a single payment.Required if payment agreement type is `FIXED`.
        max_payment_amount:
          type: number
          description: The maximum payment amount that can be charged for a single payment.Optional if payment agreement type is `VARIABLE`.
        min_payment_amount:
          type: number
          description: The minimum payment amount that can be charged for a single payment.Optional if payment agreement type is `VARIABLE`.
        payment_amount_type:
          type: string
          description: 'The agreed type of amounts for subsequent payment. Should be one of `FIXED`, `VARIABLE`.


            - **FIXED**: payment amount is fixed. A specific amount is required.

            - **VARIABLE**: payment amount is variable at each collection. A max limit is recommended.'
        payment_currency:
          type: string
          description: The currency of this payment. Please refer to [supported currencies](/docs/payments/supported-currencies).
        payment_schedule:
          $ref: '#/components/schemas/PaymentSchedule'
        start_date:
          type: string
          description: Start date to expect payment request.
        total_billing_cycles:
          type: integer
          format: int32
          description: 'The total number of billing cycles. For example, the mandate will last for 1 year if `total_billing_cycles`=12, `payment_schedule.period`=1 and `payment_schedule.period_unit`=MONTH if the `merchant_trigger_reason` is `scheduled`. Merchant can bill customers 12 times when `total_billing_cycles`=12 if the `merchant_trigger_reason` is `unscheduled`The mandate will continue indefinitely if total_billing_cycles is null. '
      description: Terms to specify how this Payment Consent will be used.
    EftDirectDebit:
      type: object
      properties:
        account_number:
          type: string
          description: 4-17 digits number to identify a bank account in Canada.
