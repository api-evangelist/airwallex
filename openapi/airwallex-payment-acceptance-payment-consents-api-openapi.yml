openapi: 3.2.0
info:
  title: Airwallex Payment Acceptance > Payment Consents API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payment Acceptance > Payment Consents
  description: '**Payment Consent** is an API resource to represent the agreement between merchant and Customer of making subsequent payments using the provided Payment Method. In general, we can categorize the usages of Payment Consent into two groups.


    - Merchant can initiate the payment without customer''s presence (MIT). For example, membership subscription and utilities.

    - Customer can initiate the payment without having to input payment method information again (CIT). For example, fast checkout with saved method.


    To make payments, you can confirm a Payment Intent with the reference of Payment Consent, which must be in the status of `VERIFIED`, `REQUIRES_PAYMENT_METHOD` or `REQUIRES_CUSTOMER_ACTION`. The latter two are only allowed for card and direct debit payment methods as they can be verified directly by the success of the initial payment.'
  x-domain: Payment Acceptance
  x-resource: Payment Consents
  x-urlPath: payments/payment_consents
paths:
  /api/v1/pa/payment_consents/create:
    post:
      tags:
      - Payment Acceptance > Payment Consents
      summary: 1|Create a Payment Consent
      description: Create a Payment Consent.
      operationId: createPaymentConsent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - customer_id
              - next_triggered_by
              - request_id
              properties:
                connected_account_id:
                  type: string
                  description: 'Airwallex assigned account identifier of the connected entity(another account which is linked with platform). It is to be used by the platform to indicate the connected entity in the transaction where platform is the owner of transaction. Notice: This can not be used with x-on-behalf-of header together.'
                customer_id:
                  type: string
                  description: Unique identifier from Airwallex of the customer who will make the payment with this Payment Consent.
                merchant_trigger_reason:
                  type: string
                  description: "Indicate whether the subsequent payments are scheduled. Only applicable when `next_triggered_by` is `merchant`.\n  \nDefault: `unscheduled`."
                  enum:
                  - installments
                  - scheduled
                  - unscheduled
                metadata:
                  type: object
                  description: A set of key-value pairs that can be attached to this Payment Consent. You can specify up to 50 keys with key names up to 50 characters long and values up to 500 characters long.
                next_triggered_by:
                  type: string
                  description: The party to trigger subsequent payments.
                  enum:
                  - customer
                  - merchant
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
                terms_of_use:
                  type: object
                  required:
                  - payment_amount_type
                  description: Terms to specify how this Payment Consent will be used.
                  properties:
                    billing_cycle_charge_day:
                      type: integer
                      format: int32
                      description: The granularity per billing cycle. Required when payment_schedule.period_unit is WEEK, MONTH, or YEAR. (e.g. charge_day_per_billing_cycle= 5, payment_schedule.period_unit  = MONTH, payment_schedule.period = 1 if collect payment on the 5th of each month).
                    end_date:
                      type: string
                      description: End date to expect payment request.
                    first_payment_amount:
                      type: number
                      description: The first payment. It could include the costs associated with the first debited amount.Optional if payment agreement type is `VARIABLE`.
                    fixed_payment_amount:
                      type: number
                      description: The fixed payment amount that can be charged for a single payment.Required if payment agreement type is `FIXED`.
                    max_payment_amount:
                      type: number
                      description: The maximum payment amount that can be charged for a single payment.Optional if payment agreement type is `VARIABLE`.
                    min_payment_amount:
                      type: number
                      description: The minimum payment amount that can be charged for a single payment.Optional if payment agreement type is `VARIABLE`.
                    payment_amount_type:
                      type: string
                      description: 'The agreed type of amounts for subsequent payment. Should be one of `FIXED`, `VARIABLE`.


                        - **FIXED**: payment amount is fixed. A specific amount is required.

                        - **VARIABLE**: payment amount is variable at each collection. A max limit is recommended.'
                    payment_currency:
                      type: string
                      description: The currency of this payment. Please refer to [supported currencies](/docs/payments/supported-currencies).
                    payment_schedule:
                      type: object
                      properties:
                        period:
                          type: integer
                          format: int32
                          description: The number of period units between billing cycles. For example, the payment cycle is one month if period=1 and period_unit=MONTH. Required when merchant_trigger_reason = scheduled.
                        period_unit:
                          type: string
                          description: Specifies billing frequency. One of `DAY`, `WEEK`,  `MONTH`, and `YEAR`. Required when merchant_trigger_reason = scheduled.
                    start_date:
                      type: string
                      description: Start date to expect payment request.
                    total_billing_cycles:
                      type: integer
                      format: int32
                      description: 'The total number of billing cycles. For example, the mandate will last for 1 year if `total_billing_cycles`=12, `payment_schedule.period`=1 and `payment_schedule.period_unit`=MONTH if the `merchant_trigger_reason` is `scheduled`. Merchant can bill customers 12 times when `total_billing_cycles`=12 if the `merchant_trigger_reason` is `unscheduled`The mandate will continue indefinitely if total_billing_cycles is null. '
        description: Payment Consent creation request.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConsent'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request`, `suspended_from_online_payments`, `resource_not_found`(invalid `customer_id`)'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/pa/payment_consents/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        request_body:
          customer_id: cus_hkpdsjz4vg1x3uscdj
