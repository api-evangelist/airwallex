  /api/v1/pa/payment_consents/{id}/verify:
    post:
      tags:
      - Payment Acceptance > Payment Consents
      summary: 5|Verify a Payment Consent
      description: 'Verify the Payment Consent with the `payment_method` details (or `payment_method.id` if reusing an existing one) when the customer is ready to store payment credentials into the Payment Consent for subsequent payments.


        Additional customer actions might be required to complete the verification for some payment methods. In that case, `next_action` will be returned to guide you through the process and the Payment Consent `status` will be updated to `REQUIRES_CUSTOMER_ACTION`.


        Once the `status` becomes `VERIFIED`, the Payment Consent is ready for making subsequent payments.


        When verifying a Payment Consent initiated by `customer`, if an existing `VERIFIED` Payment Consent already references the provided card or bank account number, the request will be declined with `resource_already_exists` to avoid generating multiple identical Payment Consents.'
      operationId: verify
      parameters:
      - name: id
        in: path
        description: Payment Consent unique identifier.
        required: true
        schema:
          type: string
          default: cst_u79lnfufjxxfdc0
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                descriptor:
                  type: string
                  description: Descriptor that may be displayed to the customer during the verification.
                device_data:
                  type: object
                  description: Client device information. It is recommended to provide this data to increase the odds of having frictionless 3DS.
                  properties:
                    accept_header:
                      type: string
                      description: Accept header value.
                    browser:
                      type: object
                      description: Browser specific data.
                      properties:
                        java_enabled:
                          type: boolean
                          description: Is Java enabled?
                        javascript_enabled:
                          type: boolean
                          description: Is JavaScript enabled?
                        user_agent:
                          type: string
                          description: User Agent header value.
                    device_id:
                      type: string
                      description: Device unique identifier or Advertisement unique identifier or IMEI.
                    ip_address:
                      type: string
                      description: Public IP address, both IPv4 and IPv6 are supported.
                    language:
                      type: string
                      description: Language or locale.
                    location:
                      type: object
                      description: Location data.
                      properties:
                        lat:
                          type: string
                          description: Latitude.
                        lon:
                          type: string
                          description: Longitude.
                    mobile:
                      type: object
                      description: Mobile specific data.
                      properties:
                        device_model:
                          type: string
                          description: Device model.
                        os_type:
                          type: string
                          description: OS type.
                        os_version:
                          type: string
                          description: OS version.
                    screen_color_depth:
                      type: integer
                      format: int32
                      description: Screen color depth in bits.
                    screen_height:
                      type: integer
                      format: int32
                      description: Screen height in pixels.
                    screen_width:
                      type: integer
                      format: int32
                      description: Screen width in pixels.
                    timezone:
                      type: string
                      description: Timezone offset to UTC in hours, with added minutes if necessary.
                payment_method:
                  type: object
                  required:
                  - type
                  description: "Payment Method information that will be used for subsequent payments.  \n  \nWhen `payment_method.type` is set to `card`, `ach_direct_debit`, `bacs_direct_debit`, `becs_direct_debit`, `sepa_direct_debit`, `eft_direct_debit`, `googlepay`, `applepay`, caller must provide either the `payment_method.id` of an existing Payment Method or the full payload of payment method information with which we will generate a new Payment Method."
                  properties:
                    ach_direct_debit:
                      type: object
                      description: ACH Direct Debit information.
                      properties:
                        aba_routing_number:
                          type: string
                          description: 9-digit number to identify a bank in the US. Required when verification method is `micro_deposit`. Should not be set when verification method is `plaid`.
                        account_number:
                          type: string
                          description: 4-17 digits number to identify a bank account in the US. Required when verification method is `micro_deposit`. Should not be set when verification method is `plaid`.
                        business_account:
                          type: boolean
                          description: Indicate whether the account is a business account. Default to `false`.
                        mandate_version:
                          type: string
                          description: The version of mandate language. Custom mandate version if you render your own mandate document to the payer instead of the default version provided by Airwallex.
                        owner_email:
                          type: string
                          description: Account holder's email. Required when verification method is `micro_deposit`.
                        owner_name:
                          type: string
                          description: Account holder name. Required when verification method is `micro_deposit`.
                        verification_method:
                          type: string
                          description: 'Verification method. Can be `plaid` or `micro_deposit`. Default: `micro_deposit`.'
                    alipaycn:
                      type: object
                      required:
                      - flow
                      description: Alipaycn information. `flow` can be one of `qrcode`, `mobile_web`, `mobile_app`.
                      properties:
                        flow:
                          type: string
                          description: Refer to the specification above.
                        os_type:
                          type: string
                          description: One of `ios`, `android`. `os_type` must be set when `flow` is `mobile_web`, `mobile_app`.
                    alipayhk:
                      type: object
                      required:
                      - flow
