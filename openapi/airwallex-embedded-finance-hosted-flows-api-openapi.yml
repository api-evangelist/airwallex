  x-urlPath: scale/hosted_flows
paths:
  /api/v1/hosted_flows/create:
    post:
      tags:
      - Embedded Finance > Hosted Flows
      summary: 1|Create a Flow
      description: Create a hosted flow instance for an account. Specify the `account_id` of the connected account for which you are creating the flow, and the hosted flow `template` provided by Airwallex.
      operationId: createHostedFlow
      x-oboSupported: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - account_id
              - template
              properties:
                account_id:
                  type: string
                  description: Account unique identifier of the connected account for which the hosted flow instance is created.
                error_url:
                  type: string
                  description: If set, the user will be redirected to this URL if an error occurs, with an extra query parameter `ahfi_id`.
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to the hosted flow.
                return_url:
                  type: string
                  description: The user be redirected to this URL after finishing the flow, with an extra query parameter `ahfi_id`, this field is only required if Airwallex is hosting the experience.
                template:
                  type: string
                  description: Unique identifier of the template that the created flow instance will follow.
        description: request to create the flow instance.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWXHostedFlow'
        '400':
          description: '["Your account does not have a flow template"

