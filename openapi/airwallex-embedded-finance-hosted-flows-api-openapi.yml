components:
  schemas:
    AuthorizedAWXHostedFlow:
      type: object
      properties:
        authorization_code:
          type: string
          description: This is a unique code embedded in url to authorize the user into the hosted flow. This code expires after 15 seconds.
        id:
          type: string
          description: Unique identifier of the hosted flow instance.
        metadata:
          type: object
          description: A set of key-value pairs that were specified in the request.
        result:
          type: object
          description: The result of the flow execution, `null` if status is not `FINISHED`.
        status:
          type: string
          description: The status of the flow instance.
          enum:
          - INIT
          - PROCESSING
          - FINISHED
        url:
          type: string
          description: The URL by which your authorized user can enter the hosted flow. This link is unique to the connected account id specified in the request and expires after 15 seconds.
    AWXHostedFlow:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the hosted flow instance.
        metadata:
          type: object
          description: The metadata set when creating the flow.
        result:
          type: object
          description: The result of the flow execution, containing optional additional information for each flow action if status is `FINISHED`. It is usually empty.
        status:
          type: string
          description: The `status` of the flow instance.
          enum:
          - INIT
          - PROCESSING
          - FINISHED
        url:
          type: string
          description: The URL by which only users with Airwallex login credentials can enter the flow. For your own users, make sure to [authorize](/docs/api/scale/hosted_flows/authorize) the flow next. This link is unique to the connected `account_id` specified in the request and expires after 15 seconds.
