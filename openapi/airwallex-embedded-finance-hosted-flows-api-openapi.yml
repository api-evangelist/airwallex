tags:
- name: Embedded Finance > Hosted Flows
  description: 'Airwallex Hosted Flows enable a Platform to redirect end users into Airwallex-hosted web pages to complete a variety of activity flows. Platforms can deliver hosted flows via a secure, short-lived link unique to each connected account. After completion of a flow, the user is redirected back to the platform. Hosted flows are available for accounts created via API.


    **Currently supported flows:**


    * `onboarding` – Submit KYC information needed to activate the account.


    Contact your Airwallex Account Manager to start using hosted flows.


    Your Account Manager will create a **flow template**, which defines the series of steps the end user will proceed through. Then, you can create a **flow instance** for a particular connected account and direct users to the provided URL.'
