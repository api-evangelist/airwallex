      summary: 6|Process a Payment Intent in a Terminal
      description: Process a Payment Intent In a Terminal.
      operationId: processPaymentIntent
      x-oboSupported: false
      parameters:
      - name: id
        in: path
        description: Terminal unique identifier.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - payment_intent_id
              - request_id
              properties:
                payment_intent_id:
                  type: string
                  description: Unique identifier of Payment Intent.
                payment_method:
                  type: object
                  required:
                  - type
                  description: The Payment Method to use for the Payment Intent. If unfilled, the default payment method set on the terminal will be used.
                  properties:
                    type:
                      type: string
                      description: Type of the Payment Method (e.g. card_present, pay_now, wechatpay).
                payment_method_options:
                  type: object
                  description: Options for Payment Method.
                  properties:
                    card:
                      type: object
                      description: The Payment Method options for card.
                      properties:
                        authorization_type:
                          type: string
                          description: The authorization type of the card payment. One of `final_auth`, `pre_auth`. Default to `final_auth`. Set it to `pre_auth` if you want to place a hold on your customer’s card for more than 7 days. Currently only available when the card brand is visa or mastercard. You must also set `auto_capture` to be `false` if you want to do pre-auth.
                        auto_capture:
                          type: boolean
                          description: Specifies whether the funds should be requested automatically after the payment is authorized. Default to `true`. Set it to `false` if you want to capture the funds sometimes later.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
        description: Terminal process payment intent request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
