openapi: 3.2.0
info:
  title: Airwallex Payment Acceptance > Terminals API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payment Acceptance > Terminals
  description: 'A **Terminal** represents a physical device that can process payments. This API allows you to manage terminals, including creating, retrieving, updating, activating, deactivating, terminating, and processing payment intents in terminals.


    A Terminal can be in one of the following states: 1. **ACTIVE**: The Terminal is activated and ready to use. 2. **INACTIVE**: The Terminal is deactivated for any reason. 3. **TERMINATED**: The Terminal is terminated and can''t be used anymore.'
  x-domain: Payment Acceptance
  x-resource: Terminals
  x-urlPath: payments/terminals
paths:
  /api/v1/pa/pos/terminals/create:
    post:
      tags:
      - Payment Acceptance > Terminals
      summary: 1|Create a Terminal
      description: Create a new Terminal. The `activation_code` must be provided in the request body. The `nickname` is optional and can be used to identify the terminal.
      operationId: createTerminal
      x-oboSupported: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - activation_code
              - request_id
              properties:
                activation_code:
                  type: string
                  description: The activation code read from the terminal.
                connected_account_id:
                  type: string
                  description: 'Airwallex assigned account identifier of the connected entity(another account which is linked with platform). It is to be used by the platform to indicate the connected entity in the transaction where platform is the owner of transaction. Notice: This can not be used with x-on-behalf-of header together.'
                nickname:
                  type: string
                  description: Nickname of the Terminal.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
        description: Create request.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Terminal'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/pa/pos/terminals/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          activation_code: MEFCMSBC
          connected_account_id: acct_dk_FmEGnOSeoCCg3RpmJBA
          nickname: cloth store
          request_id: ee939540-3203-4a2c-9172-89a566485dd9
        response_body:
          admin_password_status: ACTIVE
          connected_account_id: acct_dk_FmEGnOSeoCCg3RpmJBA
          id: ter_st8szlkh4z0nbfikx
          model: morefun_m90
          nickname: cloth store
          refund_password_status: ACTIVE
          serial_number: '19250220790001'
          status: ACTIVE
      x-scope:
      - scope: pos_terminal:write
        group: Payment Acceptance
        resource_name: POS Terminals
      x-domain: Payment Acceptance
      x-resource: Terminals
      x-urlPath: create
      x-oauthSupported: true
      x-resourceLevel: account
