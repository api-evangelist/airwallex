  /api/v1/spend/reimbursement_reports:
    get:
      tags:
      - Spend > Reimbursements
      x-stage: beta
      summary: 5|List all Reimbursement Reports
      description: List reimbursement reports based on the query parameters.
      operationId: listReimbursementReports
      parameters:
      - name: page
        in: query
        description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call.
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: The number of items returned per page, between 1 and 100. The default is 100.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: from_updated_at
        in: query
        description: Filter by reimbursement reports updated after this timestamp (inclusive) in ISO8601 format.
        required: false
        schema:
          type: string
      - name: to_updated_at
        in: query
        description: Filter by reimbursement reports updated before this timestamp (exclusive) in ISO8601 format.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by reimbursement report statuses.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - DRAFT
            - AWAITING_APPROVAL
            - AWAITING_PAYMENT
            - PAYMENT_IN_PROGRESS
            - PAID
            - DELETED
            - REJECTED
            - MARKED_AS_PAID
      - name: sync_status
        in: query
        description: Filter by sync statuses.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            description: Sync status for an accounting system.
            enum:
            - NOT_SYNCED
            - SYNCED
            - SYNC_FAILED
      - name: legal_entity_id
        in: query
        description: Filter by legal entity unique identifier.
        required: false
        schema:
          type: string
      - name: approver
        in: query
        description: Filter by approver user email.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReimbursementReportSummaryPagination'
        '400':
          description: Invalid Request.
        '404':
          description: Not found.
        '500':
          description: Internal server error.
