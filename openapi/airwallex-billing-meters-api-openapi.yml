openapi: 3.2.0
info:
  title: Airwallex Billing > Meters API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Billing > Meters
  description: A Meter defines how to aggregate usage events over a billing period to determine how much a customer should be billed.
  x-domain: Billing
  x-resource: Meters
  x-urlPath: billing/meters
paths:
  /api/v1/billing/meters/create:
    post:
      description: Create a new Meter object.
      operationId: createMeter
      requestBody:
        content:
          application/json:
            schema:
              required:
              - aggregation_method
              - event_name
              - name
              - request_id
              type: object
              properties:
                aggregation_method:
                  pattern: ^(SUM|MAX|LAST|COUNT|UNIQUE)$
                  type: string
                  description: Type of aggregation to perform, based on each event's `properties` value.
                  enum:
                  - SUM
                  - MAX
                  - LAST
                  - COUNT
                  - UNIQUE
                  x-enumDescriptions:
                    SUM: Sum up the value of each event.
                    MAX: Maximum of all event values.
                    LAST: The value of the last event.
                    COUNT: Count the number of events.
                    UNIQUE: Count the number of unique events.
                aggregation_property:
                  type: string
                  description: The name of the property within the event to aggregate. Events will be ignored during aggregation if they are missing this property or if its value is invalid.
                description:
                  maxLength: 500
                  minLength: 0
                  type: string
                  description: Meter description. Used for internal classification and identification.
                dimension_keys:
                  type: array
                  description: Append-only list of event property keys. New keys can be appended; existing keys cannot be modified, removed, or renamed. Used for event grouping and filtering. A usage event may include any subset of these (or none).
                  items:
                    type: string
                event_name:
                  maxLength: 200
                  minLength: 0
                  pattern: ^\S*$
                  type: string
                  description: The name of the Usage Event to record for. Corresponds with the `event_name` field on [Usage Events](/docs/api/billing/usage_events).
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                    description: A set of key-value pairs that you can attach to this object for storing additional information.
                  description: A set of key-value pairs that you can attach to this object for storing additional information.
                name:
                  maxLength: 200
                  minLength: 0
                  type: string
                  description: Meter name.
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meter'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '404':
          description: 'Not Found. Possible error codes: `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Create a Meter
      tags:
      - Billing > Meters
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/billing/meters/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          aggregation_method: SUM
          aggregation_property: quantity
          description: Tracks API requests made by customers.
          event_name: api_call
          metadata:
            foo: bar
          name: API Requests
          request_id: ee939540-3203-4a2c-9172-89a566485dd9
        response_body:
          aggregation_method: SUM
          aggregation_property: quantity
          archived: false
          created_at: 2022-01-01T10:15:30+0000
          description: Tracks API requests made by customers.
          event_name: api_call
          id: mtr_1234567890abcdef
          metadata:
            foo: bar
          name: API Requests
          updated_at: 2022-01-01T10:15:30+0000
      x-resourceLevel: org
      x-oboSupported: false
      x-scope:
      - scope: billing.usage_metering:write
        group: Billing
        resource_name: Usage Metering
      x-domain: Billing
      x-resource: Meters
      x-urlPath: create
      x-oauthSupported: true
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
