            event_name: api_call
            id: mtr_1234567890abcdef
            metadata:
              foo: bar
            name: API Requests
            updated_at: 2022-01-01T10:15:30+0000
          page_after: <string>
          page_before: <string>
      x-resourceLevel: org
      x-oboSupported: false
      x-scope:
      - scope: billing.usage_metering:read
        group: Billing
        resource_name: Usage Metering
      - scope: billing.usage_metering:write
        group: Billing
        resource_name: Usage Metering
