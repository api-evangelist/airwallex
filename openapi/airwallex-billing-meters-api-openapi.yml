  /api/v1/billing/meters/{id}/summaries:
    get:
      description: Calculates the result of a Meter for a customer for a given time period.
      operationId: listSummaries
      parameters:
      - description: ID of the Meter object.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: ID of the Billing Customer object.
        in: query
        name: billing_customer_id
        required: true
        schema:
          type: string
      - description: The start date of Usage Events' `happened_at` in ISO8601 format (inclusive).
        in: query
        name: from_happened_at
        required: true
        schema:
          type: string
          format: date-time
      - description: The end date of Usage Events' `happened_at` in ISO8601 format (exclusive).
        in: query
        name: to_happened_at
        required: true
        schema:
          type: string
          format: date-time
      - description: The time window to group the usage summary by. If not specified, a single summary for the entire time range is returned. When specified, the response will contain a list of summaries, one for each time window in the range. Possible values are `HOUR` or `DAY`. For `HOUR` grouping, `from_happened_at` and `to_happened_at` must align with hour boundaries (e.g., 2025-03-15T14:00:00+0000). For `DAY` grouping, `from_happened_at` and `to_happened_at` must align with UTC day boundaries (e.g., 2025-03-15T00:00:00+0000). If not specified, `from_happened_at` and `to_happened_at` must align with minute boundaries e.g., 2025-03-15T14:01:00+0000). The duration must not exceed one year.
        in: query
        name: grouped_by
        required: false
        schema:
          type: string
      - description: The event property keys to break the usage summary down by. Each key must be one of the Meter's `dimension_keys`. If not specified, usage is not broken down by event property keys. Can be combined with `grouped_by` to break down each time window further — the response then contains one summary per (time window × dimension key combination).
        in: query
        name: grouped_by_dimensions
        required: false
        schema:
          type: array
          items:
            type: string
      - description: Filters the usage events included in the summary calculation by event property keys. Each key must be one of the Meter's `dimension_keys`.
        in: query
        name: dimension_filters
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
      - description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not `null`) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not `null`) from the response to a subsequent call.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: Number of summaries per page. Defaults to 20.
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursorPaginationClientApiResponseMeterSummary'
          description: OK
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '404':
          description: 'Not Found. Possible error codes: `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 7|Retrieve Summaries of a Meter
      tags:
      - Billing > Meters
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/billing/meters/meter_id/summaries
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          items:
          - billing_customer_id: bcus_1234567890abcdef
            dimension_values:
              model: gpt-5.4
              token_type: input
            event_count: 100
            from_happened_at: 2022-01-01T00:00:00+0000
            meter_id: mtr_1234567890abcdef
            to_happened_at: 2022-01-02T00:00:00+0000
            value: 150.75
          page_after: <string>
          page_before: <string>
      x-resourceLevel: org
      x-oboSupported: false
      x-scope:
      - scope: billing.usage_metering:read
        group: Billing
        resource_name: Usage Metering
      - scope: billing.usage_metering:write
        group: Billing
        resource_name: Usage Metering
      x-domain: Billing
      x-resource: Meters
      x-urlPath: summaries
      x-oauthSupported: true
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
components:
  schemas:
    MeterSummary:
      required:
      - billing_customer_id
      - event_count
      - from_happened_at
      - meter_id
      - to_happened_at
      - value
      type: object
      properties:
        billing_customer_id:
          type: string
          description: ID of the Billing Customer object.
        dimension_values:
          type: object
          additionalProperties:
            type: string
            description: A dimension value that this summary is broken down by.
          description: The event property keys and values this summary is broken down by. Only present when `grouped_by_dimensions` is specified in the request.
        event_count:
          type: integer
          description: The number of usage events that contributed to the value.
          format: int64
        from_happened_at:
          type: string
          description: Start time of the summary period (inclusive).
        meter_id:
          type: string
          description: ID of the Meter object.
        to_happened_at:
          type: string
          description: End time of the summary period (exclusive).
        value:
          type: number
          description: The aggregated value based on the meter's aggregation type.
    CursorPaginationClientApiResponseMeterSummary:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/MeterSummary'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    CursorPaginationClientApiResponseMeter:
      required:
      - items
      type: object
      properties:
        items:
          type: array
          description: Paged results.
          items:
            $ref: '#/components/schemas/Meter'
        page_after:
          type: string
          description: The page cursor used for searching after page.
        page_before:
          type: string
          description: The page cursor used for search before page.
    Meter:
      required:
      - aggregation_method
      - archived
      - created_at
      - event_name
      - id
      - name
      - updated_at
      type: object
      properties:
        aggregation_method:
          type: string
          description: 'Type of aggregation to perform, based on each event''s `properties` value. One of

            - `COUNT`: count the number of events.

            - `LAST`: the value of the last event.

            - `MAX`: maximum of all event values.

            - `SUM`: sum up the value of each event.

            - `UNIQUE`: count the number of unique events.'
        aggregation_property:
          type: string
          description: The name of the property within the event to aggregate. Events will be ignored during aggregation if they are missing this property or if its value is invalid.
        archived:
          type: boolean
          description: '`false` if the Meter is available to be linked to new prices, `true` otherwise.'
        created_at:
          type: string
          description: Time when this meter was created.
