paths:
  /api/v1/pa/customers/create:
    post:
      tags:
      - Payment Acceptance > Customers
      summary: 1|Create a Customer
      description: Create a **Customer** object. We require the Customer unique identifier in the merchant's system as a mandatory field.
      operationId: createCustomer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - merchant_customer_id
              - request_id
              properties:
                address:
                  type: object
                  required:
                  - country_code
                  description: Address of the customer.
                  properties:
                    city:
                      type: string
                      description: City of the address. Maximum of 100 characters.
                    country_code:
                      type: string
                      description: The two-letter country code in ISO 3166-1 alpha-2 format.
                    postcode:
                      type: string
                      description: Postcode of the address. Maximum of 10 characters.
                    state:
                      type: string
                      description: State or province of the address. Maximum of 100 characters.
                    street:
                      type: string
                      description: Street of the address. Maximum of 1000 characters.
                business_name:
                  type: string
                  description: Business name of the customer. Maximum length is 128.
                email:
                  type: string
                  description: Email address of the customer. Maximum length is 256.
                first_name:
                  type: string
                  description: First name of the customer. Maximum length is 128.
                last_name:
                  type: string
                  description: Last name of the customer. Maximum length is 128.
                merchant_customer_id:
                  type: string
                  description: Unique identifier of this customer in merchant's system. Maximum length is 64.
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to this customer. You can specify up to 50 keys with key names up to 50 characters long and values up to 500 characters long.
                  additionalProperties:
                    type: string
                phone_number:
                  type: string
                  description: Phone number of the customer.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant. Maximum length is 64.
        description: Customer creation request.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request`, `resource_already_exists`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
