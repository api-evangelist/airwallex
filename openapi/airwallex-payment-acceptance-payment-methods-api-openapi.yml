openapi: 3.2.0
info:
  title: Airwallex Payment Acceptance > Payment Methods API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payment Acceptance > Payment Methods
  description: A **Payment Method** represents the funding source that belongs to a Customer and is used to bind to one or several Payment Consents.
  x-domain: Payment Acceptance
  x-resource: Payment Methods
  x-urlPath: payments/payment_methods
paths:
  /api/v1/pa/payment_methods/create:
    post:
      tags:
      - Payment Acceptance > Payment Methods
      summary: 1|Create a Payment Method
      description: 'Create a Payment Method which can be referenced by Payment Consent.


        Alternatively you can directly provide entire payload of new Payment Method when verifying the Payment Consent, and then a Payment Method will be generated for you automatically during the process, which can be re-used for other Payment Consent later.'
      operationId: createPaymentMethod
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - customer_id
              - request_id
              - type
              properties:
                applepay:
                  type: object
                  description: Apple pay information. This must be provided if `type` is set to `applepay`.
                  properties:
                    billing:
                      type: object
                      description: Billing information.
                      properties:
                        address:
                          type: object
                          required:
                          - country_code
                          description: The billing address as it appears on the credit card issuer’s records.
                          properties:
                            city:
                              type: string
                              description: City of the address. Maximum of 100 characters.
                            country_code:
                              type: string
                              description: The two-letter country code in ISO 3166-1 alpha-2 format.
                            postcode:
                              type: string
                              description: Postcode of the address. Maximum of 10 characters.
                            state:
                              type: string
                              description: State or province of the address. Maximum of 100 characters.
                            street:
                              type: string
                              description: Street of the address. Maximum of 1000 characters.
                        email:
                          type: string
                          description: Email address of the customer.
                        first_name:
                          type: string
                          description: First name of the customer. Maximum length is 128.
                        last_name:
                          type: string
                          description: Last name of the customer. Maximum length is 128.
                        phone_number:
                          type: string
                          description: Phone number of the customer.
                    encrypted_payment_token:
                      type: string
                      description: Payment data from Apple Pay Payment Token.
                    payment_data_type:
                      type: string
                      description: Type of the payment data details. One of `tokenized_card` or `encrypted_payment_token`.
                    tokenized_card:
                      type: object
                      required:
                      - expiry_month
                      - expiry_year
                      - number
                      description: Payment data with the tokenized card details.
                      properties:
                        authentication_method:
                          type: object
                          required:
                          - type
                          description: Authentication method.
                          properties:
                            emv:
                              type: object
                              required:
                              - emv_data
                              description: EMV data.
                              properties:
                                emv_data:
                                  type: string
                                  description: Output from the Secure Element.
                                encrypted_pin_data:
                                  type: string
                                  description: The PIN encrypted using the bank’s key.
                            three_ds:
                              type: object
                              required:
                              - online_payment_cryptogram
                              description: 3D-Secure authentication data.
                              properties:
                                eci_indicator:
                                  type: string
                                  description: Electronic Commerce Indicator, as defined by 3-D Secure.
                                online_payment_cryptogram:
                                  type: string
                                  description: Online payment cryptogram, as defined by 3-D Secure.
                            type:
                              type: string
                              description: The authentication method type. One of `emv` or `three_ds`.
                        device_manufacturer_identifier:
                          type: string
                          description: Device manufacturer identifier.
                        expiry_month:
                          type: string
                          description: Two digit number representing the card’s expiration month.
                        expiry_year:
                          type: string
                          description: Four digit number representing the card’s expiration year.
                        name:
                          type: string
                          description: Cardholder name.
                        number:
                          type: string
                          description: Card number.
                card:
                  type: object
                  description: Card information. This must be provided if `type` is set to `card`.
                  properties:
                    additional_info:
                      type: object
                      description: Additional information of external network token requestor. Should be provided when number_type is `EXTERNAL_NETWORK_TOKEN`.
                      properties:
                        merchant_verification_value:
                          type: string
                          description: 'Merchant Verification Value (Provided by VISA during onboarding)

                            or

                            MasterCard Assigned ID (Provided by MasterCard during onboarding).'
                        token_requestor_id:
                          type: string
                          description: Token requestor unique identifier (Provided by card schemes during onboarding).
                    billing:
                      type: object
                      description: Billing information.
                      properties:
                        address:
                          type: object
                          required:
                          - country_code
                          description: The billing address as it appears on the credit card issuer’s records.
                          properties:
                            city:
                              type: string
                              description: City of the address. Maximum of 100 characters.
                            country_code:
                              type: string
                              description: The two-letter country code in ISO 3166-1 alpha-2 format.
                            postcode:
                              type: string
                              description: Postcode of the address. Maximum of 10 characters.
                            state:
                              type: string
                              description: State or province of the address. Maximum of 100 characters.
                            street:
                              type: string
                              description: Street of the address. Maximum of 1000 characters.
                        email:
                          type: string
                          description: Email address of the customer.
                        first_name:
                          type: string
                          description: First name of the customer. Maximum length is 128.
                        last_name:
                          type: string
                          description: Last name of the customer. Maximum length is 128.
                        phone_number:
                          type: string
                          description: Phone number of the customer.
                    expiry_month:
                      type: string
                      description: Two digit number representing the card’s expiration month.
                    expiry_year:
                      type: string
                      description: Four digit number representing the card’s expiration year.
                    name:
                      type: string
                      description: Card holder name. Maximum length is 128.
                    number:
                      type: string
                      description: Card number.
                    number_type:
                      type: string
                      description: 'Type of the number. One of `PAN`, `EXTERNAL_NETWORK_TOKEN`. Default: `PAN`.'
                customer_id:
                  type: string
                  description: The Customer this Payment Method belongs to. This Payment Method is automatically added to the Customer as one of the available Payment Methods. See [Customers API](/docs/api/payments/customers) for further details.
                googlepay:
                  type: object
                  description: Google pay information. This must be provided if `type` is set to `googlepay`.
                  properties:
                    billing:
                      type: object
                      description: Billing information.
                      properties:
                        address:
                          type: object
                          required:
                          - country_code
                          description: The billing address as it appears on the credit card issuer’s records.
                          properties:
                            city:
                              type: string
                              description: City of the address. Maximum of 100 characters.
                            country_code:
                              type: string
                              description: The two-letter country code in ISO 3166-1 alpha-2 format.
                            postcode:
                              type: string
                              description: Postcode of the address. Maximum of 10 characters.
                            state:
                              type: string
                              description: State or province of the address. Maximum of 100 characters.
                            street:
                              type: string
                              description: Street of the address. Maximum of 1000 characters.
                        email:
                          type: string
                          description: Email address of the customer.
                        first_name:
                          type: string
                          description: First name of the customer. Maximum length is 128.
                        last_name:
                          type: string
                          description: Last name of the customer. Maximum length is 128.
                        phone_number:
                          type: string
                          description: Phone number of the customer.
                    encrypted_payment_token:
                      type: string
                      description: A UTF-8 encoded, serialized JSON object with the keys specified.
                    payment_data_type:
                      type: string
                      description: Type of the payment data details.  One of `tokenized_card` or `encrypted_payment_token`.
                    tokenized_card:
                      type: object
                      required:
                      - expiry_month
                      - expiry_year
                      - number
                      description: Payment data with the tokenized card details.
                      properties:
                        authentication_method:
                          type: object
                          required:
                          - type
                          description: Authentication method.
                          properties:
                            emv:
                              type: object
                              required:
                              - emv_data
                              description: EMV data.
                              properties:
                                emv_data:
                                  type: string
                                  description: Output from the Secure Element.
                                encrypted_pin_data:
                                  type: string
                                  description: The PIN encrypted using the bank’s key.
                            three_ds:
                              type: object
                              required:
                              - online_payment_cryptogram
                              description: 3D-Secure authentication data.
                              properties:
                                eci_indicator:
                                  type: string
                                  description: Electronic Commerce Indicator, as defined by 3-D Secure.
                                online_payment_cryptogram:
                                  type: string
                                  description: Online payment cryptogram, as defined by 3-D Secure.
                            type:
                              type: string
                              description: The authentication method type. One of `emv` or `three_ds`.
                        device_manufacturer_identifier:
                          type: string
                          description: Device manufacturer identifier.
                        expiry_month:
                          type: string
                          description: Two digit number representing the card’s expiration month.
                        expiry_year:
                          type: string
                          description: Four digit number representing the card’s expiration year.
                        name:
                          type: string
                          description: Cardholder name.
                        number:
                          type: string
                          description: Card number.
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to this Payment Method. You can specify up to 50 keys with key names up to 50 characters long and values up to 500 characters long.
                  additionalProperties:
                    type: string
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant.
                type:
                  type: string
                  description: Type of the Payment Method.
                  enum:
                  - card
                  - applepay
                  - googlepay
        description: Payment Method creation request.
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request`, `resource_not_found`(invalid `customer_id`)'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/pa/payment_methods/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        request_body:
          type: card
          card:
