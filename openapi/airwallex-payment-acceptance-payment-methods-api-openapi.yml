  /api/v1/pa/payment_methods:
    get:
      tags:
      - Payment Acceptance > Payment Methods
      summary: 3|List all Payment Methods
      description: List all Payment Methods.
      operationId: listPaymentMethods
      parameters:
      - name: customer_id
        in: query
        description: Customer unique identifier of the Payment Methods.
        required: false
        schema:
          type: string
          default: cus_2019091803110002010199020012_0378811980855892
      - name: from_created_at
        in: query
        description: The start time of `created_at` in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2017-03-01T03:52:34+00:00'
      - name: page_num
        in: query
        description: Page number starting from 0.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of Payment Methods to be listed per page. Default value is 10. Maximum is 1000. The value greater than the maximum will be capped to the maximum.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: status
        in: query
        description: Payment Method status. One of `CREATED`, `DISABLED`.
        required: false
        schema:
          type: string
          default: CREATED
      - name: to_created_at
        in: query
        description: The end time of `created_at` in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2017-04-01T03:52:34+00:00'
      - name: type
        in: query
        description: Payment Method type, can be `card`, `ach_direct_debit`.
        required: false
        schema:
          type: string
          default: card
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: List items.
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
