                          type: string
                          description: Last name of the customer. Maximum length is 128.
                        phone_number:
                          type: string
                          description: Phone number of the customer.
                    expiry_month:
                      type: string
                      description: Two digit number representing the card’s expiration month.
                    expiry_year:
                      type: string
                      description: Four digit number representing the card’s expiration year.
                request_id:
                  type: string
                  description: Unique request identifier specified by the merchant.
        description: Payment Method update request.
        required: true
      responses:
        '200':
          description: OK
