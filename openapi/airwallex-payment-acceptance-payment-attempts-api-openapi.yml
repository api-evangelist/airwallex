openapi: 3.2.0
info:
  title: Airwallex Payment Acceptance > Payment Attempts API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Payment Acceptance > Payment Attempts
  description: 'A **Payment Attempt** object is created whenever a customer makes a payment with the chosen Payment Method. This API allows you to find out how your customer paid for your order.


    A customer may attempt to pay for the same order multiple times. However, only one attempt should succeed. Use the List all Payment Attempts endpoint to list each and every Payment Attempt made by your customer.


    Data Retention Policy: You can query Payment Attempt resources for a maximum of 2 years since creation.'
  x-domain: Payment Acceptance
  x-resource: Payment Attempts
  x-urlPath: payments/payment_attempts
paths:
  /api/v1/pa/payment_attempts/{id}:
    get:
      tags:
      - Payment Acceptance > Payment Attempts
      summary: 1|Retrieve a Payment Attempt
      operationId: retrievePaymentAttempt
      parameters:
      - name: id
        in: path
        description: Payment Attempt unique identifier.
        required: true
        schema:
          type: string
          default: att_tHambObszjrtrCbazat45Im1F0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttempt'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url), `resource_not_found`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/pa/payment_attempts/att_hkpd12a3456hi7
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          id: att_hkpd12a3456hi7
          amount: 100
          currency: USD
          payment_method:
            type: card
            card:
              expiry_month: '03'
              expiry_year: '2030'
              name: John Doe
              bin: '403550'
              last4: 0008
              brand: visa
              issuer_country_code: US
              card_type: CREDIT
              fingerprint: AKvN4TqxI04SNFZ+oYRXaECtDA==
              billing:
                first_name: John
                last_name: Doe
                email: john.doe@example.com
                phone_number: +1 1234567890
                address:
                  country_code: US
                  state: CA
                  city: San Francisco
                  street: 1460 Mission St.#02W101
                  postcode: '94103'
              issuer_name: JPMorgan Chase
              is_commercial: false
              number_type: PAN
          merchant_order_id: D202503210001
          payment_intent_id: int_hkpdskz7vg1xc7uscdj
          status: CAPTURE_REQUESTED
          payment_method_transaction_id: '1234567890'
          acquirer_reference_number: '1234567890'
          provider_original_response_code: '00'
          authorization_code: '123456'
          captured_amount: 100
          refunded_amount: 0
          settle_via: airwallex
          authentication_data:
            ds_data: {}
          created_at: '2023-10-01T12:00:00+00:00'
          updated_at: '2023-10-01T12:00:00+00:00'
      x-scope:
      - scope: payment_acceptance:read
        group: Payment Acceptance
        resource_name: Payment Acceptance
      x-domain: Payment Acceptance
      x-resource: Payment Attempts
      x-urlPath: retrieve
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
  /api/v1/pa/payment_attempts:
    get:
      tags:
      - Payment Acceptance > Payment Attempts
      summary: 2|List all Payment Attempts
      description: List all Payment Attempts. Specify a value for `payment_intent_id` to list the Payment Attempts made on the Payment Intent. You may filter out the results further by `method` and/or `status`.
      operationId: listPaymentAttempts
      parameters:
      - name: currency
        in: query
        description: Payment Attempt currency.
        required: false
        schema:
          type: string
          default: USD
      - name: from_created_at
        in: query
        description: The start time of `created_at` in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2021-05-01T03:52:34+00:00'
      - name: page_num
        in: query
        description: Page number starting from 0.
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of Payment Attempts to be listed per page. Default value is 10. Maximum is 1000. The value greater than the maximum will be capped to the maximum.
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      - name: payment_intent_id
        in: query
        description: Payment Intent unique identifier of the attempt.
        required: false
        schema:
          type: string
          default: int_e65tkXCSzJrsMpTrzoFrjaau53
      - name: status
        in: query
        description: Payment Attempt status.
        required: false
        schema:
          type: string
          default: AUTHORIZED
      - name: to_created_at
        in: query
        description: The end time of `created_at` in ISO8601 format. The timestamp must include an explicit timezone (e.g. `Z` or `-04:00`).
        required: false
        schema:
          type: string
          default: '2017-04-01T03:52:34+00:00'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: List items.
                    items:
                      $ref: '#/components/schemas/PaymentAttempt'
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: 'Not Found. Possible error codes: `not_found`(invalid url)'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/pa/payment_attempts
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        query_params:
          page_num: 0
          page_size: 10
          status: CAPTURE_REQUESTED,SETTLED,PAID,CAPTURE_REQUESTED,CANCELLED
        status_code: 200
        reason_phrase: OK
        response_body:
          has_more: false
          items:
          - id: att_hkpd12a3456hi7
            amount: 100
            currency: USD
            payment_method:
              type: card
              card:
                expiry_month: '03'
                expiry_year: '2030'
                name: John Doe
                bin: '403550'
                last4: 0008
                brand: visa
                issuer_country_code: US
                card_type: CREDIT
                fingerprint: AKvN4TqxI04SNFZ+oYRXaECtDA==
                billing:
                  first_name: John
                  last_name: Doe
                  email: john.doe@example.com
                  phone_number: +1 1234567890
                  address:
                    country_code: US
                    state: CA
                    city: San Francisco
                    street: 1460 Mission St.#02W101
                    postcode: '94103'
                issuer_name: JPMorgan Chase
                is_commercial: false
                number_type: PAN
            merchant_order_id: D202503210001
            payment_intent_id: int_hkpdskz7vg1xc7uscdj
            status: CAPTURE_REQUESTED
            payment_method_transaction_id: '1234567890'
            acquirer_reference_number: '1234567890'
            provider_original_response_code: '00'
            authorization_code: '123456'
            captured_amount: 100
            refunded_amount: 0
            created_at: '2023-10-01T12:00:00+00:00'
            updated_at: '2023-10-01T12:00:00+00:00'
            settle_via: airwallex
            authentication_data:
              ds_data: {}
      x-scope:
      - scope: payment_acceptance:read
        group: Payment Acceptance
        resource_name: Payment Acceptance
      x-domain: Payment Acceptance
      x-resource: Payment Attempts
      x-urlPath: list
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
components:
  schemas:
    Skrill:
      type: object
      properties:
        country_code:
          type: string
          description: The 2-letter ISO country/region code from which the consumer will be paying. Applicable worldwide except for blacklisted countries. For the forbidden countries, please refer to [Skrill Non-serviced Countries](https://www.skrill.com/en/footer/terms-conditions/non-serviced-countries/).
        shopper_email:
          type: string
          description: Email address of the shopper.
        shopper_name:
          type: string
          description: The name of the shopper.
      description: Skrill information.
    FamilyMart:
      type: object
      properties:
        shopper_email:
          type: string
          description: Email address of the shopper.
        shopper_name:
          type: string
          description: The name of the shopper.
        shopper_phone:
          type: string
          description: Phone number of the shopper.
      description: Family Mart information.
    ThreeDomainSecure:
      type: object
      required:
      - online_payment_cryptogram
      properties:
        eci_indicator:
          type: string
          description: Electronic Commerce Indicator, as defined by 3-D Secure.
        online_payment_cryptogram:
          type: string
          description: Online payment cryptogram, as defined by 3-D Secure.
      description: 3D-Secure authentication data.
    BankTransfer:
      type: object
      properties:
        bank_name:
          type: string
          description: The name of the bank.
        country_code:
          type: string
          description: The 2-letter ISO country/region code from which the consumer will be paying.
        expires_at:
          type: string
          description: Expiry time of this attempt, in [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) format.
        ga_mode:
          type: string
          description: The type of GA mode.
        shopper_email:
          type: string
          description: Email address of the shopper.
        shopper_name:
          type: string
          description: The name of the shopper.
      description: Bank Transfer information.
    Trustly:
      type: object
      properties:
        country_code:
          type: string
          description: The 2-letter ISO country/region code from which the consumer will be paying. One of `DE`, `DK`, `EE`, `ES`, `FI`, `GB`, `LT`, `LV`, `NL`, `NO`, `PL`, `SE`, `SK`.
        shopper_email:
          type: string
          description: Email address of the shopper.
        shopper_name:
          type: string
          description: The name of the shopper.
      description: Trustly information.
    Maxima:
      type: object
      properties:
        shopper_name:
          type: string
          description: The name of the shopper.
      description: Maxima information.
    PayId:
      type: object
      properties:
        australian_business_number:
          type: string
          description: 11 digits number to identify the Pay Id. Required when `phone_number`, `owner_email`, and `organisation_id` is null.
        organisation_id:
          type: string
          description: The organisation id of the recipient. The Pay ID must be in the format of `payid:airwallex.com`.
        owner_email:
          type: string
          description: owner email to identify the Pay Id. Required when `phone_number`, `australian_business_number`, and `organisation_id` is null.
        phone_number:
          type: string
          description: The phone number of the Pay Id. Required when `owner_email`, `australian_business_number`, and `organisation_id` is null.
      description: The Pay ID of the recipient.
    Paypal:
      type: object
      properties:
        country_code:
          type: string
          description: The 2-letter ISO country/region code from which the consumer will be paying.
        shopper_name:
          type: string
          description: The name of the shopper.
      description: Pay Pal information.
    CashAppPay:
      type: object
      properties:
        cashtag:
          type: string
          description: A unique identifier for individuals and businesses using Cash App. Only present for Payment Intents with verified consent.
          example: $example_cashtag
      description: Cash App Pay information.
    Klarna:
      type: object
      required:
      - country_code
      properties:
        billing:
          $ref: '#/components/schemas/Billing'
          description: Billing information.
        country_code:
          type: string
          description: The ISO 3166 alpha-2 standard country/region code from which the consumer will be paying. One of `AT`, `BE`, `CH`, `CZ`, `DE`, `DK`, `ES`, `FI`, `FR`, `GB`, `GR`, `IE`, `IT`, `NL`, `NO`, `PL`, `PT`, `SE`, `US`.
        language:
          type: string
          description: "The ISO 639-1 alpha-2 language code. Default value is `en`. Besides `en`, you can specify other local languages (see below) for some countries to render the payment page.  \nAT: `de`; BE: `be`, `nl`, `fr`; CH: `it`, `de`, `fr`; CZ: `cs`; DE: `de`; DK: `da`; ES: `es`; FI: `fi`, `sv`; FR: `fr`; GR: `el`; IT: `it`; NL: `nl`; NO: `nb`; PL: `pl`; PT: `pt`; SE: `sv`; US: `es`."
      description: Klarna information.
    Paypost:
      type: object
      properties:
        shopper_name:
          type: string
          description: The name of the shopper.
      description: Paypost information.
    Blik:
      type: object
      properties:
        shopper_name:
          type: string
          description: The name of the shopper.
      description: BLIK information.
    RiskFactor:
      type: object
      properties:
        description:
          type: string
          description: Risk factor description.
    Bancontact:
      type: object
      properties:
        shopper_name:
          type: string
          description: The name of the shopper.
      description: Bancontact information.
    PaymentAttempt:
      type: object
      properties:
        acquirer_reference_number:
          type: string
          description: Acquirer reference number of the card payment. Will be populated after the payment attempt has transitioned to the `CAPTURE_REQUESTED` or `SETTLED` status.
        amount:
          type: number
          description: Amount of the Payment Attempt.
        authentication_data:
          $ref: '#/components/schemas/AuthenticationData'
          description: Authentication data which contains AVS result, CVC result, three domain secure result and fraud evaluation result.
        authorization_code:
          type: string
          description: Authorization response code from issuer when the payment is authorized successfully.
        captured_amount:
          type: number
          description: Captured amount.
        created_at:
          type: string
          format: date-time
          description: Time at which this Payment Attempt was created.
        currency:
          type: string
          description: Currency of the Payment Attempt.
        dcc_data:
          $ref: '#/components/schemas/Dcc'
          description: Present when DCC amount is available and DCC currency is different from Payment Intent currency. DCC could be conducted either by third party or Airwallex when using Airwallex DCC product.
        failure_code:
          type: string
          description: Payment Attempt failure code. One of `authentication_failed`, `capture_failed`, `authorization_failed`, `provider_unavailable`, `system_unavailable`, `fraud_rejected`.
        failure_details:
          $ref: '#/components/schemas/Payment_Acceptance_FailureDetails'
          description: Failure details. Only applicable when status is FAILED.
        id:
          type: string
          description: Unique identifier for the Payment Attempt.
        merchant_advice_code:
          type: string
          description: An advice code from issuer to provide more details about the payment. It can be useful when implementing a retry logic for declined payments.
        merchant_order_id:
          type: string
          description: Merchant order unique identifier of the Payment Attempt.
        payment_consent_id:
          type: string
          description: Payment Consent unique identifier of the Payment Attempt.
        payment_intent_id:
          type: string
          description: Payment Intent unique identifier of the Payment Attempt.
        payment_method:
          $ref: '#/components/schemas/AttemptPaymentMethodDetail'
          description: Payment Method used by the Payment Attempt.
        payment_method_options:
          $ref: '#/components/schemas/PaymentMethodOption'
          description: Options for Payment Method.
        payment_method_transaction_id:
          type: string
          description: The unique transaction identifier for a Payment Attempt, assigned by the payment provider (card issuers or local payment method providers such as Google Pay, i DEAL, etc.).
        provider_original_response_code:
          type: string
          description: The original response code from the payment method provider (or issuer for card).
        provider_original_response_description:
          type: string
          description: Human-readable description of `provider_original_response_code`, describing the reason returned by the issuer.
        provider_transaction_id:
          type: string
          description: "Deprecated.  \n  \nUse `payment_method_transaction_id` instead."
        refunded_amount:
          type: number
          description: Refunded amount.
        settle_via:
          type: string
          description: "Through which channel the merchant will get this payment settled. Possible values are `airwallex`, `paypal`, `amex`. \n\nIf `airwallex` is returned, this payment will be settled to merchant's Airwallex wallet, otherwise it will be settled externally."
        status:
          type: string
          description: '

            - **RECEIVED**: The Payment Attempt has been created upon request.

            - **AUTHENTICATION_REDIRECTED**: The Payment Attempt is waiting for further customer action of authentication, e.g. 3DS verification and QR code scan.

            - **PENDING_AUTHORIZATION**: The Payment Attempt authorization request has been accepted and is pending the final result from the provider.

            - **AUTHORIZED**: The Payment Attempt was successfully authorized. It will either be automatically captured or require a manual capture to finalize the payment. Please be aware that capturing the payment is not possible if the Payment Intent status is **PENDING_REVIEW**.

            - **CAPTURE_REQUESTED**: The Payment Attempt has been successfully requested for capture. The payment is complete.

            - **EXPIRED**: The Payment Attempt expired after the allowed payment time. Please create a new Payment Attempt to retry.

            - **CANCELLED**: The Payment Attempt has been cancelled. The previously authorized amount (if any) will be returned to the customer.

            - **FAILED**: The Payment Attempt has failed. Please create a new Payment Attempt to retry.

            - **SETTLED**: Airwallex has received the settlement from the provider. We will settle the funds in your wallet.

            - **PAID**: Airwallex has settled the funds in your wallet.

            '
        terminal_id:
          type: string
          description: Airwallex terminal unique identifier used to process the payment attempt.
        updated_at:
          type: string
          format: date-time
          description: Last time at which this Payment Attempt was updated or operated on.
      description: Latest Payment Attempt that was created under the Payment Intent.
    Payu:
      type: object
      properties:
        shopper_name:
          type: string
          description: The name of the shopper.
      description: Pay U information.
    AuthenticationData:
      type: object
      properties:
        authentication_type:
          type: string
          description: 'The method used to authenticate this transaction. Possible values: passkey, 3ds, none.'
        avs_result:
          type: string
          description: AVS result.
        cvc_result:
          type: string
          description: CVC result.
        ds_data:
          $ref: '#/components/schemas/DsData'
          description: 3DS data.
        fraud_data:
          $ref: '#/components/schemas/FraudData'
          description: Fraud data.
        passkey_setup_status:
          type: string
          description: 'Status of payment passkey setup for the card/device used in the transaction, during cardholder authentication. Possible values: `SETUP_COMPLETED`, `ALREADY_SETUP`, `FAILED_TO_SETUP`, `NOT_TRIGGERED`

            - `SETUP_COMPLETED`: Payment passkey was successfully set up.

            - `ALREADY_SETUP`: Payment passkey was already set up for this card/device combination in a previous transaction.

            - `FAILED_TO_SETUP`: Attempted to set up a payment passkey, but the setup failed.

            - `NOT_TRIGGERED`: Payment passkey setup was not supported or not applicable for this transaction (transaction was not processed via the passkey flow).'
        sca_exemption:
          $ref: '#/components/schemas/ScaExemption'
          description: SCA exemption indicators for this transaction.
      description: Authentication data which contains AVS result, CVC result, three domain secure result and fraud evaluation result.
    Googlepay:
      type: object
      properties:
        billing:
          $ref: '#/components/schemas/Billing'
          description: Billing information.
        lifecycle_id:
          type: string
          description: Identifier used to link the transaction to the original or previous transaction in a subscription or card-on-file chain. Currently supported only for Mastercard.
        payment_data_type:
          type: string
          description: Type of the payment data details. One of `tokenized_card` or `encrypted_payment_token`.
        tokenized_card:
          $ref: '#/components/schemas/TokenizedCard'
          description: Payment data with the tokenized card details.
      description: Google pay information.
    SepaDirectDebitAddress:
      type: object
      required:
      - postcode
      - street
      - town
      properties:
        country_code:
          type: string
          description: Country code of the address. Use the two-character ISO Standard Country Codes.
        postcode:
          type: string
          description: Postcode of the address.
        street:
          type: string
          description: 'street of the address. '
        town:
          type: string
          description: town of the address.
      description: Account holder's address.
    CardAdditionalInfo:
      type: object
      properties:
        merchant_verification_value:
          type: string
          description: 'Merchant Verification Value (Provided by VISA during onboarding)

            or

            MasterCard Assigned ID (Provided by MasterCard during onboarding).'
        token_requestor_id:
          type: string
          description: Token requestor unique identifier (Provided by card schemes during onboarding).
      description: Additional information of external network token requestor. Would return when number_type is `EXTERNAL_NETWORK_TOKEN`.
    HiLife:
      type: object
      properties:
        shopper_email:
          type: string
          description: Email address of the shopper.
        shopper_name:
          type: string
          description: The name of the shopper.
        shopper_phone:
          type: string
          description: Phone number of the shopper.
      description: Hi-Life information.
    Verkkopankki:
      type: object
      properties:
        bank_name:
          type: string
          description: The name of the bank.
        shopper_email:
          type: string
          description: Email address of the shopper.
        shopper_name:
          type: string
          description: The name of the shopper.
      description: Verkkopankki information.
    Fpx:
      type: object
      properties:
        bank_name:
          type: string
          description: The name of the bank.
        shopper_email:
          type: string
          description: Email address of the shopper.
        shopper_name:
          type: string
          description: The name of the shopper.
        shopper_phone:
          type: string
          description: Phone number of the shopper.
      description: FPX information.
    TokenizedCard:
      type: object
      required:
      - expiry_month
      - expiry_year
      properties:
        authentication_method:
          $ref: '#/components/schemas/AuthenticationMethod'
          description: Authentication method.
        bin:
          type: string
          description: Bank identify number of this card.
        brand:
          type: string
          description: Brand of the card. One of `visa`, `mastercard`, `maestro`, `chinaunionpay`.
        device_manufacturer_identifier:
          type: string
          description: Device manufacturer identifier.
        expiry_month:
          type: string
          description: Two digit number representing the card’s expiration month.
        expiry_year:
          type: string
          description: Four digit number representing the card’s expiration year.
        fingerprint:
          type: string
          description: Fingerprint of the card.
        is_commercial:
          type: boolean
          description: A boolean field referring whether the card is commercial or not.
        issuer_country_code:
          type: string
          description: Country code of the card issuer.
        issuer_name:
          type: string
          description: Issuer name.
        last4:
          type: string
          description: Last four digits of the card number.
        name:
          type: string
          description: Cardholder name.
        type:
          type: string
          description: The card's type of payment. One of `credit` or `debit`.
      description: Payment data with the tokenized card details.
    KoreanCardData:
      type: object
      properties:
        business_number:
          type: string
          description: A 10-digit business number of the company.
        date_of_birth:
          type: string
          description: A 6-digit date of birth in the format of YYMMDD.
        password_first2:
          type: string
          description: Card password first 2 digits.
      description: Information for Korean Card.
    DsData:
      type: object
      properties:
        cavv:
          type: string
          description: Cardholder Authentication Verification Value. Base64-encoded 28-character string.
        challenge_cancellation_reason:
          type: string
          description: Challenge cancellation reason.
        eci:
          type: string
          description: 'Electronic Commerce Indicator. As defined by 3D-Secure.

            - `00`: **Mastercard variant**: Authentication failed.

            - `01`: **Mastercard variant**: Authentication attempted.

            - `02`: **Mastercard variant**: Authentication succeeded.

            - `04`: **Mastercard variant**: Frictionless authentication via data only mode.

            - `05`: Authentication succeeded.

            - `06`: Authentication attempted. **Mastercard variant**: Exempted from Strong Customer Authentication.

            - `07`: Authentication failed or exempted. **Mastercard variant**: Recurring transaction successfully authenticated.

            - `null`: Not applicable or 3DS authentication was not performed.

            '
        enrolled:
          type: string
          description: 'Indicates whether the cardholder is enrolled in 3D-Secure.

            - `Y`: Cardholder is enrolled.

            - `N`: Cardholder is not enrolled.

            - `U`: Unable to determine enrollment status.

            - `null`: Not applicable or enrollment check was not performed.

            '
        frictionless:
          type: string
          description: 'Indicates whether 3DS passed in frictionless flow.

            - `Y`: 3DS passed in frictionless flow.

            - `N`: 3DS entered challenge flow.

            - `null`: Not applicable or 3DS authentication was not performed.

            '
        liability_shift_indicator:
          type: string
          description: 'Indicates whether liability has shifted to the card issuer.

            - `Y`: Liability has shifted to the issuer.

            - `N`: Liability has not shifted.

            - `null`: Not applicable or unable to determine.

            '
        pa_res_status:
          type: string
          description: 'Payment Authentication Response (PARes) status.

            - `Y`: Authentication successful.

            - `N`: Authentication failed.

            - `U`: Authentication could not be performed.

            - `A`: Authentication attempted but not completed.

            - `C`: Challenge required.

            - `R`: Authentication rejected.

            - `null`: Not applicable or authentication was not performed.

            '
        version:
          type: string
          description: 3ds version.
        xid:
          type: string
          description: XID
      description: 3DS data.
