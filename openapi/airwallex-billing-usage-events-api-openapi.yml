          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 202
        reason_phrase: Accepted
        request_body:
          events:
          - billing_customer_id: bcus_hkpd7fedfgb004apkvs
            event_name: api_call
            merchant_event_id: merchant_event_12345
