  /api/v1/billing/usage_events/void:
    post:
      description: Void a previous usage event ingested within 35 days.
      operationId: usageEvents_void
      requestBody:
        content:
          application/json:
            schema:
              required:
              - merchant_event_id
              type: object
              properties:
                merchant_event_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique identifier of a previous event.
        required: true
