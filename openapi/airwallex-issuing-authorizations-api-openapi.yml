            client_data: Some client data
            create_time: '2018-03-22T16:08:02+00:00'
            digital_wallet_token_id: 91eb855a-8169-40ea-b428-8405372da9a5
            expiry_date: '2018-03-22T16:08:02+00:00'
            failure_reason: INSUFFICIENT_FUNDS
            fee_details:
            - amount: 500
              currency: USD
              type: ATM_ACCESS_FEE
            card_transaction_data:
              card_transaction_lifecycle_id: 95ede192-3a86-461e-96d9-f51b55aae79e
              card_transaction_id: 6c2dc266-09ad-4235-b61a-767c7cd6d6ea
              card_transaction_event_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
            masked_card_number: '************4242'
            merchant:
              additional_merchant_info:
                merchant_category: Professional Services
                merchant_full_name: Meta
                merchant_logo_url: https://example.com/merchant-logo.png
                merchant_sub_category: Advertising and Marketing
              category_code: '4829'
              city: San Francisco
              country: USA
              identifier: 012345678910123
              name: Merchant A
              postcode: '94111'
              state: CA
            network_transaction_id: '3951729271768745'
            retrieval_ref: '909916088001'
            risk_details:
              risk_actions_performed:
              - TRANSACTION_BLOCKED
              risk_factors:
              - Suspicious transaction velocity
              three_dsecure_outcome: AUTHENTICATED
            status: PENDING
            transaction_amount: 100
            transaction_currency: USD
