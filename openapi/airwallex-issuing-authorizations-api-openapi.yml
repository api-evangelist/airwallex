openapi: 3.2.0
info:
  title: Airwallex Issuing > Authorizations API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Issuing > Authorizations
  description: You can view authorizations such as pre auth and capture processed against individual cards or for all cards created within your organisation.
  x-domain: Issuing
  x-resource: Authorizations
  x-urlPath: issuing/authorizations
paths:
  /api/v1/issuing/authorizations/{id}:
    get:
      tags:
      - Issuing > Authorizations
      summary: 1|Retrieve an Authorization
      description: 'Retrieves details of an authorization performed on a card issued to your account.


        *This endpoint uses the legacy transaction model. Use Transaction Events, Card Transactions, and Lifecycles for the three-level transaction model and more precise transaction status and event data.*'
      operationId: retrieveAuthorization
      parameters:
      - name: id
        in: path
        description: Unique identifier for a transaction.
        required: true
        schema:
          type: string
          format: uuid
          default: 6c2dc266-09ad-4235-b61a-767c7cd6d6ea
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NonPciAuthorization'
        '400':
          description: '["field_required"

            ,"bad_request"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: true
      x-stage: deprecated
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/issuing/authorizations/authorization_id
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          acquiring_institution_identifier: '123456'
          auth_code: '000001'
          billing_amount: 1000
          billing_currency: USD
          card_id: 6c2dc266-09ad-4235-b61a-767c7cd6d6ea
          card_nickname: <string>
          client_data: Some client data
          create_time: '2018-03-22T16:08:02+00:00'
          digital_wallet_token_id: 91eb855a-8169-40ea-b428-8405372da9a5
          expiry_date: '2018-03-22T16:08:02+00:00'
          failure_reason: INSUFFICIENT_FUNDS
          fee_details:
          - amount: 500
            currency: USD
            type: ATM_ACCESS_FEE
          card_transaction_data:
            card_transaction_lifecycle_id: 95ede192-3a86-461e-96d9-f51b55aae79e
            card_transaction_id: 6c2dc266-09ad-4235-b61a-767c7cd6d6ea
            card_transaction_event_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          masked_card_number: '************4242'
          merchant:
            additional_merchant_info:
              merchant_category: Professional Services
              merchant_full_name: Meta
              merchant_logo_url: https://example.com/merchant-logo.png
              merchant_sub_category: Advertising and Marketing
            category_code: '4829'
            city: San Francisco
            country: USA
            identifier: 012345678910123
            name: Merchant A
            postcode: '94111'
            state: CA
          network_transaction_id: '3951729271768745'
          retrieval_ref: '909916088001'
          risk_details:
            risk_actions_performed:
            - TRANSACTION_BLOCKED
            risk_factors:
            - Suspicious transaction velocity
            three_dsecure_outcome: AUTHENTICATED
          status: PENDING
          transaction_amount: 100
          transaction_currency: USD
          transaction_id: 6c2dc266-09ad-4235-b61a-767c7cd6d6ea
          updated_by_transaction: 6c2dc266-09ad-4235-b61a-767c7cd6d6ea
      x-scope:
      - scope: issuing.transaction:read
        group: Issuing
        resource_name: Authorizations and Transactions
      x-domain: Issuing
      x-resource: Authorizations
      x-urlPath: retrieve
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
      servers:
      - url: https://api.airwallex.com
        description: Production
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
  /api/v1/issuing/authorizations:
    get:
      tags:
      - Issuing > Authorizations
      summary: 2|List all Authorizations
      description: 'Retrieves details of all card authorizations associated with your account. By default, authorizations created within the last 30 days are returned unless both *to* and *from* created_at request fields are populated.


        *This endpoint uses the legacy transaction model. Use Transaction Events, Card Transactions, and Lifecycles for the three-level transaction model and more precise transaction status and event data.*'
      operationId: listAuthorizations
      parameters:
      - name: billing_currency
        in: query
        description: Currency in which the transaction was billed, in 3-letter ISO-4217 code.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: card_id
        in: query
        description: Unique Identifier for the card.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: digital_wallet_token_id
        in: query
        description: Unique Identifier for the digital token.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: from_created_at
        in: query
        description: start of Transaction Date in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: to_created_at - 30 day
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: retrieval_ref
        in: query
        description: Retrieval reference number.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: status
        in: query
        description: Authorization status, Can be one of `CLEARED`, `EXPIRED`, `FAILED`, `PENDING`, `REVERSED`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: to_created_at
        in: query
        description: End of Transaction Date in ISO8601 format (exclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          default: current time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - has_more
                - items
                properties:
                  has_more:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NonPciAuthorization'
        '400':
          description: '["field_required"

            ,"bad_request"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: true
      x-stage: deprecated
      x-examples:
      - key: default
        name: ''
        method: GET
        uri: /api/v1/issuing/authorizations
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        response_body:
          has_more: false
          items:
          - acquiring_institution_identifier: '123456'
            auth_code: '000001'
            billing_amount: 1000
