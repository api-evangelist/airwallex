components:
  schemas:
    NonPciFeeDetail:
      type: object
      properties:
        amount:
          type: number
          description: Fee amount.
        currency:
          type: string
          description: Currency in which the fee is charged (3-letter ISO-4217 code).
        type:
          type: string
          description: 'Fee type. One of: `ATM_ACCESS_FEE`.'
    NonPciAdditionalMerchantInfo:
      type: object
      properties:
        merchant_category:
          type: string
          description: Merchant category.
        merchant_full_name:
          type: string
          description: Merchant full name.
        merchant_logo_url:
          type: string
          description: Merchant logo url.
        merchant_sub_category:
          type: string
          description: Merchant sub category.
      description: Merchant additional info.
    NonPciRiskDetails:
      type: object
      properties:
        risk_actions_performed:
          type: array
          description: Risk actions performed for a card transaction, triggered by rules in our risk engine.
          items:
            type: string
        risk_factors:
          type: array
          description: Risk factors are conditions or variables that increase the likelihood of fraud or financial irregularities, assessed by our risk management system to determine the threat level of a transaction.
          items:
            type: string
        three_dsecure_outcome:
          type: string
          description: 'The outcome of a 3D Secure authentication process, which verifies the identity of a cardholder during an online purchase. Can be one of: `ATTEMPTED`, `AUTHENTICATED`, `FAILED`, `NOT_APPLICABLE`, `NOT_REQUESTED`. Learn more about [3D Secure](/docs/issuing/card-controls/3d-secure-authentication).'
      description: Risk details provides a comprehensive overview of the risk evaluation for a card transaction, including identified risk factors, actions taken by the risk engine, and the outcome of the 3D Secure authentication process. It encapsulates key elements that assess the potential threat level, safeguard the transaction, and ensure the cardholder’s identity is verified. N.b. this information will only be available for transactions on or after 1st Sept 2024.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    NonPciMerchant:
      type: object
      properties:
        additional_merchant_info:
          $ref: '#/components/schemas/NonPciAdditionalMerchantInfo'
          description: Merchant additional info.
        category_code:
          type: string
          description: Merchant category code.
        city:
          type: string
          description: Merchant city.
        country:
          type: string
          description: 'Merchant country. Note: this field might prefixed with state name for some countries, e.g. TXUSA, you should parse the last 3 characters for country code.'
        identifier:
          type: string
          description: Unique identifier for the merchant.
        name:
          type: string
          description: Merchant name.
        postcode:
          type: string
          description: Merchant postcode (only for merchants within the US, Canada or Brazil).
        state:
          type: string
          description: Merchant state (only for merchants within the US, Canada or Brazil).
      description: merchant of the card transaction.
    NonPciCardTransactionData:
      type: object
      description: Identifiers for the card transaction associated with this record, following the Lifecycle → Card Transaction → Transaction Event model. Omitted for transactions that have no associated card transaction lifecycle.
      properties:
        card_transaction_lifecycle_id:
          type: string
          format: uuid
          description: Identifier that links related transactions belonging to the same card payment — such as authorizations, reversals, captures, and refunds — under a single lifecycle.
        card_transaction_id:
          type: string
          format: uuid
          description: Identifier of the card transaction. Retrieve its details via GET /api/v1/issuing/card_transactions/{id}.
        card_transaction_event_id:
          type: string
          format: uuid
          description: Identifier of the individual card transaction event within the lifecycle. The closest equivalent of the transaction_id field.
    NonPciAuthorization:
      type: object
      properties:
        acquiring_institution_identifier:
          type: string
          description: Unique Identifier for the acquiring institution.
        auth_code:
          type: string
          description: Authorization Code.
        billing_amount:
          type: number
          description: Billing Amount.
        billing_currency:
          type: string
          description: Billing Currency.
        card_id:
          type: string
          format: uuid
          description: Unique Identifier for the card.
        card_nickname:
          type: string
          description: The nickname of the card used.
        client_data:
          type: string
          description: Client data stored against the card record.
        create_time:
          type: string
          description: The time this outstanding authorization was created.
        digital_wallet_token_id:
          type: string
          format: uuid
          description: Unique Identifier for the digital token.
        expiry_date:
          type: string
          description: The authorization will expire after this date if not posted.
        failure_reason:
          type: string
          description: 'The reason why this authorization failed (if status is FAILED). Can be one of: `ACCOUNT_INVALID`, `CARD_CLOSED`, `CARD_INACTIVE`, `CARD_INVALID`, `CARD_LOST_STOLEN`, `CARD_NOT_ACTIVATED`, `CARD_REISSUED_TO_NEW_NUMBER`, `CARDHOLDER_VERIFICATION_FAILED`, `CURRENCY_NOT_ALLOWED`, `CVV_INVALID`, `EXPIRY_MISSING`, `INSUFFICIENT_AVAILABLE_CREDIT`,  `INSUFFICIENT_FUNDS`, `INTERNAL_ERROR`, `INVALID_EXPIRY_DATE`, `LIMIT_EXCEEDED`, `MERCHANT_CATEGORY_NOT_ALLOWED`, `NOT_SUPPORTED`,  `OUT_OF_ALLOWED_TIME_RANGE`, `PIN_INVALID`, `PIN_RETRIES_EXCEEDED`, `REMOTE_AUTH_DECLINED`, `RESTRICTED_COUNTRY`, `SUSPECTED_FRAUD`, `TRANSACTION_BLOCKED`, `TRANSACTION_BLOCKED_AT_TERMINAL`, `TRANSACTION_USAGE_DISABLED`, `MERCHANT_COUNTRY_NOT_ALLOWED`, `MERCHANT_BRAND_NOT_ALLOWED`, `MERCHANT_BRAND_CATEGORY_NOT_ALLOWED`, `MERCHANT_BRAND_SUBCATEGORY_NOT_ALLOWED`. Learn more about [transaction failure reasons](/docs/issuing/transactions/transaction-failure-reasons).'
        fee_details:
          type: array
          description: List of fee details associated with the authorization.
          items:
            $ref: '#/components/schemas/NonPciFeeDetail'
        card_transaction_data:
          $ref: '#/components/schemas/NonPciCardTransactionData'
          description: Card transaction identifiers associated with this authorization. Replaces the lifecycle_id field; card_transaction_lifecycle_id carries the same value as the old lifecycle_id. Omitted for transactions that have no associated card transaction lifecycle.
        masked_card_number:
          type: string
          description: Masked card number.
        merchant:
          $ref: '#/components/schemas/NonPciMerchant'
          description: merchant of the card transaction.
        network_transaction_id:
          type: string
          description: The transaction unique identifier from VISA network.
        retrieval_ref:
          type: string
          description: Transaction retrieval reference number. Data element 37 of a financial transaction message (https://en.wikipedia.org/wiki/ISO_8583).
        risk_details:
          $ref: '#/components/schemas/NonPciRiskDetails'
          description: Risk details provides a comprehensive overview of the risk evaluation for a card transaction, including identified risk factors, actions taken by the risk engine, and the outcome of the 3D Secure authentication process. It encapsulates key elements that assess the potential threat level, safeguard the transaction, and ensure the cardholder’s identity is verified. N.b. this information will only be available for transactions on or after 1st Sept 2024.
        status:
          type: string
          description: The status of this authorization. Can be one of `CLEARED`, `EXPIRED`, `FAILED`, `PENDING`, `REVERSED`.
        transaction_amount:
          type: number
          description: Transaction amount.
        transaction_currency:
          type: string
          description: Transaction currency.
        transaction_id:
          type: string
          format: uuid
          description: Unique id for the transaction.
        updated_by_transaction:
          type: string
          format: uuid
          description: 'Id of the transaction which updated status of this transaction. eg: capture.'
