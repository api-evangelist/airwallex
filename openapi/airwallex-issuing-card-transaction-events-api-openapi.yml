  /api/v1/issuing/card_transaction_events:
    get:
      tags:
      - Issuing > Card Transaction Events
      summary: 2|List all Card Transaction Events
      description: Retrieve a paginated list of transaction events. Each event includes its type, subtype, process result, and per-event amounts. Use the `lifecycle_id` or `card_transaction_id` filter to trace the sequence of events within a specific lifecycle or card transaction.
      operationId: listCardTransactionEvents
      parameters:
      - name: billing_currency
        in: query
        description: Filter by billing currency (3-letter ISO 4217 code).
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: card_id
        in: query
        description: Filter by card. Only returns transaction events associated with this card.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: card_transaction_id
        in: query
        description: Filter by card transaction. Only returns transaction events belonging to this card transaction.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: from_created_at
        in: query
        description: Filter for items created after this date in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
      - name: lifecycle_id
        in: query
        description: Filter by lifecycle. Only returns transaction events belonging to this lifecycle.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not null) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not null) from the response to a subsequent call.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_size
        in: query
        description: Number of related objects to be listed per page. The maximum is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: to_created_at
        in: query
        description: Filter for items created before this date in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
          format: date-time
      - name: type
        in: query
        description: Filter by event type. One of `AUTHORIZATION`, `CLEARING`, or `REVERSAL_AUTH`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - AUTHORIZATION
          - CLEARING
          - REVERSAL_AUTH
          - UNKNOWN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
