components:
  schemas:
    NonPciMerchantWithEnrichment:
      type: object
      properties:
        additional_merchant_info:
          $ref: '#/components/schemas/NonPciAdditionalMerchantInfo-2'
          description: Supplemental details providing richer context on the merchant and its brand. Learn more about [merchant brand controls](/docs/issuing/card-controls/authorization-controls/merchant-brand-transaction-categories).
        category_code:
          type: string
          description: The Merchant Category Code (MCC).
        city:
          type: string
          description: The city of the merchant.
        country:
          type: string
          description: The country of the merchant.
        identifier:
          type: string
          description: Unique identifier for the merchant.
        name:
          type: string
          description: The short name of the merchant.
        postcode:
          type: string
          description: The postal code of the merchant.
        state:
          type: string
          description: The state or province of the merchant.
      description: Details about the merchant where the transaction occurred, including enriched brand information.
    NonPciFxConversionFromToDetails:
      type: object
      properties:
        from_currency:
          type: string
          description: The source currency of the conversion (3-letter ISO-4217 code).
        rate:
          type: number
          description: The effective rate of fx after markup, in the from -> to direction.
        to_currency:
          type: string
          description: The target currency of the conversion (3-letter ISO-4217 code).
      description: Currency conversion details, present when the billing currency differs from the transaction currency.
    NonPciFeeDetail:
      type: object
      properties:
        amount:
          type: number
          description: Fee amount.
        currency:
          type: string
          description: Currency in which the fee is charged (3-letter ISO-4217 code).
        type:
          type: string
          description: 'Fee type. One of: `ATM_ACCESS_FEE`.'
    NonPciTransactionEvent:
      type: object
      properties:
        acquiring_institution_identifier:
          type: string
          description: Identifier of the acquiring institution (the merchant's bank).
        auth_code:
          type: string
          description: Authorization code returned for approved transactions.
        billing_amount:
          type: number
          description: The amount for this event in the card's billing currency.
        billing_currency:
          type: string
          description: Three-letter ISO 4217 currency code for the billing amount.
        card_id:
          type: string
          format: uuid
          description: Unique identifier of the card associated with this transaction event.
        card_transaction_id:
          type: string
          format: uuid
          description: Unique identifier of the card transaction this event belongs to.
        conversion_details:
          $ref: '#/components/schemas/NonPciFxConversionFromToDetails'
          description: Currency conversion details, present when the billing currency differs from the transaction currency.
        created_at:
          type: string
          description: Date and time when the transaction event was created, in ISO 8601 format.
        digital_wallet_token:
          $ref: '#/components/schemas/NonPciSimpleDigitalWalletToken'
          description: Details of the digital wallet token used for the transaction, if applicable.
        expiry_date:
          type: string
          description: 'The date and time when the authorization is set to expire, in ISO 8601 format. After expiry, reserved funds are released. Note: the associated card transaction status may not update to `EXPIRED` immediately after this time.'
        failure_reason:
          type: string
          description: The reason the event was declined. Only present when `process_result` is `DECLINED`. Learn more about [transaction failure reasons](/docs/issuing/transactions/transaction-failure-reasons).
        fee_details:
          type: array
          description: Fees applied to this specific event.
          items:
            $ref: '#/components/schemas/NonPciFeeDetail'
        id:
          type: string
          format: uuid
          description: Unique identifier of the transaction event.
        lifecycle_id:
          type: string
          format: uuid
          description: Unique identifier of the lifecycle this event belongs to.
        masked_card_number:
          type: string
          description: The masked primary account number (PAN) of the card.
        merchant:
          $ref: '#/components/schemas/NonPciMerchantWithEnrichment'
          description: Details about the merchant where the event originated, including enriched brand information.
        network_transaction_id:
          type: string
          description: Unique identifier assigned to the transaction by the card network.
        pos_entry_mode:
          type: string
          description: 'The point-of-service entry mode indicating how the card was presented. One of: `MANUAL`, `CREDENTIAL_ON_FILE`, `CONTACTLESS_CHIP`, `CONTACT_CHIP`, or `MAGSTRIPE`.'
        process_result:
          type: string
          description: The processing outcome for this event. `APPROVED` or `DECLINED`.
        remote_auth:
          type: object
          description: Data related to remote authentication, present when the transaction was processed via Remote Auth. Null or absent otherwise.
          required:
          - default_response_used
          - duration_ms
          - reason
          - response
          - timed_out
          properties:
            response:
              type: string
              description: 'The response status of the remote auth call. One of: `AUTHORIZED`, `DECLINED`.'
            reason:
              type: string
              description: Reason for the remote authorization decision.
            duration_ms:
              type: integer
              format: int32
              description: Response time of remote authorization in milliseconds.
            timed_out:
              type: boolean
              description: Indicates whether the remote auth call timed out before a response was received.
            default_response_used:
              type: boolean
              description: Indicates whether the fallback/default action from the remote auth configuration was applied.
        retrieval_ref:
          type: string
          description: Reference number assigned by the acquiring bank, used to link related events (e.g., a clearing to its original authorization).
        risk_details:
          $ref: '#/components/schemas/NonPciRiskDetails'
          description: Risk assessment details for this transaction event.
        subtype:
          type: string
          description: 'A more specific classification of the event type. One of: `AUTHORIZATION`, `INCREMENTAL_AUTHORIZATION`, `VERIFICATION`, `REVERSAL`, `PARTIAL_REVERSAL`, `EXPIRED_AUTHORIZATION`, `CLEARING`, `PARTIAL_CLEARING`, `CLEARING_REVERSAL`.'
        transaction_amount:
          type: number
          description: The amount for this event in the merchant's transaction currency.
        transaction_category:
          type: string
          description: 'The category of the transaction, derived from the card scheme''s processing code. One of: `PURCHASE`, `CASH_DISBURSEMENT`, `ACCOUNT_FUNDING`, `QUASI_CASH`, `MERCHANT_CREDIT`, `DISPUTE_CREDIT`, `ORIGINAL_CREDIT`, `ELIGIBILITY_INQUIRY`, `BILL_PAYMENT`.'
        transaction_currency:
          type: string
          description: Three-letter ISO 4217 currency code for the transaction amount.
        transacted_at:
          type: string
          format: date-time
          description: The date and time the transaction occurred as reported by the card network, in ISO 8601 format.
        type:
          type: string
          description: 'The type of this transaction event. One of: `AUTHORIZATION`, `CLEARING`, or `REVERSAL_AUTH`.'
        updated_at:
          type: string
          description: Date and time when the transaction event was last updated, in ISO 8601 format.
    NonPciAdditionalMerchantInfo-2:
      type: object
      properties:
        merchant_brand_category_id:
          type: integer
          format: int32
          description: The unique identifier associated with the merchant category.
        merchant_brand_id:
          type: string
          format: uuid
          description: The unique identifier for the merchant brand.
        merchant_brand_name:
          type: string
          description: The full legal or common name of the merchant.
        merchant_brand_subcategory_id:
          type: integer
          format: int32
          description: The unique identifier associated with the merchant's sub-category.
        merchant_logo_url:
          type: string
          description: URL of the merchant's logo for display purposes.
      description: Supplemental details providing richer context on the merchant and its brand. Learn more about [merchant brand controls](/docs/issuing/card-controls/authorization-controls/merchant-brand-transaction-categories).
    NonPciRiskDetails:
      type: object
      properties:
        risk_actions_performed:
          type: array
          description: Risk actions performed for a card transaction, triggered by rules in our risk engine.
          items:
            type: string
        risk_factors:
          type: array
          description: Risk factors are conditions or variables that increase the likelihood of fraud or financial irregularities, assessed by our risk management system to determine the threat level of a transaction.
          items:
            type: string
        three_dsecure_outcome:
          type: string
          description: 'The outcome of a 3D Secure authentication process, which verifies the identity of a cardholder during an online purchase. Can be one of: `ATTEMPTED`, `AUTHENTICATED`, `FAILED`, `NOT_APPLICABLE`, `NOT_REQUESTED`. Learn more about [3D Secure](/docs/issuing/card-controls/3d-secure-authentication).'
      description: Risk details provides a comprehensive overview of the risk evaluation for a card transaction, including identified risk factors, actions taken by the risk engine, and the outcome of the 3D Secure authentication process. It encapsulates key elements that assess the potential threat level, safeguard the transaction, and ensure the cardholder’s identity is verified. N.b. this information will only be available for transactions on or after 1st Sept 2024.
    NonPciSimpleDigitalWalletToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the digital token.
        payment_method:
          type: string
          description: 'Payment method used. One of: `APPLE_PAY`, `GOOGLE_PAY`, `CARD_ON_FILE`.'
      description: Details of the digital wallet token used for the transaction, if applicable.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    NonPciBookmarkedResultOfIssuingNonPciTransactionEvent:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NonPciTransactionEvent'
        page_after:
          type: string
          description: A marker for retrieving the next page of results. Include this value in the `page` request parameter to retrieve subsequent pages.
        page_before:
          type: string
          description: A marker for retrieving the previous page of results. Include this value in the `page` request parameter to retrieve previous pages.
