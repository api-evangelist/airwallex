tags:
- name: Issuing > Card Transaction Events
  description: 'A **transaction event** is the most granular level of the three-level transaction model

    (**Lifecycle → Card Transaction → Transaction Event**).


    Each transaction event represents an individual network message or fund movement, with an immutable

    fund movement per event. Use transaction events when you need per-event

    details such as failure reasons, authorization subtypes, or individual amounts.


    **Event types:** `AUTHORIZATION`, `CLEARING`, `REVERSAL_AUTH`.


    **Event subtypes:** `AUTHORIZATION`, `INCREMENTAL_AUTHORIZATION`, `VERIFICATION`, `REVERSAL`,

    `PARTIAL_REVERSAL`, `EXPIRED_AUTHORIZATION`, `CLEARING`, `PARTIAL_CLEARING`, `CLEARING_REVERSAL`.


    **Data retention:** Resources can be queried for a maximum of 2 years from creation.


    Learn more about the transaction lifecycle.'
  x-domain: Issuing
  x-resource: Card Transaction Events
  x-urlPath: issuing/card_transaction_events
paths:
  /api/v1/issuing/card_transaction_events/{id}:
    get:
      tags:
      - Issuing > Card Transaction Events
      summary: 1|Retrieve a Card Transaction Event
      description: Retrieve a single transaction event by its unique identifier. The response includes the event type, subtype, process result, failure reason (if declined), and per-event billing and transaction amounts.
      operationId: retrieveCardTransactionEvent
      parameters:
      - name: id
        in: path
        description: Unique identifier of the transaction event.
        required: true
        schema:
          type: string
          format: uuid
      responses:
