tags:
- name: Payment Acceptance > Settlement Records
  description: 'Use the Settlement Record API to receive the full settlement details of a particular settlement batch or payment intent.


    The Settlement Record API provides the same information as the Settlement Report but via JSON. The API can be queried using settlement batch ID or payment intent ID or both depending on your reconciliation use case.


    **How to use this API:**


    **Step 1:** Retrieve a settlement batch ID and/or payment intent ID.

    You can obtain a settlement batch ID by calling the Get list of settlements endpoint. To query by a specific payment intent, retrieve the corresponding payment intent ID using the Get list of Payment Intents endpoint.


    **Step 2:** Query the Settlement Record API.

    Once you have the required identifiers, make a request to this API to retrieve detailed settlement records. Refer to the API Reference for request details and parameters.


    This API supports keyset pagination using the `page_after` parameter. If the response includes additional pages, the `has_more` field will be set to `true`.'
  x-domain: Payment Acceptance
  x-resource: Settlement Records
  x-urlPath: payments/settlement_records
paths:
  /api/v1/pa/settlement_records:
    get:
      tags:
      - Payment Acceptance > Settlement Records
      summary: 1|List all Settlement Records
      description: Get Settlement Records by specifying the settlement (batch) unique identifier or payment intent unique identifier.
      operationId: listSettlementRecords
      parameters:
      - name: page
        in: query
        description: Value from page_after.
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: The number of items requested by page (default and max is 50).
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      - name: payment_intent_id
        in: query
        description: The payment intent unique identifier of the settlement records.
        required: false
        schema:
          type: string
      - name: settlement_id
        in: query
        description: The settlement(batch) unique identifier of the settlement records.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  has_more:
                    type: boolean
                    description: A flag which identifies whether there are more results.
                  items:
                    type: array
                    description: List items.
                    items:
                      $ref: '#/components/schemas/SettlementRecord'
                  page_after:
                    type: string
                    description: Page after.
        '400':
          description: 'Bad Request. Possible error codes: `resource_not_found` (`settlement_id` or `payment_intent_id` not found), `validation_error` (e.g. invalid `page_size`), `configuration_error` (Invalid request against merchant configuration. Please contact your account manager.)'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
