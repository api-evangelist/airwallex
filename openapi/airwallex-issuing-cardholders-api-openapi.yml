  /api/v1/issuing/cardholders:
    get:
      tags:
      - Issuing > Cardholders
      summary: 3|List all Cardholders
      description: Get all cardholders created within an account.
      operationId: listCardholders
      parameters:
      - name: cardholder_status
        in: query
        description: Cardholder status.
        required: false
        allowEmptyValue: false
        schema:
          type: string
          enum:
          - PENDING
          - READY
          - DISABLED
          - INCOMPLETE
      - name: email
        in: query
        description: Email address of the cardholder to filter by.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page, between 10 and 200. The default is 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                - has_more
                - items
                properties:
                  has_more:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NonPciCardholder'
        '400':
          description: '["field_required"

            ,"bad_request"

            ,"invalid_argument"

            ]'
          content:
