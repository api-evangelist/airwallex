  /api/v1/psp_settlement_intents/{id}/update:
    post:
      tags:
      - Embedded Finance > PSP Settlement Intents
      summary: 4|Update a PSP Settlement Intent
      description: 'Use this endpoint to update a PSP settlement intent data.


        PSP settlement intent values can only be updated if the current status is `NEW`, `ACTION_REQUIRED` or `SUBMITTED`.


        Updating any of the fields `associate_by_deposit_ids`, `currency`, `global_account_id` or `settlement_reference` on a PSP settlement intent in status `ACTION_REQUIRED` changes the status to `SUBMITTED`.'
      operationId: updatePspSettlementIntent
      x-oboSupported: false
      parameters:
      - name: id
        in: path
        description: Unique identifier of the PSP settlement intent to update.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - request_id
              properties:
                associate_by_deposit_ids:
                  type: array
                  description: Unique identifiers of the deposits associated with this PSP settlement intent. If present, these will be used instead of the `settlement_reference` field to associate deposits with this intent.
                  items:
                    type: string
                currency:
                  type: string
                  description: Currency (3-letter ISO-4217 code) of this PSP settlement intent.
                expected_settlement_date:
                  type: string
                  description: Expected date on which these funds will be deposited by the PSP into the global account, in `YYYY-MM-DD` format in the UTC timezone.
                global_account_id:
                  type: string
                  description: Global account unique identifier that will accept the funds for this PSP settlement intent.
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to this PSP settlement intent. This can be useful for storing additional information about it in a structured format.
                  additionalProperties:
                    type: string
                request_id:
                  type: string
                  description: Unique request identifier. Max length 50 characters.
                settlement_reference:
                  type: string
                  description: The PSP settlement reference field refers to the reference attached by the pay-in PSP when sending the deposit to Airwallex. The pay-in PSP typically also includes this reference in settlement reports. Airwallex uses this field to match the PSP settlement splits you have created with funds received from the PSP. Min length 5 characters. Max length 255 characters.
        description: The updated values for the PSP settlement intent.
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementIntent'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid","credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
