      summary: 3|List all PSP Settlement Intents
      description: Get a list of PSP settlement intents created by your account. The intents returned are sorted by creation time in descending order.
      operationId: listPspSettlementIntents
      x-oboSupported: false
      parameters:
      - name: from_created_at
        in: query
        description: The start date of `created_at` in ISO8601 format (inclusive).
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: global_account_id
        in: query
        description: Global account unique identifier of the PSP settlement intents.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: page_num
        in: query
        description: Page number, starts from 0.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: page_size
        in: query
        description: Number of results per page. Default value is 100, minimum 10, maximum 100.
        required: false
        allowEmptyValue: false
        schema:
          type: integer
          format: int32
          default: 100
      - name: settlement_reference
        in: query
        description: Settlement reference that has been specified while creating PSP settlement intents.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: status
        in: query
        description: PSP Settlement Intent status. One of `NEW`, `SUBMITTED`, `MATCHED`, `ACTION_REQUIRED`, `SETTLED`, `CANCELLED`.
        required: false
        allowEmptyValue: false
        schema:
          type: string
      - name: to_created_at
