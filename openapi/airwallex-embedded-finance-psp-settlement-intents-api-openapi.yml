components:
  schemas:
    SettlementIntentRequirements:
      type: object
      properties:
        matching_psp_settlement_required:
          $ref: '#/components/schemas/MatchingPspSettlementRequired'
          description: Funds have been received that correspond to this PSP settlement intent, but the total amounts do not match.
        reference_disambiguation_required:
          $ref: '#/components/schemas/ReferenceDisambiguationRequired'
          description: PSP settlement deposit reference corresponds to multiple PSP settlement intents.
      description: Further actions required in order to proceed with this settlement intent.
    SettlementIntent:
      type: object
      properties:
        associate_by_deposit_ids:
          type: array
          description: Unique identifiers of the deposits that should be associated with this PSP settlement intent. If present, these will be used instead of the `settlement_reference` field to associate deposits with this intent.
          items:
            type: string
        associated_deposit_ids:
          type: array
          description: Unique identifiers of the deposits currently associated with this PSP settlement intent. If `associate_by_deposit_ids` is not empty, then these have been associated based on that list. Otherwise, they are associated by reference.
          items:
            type: string
        created_at:
          type: string
          description: The time this PSP settlement intent was created.
        currency:
          type: string
          description: Currency (3-letter ISO-4217 code) specified in the request.
        expected_settlement_date:
          type: string
          description: Expected date on which these funds will be deposited by the PSP into the global account, in `YYYY-MM-DD` format in the UTC timezone.
        global_account_id:
          type: string
          description: The unique identifier of the global account in which this settlement will be deposited.
        id:
          type: string
          description: Unique identifier for the PSP settlement intent.
        metadata:
          type: object
          description: A set of key-value pairs that you can attach to the PSP settlement intent.
          additionalProperties:
            type: string
        request_id:
          type: string
          description: Unique request identifier specified in the request.
        requirements:
          $ref: '#/components/schemas/SettlementIntentRequirements'
          description: Further actions required in order to proceed with this settlement intent.
        settlement_reference:
          type: string
          description: The reference value expected to be included by the PSP in its PSP settlement deposit.
        status:
          type: string
          description: 'Status of the PSP settlement intent. One of: `NEW`, `SUBMITTED`, `ACTION_REQUIRED`, `MATCHED`, `SETTLED`.'
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    MatchingPspSettlementRequired:
      type: object
      properties:
        message:
          type: string
          description: Information about this requirement.
      description: The amount of associated PSP settlement deposits does not match the amount of the PSP settlement intent.
    ReferenceDisambiguationRequired:
      type: object
      required:
      - message
      properties:
        message:
          type: string
      description: PSP settlement deposit reference corresponds to multiple PSP settlement intents. Please specify in the PSP settlement intents which PSP settlement deposits correspond to them.
