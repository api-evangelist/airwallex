openapi: 3.2.0
info:
  title: Airwallex Embedded Finance > PSP Settlement Intents API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Embedded Finance > PSP Settlement Intents
  description: 'A PSP settlement intent represents a settlement with a PSP in a particular currency. Each PSP settlement intent is associated with one or more PSP settlement deposits by `settlement_reference`.

    After creating your PSP settlement intent, you can start splitting it, creating one PSP settlement split for each target account. Once you complete splitting your PSP settlement intent, you can submit it and wait for it to be matched with the associated PSP settlement deposit. The sum of the amounts of the PSP settlement splits of a PSP settlement intent should match the sum of the amounts of associated deposits.

    PSP settlement intents form part of the PSP-agnostic payout solution.'
  x-domain: Embedded Finance
  x-resource: PSP Settlement Intents
  x-urlPath: scale/psp_settlement_intents
paths:
  /api/v1/psp_settlement_intents/create:
    post:
      tags:
      - Embedded Finance > PSP Settlement Intents
      summary: 1|Create a PSP Settlement Intent
      description: 'Use this endpoint to share data with Airwallex on the *settlement* to be deposited by the PSP.


        Data on a PSP Settlement should be shared with Airwallex before the pay-in PSP deposits funds into the holding account.


        PSP settlement intent is created with initial status `NEW`.'
      operationId: createPspSettlementIntent
      x-oboSupported: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - currency
              - expected_settlement_date
              - global_account_id
              - request_id
              - settlement_reference
              properties:
                associate_by_deposit_ids:
                  type: array
                  description: Unique identifiers of the deposits associated with this PSP settlement intent. If present, these will be used instead of the `settlement_reference` field to associate deposits with this intent.
                  items:
                    type: string
                currency:
                  type: string
                  description: Currency (3-letter ISO-4217 code) of this PSP settlement intent.
                expected_settlement_date:
                  type: string
                  description: Expected date on which these funds will be deposited by the PSP into the global account, in `YYYY-MM-DD` format in the UTC timezone.
                global_account_id:
                  type: string
                  description: Global account unique identifier that will accept the deposit for this PSP settlement intent.
                metadata:
                  type: object
                  description: A set of key-value pairs that you can attach to this PSP settlement intent. This can be useful for storing additional information about it in a structured format.
                  additionalProperties:
                    type: string
                request_id:
                  type: string
                  description: Unique request identifier. Max length 50 characters.
                settlement_reference:
                  type: string
                  description: The PSP settlement reference field refers to the reference attached by the pay-in PSP when sending the deposit to Airwallex. The pay-in PSP typically also includes this reference in settlement reports. Airwallex uses this field to match the PSP settlement splits you have created with funds received from the PSP. Min length 5 characters. Max length 255 characters.
        description: request.
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementIntent'
        '400':
          description: '["field_required"

            ,"invalid_argument"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: '["credentials_invalid","credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/psp_settlement_intents/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          associate_by_deposit_ids: []
          currency: USD
          expected_settlement_date: '2022-08-26'
          global_account_id: 3f457fe5-daf4-9962-92ec-10332301d9p3
          metadata: {}
          request_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          settlement_reference: PMT1936398
        response_body:
          associate_by_deposit_ids: []
          associated_deposit_ids: []
          created_at: 2022-09-22T16:08:02+1100
          currency: AUD
          expected_settlement_date: '2022-08-26'
          global_account_id: 3f457fe5-daf4-9962-92ec-10332301d9p3
          id: psi_0iBwL9IuOZaKCz8Kn-01ew
          metadata: {}
          request_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          requirements:
            matching_psp_settlement_required:
              message: <string>
            reference_disambiguation_required:
              message: <string>
          settlement_reference: PMT1936398
          status: NEW
      x-oauthSupported: false
      x-scope:
      - scope: psp_settlement_intent:write
        group: Embedded Finance
        resource_name: PSP Settlement Intents
      x-domain: Embedded Finance
      x-resource: PSP Settlement Intents
      x-urlPath: create
