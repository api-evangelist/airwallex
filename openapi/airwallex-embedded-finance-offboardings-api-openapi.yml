tags:
- name: Embedded Finance > Offboardings
  description: 'The Offboarding API allows platforms to programmatically submit offboarding requests

    for connected accounts and query the status of submitted offboardings.


    Create an offboarding raises an Airwallex Operations-owned offboarding case for account closure. It

    differs from Suspend account, which temporarily

    suspends an account and can be reversed with

    Reactivate account. You can create an offboarding for a connected account that is not already

    closed or pending closure. Create Offboarding is not limited to `ACTIVE` accounts.

    While an offboarding is in progress (`PENDING`), the connected account `status` does

    not change. After it completes successfully (`COMPLETED`), the account enters pending

    closure and the connected account `status` returned by the client API is `SUSPENDED`

    on all API versions. After a 30-day grace period the account is permanently closed;

    from API version `2026-08-21` that surfaces as `CLOSED` (earlier versions continue to

    return `SUSPENDED`). If multiple connected

    accounts share the same client legal entity, you cannot create an offboarding for

    another account under that legal entity until the existing offboarding request is

    completed. Balance handling during offboarding is managed by Airwallex operations and

    is not available through this API.'
  x-domain: Embedded Finance
  x-resource: Offboardings
  x-urlPath: scale/offboardings
paths:
  /api/v1/accounts/{account_id}/offboardings/create:
    post:
      tags:
      - Embedded Finance > Offboardings
      summary: 1|Create an Offboarding
      description: 'Submit an offboarding request for a connected account. This creates an Airwallex Operations-owned

        offboarding case; it does not replace operations handling of the closure workflow.


        You can create an offboarding for a connected account that is not already closed or

        pending closure. Create Offboarding is not limited to `ACTIVE` accounts. While the

        offboarding case is `PENDING`, the connected account `status` does not change.

        After the offboarding completes successfully (`COMPLETED`), the account enters pending

        closure and the connected account `status` returned by the client API is `SUSPENDED`

        on all API versions. After a 30-day grace period the account is permanently closed;

        from API version `2026-08-21` that surfaces as `CLOSED` (earlier versions continue to

        return `SUSPENDED`).


        If multiple connected accounts share the same client legal entity, you cannot create

        an offboarding for another account under that legal entity until the existing

        offboarding request is completed.


        Use this endpoint for official account closure. To temporarily disable an account,

        use Suspend account instead. Balance handling

        during offboarding is managed by Airwallex operations and is not available through

        this API.'
      operationId: createOffboarding
      x-oboSupported: false
      parameters:
      - name: account_id
        in: path
        description: The account ID of the connected account to offboard.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - reason_code
              properties:
                comment:
                  type: string
                  description: Optional comment providing additional context for the offboarding request.
                reason_code:
                  type: string
                  description: "Reason code for offboarding the connected account. Possible values:\n\n * `COMMERCIAL_DECISION`: Account closure due to a commercial factors, such as account inactivity, low profitability, or other business-strategy reasons.\n * `INCOMPLETE_ONBOARDING_KYC`: The account holder signed up but did not complete KYC within specific timeframe.\n * `COMPANY_DISSOLVED_OR_LIQUIDATING`: The associated company has been dissolved or entered liquidation.\n\n * `POLICY_VIOLATION`: Offboarding due to a breach of the Acceptable Use Policy or Terms of Service. This includes operating an unsupported business model (e.g., prohibited industry, unsupported country) or actively misusing the account (e.g., personal use, circumvention of controls).\n * `FRAUDULENT_ACTIVITY`: Offboarding due to evidence of fraud. Some examples: application fraud (stolen/fake identity), merchant fraud, payment fraud, or card testing.\n * `SANCTIONS_EXPOSURE`: Offboarding due to a confirmed sanctions link or exposure, violating global sanctions policies.\n * `SUSPECTED_MONEY_LAUNDERING_OR_TERRORIST_FINANCING`: Offboarding due to suspicion of Money Laundering (ML), Terrorist Financing (TF), or other serious financial crimes, based on transaction patterns, unclear source of funds/wealth, or links to illicit activities (e.g., human trafficking, shell companies).\n * `REPUTATIONAL_RISK_OR_ADVERSE_MEDIA`: Offboarding due to negative public information (adverse media) or other factors that pose a significant reputational risk to Airwallex, even if not directly linked to a confirmed financial crime.\n * `NOT_COMPLY_WITH_ONGOING_REVIEWS`: Offboarding due to repeated failure to respond to Risk and Compliance-related Requests for Information (RFI) or Customer Due Diligence (CDD) reviews regarding their account activity.\n * `LINKAGE_TO_HIGH_RISK_CLIENT`: Offboarding due to a confirmed connection (e.g., shared ownership, validated linked devices) to another entity that has been flagged or offboarded for high-risk activity, such as fraud or financial crime.\n * `OTHER`: Client initiated closure or other reason if not listed above.\n"
        description: request.
        required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Embedded_Finance_Offboarding'
        '400':
          description: '["invalid_argument"

            ,"bad_request"

            ,"operation_failed"

            ]'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
