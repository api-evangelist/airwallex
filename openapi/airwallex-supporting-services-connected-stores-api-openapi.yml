      tags:
      - Supporting Services > Connected Stores
      summary: 1|Retrieve a Connected Store
      description: Gets the details of a Connected Store object by unique identifier.
      operationId: retrieveConnectedStore
      x-oboSupported: false
      parameters:
      - name: id
        in: path
        description: The unique identifier of the connected store object.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
