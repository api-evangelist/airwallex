    get:
      tags:
      - Supporting Services > Connected Stores
      summary: 2|List all Connected Stores
      description: Get a list of connected stores based on the query parameters.
      operationId: listConnectedStores
      x-oboSupported: false
      parameters:
      - name: from_created_at
        in: query
        description: The start time of created_at in ISO8601 format.
        required: false
        schema:
          type: string
      - name: page_num
        in: query
        description: The number of the page. Starts from 0. Defaults to 0.
        required: false
