components:
  schemas:
    Store:
      type: object
      properties:
        default_currency:
          type: string
          description: The default currency of the store is in three-letter ISO 4217 format.
        id:
          type: string
          description: The unique identifier of the store.
        name:
          type: string
          description: The unique identifier or brand name of the store on the commerce platform.
        platform:
          type: string
          description: The commerce platform of the store. One of `AMAZON`, `EBAY`, `SHOPIFY`, `SHOPEE`, `FNAC`, `LAZADA`, `WOO_COMMERCE`, `SHOPLAZZA`, `MAGENTO`.
        platform_seller_id:
          type: string
          description: The seller unique identifier on the commerce platform.
        status:
          type: string
          enum:
          - CONNECTED
          - DISCONNECTED
        url:
          type: string
          description: The URL of the commerce store.
