components:
  schemas:
    CoreBankingLendingSettings:
      type: object
      properties:
        activation_status:
          type: string
          description: Activation status of the lender.
          enum:
          - ACTIVE
          - INACTIVE
        lending_limits:
          type: array
          description: Per currency limit of lending that can be extended across all associated borrowers in total.
          items:
            $ref: '#/components/schemas/CoreBankingLendingLimit'
      description: Lending limit settings and total allocation details.
    Error:
      type: object
      properties:
        code:
          type: string
        details:
          type: object
        message:
          type: string
        source:
          type: string
    CoreBankingLendingStatistics:
      type: object
      properties:
        currency:
          type: string
          description: Currency in which lending is extended.
        limit_allocated:
          type: number
          description: Lending currently extended across all existing borrowers, up to the `lending_limit` defined in `lending_settings`.
    CoreBankingLenderBalances:
      type: object
      properties:
        available_amount:
          type: number
          description: Available balance for covering funds extended to borrowers.
        currency:
          type: string
          description: Currency in which lending is extended.
        reserved_amount:
          type: number
          description: Amount reserved for use in future transactions.
    CoreBankingLender:
      type: object
      properties:
        account_id:
          type: string
          description: Airwallex account unique identifier of the lender.
        balances:
          type: array
          description: Balances of the lender's account.
          items:
            $ref: '#/components/schemas/CoreBankingLenderBalances'
        id:
          type: string
          description: Lender unique identifier.
        lending_settings:
          $ref: '#/components/schemas/CoreBankingLendingSettings'
          description: Lending limit settings and total allocation details.
        lending_statistics:
          type: array
          description: Statistics relating to the current distribution of lending.
          items:
            $ref: '#/components/schemas/CoreBankingLendingStatistics'
    CoreBankingLendingLimit:
      type: object
      properties:
        currency:
          type: string
          description: Currency in which lending is extended.
        limit:
          type: number
          description: Upper limit of lending that can be extended across all associated borrowers in total.
