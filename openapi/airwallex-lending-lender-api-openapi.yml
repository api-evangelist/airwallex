    get:
      tags:
      - Lending > Lender
      x-stage: beta
      summary: 1|List all Lender Details
      description: Get details of the specified lender.
      operationId: retrieveLender
      x-oboSupported: false
      parameters:
      - name: lender_id
        in: path
        description: Lender unique identifier.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Ok
          content:
