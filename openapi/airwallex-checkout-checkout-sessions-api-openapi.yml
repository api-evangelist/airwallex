openapi: 3.2.0
info:
  title: Airwallex Checkout > Checkout Sessions API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Checkout > Checkout Sessions
  x-stage: early_access
  description: 'A Checkout Session manages the setup and lifecycle of an Airwallex-hosted customer checkout experience, including billing subscriptions, one-off payments and payment setup flows.

    We recommend creating a new Checkout Session each time a customer initiates a purchase. After the customer successfully completes the session, downstream resources such as Billing Customer, Customer, Payment Source, Payment Consent, Subscription, or Invoice may be created depending on the session mode.'
  x-domain: Checkout
  x-resource: Checkout Sessions
  x-urlPath: checkout/checkout_sessions
paths:
  /api/v1/checkout/checkout_sessions/create:
    post:
      x-stage: early_access
      description: 'Creates a Checkout Session object.


        A Checkout Session is created for one of the following use cases:


        - **One-off payment.** Set `mode` to `PAYMENT`. Omit `invoice_creation`, or set `invoice_creation.enabled` to `false`. See Checkout Session quickstart.

        - **One-off payment with an invoice.** Set `mode` to `PAYMENT` and set `invoice_creation.enabled` to `true`. See Invoicing.

        - **Subscription payments.** Set `mode` to `SUBSCRIPTION`. See Subscription management.

        - **Save a payment method for future use.**

        - **Save as Payment Consent.** Set `mode` to `SETUP` and pass `customer_id`. This field is required. See Recurring with Payments.

        - **Save as Payment Source.** Set `mode` to `SETUP` and pass `billing_customer_id`. This field is required. See Recurring with Billing.'
      operationId: createCheckoutSession
      x-oboSupported: false
      requestBody:
        content:
          application/json:
            schema:
              required:
              - account_id
              - mode
              - request_id
              type: object
              properties:
                mode:
                  pattern: ^(PAYMENT|SUBSCRIPTION|SETUP)$
                  type: string
                  description: 'The mode of the Checkout Session object, can be one of:

                    - `PAYMENT`: Accept one-off payments.

                    - `SUBSCRIPTION`: Set up subscriptions.

                    - `SETUP`: Collect payment details to charge your customers later.'
                request_id:
                  maxLength: 64
                  minLength: 0
                  type: string
                  description: Unique request ID specified by the merchant.
                success_url:
                  type: string
                  description: The URL the customer will be directed to after the checkout completion. Only applicable when `ui_mode` is `HOSTED`.
                account_id:
                  type: string
                  description: ID of the Airwallex payment account to collect payment. You can find this ID in the Airwallex web app > Settings > Account details, within the Account Information section.
                back_url:
                  type: string
                  description: If set, the hosted checkout page displays a back button which allows customers to cancel the flow and be directed to this URL.
                billing_customer_id:
                  type: string
                  description: 'The ID of the [Billing Customer](/docs/api/billing/billing_customers) associated with this Checkout Session.


                    Use this field when:


                    - `mode` is `PAYMENT` and `invoice_creation.enabled` is `true`.

                    - `mode` is `SUBSCRIPTION`.

                    - `mode` is `SETUP` and the collected payment method is saved as a Payment Source. The field is required in this case.


                    Mutually exclusive with `customer_id`.'
                currency:
                  type: string
                  description: The checkout currency in 3-letter ISO-4217 format. Required when `mode` is `PAYMENT` or `SETUP`.
                customer_data:
                  $ref: '#/components/schemas/Checkout_PrefilledCustomerData'
                  description: The prefilled information of the customer. Only applicable when `billing_customer_id` and `customer_id` are omitted and `mode` is not `SETUP`.
                customer_data_collection:
                  $ref: '#/components/schemas/Checkout_CustomerDataCollection'
                customer_id:
                  type: string
                  description: 'The ID of the [Customer](/docs/api/payments/customers) associated with this Checkout Session.


                    Use this field when:


                    - `mode` is `PAYMENT` and `invoice_creation.enabled` is `false` or omitted.

                    - `mode` is `SETUP` and the collected payment method is saved as a Payment Consent. The field is required in this case.


                    Mutually exclusive with `billing_customer_id`.'
                discounts:
                  maxItems: 1
                  minItems: 0
                  type: array
                  description: List of discounts to be applied to the subscription or invoice. Discounts of line items are applied before subscription or invoice discounts. Currently, only one element is supported. Only applicable when an invoice is created.
                  items:
                    $ref: '#/components/schemas/DiscountInstructionRequest'
                enable_automatic_tax:
                  type: boolean
                  description: Whether automatic tax is enabled for this checkout. When enabled, the system attempts to calculate taxes for this checkout's invoice automatically. Defaults to `false`. Only applicable when an invoice is created.
                payment_intent_data:
                  $ref: '#/components/schemas/PaymentIntentData'
                  description: A subset of parameters used to create the Payment Intent for this Checkout Session.
                invoice_creation:
                  $ref: '#/components/schemas/InvoiceCreation'
                  description: Invoice creation settings. Only applicable when `mode` is `PAYMENT`.
                legal_entity_id:
                  type: string
                  description: ID of the legal entity to be used as billing entity. You can find this ID in the Airwallex web app > Settings. Required when your organization has more than one legal entity. Only applicable when an invoice is created.
                locale:
                  type: string
                  description: 'The locale for your website. Defaults to the browser''s locale; however, if the browser''s locale is not supported, it will default to `en`.


                    Accepted values: `ar`, `da`, `de`, `en`, `es`, `fi`, `fr`, `he`, `id`, `it`, `ja`, `ko`, `ms`, `nl`, `pl`, `pt`, `ro`, `ru`, `si`, `sv`, `tr`, `vi`, `ur`, `zh`, `zh-HK`.'
                line_items:
                  type: array
                  description: "A list of items the customer is purchasing. Required when `mode` is `SUBSCRIPTION` or `PAYMENT`. Not applicable when `mode` is `SETUP`.  \nWhen `mode` is `SUBSCRIPTION`, all line items must have a recurring Price.  \nWhen `mode` is `PAYMENT`, all line items must have a non-recurring Price."
                  items:
                    $ref: '#/components/schemas/CheckoutLineItemRequest'
                metadata:
                  type: object
                  additionalProperties:
                    type: string
                  description: A set of string key-value pairs that you can attach to this object for storing additional information.
                payment_options:
                  $ref: '#/components/schemas/PaymentOptions'
                  description: Payment settings of this Checkout Session.
                return_url:
                  type: string
                  description: The URL to redirect your customer back to after they authenticate or cancel their payment on the payment method's app or site, with payment status not confirmed. Only applicable when `ui_mode` is `EMBEDDED` or `ELEMENTS`.
                subscription_data:
                  $ref: '#/components/schemas/SubscriptionDataRequest'
                  description: The settings of subscription to be passed to the subscription creation upon completion of the Checkout Session in `SUBSCRIPTION` mode.
                ui_mode:
                  pattern: ^(HOSTED|EMBEDDED|ELEMENTS)$
                  type: string
                  description: 'The UI mode of the Checkout Session:

                    - `HOSTED`: Customers complete checkout on an Airwallex-hosted page.

                    - `EMBEDDED`: Embed the checkout UI directly in your website or app.

                    - `ELEMENTS`: Build a custom checkout UI using Airwallex Elements.


                    Defaults to `HOSTED`. When no invoice is created, only `HOSTED` is supported.'
                hosted_completion_page:
                  $ref: '#/components/schemas/Checkout_HostedCompletionPage'
                  description: Configuration of the customer experience after the Checkout Session completes. Only applicable when `ui_mode` is `HOSTED`.
                ui_options:
                  $ref: '#/components/schemas/UiOptions'
                  description: Customization options for the Checkout Page.
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CheckoutSessionResponse'
          description: Created
        '400':
          description: 'Bad Request. Possible error codes: `validation_error`, `duplicate_request_id`'
        '401':
          description: 'Unauthorized. Possible error codes: `unauthorized`'
        '500':
          description: 'Server Error. Possible error codes: `internal_error`'
      summary: 1|Create a Checkout Session
      tags:
      - Checkout > Checkout Sessions
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/checkout/checkout_sessions/create
        request_headers:
          Authorization: Bearer <token>
          Content-Type: application/json
        status_code: 201
        reason_phrase: Created
        request_body:
          mode: PAYMENT
          request_id: ee939540-3203-4a2c-9172-89a566485dd9
          success_url: https://www.airwallex.com/success
          account_id: acct_ncI2nypPKSq2VXKxscAcg
          back_url: https://www.airwallex.com/back
          currency: USD
          customer_data_collection:
            tax_id: OPTIONAL_IF_SUPPORTED
            billing_address: REQUIRED
            phone_number: REQUIRED
            name: REQUIRED
            email: REQUIRED
          customer_id: cus_hkpd7fedfgb004apkvs
          invoice_creation:
            enabled: false
          payment_intent_data:
            descriptor: AIRWALLEX
            merchant_order_id: order_123
            shipping:
              address:
                country_code: AU
                city: Melbourne
                postcode: '3000'
                state: VIC
                street: 1 Collins Street
              fee_amount: 5
              first_name: John
              last_name: Doe
              phone_number: '+61400000000'
              shipping_method: standard
          line_items:
          - price_id: pri_hkpd7fedfgb004apkvs
            quantity: 1
          metadata:
            foo: bar
          payment_options:
            payment_method_types:
            - card
            - googlepay
            - applepay
            auto_capture: true
            authorization_type: final_auth
            allowed_card_networks:
            - visa
            - mastercard
            payment_method_save:
              mode: ENABLED
              next_triggered_by: MERCHANT
          ui_mode: HOSTED
          locale: en
        response_body:
          automatic_tax_status: DISABLED
          created_at: 2025-05-10T16:00:30+0000
          discounts: []
          enable_automatic_tax: false
          expires_at: 2025-05-10T17:00:30+0000
          id: bco_sgstcdcpnh8sv3awiwo
          mode: PAYMENT
          status: ACTIVE
          success_url: https://www.airwallex.com/success
          updated_at: 2025-05-10T16:00:30+0000
          account_id: acct_ncI2nypPKSq2VXKxscAcg
          back_url: https://www.airwallex.com/back
          currency: USD
          customer_data_collection:
            tax_id: OPTIONAL_IF_SUPPORTED
            billing_address: REQUIRED
            phone_number: REQUIRED
            name: REQUIRED
            email: REQUIRED
          customer_id: cus_hkpd7fedfgb004apkvs
          invoice_creation:
            enabled: false
          payment_intent_data:
            descriptor: AIRWALLEX
            merchant_order_id: order_123
            shipping:
              address:
                country_code: AU
                city: Melbourne
                postcode: '3000'
                state: VIC
                street: 1 Collins Street
              fee_amount: 5
              first_name: John
              last_name: Doe
              phone_number: '+61400000000'
              shipping_method: standard
          line_items:
          - price_id: pri_hkpd7fedfgb004apkvs
            discounts: []
            quantity: 1
          metadata:
            foo: bar
          payment_options:
            payment_method_types:
            - card
            - googlepay
            - applepay
            auto_capture: true
            authorization_type: final_auth
            allowed_card_networks:
            - visa
            - mastercard
            payment_method_save:
              mode: ENABLED
              next_triggered_by: MERCHANT
          ui_mode: HOSTED
          locale: en
          url: https://checkout.airwallex.com/pay?s=jwt_token
      x-api-key-scope: org
      x-obo-supported: false
      x-scope:
      - scope: checkout.session:write
        group: Checkout
        resource_name: Checkout Sessions
      x-domain: Checkout
