components:
  schemas:
    TaxIdCollection:
      pattern: ^(DISABLED|OPTIONAL_IF_SUPPORTED|REQUIRED_IF_SUPPORTED)$
      type: string
      description: 'Controls whether the tax ID will be collected for a business customer during checkout.

        - `DISABLED`: Tax ID will not be collected.

        - `OPTIONAL_IF_SUPPORTED`: Tax ID is optionally collected in supported countries by displaying the "I am purchasing as a business" checkbox.

        - `REQUIRED_IF_SUPPORTED`: Tax ID is always collected when the country is supported.

        Defaults to `OPTIONAL_IF_SUPPORTED`.'
    InvoiceCreationResponse:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Whether an invoice is created for this Checkout Session.
        invoice_data:
          $ref: '#/components/schemas/Checkout_InvoiceDataResponse'
          description: The invoice settings used for this Checkout Session.
    PaymentSourceOptions:
      type: object
      properties:
        mode:
          type: string
          description: 'Whether and how to store the payment method used in this Checkout Session for future payments. Accepted values:

            - `ENABLED`: Always store the payment method when possible; no checkbox is shown.

            - `DISABLED`: Never store the payment method; always treat the transaction as guest checkout.

            - `COLLECT_CONSENT`: Show a checkbox and only store the payment method if the customer explicitly opts in. Only applicable to cards.'
        next_triggered_by:
          type: string
          description: 'Indicates who will use the saved Payment Source or Payment Consent to trigger future payments. One of `MERCHANT` or `CUSTOMER`.

            If `MERCHANT`, a Payment Source or Payment Consent is created for future use. If `CUSTOMER`, the payment method is saved only with the payment provider.'
      description: Settings that control how the payment method can be reused for future payments (Card-on-File / recurring agreements).
    CheckoutSessionResponse:
      required:
      - automatic_tax_status
      - created_at
      - discounts
      - enable_automatic_tax
      - expires_at
      - id
      - line_items
      - account_id
      - mode
      - status
      - ui_mode
      - updated_at
      type: object
      properties:
        automatic_tax_status:
          type: string
          enum:
          - APPLIED
          - DISABLED
          - LOCATION_NOT_SUPPORTED
          - LOCATION_NOT_REGISTERED_BY_MERCHANT
          - ADDRESS_INCOMPLETE
          description: 'The automatic tax status of this checkout. One of:

            - `APPLIED`: The automatic tax is applied.

            - `DISABLED`: The automatic tax is disabled.

            - `LOCATION_NOT_SUPPORTED`: Automatic tax calculation isn''t supported in the customer''s location.

            - `LOCATION_NOT_REGISTERED_BY_MERCHANT`: The merchant isn''t registered to collect tax in the customer''s location.

            - `ADDRESS_INCOMPLETE`: The customer address was insufficient or invalid to determine the correct tax.'
        created_at:
          type: string
          description: Time when the Checkout Session was created.
        discounts:
          type: array
          description: List of discounts applied to the subscription or invoice. Discounts of line items are applied before subscription or invoice discounts. Currently, only one element is supported.
          items:
            $ref: '#/components/schemas/DiscountInstructionResponse'
        enable_automatic_tax:
          type: boolean
          description: Whether automatic tax is enabled for this checkout. When enabled, the system attempts to calculate taxes for this checkout's invoice automatically.
        expires_at:
          type: string
          description: Time when the Checkout Session expires.
        id:
          type: string
          description: ID of the Checkout Session object.
        mode:
          type: string
          description: 'The mode of the Checkout Session object, can be one of:

            - `PAYMENT`: Accept one-off payments.

            - `SUBSCRIPTION`: Set up subscriptions.

            - `SETUP`: Collect payment details to charge your customers later.'
        status:
          type: string
          description: 'The status of the Checkout Session object, can be one of:

            - `ACTIVE`: The Checkout Session is available for the customer to complete a purchase.

            - `COMPLETED`: The Checkout Session has been completed.

            - `CANCELLED`: The Checkout Session has been cancelled.

            - `EXPIRED`: The Checkout Session has expired.


            The status automatically changes from `ACTIVE` to `EXPIRED` after 1 hour if purchase has not been completed.'
        success_url:
          type: string
          description: The URL the customer will be directed to after the checkout completion.
        updated_at:
          type: string
          description: Time when the Checkout Session was last updated.
        account_id:
          type: string
          description: ID of the Airwallex payment account used to collect payment. You can find this ID in the Airwallex web app > Settings > Account details, within the Account Information section.
        back_url:
          type: string
          description: If set, the hosted checkout page displays a back button which allows customers to cancel the flow and be directed to this URL.
        billing_customer_id:
          type: string
          description: ID of the [Billing Customer](/docs/api/billing/billing_customers) associated with this Checkout Session, if applicable.
        cancelled_at:
          type: string
          description: Time when the Checkout Session was cancelled.
        client_secret:
          type: string
          description: The client secret used to initialize the Checkout Session in `EMBEDDED` or `ELEMENTS` `ui_mode`. Only present when `ui_mode` is `EMBEDDED` or `ELEMENTS`.
        completed_at:
          type: string
          description: Time when the Checkout Session was completed.
        currency:
          type: string
          description: The checkout currency in 3-letter ISO-4217 format.
        customer_data:
          $ref: '#/components/schemas/Checkout_PrefilledCustomerData'
          description: The prefilled information of the customer.
        customer_data_collection:
          $ref: '#/components/schemas/Checkout_CustomerDataCollection'
        customer_id:
          type: string
          description: ID of the [Customer](/docs/api/payments/customers) from the Payments API associated with this Checkout Session, if applicable.
        payment_intent_data:
          $ref: '#/components/schemas/PaymentIntentData'
          description: The Payment Intent parameters configured for this Checkout Session.
        payment_intent_id:
          type: string
          description: ID of the Payment Intent associated with this Checkout Session.
        invoice_creation:
          $ref: '#/components/schemas/InvoiceCreationResponse'
          description: Invoice creation settings for this Checkout Session.
        invoice_id:
          type: string
          description: ID of the invoice for the Checkout Session when `mode` is `PAYMENT`. Only applicable when `status` is `COMPLETED`.
        legal_entity_id:
          type: string
          description: ID of the legal entity to be used as billing entity, which can be retrieved from the `legal_entity_id` field in the [Retrieve account details API](/docs/api/scale/accounts/retrieve) response.
        line_items:
          type: array
          description: A list of items the customer is purchasing.
          items:
            $ref: '#/components/schemas/CheckoutLineItemResponse'
        metadata:
          type: object
          additionalProperties:
            type: string
          description: A set of string key-value pairs that you can attach to this object for storing additional information.
        payment_consent_id:
          type: string
          description: ID of the Payment Consent created when the Checkout Session is completed.
        payment_options:
          $ref: '#/components/schemas/PaymentOptions'
          description: Payment settings of this Checkout Session.
        payment_source_id:
          type: string
          description: ID of the Payment Source created when the Checkout Session is completed.
        return_url:
          type: string
          description: The URL to redirect your customer back to after they authenticate or cancel their payment on the payment method's app or site, with payment status not confirmed.
        subscription_data:
          $ref: '#/components/schemas/SubscriptionDataResponse'
          description: The settings of subscription to be passed to the subscription creation upon completion of the Checkout Session in `SUBSCRIPTION` mode.
        subscription_id:
          type: string
          description: ID of the subscription for the Checkout Session when `mode` is `SUBSCRIPTION`. Only applicable when `status` is `COMPLETED`.
        ui_mode:
          type: string
          description: "The UI mode of the Checkout Session, can be one of:  \n`HOSTED`: Customers complete the checkout on an Airwallex-hosted page.  \n`EMBEDDED`: Embed the checkout UI directly in your website or app.  \n`ELEMENTS`: Build a custom checkout UI using Airwallex Elements."
        locale:
          type: string
          description: The locale for the Checkout Session.
        hosted_completion_page:
          $ref: '#/components/schemas/Checkout_HostedCompletionPage'
          description: Configuration of the customer experience after the Checkout Session completes. Only applicable when `ui_mode` is `HOSTED`.
        ui_options:
          $ref: '#/components/schemas/UiOptions'
          description: Customization options for the Checkout Page.
        url:
          type: string
          description: The URL to the Checkout Session. Only present when `status` is `ACTIVE`.
    SubscriptionDefaultInvoiceTemplateRequest:
      type: object
      properties:
        invoice_memo:
          type: string
          minLength: 0
          maxLength: 500
          description: Memo to be used for the invoices that are generated by this Subscription.
      description: Invoices for the Subscription will be created using the specified settings.
    BillingAddressCollection:
      pattern: ^(AUTO|REQUIRED)$
      type: string
      description: 'Controls whether the billing address will be collected during checkout.

        - `AUTO`: Billing address is collected only when necessary, including when automatic tax is enabled or a tax ID is collected.

        - `REQUIRED`: Billing address is always collected.

        Defaults to `AUTO`.'
    PaymentOptions:
      type: object
      properties:
        payment_method_types:
          type: array
          description: "Specify which payment methods to display on the Checkout Page and set their display order. Only methods supported for the specified currency and the customer's country code will appear on the Checkout Page. If omitted, all available payment methods are displayed in the default order.  \nPossible values when `mode` is `SUBSCRIPTION`: `card`, `applepay`, `googlepay`, `alipaycn`, `alipayhk`, `dana`, `gcash`, `kakaopay`, `klarna`, `rabbit_line_pay`, `tng`, `truemoney`.  \nPossible values when `mode` is `PAYMENT`: `card`, `applepay`, `googlepay`, `wechatpay`, `alipaycn`, `alipayhk`, `gcash`, `dana`, `kakaopay`, `tng`, `truemoney`, `bkash`, `poli`, `fpx`, `bank_transfer`, `alfamart`, `doku_ewallet`, `enets`, `grabpay`, `indomaret`, `konbini`, `online_banking`, `payeasy`, `payeasy_atm`, `seven_eleven`, `skrill`, `tesco_lotus`, `eps`, `giropay`, `bancontact`, `ideal`, `multibanco`, `p24`, `sofort`, `trustly`, `dragonpay`, `blik`, `mybank`, `paybybankapp`, `safetypay`, `verkkopankki`, `maxima`, `narvesen`, `paypost`, `perlas_terminals`, `paysafecash`, `paysafecard`, `paysera`, `satispay`, `family_mart`, `hi_life`, `permata_atm`, `sam_kiosk`, `axs_kiosk`, `esun`, `shopee_pay`, `boost`, `paypal`, `payu`, `bitpay`, `ovo`, `rabbit_line_pay`, `ach_direct_debit`, `bacs_direct_debit`, `becs_direct_debit`, `sepa_direct_debit`, `eft_direct_debit`, `atome`, `go_pay`, `jenius_pay`, `linkaja`, `duit_now`, `pay_now`, `prompt_pay`, `airwallex_pay`, `fps`, `klarna`, `korean_local_card`, `payco`, `samsung_pay`, `naver_pay`, `toss_pay`, `upi`, `line_pay`, `paypay`, `merpay`, `d_barai`, `au_pay`, `rakuten_pay`, `zip`, `spei`, `afterpay`, `airi`, `lumi`, `payto`, `twint`, `venmo`, `pix`, `laybuy`, `cash_app_pay`, `payme`, `octopus`, `tabby`, `spaylater`, `wero`, `jkopay`, `affirm`, `bizum`, `cartes_bancaires`, `swish`, `mbway`.  \nPossible values when `mode` is `SETUP`: `card`."
          items:
            type: string
        auto_capture:
          type: boolean
          description: Whether the amount should be captured automatically upon successful payment authorization. Set to `false` to place a hold on the payment method and capture the funds later. Defaults to `true`. Only applicable when `mode` is `PAYMENT`.
        pay_by_invoice_enabled:
          type: boolean
          description: Enables the option to "Request an invoice" for payment. After the customer confirms to pay with this option, the status of Checkout Session will transit to COMPLETED, and an invoice will be generated. The invoice will inherit the payment_options of this Checkout Session, and other configurations in `invoice_creation.invoice_data`. Only applicable when an invoice is created, and the customer type is `BUSINESS`.
        authorization_type:
          type: string
          enum:
          - final_auth
          - pre_auth
          description: The authorization type of the card payment. One of `final_auth`, `pre_auth`. Defaults to `final_auth`. Set it to `pre_auth` if you want to place a hold on your customer's card for more than 7 days. `pre_auth` is only applicable to Visa or Mastercard and requires `auto_capture` to be `false`. Only applicable when `mode` is `PAYMENT`.
        allowed_card_networks:
          type: array
          description: One or more card networks that you support. Accepted values are `visa`, `mastercard`, `maestro`, `unionpay`, `amex`, `jcb`, `diners`, and `discover`. Only applicable when `mode` is `PAYMENT`.
          items:
            type: string
        payment_method_save:
          $ref: '#/components/schemas/PaymentSourceOptions'
          description: Settings that control whether and how the payment method can be reused for future payments.
      description: Payment settings of this Checkout Session.
    Checkout_PrefilledCustomerData:
      type: object
      properties:
        country_code:
          type: string
          description: Two-letter ISO 3166 country code of the shopper's country. Strongly recommended — drives which payment methods are surfaced (iDEAL / EPS etc. are country-restricted). Falls back to IP geo when absent.
        email:
          maxLength: 200
          minLength: 0
          type: string
          description: 'The prefilled email of the customer.

            If this field, or a `customer_id` or `billing_customer_id` with an email on file, is provided, the email will be prefilled and will not be editable during checkout.

            If no email is provided, the Checkout Session prompts the customer to enter their email.'
        name:
          maxLength: 200
          minLength: 0
          type: string
          description: 'The prefilled name of the customer.

            If this field, or a `customer_id` or `billing_customer_id` with a name on file, is provided, the name will be prefilled and will not be editable during checkout.

            If no name is provided, the Checkout Session prompts the customer to enter their name.'
        type:
          type: string
          description: Type of the customer, one of `BUSINESS` or `INDIVIDUAL`. If not provided and no type is available from an existing customer, an "I am purchasing as a business" checkbox is displayed for the customer to self-select.
      description: Customer data prefilled by the merchant when creating the Checkout Session. Surfaced to the Checkout Page to pre-populate form fields and to drive country-aware payment method surfacing.
    Checkout_InvoiceDataResponse:
      type: object
      properties:
        days_until_due:
          type: integer
          description: Number of days from invoice finalization until payment is due.
          format: int32
        default_tax_percent:
          type: number
          description: The tax rate between 0 and 100(%) to be applied to invoices to be generated. The tax will be exclusive. Defaults to 0.
          maximum: 100
          minimum: 0
        due_at:
          type: string
          description: Due date set by the merchant for this invoice, if any.
        memo:
          type: string
          description: String used for merchants to share a custom message to their customers. Referenced as memo or invoice note in Webapp.
          maxLength: 200
          minLength: 0
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of key-value pairs that you can attach to this object for storing additional information.
          description: A set of key-value pairs that you can attach to this object for storing additional information.
      description: The settings of invoice to be passed to the invoice creation upon completion of the Checkout Session in `PAYMENT` mode.
    SubscriptionDataRequest:
      type: object
      properties:
        days_until_due:
          type: integer
          description: Number of days from invoice finalization until payment is due. Defaults to `0`.
          format: int32
        default_invoice_template:
          $ref: '#/components/schemas/SubscriptionDefaultInvoiceTemplateRequest'
          description: Invoices for the Subscription will be created using the specified settings.
        default_tax_percent:
          maximum: 100
          minimum: 0
          type: number
          description: The tax rate between 0 and 100(%) to be applied to invoices to be generated. The tax will be exclusive. Defaults to 0.
        duration:
          $ref: '#/components/schemas/SubscriptionDurationResponse'
          description: The total duration of the subscription.
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of string key-value pairs that you can attach to this object for storing additional information.
          description: A set of string key-value pairs that you can attach to this object for storing additional information.
        starts_at:
          type: string
          description: Time when the subscription started or scheduled to start. Defaults to start immediately after creation.
        trial_ends_at:
          type: string
          description: The end time of the trial if applicable.
      description: The settings of subscription to be passed to the subscription creation upon completion of the Checkout Session in `SUBSCRIPTION` mode. `recurring` is response-only and not accepted at create time.
    Checkout_CustomerDataCollection:
      type: object
      properties:
        tax_id:
          $ref: '#/components/schemas/TaxIdCollection'
        billing_address:
          $ref: '#/components/schemas/BillingAddressCollection'
        phone_number:
          $ref: '#/components/schemas/RequiredInfoCollection'
          description: 'Controls whether the phone number will be collected during checkout.

            - `AUTO`: Phone number is collected only when necessary.

            - `REQUIRED`: Phone number is always collected.'
        name:
          $ref: '#/components/schemas/RequiredInfoCollection'
          description: 'Controls whether the name will be collected during checkout.

            - `AUTO`: Name is collected only when necessary, including when an invoice is created or when required by the selected payment method.

            - `REQUIRED`: Name is always collected.'
        email:
          $ref: '#/components/schemas/RequiredInfoCollection'
          description: 'Controls whether the email address will be collected during checkout.

            - `AUTO`: Email address is collected only when necessary, including when an invoice is created or when required by the selected payment method.

            - `REQUIRED`: Email address is always collected.'
      description: Provides configuration for the Checkout Session to collect information from customers.
    InlineProductRequest:
      required:
      - name
      type: object
      properties:
        description:
          maxLength: 500
          minLength: 0
          type: string
          description: Product description. Used for internal classification and identification.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: A set of string key-value pairs that you can attach to this object for storing additional information.
        name:
          maxLength: 200
          minLength: 0
          type: string
          description: Product name.
        tax_code:
          type: string
          description: The tax category of the product.
        unit:
          maxLength: 30
          minLength: 0
          type: string
          description: Product unit.
    DiscountInstructionResponse:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: 'Specifies how to obtain the discount. One of: `COUPON`.'
        coupon:
          $ref: '#/components/schemas/CouponDiscountDataRequest'
    Checkout_Address:
      required:
      - country_code
      type: object
      properties:
        country_code:
          type: string
          description: The two-letter country code in ISO 3166-1 alpha-2 format.
        city:
          type: string
          description: City of the address.
        postcode:
          type: string
          description: Postcode of the address.
        state:
          type: string
          description: State or province of the address.
        street:
          type: string
          description: Street address.
      description: Address information.
    SubscriptionDataResponse:
      required:
      - days_until_due
      - recurring
      type: object
      properties:
        days_until_due:
          type: integer
          description: Number of days from invoice finalization until payment is due. Defaults to `0`.
          format: int32
        default_invoice_template:
          $ref: '#/components/schemas/SubscriptionDefaultInvoiceTemplateResponse'
          description: Invoices for the Subscription will be created using the specified settings.
        default_tax_percent:
          maximum: 100
          minimum: 0
          type: number
          description: The tax rate between 0 and 100(%) to be applied to invoices to be generated. The tax will be exclusive. Defaults to 0.
        duration:
          $ref: '#/components/schemas/SubscriptionDurationResponse'
          description: The total duration of the subscription.
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of string key-value pairs that you can attach to this object for storing additional information.
          description: A set of string key-value pairs that you can attach to this object for storing additional information.
        recurring:
          $ref: '#/components/schemas/SubscriptionRecurringResponse'
          description: The billing cycle for recurring charges.
        starts_at:
          type: string
          description: Time when the subscription started or scheduled to start. Defaults to start immediately after creation.
        trial_ends_at:
          type: string
          description: The end time of the trial if applicable.
      description: The settings of subscription returned on the Checkout Session response. The billing cycle (`recurring`) is computed from line items.
    CouponDiscountDataRequest:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: id of the Coupon object.
      description: Coupon to redeem into a discount for this resource. Only required when `type` = `COUPON`.
    CheckoutLineItemResponse:
      required:
      - price_id
      - discounts
      type: object
      properties:
        price_id:
          type: string
          description: ID of the Price object.
        discounts:
          type: array
          description: List of discounts applied to the line item. Discounts of line items are applied before subscription or invoice discounts. Currently, only one element is supported.
          items:
            $ref: '#/components/schemas/DiscountInstructionResponse'
          maxItems: 1
          minItems: 0
        quantity:
          type: integer
          description: The quantity of the line item being purchased.
          format: int32
          minimum: 1
        tax_percent:
          type: number
          minimum: 0
          maximum: 100
          description: The effective tax percent of this line item.
    CheckoutLineItemRequest:
      type: object
      properties:
        discounts:
          maxItems: 1
          minItems: 0
          type: array
          description: List of discounts to be applied to the line item. Discounts of line items are applied before subscription or invoice discounts. Currently, only one element is supported. Only applicable when an invoice is created.
          items:
            $ref: '#/components/schemas/DiscountInstructionRequest'
        price:
          $ref: '#/components/schemas/InlinePriceRequest'
          description: One-time price definition following the same schema as the [Price](/docs/api/billing/prices) resource. Exactly one of `price_id` or `price` is required. Only applicable when `mode` is `PAYMENT`.
        price_id:
          type: string
          description: ID of the [Price](/docs/api/billing/prices) object. Exactly one of `price_id` or `price` is required.
        quantity:
          minimum: 1
          type: integer
          description: The quantity of the line item being purchased. Defaults to `1`.
          format: int32
        tax_percent:
          type: number
          minimum: 0
          maximum: 100
          description: The effective tax percent of this line item. Only applicable when an invoice is created.
    SubscriptionDefaultInvoiceTemplateResponse:
      type: object
      properties:
        invoice_memo:
          type: string
          description: Memo to be used for the invoices that are generated by this Subscription.
      description: Invoices for the Subscription will be created using the specified settings.
    UiOptions:
      type: object
      properties:
        theme_id:
          type: string
          description: ID of the theme to apply to this Checkout Session, overriding the theme applied to its legal entity. You can find this ID in the Airwallex web app > Settings > Themes.
        layout:
          $ref: '#/components/schemas/Layout'
        submit_type:
          pattern: ^(pay|book|subscribe|save)$
          type: string
          description: Describes the type of transaction being performed in order to customize the submit button text. Accepted values are `pay`, `book`, `subscribe`, and `save`.
      description: Customization options for the Checkout Page.
    InlinePriceRequest:
      required:
      - currency
      type: object
      properties:
        currency:
          type: string
          description: Currency of the price (in 3-letter ISO-4217 format).
        description:
          maxLength: 500
          minLength: 0
          type: string
          description: Price description. Used for internal classification and identification.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Custom key-value pairs attached to the price.
        product:
          $ref: '#/components/schemas/InlineProductRequest'
          description: One-time product definition following the same schema as the [Product](/docs/api/billing/products). Exactly one of `product_id` or `product` is required.
        product_id:
          type: string
          description: ID of the [Product](/docs/api/billing/products) object. Exactly one of `product_id` or `product` is required.
        pricing_model:
          type: string
          description: 'Specify how to calculate the total billing amount when a quantity is provided. One of

            - `FLAT`: a fixed price.

            - `PER_UNIT`: a fixed price per unit quantity.

            Defaults to `PER_UNIT`.'
        unit_amount:
          maximum: 9999999999
          minimum: 0
          type: number
          description: The amount to be charged per product unit. Required when `pricing_model` is `PER_UNIT`.
        flat_amount:
          maximum: 9999999999
          minimum: 0
          type: number
          description: The fixed amount to be charged. Required when `pricing_model` is `FLAT`.
        tax_included:
          type: boolean
          description: Whether the price includes tax. Defaults to `false`.
    InvoiceData:
      type: object
      properties:
        days_until_due:
          type: integer
          description: Number of days from invoice finalization until payment is due.
          format: int32
        default_tax_percent:
          maximum: 100
          minimum: 0
          type: number
          description: The tax rate between 0 and 100(%) to be applied to invoices to be generated. The tax will be exclusive. Defaults to 0.
        due_at:
          type: string
          description: Due date set by the merchant for this invoice, if any. Only one of `days_until_due` and `due_at` should be passed.
        memo:
          maxLength: 200
          minLength: 0
          type: string
          description: String used for merchants to share a custom message to their customers. Referenced as memo or invoice note in Webapp.
        metadata:
          type: object
          additionalProperties:
            type: string
            description: A set of key-value pairs that you can attach to this object for storing additional information.
          description: A set of key-value pairs that you can attach to this object for storing additional information.
      description: The settings of invoice to be passed to the invoice creation upon completion of the Checkout Session in `PAYMENT` mode.
    Layout:
      type: object
      properties:
        payment_methods:
          type: string
          description: Specify the layout for the payment elements. Accepted values are `tab` and `accordion`. By default, `accordion` layout is used on desktop and `tab` layout is used on mobile. Only applicable when no invoice is created.
      description: The layout of the Checkout Page.
    PaymentIntentData:
      type: object
      properties:
        descriptor:
          type: string
