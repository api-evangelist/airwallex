  /api/v1/checkout/checkout_sessions:
    get:
      x-stage: early_access
      description: Retrieves a list of Checkout Sessions based on the query parameters.
      operationId: listCheckoutSessions
      x-oboSupported: false
      parameters:
      - description: ID of the Airwallex payment account associated with the Checkout Session. You can find this ID in the Airwallex web app > Settings > Account details, within the Account Information section. The account must belong to your organization. If omitted, returns Checkout Sessions for all accounts in your organization.
        in: query
        name: account_id
        required: false
        schema:
          type: string
          minLength: 1
        example: acct_ncI2nypPKSq2VXKxscAcg
      - description: The start date of `created_at` in ISO8601 format (inclusive).
        in: query
        name: from_created_at
        required: false
        schema:
          type: string
          format: date-time
      - description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call. To retrieve the next page of results, pass the value of `page_after` (if not `null`) from the response to a subsequent call. To retrieve the previous page of results, pass the value of `page_before` (if not `null`) from the response to a subsequent call.
        in: query
        name: page
        required: false
        schema:
          type: string
      - description: Number of Checkout Sessions per page. Defaults to `20`.
        in: query
        name: page_size
        required: false
        schema:
          maximum: 1000
