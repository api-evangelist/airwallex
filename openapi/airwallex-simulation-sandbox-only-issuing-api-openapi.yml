                transaction_currency:
                  type: string
                  description: Currency of the transaction. Can only be one of USD, AUD, GBP, EUR, CAD, JPY, HKD, CNY, SGD, NZD, CHF.
                card_transaction_lifecycle_id:
                  type: string
                  format: uuid
                  description: The unique identifier of the original card transaction lifecycle to refund.
        description: payload
        required: true
      responses:
