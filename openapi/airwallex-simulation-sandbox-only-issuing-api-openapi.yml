openapi: 3.2.0
info:
  title: Airwallex Simulation (Sandbox Only) > Issuing API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Simulation (Sandbox Only) > Issuing
  description: You can simulate transactions on cards issued by Airwallex and KYC processes of cardholders. Find out more about generating card issuing transactions and cardholder status.
  x-domain: Simulation (Sandbox Only)
  x-resource: Issuing
  x-urlPath: simulation/issuing
paths:
  /api/v1/simulation/issuing/create:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Issuing
      summary: 1|Create a Transaction for the Provided Card
      description: Creates a transaction for the card_id (or card_number) provided, but does not capture the transaction. This is only available in the sandbox environment.
      operationId: simulation_createIssuing
      parameters:
      - name: x-api-version
        in: header
        description: x-api-version.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - transaction_amount
              - transaction_currency
              properties:
                auth_code:
                  type: string
                  description: Authorization code.
                card_id:
                  type: string
                  format: uuid
                  description: Unique Identifier for card. Leave this blank if using card_number. If both card_number and card_id are provided, card_number will be used.
                card_number:
                  type: string
                  description: Card Number.
                merchant_category_code:
                  type: string
                  description: Merchant category code.
                merchant_info:
                  type: string
                  description: Merchant description.
                single_phase:
                  type: boolean
                  description: 'Set this to true to combine a single transaction that both authorizes and clears the transaction request. Defaults to false if not set. '
                transaction_amount:
                  type: number
                  description: Transaction amount.
                transaction_currency:
                  type: string
                  description: Currency of the transaction. Can only be one of USD, AUD, GBP, EUR, CAD, JPY, HKD, CNY, SGD, NZD, CHF.
                transaction_failure_reason:
                  type: string
                  description: Set this field to simulate a failed transaction with the specific failure reason.
                  enum:
                  - CARDHOLDER_VERIFICATION_FAILED
                  - CVV_INVALID
                  - INVALID_EXPIRY_DATE
                  - PIN_INVALID
                  - PIN_RETRIES_EXCEEDED
                  - TRANSACTION_BLOCKED
                card_transaction_lifecycle_id:
                  type: string
                  format: uuid
                  description: The unique identifier of a card transaction lifecycle to associate with the new authorization.
        description: payload
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationTransaction'
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '500':
          description: service_unavailable
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/simulation/issuing/create
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
          x-api-version: '2026-08-21'
        status_code: 201
        reason_phrase: Created
        request_body:
          auth_code: '123312'
          card_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          card_number: '4242424242424242'
          merchant_category_code: '0742'
          merchant_info: Example
          single_phase: true
          transaction_amount: 100
          transaction_currency: AUD
          transaction_failure_reason: CVV_INVALID
          card_transaction_lifecycle_id: d8af1614-a6a1-4d45-aae7-6858fc6d9ede
        response_body:
          auth_code: '000001'
          billing_amount: 100
          billing_currency: USD
          card_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          card_nickname: <string>
          client_data: Some client data
          masked_card_number: '************4242'
          merchant:
            category_code: '4829'
            city: Melbourne
            country: Australia
            name: Merchant A
          network_transaction_id: '3951729271768745'
          process_result: APPROVED
          retrieval_ref: '909916088001'
          subtype: AUTHORIZATION
          transaction_amount: 100
          transaction_currency: USD
          transacted_at: '2018-03-21T16:08:02+00:00'
          card_transaction_event_id: 6c2dc266-09ad-4235-b61a-767c7cd6d6ea
          card_transaction_id: 7c2dc266-09ad-4235-b61a-767c7cd6d6ea
          card_transaction_lifecycle_id: 3c2dc266-09ad-4235-b61a-767c7cd6d6ea
          type: AUTHORIZATION
          updated_at: '2018-03-22T16:08:02+00:00'
      x-scope:
      - scope: simulation:write
        group: Simulations
        resource_name: Simulations
      x-domain: Simulation (Sandbox Only)
      x-resource: Issuing
      x-urlPath: create
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
  /api/v1/simulation/issuing/card_transaction_lifecycles/{card_transaction_lifecycle_id}/capture:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Issuing
      summary: 2|Capture the Card Transaction Lifecycle
      description: Capture a card transaction lifecycle using the given lifecycle ID. This is only available in the sandbox environment.
      operationId: simulation_captureTransaction
      parameters:
      - name: card_transaction_lifecycle_id
        in: path
        description: Unique identifier of the card transaction lifecycle to capture.
        required: true
        schema:
          type: string
          format: uuid
          default: d8af1614-a6a1-4d45-aae7-6858fc6d9ede
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                merchant_info:
                  type: string
                  description: Merchant description.
                transaction_amount:
                  type: number
                  description: Amount to capture. Providing an amount smaller than the full authorised amount will result in a partial capture of the indicated amount only. When not present, the full authorised amount will be captured.
        description: payload
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationTransaction'
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '500':
          description: service_unavailable
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/simulation/issuing/card_transaction_lifecycles/d8af1614-a6a1-4d45-aae7-6858fc6d9ede/capture
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          merchant_info: Example
          transaction_amount: 100
        response_body:
          auth_code: '000001'
          billing_amount: 100
          billing_currency: USD
          card_id: 7f687fe6-dcf4-4462-92fa-80335301d9d2
          card_nickname: <string>
          client_data: Some client data
          masked_card_number: '************4242'
          merchant:
            category_code: '4829'
            city: Melbourne
            country: Australia
            name: Merchant A
          network_transaction_id: '3951729271768745'
          process_result: APPROVED
          retrieval_ref: '909916088001'
          subtype: CLEARING
          transaction_amount: 100
          transaction_currency: USD
          transacted_at: '2018-03-21T16:08:02+00:00'
          card_transaction_event_id: 6c2dc266-09ad-4235-b61a-767c7cd6d6ea
          card_transaction_id: 7c2dc266-09ad-4235-b61a-767c7cd6d6ea
          card_transaction_lifecycle_id: 3c2dc266-09ad-4235-b61a-767c7cd6d6ea
          type: CLEARING
          updated_at: '2018-03-22T16:08:02+00:00'
      x-domain: Simulation (Sandbox Only)
      x-resource: Issuing
      x-urlPath: capture_card_transaction_lifecycles
      x-oauthSupported: true
      x-oboSupported: true
      x-resourceLevel: account
