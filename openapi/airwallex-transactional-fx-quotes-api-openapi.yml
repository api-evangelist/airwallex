components:
  schemas:
    RateDetail:
      type: object
      properties:
        buy_amount:
          type: number
          description: The total amount being bought at the respective level.
        level:
          type: string
          enum:
          - CLIENT
          - AWX
          - PLATFORM_CLIENT
        rate:
          type: number
          description: The exchange rate from the respective level's perspective.
        sell_amount:
          type: number
          description: The total amount being sold at the respective level.
    FxQuote:
      type: object
      required:
      - awx_rate
      - buy_amount
      - buy_currency
      - client_rate
      - conversion_date
      - currency_pair
      - dealt_currency
      - mid_rate
      - quote_id
      - rate_details
      - sell_amount
      - sell_currency
      - usage
      - valid_from_at
      - valid_to_at
      - validity
      properties:
        application_fees:
          type: array
          description: Application fees in this transaction.
          items:
            $ref: '#/components/schemas/ApplicationFee'
        awx_rate:
          type: number
          description: For reference purposes only. This is a reference rate Airwallex compiles by analyzing prices across multiple banking providers and independent rate publishers.
        buy_amount:
          type: number
          description: '`buy_amount` copied from the Quote request (if specified).  Otherwise, this is calculated by multiplying/dividing the `sell_amount` by the FX quote depending on the direction of the currency pair.'
        buy_currency:
          type: string
          description: Buy currency of the quote (3-letter ISO-4217 code).
        client_rate:
          type: number
          description: The returned quote.
        conversion_date:
          type: string
          description: Date on which the conversion will be settled. `conversion_date` defaults to current date, if funding is available, unless specified.
        currency_pair:
          type: string
          description: The currency pair that the quote is for.  The direction of the currency pair is per market convention where possible.
        dealt_currency:
          type: string
          description: The currency where the client provided the exact amount for in the request.
        mid_rate:
          type: number
          description: For reference purposes only. This rate represents the midpoint of the current bid and ask price.
        quote_id:
          type: string
          format: uuid
          description: The quote unique identifier.
        rate_details:
          type: array
          description: Breakdown of rates at different user levels.
          items:
            $ref: '#/components/schemas/RateDetail'
        sell_amount:
          type: number
          description: '`sell_amount` copied from the Quote request (if specified).  Otherwise, this is calculated by multiplying/dividing the `buy_amount` by the FX quote depending on the direction of the currency pair.'
        sell_currency:
          type: string
          description: Sell currency of the quote (3-letter ISO-4217 code).
        usage:
          type: string
          description: Quote usage.
          enum:
          - SINGLE_USE
          - MULTI_USE
        valid_from_at:
          type: string
          description: Quote valid from in ISO8601 format (inclusive).
        valid_to_at:
          type: string
          description: Quote valid to in ISO8601 format (inclusive).
        validity:
          type: string
          description: Quote validity period in the create request.
          enum:
          - MIN_1
          - MIN_15
          - MIN_30
          - HR_1
          - HR_4
          - HR_8
          - HR_24
    ApplicationFee:
      type: object
      properties:
        amount:
          type: string
          description: The application fee amount.
        currency:
          type: string
          description: The currency of the application fee.
        source_type:
          type: string
          description: Specify the type of source transaction for this application fee.
          enum:
          - CONVERSION
          - TRANSFER
