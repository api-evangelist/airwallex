  /api/v1/simulation/rfis/{id}/follow_up:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Request for Information (RFI)
      summary: 2|Follow-up RFI
      description: Use this endpoint to create a follow-up on an existing RFI. You can choose to retain the existing questions, append new ones, or both, depending on your testing needs.
      operationId: simulation_followup
      parameters:
      - name: id
        in: path
        description: Unique identifier of the RFI.
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                questions:
                  type: array
                  description: The questions in this RFI. You can refer to an existing question by its unique identifier, or append new questions by specifying the expected response type.
                  items:
                    type: object
                    properties:
                      title:
                        type: object
                        description: Custom title for a newly created question, keyed by language code. Supported languages are `en`, `zh`, `fr`, and `vi`. If `title` is provided, `en` is required. Omitted languages retain their simulated defaults, while supplied languages beyond the built-in `en` and `zh` defaults are added. Ignored for questions that reuse an existing question by `id`. For questions rendered as structured forms (`ADDRESS`, `IDENTITY_DOCUMENT`, `LIVENESS`), the title is stored but the form's field label is displayed instead. Each value must be no more than 200 characters.
                        properties:
                          en:
                            type: string
                            description: Title in English. Required when `title` is provided.
                          zh:
                            type: string
                            description: Title in Chinese.
                          fr:
                            type: string
                            description: Title in French.
                          vi:
                            type: string
                            description: Title in Vietnamese.
                      description:
                        type: object
                        description: Custom description for a newly created question, keyed by language code. Supported languages are `en`, `zh`, `fr`, and `vi`. If `description` is provided, `en` is required. Same per-language fallback as `title`. Ignored for questions that reuse an existing question by `id`. Each value must be no more than 2000 characters.
                        properties:
                          en:
                            type: string
                            description: Description in English. Required when `description` is provided.
                          zh:
                            type: string
                            description: Description in Chinese.
                          fr:
                            type: string
                            description: Description in French.
                          vi:
                            type: string
                            description: Description in Vietnamese.
                      answer:
                        type: object
                        required:
                        - type
                        description: Expected response to the question, this is required if id is not passed.
                        properties:
                          type:
                            type: string
                            description: The expected type of response to the question.
                            enum:
                            - ADDRESS
                            - ATTACHMENT
                            - CONFIRMATION
                            - IDENTITY_DOCUMENT
                            - LIVENESS
                            - TEXT
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier of the original RFI question, which will be reopened by this follow-up request.
                      sources:
                        type: array
                        description: In the case where a question is linked to a specific source (such as a cardholder) then the source should be specified.
                        items:
                          type: object
                          required:
                          - id
                          - type
                          properties:
                            id:
                              type: string
                              description: Unique identifier for the source.
                            type:
                              type: string
                              description: "The type of the source. Valid values depend on the RFI type::  \n\n-   `KYC`/`KYC_ONGOING`: `PERSON`\n-   `CARDHOLDER`: `CARDHOLDER`\n-   `MERCHANT_RISK`: `PAYMENT_INTENT`\n-   `TRANSACTION`: `CHARGE`, `CONNECTED_ACCOUNT_TRANSFER`, `DIRECT_DEBIT`, `DEPOSIT`, `TRANSFER`."
        description: create RFI request.
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRfiSession'
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '404':
          description: not_found
        '500':
          description: service_unavailable
