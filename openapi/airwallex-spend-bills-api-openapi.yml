  /api/v1/spend/bills:
    get:
      tags:
      - Spend > Bills
      x-stage: beta
      summary: 3|List all Bills
      description: Returns a list of bills filtered by the specified query parameters.
      operationId: listBills
      parameters:
      - name: page
        in: query
        description: A bookmark for use in pagination to retrieve either the next page or the previous page of results. You can fetch the value for this identifier from the response of the previous API call.
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        description: The number of items returned per page, between 1 and 100. The default is 100.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: from_created_at
        in: query
        description: Filter by bills created after this timestamp (inclusive) in ISO8601 format. If not specified, defaults to last 30 days from `to_created_at`.
        required: false
        schema:
          type: string
      - name: to_created_at
        in: query
        description: Filter by bills created before this timestamp (exclusive) in ISO8601 format. If not specified, defaults to now.
        required: false
        schema:
          type: string
      - name: from_updated_at
        in: query
        description: Filter by bills updated after this timestamp (inclusive) in ISO8601 format.
        required: false
        schema:
          type: string
      - name: to_updated_at
        in: query
        description: Filter by bills updated before this timestamp (exclusive) in ISO8601 format.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Filter by bill status.
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - AWAITING_APPROVAL
          - AWAITING_PAYMENT
          - PAYMENT_IN_PROGRESS
          - PAID
          - REJECTED
          - SCHEDULED
      - name: sync_status
        in: query
        description: Filter by sync status.
        required: false
        schema:
          type: string
          enum:
          - NOT_SYNCED
          - SYNCED
          - SYNC_FAILED
      - name: legal_entity_id
        in: query
        description: Filter by legal entity unique identifier.
        required: false
        schema:
          type: string
      - name: purchase_order_id
        in: query
        description: Filter by purchase order unique identifier.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillPagination'
        '400':
          description: Invalid Request.
        '404':
          description: Not found.
        '500':
          description: Internal server error.
