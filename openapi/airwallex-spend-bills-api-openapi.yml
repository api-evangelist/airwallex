openapi: 3.2.0
info:
  title: Airwallex Spend > Bills API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Spend > Bills
  description: Manages bills representing accounts payable obligations. Supports retrieval, listing with filters, and sync status updates for integration with external accounting systems.
  x-domain: Spend
  x-resource: Bills
  x-urlPath: spend/bills
paths:
  /api/v1/spend/bills/create:
    post:
      tags:
      - Spend > Bills
      x-stage: beta
      summary: 1|Create a Bill
      description: Creates a new bill.
      operationId: createBill
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - billing_currency
              - due_date
              - external_id
              - invoice_number
              - issued_date
              - legal_entity_id
              - line_items
              - request_id
              - sync_status
              - tax_status
              - vendor_id
              properties:
                request_id:
                  type: string
                  description: Unique identifier for this request to ensure idempotency. To prevent accidental duplication, clients should generate a random UUID.
                external_id:
                  type: string
                  description: External identifier for this bill in your system.
                legal_entity_id:
                  type: string
                  description: Unique identifier of the legal entity associated with the bill.
                vendor_id:
                  type: string
                  format: uuid
                  description: Unique identifier of the vendor associated with the bill.
                invoice_number:
                  type: string
                  description: Invoice number associated with the bill.
                issued_date:
                  type: string
                  description: Date when the bill was issued, in ISO8601 format.
                due_date:
                  type: string
                  description: Date when the bill is due, in ISO8601 format.
