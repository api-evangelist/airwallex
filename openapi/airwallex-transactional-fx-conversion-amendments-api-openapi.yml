components:
  schemas:
    AmendmentCharge:
      type: object
      properties:
        amount:
          type: number
          description: "The amount of the financial adjustment (cancellation delta).\n Contact your account manager for settlement timing and configuration options."
        awx_rate:
          type: number
          description: The rate at which Airwallex executed the amendment (with Airwallex's liquidity provider partners).
        client_rate:
          type: number
          description: 'The rate at which the client is being billed for the amendment (inherited from the client’s existing conversion rate configuration). '
        currency:
          type: string
          description: The currency of the financial adjustment. This is always the non-fixed side of the original conversion.
        currency_pair:
          type: string
          description: The currency pair associated with `awx_rate` and `client_rate`.
        type:
          type: string
          description: Type of charge applied.
          enum:
          - FEE
          - CREDIT
    ConversionAmendment:
      type: object
      properties:
        amendment_id:
          type: string
          description: Airwallex-generated unique identifier of the amendment.
        charges:
          type: array
          description: Represents the indicative financial adjustment resulting from the amendment.
          items:
            $ref: '#/components/schemas/AmendmentCharge'
        conversion_id:
          type: string
          description: Airwallex echoes the unique identifier of the conversion being amended.
        created_at:
          type: string
          description: The time at which the amendment was created (follows the [same format](/docs/api/data_types) as the rest of Airwallex’s APIs).
        metadata:
          type: object
          description: Airwallex echoes any client-supplied metadata.
        request_id:
          type: string
          description: Airwallex echoes the request’s idempotency key.
        short_reference_id:
          type: string
          description: Shortened transaction unique identifier for ease of use within Web GUI and with Airwallex support.
        type:
          type: string
          description: Defines the type of amendment to be created. Only `CANCEL` is supported.
          enum:
          - CANCEL
          x-enumDescriptions:
            CANCEL: Full cancellation of the original conversion.
        updated_at:
          type: string
          description: The time at which the amendment was last updated (follows the [same format](/docs/api/data_types) as the rest of Airwallex’s APIs).
    ConversionAmendmentQuote:
      type: object
      properties:
        charges:
          type: array
          description: Represents the indicative financial adjustment resulting from the amendment.
          items:
            $ref: '#/components/schemas/AmendmentCharge'
        conversion_id:
          type: string
          description: Airwallex echoes the unique identifier of the conversion being amended.
        metadata:
          type: object
          description: Airwallex echoes any client-supplied metadata.
        request_id:
          type: string
          description: Airwallex echoes the request’s idempotency key.
        short_reference_id:
          type: string
          description: Shortened transaction unique identifier for ease of use within Web GUI and with Airwallex support.
        type:
          type: string
          description: Defines the type of amendment to be created. Only `CANCEL` is supported.
          enum:
          - CANCEL
          x-enumDescriptions:
            CANCEL: Full cancellation of the original conversion.
