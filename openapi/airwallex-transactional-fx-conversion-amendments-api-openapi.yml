  x-urlPath: transactional_fx/conversion_amendments
paths:
  /api/v1/fx/conversion_amendments/create:
    post:
      tags:
      - Transactional FX > Conversion Amendments
      summary: 1|Create an Amendment
      description: Create an amendment on a booked but unsettled conversion.
      operationId: createConversionAmendment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - conversion_id
              - request_id
              - type
              properties:
                charge_currency:
                  type: string
                  description: Currency charged on the delta that arises with the amendment. Only the currencies from the original conversion are allowed. Default will be set to the non-fixed side of the original conversion.
                conversion_id:
                  type: string
                  description: Unique identifier of the conversion to be amended.
                metadata:
                  type: object
                  description: Persisted client-supplied metadata. A metadata JSON object with a maximum of 10 key-value pairs (each key and value must be less than 255 characters).
                request_id:
                  type: string
                  description: Client-generated idempotency key.
                type:
                  type: string
                  description: Defines the type of amendment to be created. Only `CANCEL` is supported.
                  enum:
                  - CANCEL
                  x-enumDescriptions:
                    CANCEL: Full cancellation of the original conversion.
        description: request
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionAmendment'
        '400':
          description: '["account_not_authorized"

            ,"does_not_exist"

            ,"field_required"

            ,"invalid_status_for_operation"

            ,"invalid_charge_currency"]'
        '401':
          description: '["credentials_invalid"

            ,"credentials_expired"]'
        '429':
          description: Too many requests
        '500':
          description: Service unavailable
      deprecated: false
