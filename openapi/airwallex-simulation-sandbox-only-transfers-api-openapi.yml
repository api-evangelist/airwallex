components:
  schemas:
    SimulationBankDetails:
      type: object
      required:
      - account_currency
      - account_name
      - bank_country_code
      properties:
        account_currency:
          type: string
          description: Account Currency.
        account_name:
          type: string
          description: Account holder name of the beneficiary’s bank account.
        account_name_alias:
          type: string
          description: The beneficiary’s account name known in the payment system. This is only supported in some regions and transfer methods. See detailed definitions in the [Payouts Product Docs](/docs/payouts/beneficiaries/create-beneficiaries).
        account_number:
          type: string
          description: Account number, mostly for non-european countries, either account_number or iban should be filled.
        account_routing_type1:
          type: string
          description: Routing code type.
        account_routing_type2:
          type: string
          description: Routing code sub type.
        account_routing_value1:
          type: string
          description: Routing code value.
        account_routing_value2:
          type: string
          description: Routing code sub type value.
        bank_account_category:
          type: string
          description: bank account type.
        bank_branch:
          type: string
          description: Specific branch of bank account.
        bank_country_code:
          type: string
          description: Bank country code (2-letter ISO 3166-2 country code).
        bank_name:
          type: string
          description: Bank name of the beneficiary's bank account.
        bank_state:
          type: string
          description: Bank State.
        bank_street_address:
          type: string
          description: Bank street address.
        binding_mobile_number:
          type: string
          description: The mobile number tied to the Beneficiary's bank account.
        fingerprint:
          type: string
          description: Fingerprint of current beneficiary's bank account.
        iban:
          type: string
          description: International bank account number, mostly for european countries.
        intermediary_bank_name:
          type: string
          description: Bank name of the beneficiary's intermediary bank.
        intermediary_bank_swift_code:
          type: string
          description: Intermediary bank SWIFT code / BIC,Should contain alphanumeric characters only, Should be a valid and supported SWIFT code / BIC.
        local_clearing_system:
          type: string
          description: 'Which clearing system should be used for this local bank transfer.


            Please refer to our [payout guide](https://airwallex.com/guides/payout) for details about each option.


            We suggest explicitly specifying this value, however if it''s not provided we will select a default (using the specified account routing type and/or what''s most often the best option).'
        swift_code:
          type: string
          description: Bank swift code.
      description: Beneficiary's bank account details where the payment will be credited.
    SimulationFunding:
      type: object
      required:
      - status
      properties:
        deposit_type:
          type: string
          description: 'Can be one of: `FASTER_DIRECT_DEBIT`, `DIRECT_DEBIT`.'
        failure_details:
          $ref: '#/components/schemas/SimulationFailureDetails'
          description: Details about why the funding has failed. Only present when the funding is in a failure state.
        failure_reason:
          type: string
          description: Empty unless the funding is in an error state.
        funding_source_id:
          type: string
          description: The id of the funding source, it can be null if using a wallet.
        status:
          type: string
          description: The funding status of this payment. Please see details in [Funding Statuses](/docs/payouts/older-api-versions/transfers/transfer-statuses#funding-statuses).
      description: The funding information of this payment.
    SimulationBeneficiaryAddress:
      type: object
      properties:
        city:
          type: string
          description: Beneficiary's city.
        country_code:
          type: string
          description: Beneficiary's country code (2-letter ISO 3166-2 country code).
        postcode:
          type: string
          description: Beneficiary's post code.
        state:
          type: string
          description: Beneficiary's state.
        street_address:
          type: string
          description: Beneficiary's street address.
      description: Beneficiary's address details.
    SimulationPayerAddress:
      type: object
      required:
      - country_code
      properties:
        city:
          type: string
          description: Payer's city.
        country_code:
          type: string
          description: Payer's country code (2-letter ISO 3166-2 country code).
        postcode:
          type: string
          description: Payer's post code.
        state:
          type: string
          description: Payer's state.
        street_address:
          type: string
          description: Payer's street address.
      description: Payer's address details.
    SimulationPrepayment:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
          description: The prepayment amount to be paid.
        currency:
          type: string
          description: The prepayment currency.
      description: Prepayment details for a schedule transfer with currency conversions at a confirmed rate.
    SimulationPayerAdditionalInfo:
      type: object
      properties:
        business_registration_number:
          type: string
          description: Business registration number.
        business_registration_type:
          type: string
          description: Type of business as registered with the local government authority.
        external_id:
          type: string
          description: Unique identifier of the person in your company.
        personal_email:
          type: string
          description: Personal email.
        personal_id_number:
          type: string
          description: Personal unique identifier number.
      description: Additional information about the payer.
    SimulationApplicationFee:
      type: object
      properties:
        amount:
          type: string
          description: The application fee amount.
        currency:
          type: string
          description: The currency of the application fee.
        source_type:
          type: string
          description: Specify the type of source transaction for this application fee.
          enum:
          - CONVERSION
          - TRANSFER
    SimulationPayer:
      type: object
      required:
      - address
      - entity_type
      properties:
        additional_info:
          $ref: '#/components/schemas/SimulationPayerAdditionalInfo'
          description: Additional information about the payer.
        address:
          $ref: '#/components/schemas/SimulationPayerAddress'
          description: Payer's address details.
        company_name:
          type: string
          description: Company name of the payer.
        date_of_birth:
          type: string
          description: Payer's date of birth.
        entity_type:
          type: string
          description: Entity type of the payer.
        first_name:
          type: string
          description: First name of the payer.
        last_name:
          type: string
          description: Last name of the payer.
      description: Details of the payer.
    SimulationUnderlyingConversion:
      type: object
      required:
      - currency_pair
      - rate
      properties:
        currency_pair:
          type: string
          description: The currency pair of the conversion.
        rate:
          type: number
          description: The rate of the conversion.
      description: Conversion details of a transfer with currency conversions.
    SimulationFailureDetails:
      type: object
      properties:
        code:
          type: string
          description: Error code (details can be found [here](/docs/global-treasury/receive-funds/add-funds-via-direct-debits-from-linked-accounts/direct-debit-deposit-error-codes)).
        iso_code:
          type: string
          description: Error code [ISO 20022](https://www.iso20022.org/about-iso-20022) (details can be found [here](/docs/global-treasury/receive-funds/add-funds-via-direct-debits-from-linked-accounts/direct-debit-deposit-error-codes)).
        provider_failure_details:
          $ref: '#/components/schemas/SimulationProviderFailureDetails'
          description: A set of original information received from the local clearing system.
      description: Details about why the funding has failed. Only present when the funding is in a failure state.
    SimulationDispatchInfo:
      type: object
      properties:
        external_reference:
          type: string
          description: A reference unique identifier to track a transfer after it's dispatched from Airwallex.
        external_reference_type:
          type: string
          description: The definition of the `external_reference` in the payment system.
      description: Additional details populated after the transaction is sent to Airwallex's downstream for processing. Only available for some transfer methods - see [Product Docs](/docs/payouts/transfers/create-a-transfer) for details.
    SimulationBeneficiaryAdditionalInfo:
      type: object
      properties:
        business_area:
          type: string
          description: Category of business activity.
        business_phone_number:
          type: string
          description: Business phone number.
        business_registration_number:
          type: string
          description: Business registration number.
        external_identifier:
          type: string
          description: The identifier that you use to identify a beneficiary, usually a unique identifier. This field can be used to link transfers or beneficiaries to other records such as tax form details for filing purposes.
        legal_rep_bank_account_number:
          type: string
          description: Legal representative's personal bank account number used for declaration purposes. No funds will be sent to this account number.
        legal_rep_first_name_in_chinese:
          type: string
          description: Legal representative first name in chinese.
        legal_rep_id_number:
          type: string
          description: Legal representative id number.
        legal_rep_last_name_in_chinese:
          type: string
          description: Legal representative last name in chinese.
        legal_rep_mobile_number:
          type: string
          description: Legal representative’s mobile number associated with their bank account.
        personal_email:
          type: string
          description: Personal email.
        personal_first_name_in_chinese:
          type: string
          description: Beneficiary's first name in Chinese.
        personal_id_number:
          type: string
          description: Personal unique identifier number.
        personal_id_type:
          type: string
          description: Personal unique identifier type.
        personal_last_name_in_chinese:
          type: string
          description: Beneficiary's last name in Chinese.
        personal_mobile_number:
          type: string
          description: Personal mobile number.
        recipient_account_id:
          type: string
          description: Account unique identifier of the recipient account used for payout processing. The account must be active and have `customer_agreements.terms_and_conditions.service_agreement_type` set to `RECIPIENT` (verify via [Retrieve account details API](/docs/api/scale/accounts/detail)).
        security_question:
          type: string
          description: Security question. Required when the email address is not registered with Interac e-Transfer autodeposit.
        security_question_answer:
          type: string
          description: Security question answer. Required when the email address is not registered with Interac e-Transfer autodeposit.
      description: Additional information about the beneficiary.
    SimulationProviderFailureDetails:
      type: object
      properties:
        code:
          type: string
          description: The original error code received from the local clearing system.
        local_clearing_system:
          type: string
          description: The local clearing system used for the direct debit deposit. Possible values are `AU_BECS`, `US_ACH`, `GB_BACS`, `EU_SEPA`.
        message:
          type: string
          description: The original error message received from the local clearing system.
      description: A set of original information received from the local clearing system.
    SimulationTransfer:
      type: object
      required:
      - amount_beneficiary_receives
      - amount_payer_pays
      - beneficiary
      - created_at
      - fee_amount
      - fee_currency
      - fee_paid_by
      - funding
      - id
      - payer
      - reason
      - reference
      - request_id
      - short_reference_id
      - source_amount
      - source_currency
      - status
      - transfer_amount
      - transfer_currency
      - transfer_date
      - transfer_method
      - updated_at
      properties:
        amount_beneficiary_receives:
          type: number
          description: The total amount (in transfer `transfer_currency`) the beneficiary receives for this transfer, and is governed by value specified in `fee_paid_by`, i.e. if `fee_paid_by` is `PAYER`, then the beneficiary receives the exact same `transfer_amount` since payer is responsible for the transfer fee.  Otherwise, beneficiary receives `transfer_amount - fee` as the fee is implicitly passed onto the beneficiary.
        amount_payer_pays:
          type: number
          description: The total amount (in `source_currency`) the payer has to pay for making this transfer. For example, if `fee_paid_by` is `PAYER` and FX conversion is not involved, then this is the sum of `transfer_amount + fee` as the payer is responsible for the fee.  Otherwise this field is the same as `transfer_amount`.
        application_fee_options:
          type: array
          description: The application fee options applied to this transfer.
          items:
            $ref: '#/components/schemas/SimulationApplicationFeeOption'
        application_fees:
          type: array
          description: Application fees in this transfer.
          items:
            $ref: '#/components/schemas/SimulationApplicationFee'
        batch_transfer_id:
          type: string
          description: Unique identifier of the batch containing the transfer.
        beneficiary:
          $ref: '#/components/schemas/SimulationBeneficiary'
          description: Details of the beneficiary.
        beneficiary_id:
          type: string
          format: uuid
          description: beneficiary_id of the beneficiary contact used to create this transfer.
        conversion:
          $ref: '#/components/schemas/SimulationUnderlyingConversion'
          description: Conversion details of a transfer with currency conversions.
        created_at:
          type: string
          description: The time this transfer request was created.
        dispatch_date:
          type: string
          description: Actual payout dispatch date. Payouts are dispatched at this date in actual processing. This date could be later than the transfer date.
        dispatch_info:
          $ref: '#/components/schemas/SimulationDispatchInfo'
          description: Additional details populated after the transaction is sent to Airwallex's downstream for processing. Only available for some transfer methods - see [Product Docs](/docs/payouts/transfers/create-a-transfer) for details.
        failure_reason:
          type: string
          description: Empty unless the transfer is in an error state.
        failure_type:
          type: string
          description: Empty unless the transfer is in an error state.
        fee_amount:
          type: number
          description: The transfer fee (in `source_currency`) for sending this transfer.
        fee_currency:
          type: string
          description: The transfer fee currency. This should always equal to the `source_currency`.
        fee_paid_by:
          type: string
          description: Denotes whether `PAYER` / `BENEFICIARY` will be liable for the the transfer fee.  Defaults to `PAYER` unless field is populated in the request.
        funding:
          $ref: '#/components/schemas/SimulationFunding'
          description: The funding information of this transfer.
        id:
          type: string
          format: uuid
          description: Returned `id` that can be used to query the status of the transfer.
        lock_rate_on_create:
          type: boolean
          description: 'Denotes whether to lock the conversion rate for a scheduled transfer with value `TRUE` or `FALSE`.This field should only be specified when a conversion is involved. If not specified, the default value is `TRUE`. '
        metadata:
          type: object
          description: A set of key-value pairs for storing your own data together with the transfer.
          additionalProperties:
            type: string
        payer:
          $ref: '#/components/schemas/SimulationPayer'
          description: Details of the payer.
        payer_id:
          type: string
          format: uuid
          description: payer_id of the payer contact used to create this transfer.
        prepayment:
          $ref: '#/components/schemas/SimulationPrepayment'
          description: Prepayment details for a schedule transfer with currency conversions at a confirmed rate.
        reason:
          type: string
          description: Reason for the transfer instruction.
        reference:
          type: string
          description: Bank transfer reference to be shown on beneficiary's bank transaction history.
        remarks:
          type: string
          description: Additional information about this transfer, which will not be passed to the beneficiary.
        request_id:
          type: string
          description: A unique request identifier specified in the transfer request.
        short_reference_id:
          type: string
          description: Short transfer reference for support purposes.
        source_amount:
          type: number
          description: Amount to be received.
        source_currency:
          type: string
          description: Copied from the request if specified.
        status:
          type: string
          description: The transfer status. Please see details in [Transfer Statuses](/docs/payouts/older-api-versions/transfers/transfer-statuses).
        swift_charge_option:
          type: string
          description: (For SWIFT transfers only), specify who should bear SWIFT charges, either `SHARED` (default) or `PAYER`.
        transfer_amount:
          type: number
          description: Amount to be paid.
        transfer_currency:
          type: string
          description: Currency the transfer should be made in (3-letter ISO-4217 code).
        transfer_date:
          type: string
          description: Date when transfer should be made (Copied from the request if specified).
        transfer_method:
          type: string
          description: Copied from the request if specified.  Otherwise the system will populate this field automatically.
        updated_at:
          type: string
          description: The time this transfer request was last updated.
    SimulationBeneficiary:
      type: object
      properties:
        additional_info:
          $ref: '#/components/schemas/SimulationBeneficiaryAdditionalInfo'
          description: Additional information about the beneficiary.
        address:
