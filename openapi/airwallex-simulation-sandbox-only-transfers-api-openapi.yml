openapi: 3.2.0
info:
  title: Airwallex Simulation (Sandbox Only) > Transfers API
  version: '2026-08-21'
  description: Airwallex Client API, assembled verbatim from the per-category OpenAPI fragments (paths, operations, component schemas) that the Airwallex API reference at https://www.airwallex.com/docs/api serves as Next.js page data. The reference names the source file airwallex-openapi-2026-08-21.yaml but does not offer it for download.
  contact:
    name: Airwallex
    url: https://www.airwallex.com/docs/api
servers:
- url: https://api.airwallex.com
  description: Production
- url: https://api.sandbox.airwallex.com
  description: Sandbox
tags:
- name: Simulation (Sandbox Only) > Transfers
  description: Simulate the transfer lifecycle scenarios in the sandbox environment.
  x-domain: Simulation (Sandbox Only)
  x-resource: Transfers
  x-urlPath: simulation/transfers
paths:
  /api/v1/simulation/transfers/{id}/transition:
    post:
      servers:
      - url: https://api.sandbox.airwallex.com
        description: Sandbox
      tags:
      - Simulation (Sandbox Only) > Transfers
      summary: 1|Transition Transfer Status
      description: You can use this endpoint to simulate the status transition of your transfer. This is only available in the Sandbox environment. Learn about the transfer status lifecycle.
      operationId: simulation_transition
      parameters:
      - name: id
        in: path
        description: Unique identifier of the transfer to transition the status of.
        required: true
        schema:
          type: string
          format: uuid
          default: d8af1614-a6a1-4d45-aae7-6858fc6d9ede
      - name: x-api-version
        in: header
        description: x-api-version.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - next_status
              properties:
                failure_type:
                  type: string
                  description: The type of failure to simulate.
                  enum:
                  - ACCOUNT_CLOSED
                  - ACCOUNT_CURRENCY_MISMATCH
                  - ACCOUNT_INACTIVE_OR_DORMANT
                  - ACCOUNT_UNDER_RESTRICTION
                  - BENEFICIARY_BANK_RETURNED
                  - BENEFICIARY_NAME_MISMATCH
                  - BENEFICIARY_REQUESTED
                  - CARD_ISSUER_ERROR
                  - CHANNEL_POLICY
                  - CHANNEL_TIMEOUT
                  - CLIENT_REQUESTED
                  - DUPLICATION_RETURN
                  - EXCEEDED_TRANSACTION_AMOUNT_OR_LIMIT
                  - INBOUND_2B_CARD_NOT_SUPPORTED
                  - INBOUND_BENFICIARY_VALIDATION_ERROR
                  - INBOUND_COMPANY_REGISTRATION_NUMBER_ERROR
                  - INBOUND_ORDER_ERROR
                  - INSUFFICIENT_FUNDS
                  - INVALID_ACCOUNT_NAME_OR_NUMBER
                  - INVALID_BANK_INFORMATION
                  - INVALID_BANK_OR_BRANCH_CODE
                  - INVALID_BENEFICIARY_DETAILS
                  - INVALID_CORRESPONDENT_BANK_INFORMATION
                  - INVALID_PAYMENT_PURPOSE
                  - INVALID_SPECIAL_CHARACTER
                  - INVALID_SWIFT_BIC_CODE
                  - OTHER
                  - RECALL_REQUESTED
                  - SYSTEM_ERROR
                  - TM_SUSPENDED
                  - TRANSACTION_AMOUNT_NOT_COVERING_FEE
                  - UNABLE_TO_APPLY
                next_status:
                  type: string
                  description: The next status to transition to. Status can be OVERDUE, PROCESSING, SENT, PAID, FAILED, and CANCELLED.
        description: payload
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationTransfer'
        '400':
          description: invalid_argument
        '401':
          description: credentials_invalid
        '500':
          description: service_unavailable
      x-examples:
      - key: default
        name: ''
        method: POST
        uri: /api/v1/simulation/transfers/transfer_id/transition
        request_headers:
          Authorization: Bearer {{ACCESS_TOKEN}}
          Content-Type: application/json
        status_code: 200
        reason_phrase: OK
        request_body:
          failure_type: INVALID_ACCOUNT_NAME_OR_NUMBER
