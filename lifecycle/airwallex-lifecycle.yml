compatibility_policy:
  backwards_compatible_without_new_version:
  - adding new API endpoints
  - adding new optional request fields
  - adding new response fields
  - adding new required request fields tied to a new payment corridor or method
  - changing the content of unstructured text such as error messages and field labels
  requires_new_version:
  - renaming a field
  - splitting a field
  - any other backwards-incompatible contract change
  client_obligation: tolerate unknown response fields; do not fail on additive changes
  external_data_requirement_change: regulator- or third-party-mandated data requirements may be enforced across
    ALL versions rather than gated behind a new one. Airwallex states this situation has not yet arisen.
deprecation:
  policy_url: https://www.airwallex.com/docs/api/versioning
  sunset_header: false
  deprecation_header: false
  model: additive date-versioning - old versions remain selectable rather than being sunset on a clock
  note: 'No RFC 8594 Sunset or Deprecation response header is documented, and no dated sunset schedule is published.
    The stated migration path is: read the changelog, set x-api-version on the affected endpoints, test in sandbox,
    then ask support to move the account default. Support moves the account and the header can be dropped roughly
    an hour later.'
  migration_steps:
  - read the changelog for the target version
  - set the x-api-version header on affected endpoints and adapt to the new contract
  - test in the sandbox environment (or feature-flag traffic incrementally)
  - notify Airwallex support to move the account default version
  - remove the x-api-version header more than an hour after the account is moved
