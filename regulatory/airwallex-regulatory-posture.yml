  global_privacy_control: No mention of Global Privacy Control or opt-out preference signals on the pages read.
  transparency_report: The candidate line was a list of retention purposes ("To comply with legal process orders or law enforcement requests"), not a published transparency report.
  exit_assistance: Data portability shows up only as a jurisdiction-dependent data-subject right (recorded under data_subject_request). There is no cloud-switching or export-assistance commitment.
