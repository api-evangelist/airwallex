- aid: airwallex:airwallex-authentication-authentication-api
  name: Airwallex Authentication > Authentication API
  description: >-
    Airwallex uses an API key and Client ID to authenticate requests. You authenticate by exchanging your
    API key and Client ID for a short-lived access token, then sending that token as `Authorization: Bearer
    <token>` on every subsequent call. The access token is valid for 30 minutes and can be reused until
    it expires. Do not call the authentication endpoint before each request. Track expiration using the
    `expires_at` field from the login response. To get an access token, call [Obtain an access token](/docs/api/authentication/api_access_token/login).


    You can view and manage API keys in the [Airwallex web app](https://www.airwallex.com/app). Do not
    share your API key in publicly accessible places such as GitHub repositories, client-side code, and
    so forth. For guidance on scoping, storing, and rotating your keys, see [API key best practices](/docs/developer-tools/api/api-key-best-practices).


    Airwallex authorizes each request against the scopes attached to your API key. For the full catalog
    of key permissions, see [API key scopes](/docs/developer-tools/api/api-key-scopes).


    All requests must be made over HTTPS. Only [PCI-DSS recommended TLS versions and cipher suites](/docs/developer-tools/security/securing-connections-to-airwallex)
    are supported.
  humanURL: https://www.airwallex.com/docs/api#/Introduction
  baseURL: https://api.airwallex.com/api/v1
  tags:
  - Authentication > Authentication
  properties:
