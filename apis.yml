  name: Airwallex Embedded Finance > PSP Settlement Splits API
  description: >-
    Platforms must share PSP Settlement Split information with Airwallex before funds settle to the holding
    account, by calling the [Split a PSP Settlement Intent API](/docs/api/scale/psp_settlement_splits/split_psp_settlement_intents).
    This data typically originates from the pay-in PSP's reporting feed.


    Funds in the holding account are inaccessible to all parties until the funds are released to other
    connected accounts. A Platform can choose to [release a PSP Settlement Split](/docs/api/scale/psp_settlement_splits/release)
    anytime. On release, funds are transferred to a connected account for the recipient, such as a seller.


    If a Platform wants to apply a transaction fee to the seller, they can create one split for the amount
    due to the seller, and can create another split for the fee to the platform's own account.

    A Platform can trigger a [payout](/docs/api/payouts/transfers) from any connected account to an **external
    bank account** at any time (for example, at the end of a payout cycle).

    PSP Settlement Splits form part of the [PSP-agnostic payout solution](/docs/payments-for-platforms/psp-agnostic/implement-your-psp-agnostic-solution).
