- aid: airwallex:airwallex-payment-acceptance-funds-splits-api
  name: Airwallex Payment Acceptance > Funds Splits API
  description: >-
    A **Funds Split** will guide you through the process to divide part of the collected funds to another
    destination before settling to the account that owns the funds.


    You may create multiple **Funds Splits** for the same source of funds to send money to different destinations.
    However, one **Funds Split** will only have one destination.


    You may specify the following on a Funds Split.


    1. What is the source of funds? Denoted by `source_type`.

    2. How much do you want to split? Denoted by `amount`.

    3. Who will receive the funds? Denoted by `destination`.


    Currently, Funds Split only works when the source of funds is a payment acceptance transaction, and
    the destinations are connected accounts to the funds owner.


    Data Retention Policy: You can query and operate Funds Split resources for a maximum of 2 years since
    creation.
