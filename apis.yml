  name: Airwallex Issuing > Card Transaction Events API
  description: "A **transaction event** is the most granular level of the three-level transaction model\
    \ \n(**Lifecycle → Card Transaction → Transaction Event**).\n\nEach transaction event represents an\
    \ individual network message or fund movement, with an immutable \nfund movement per event. Use transaction\
    \ events when you need per-event \ndetails such as failure reasons, authorization subtypes, or individual\
    \ amounts.\n\n**Event types:** `AUTHORIZATION`, `CLEARING`, `REVERSAL_AUTH`.\n\n**Event subtypes:**\
    \ `AUTHORIZATION`, `INCREMENTAL_AUTHORIZATION`, `VERIFICATION`, `REVERSAL`, \n`PARTIAL_REVERSAL`,\
    \ `EXPIRED_AUTHORIZATION`, `CLEARING`, `PARTIAL_CLEARING`, `CLEARING_REVERSAL`.\n\n**Data retention:**\
    \ Resources can be queried for a maximum of 2 years from creation.\n\nLearn more about the [transaction\
    \ lifecycle](/docs/issuing/transactions/transaction-lifecycle)."
