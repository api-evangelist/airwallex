  description: "A PSP settlement intent represents a settlement with a PSP in a particular currency. Each\
    \ PSP settlement intent is associated with one or more PSP settlement deposits by `settlement_reference`.\
    \ \nAfter creating your PSP settlement intent, you can start splitting it, creating one PSP settlement\
    \ split for each target account. Once you complete splitting your PSP settlement intent, you can submit\
