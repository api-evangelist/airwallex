- aid: airwallex:airwallex-risk-risk-reports-api
  name: Airwallex Risk > Risk Reports API
  description: >-
    The Risk Reports API lets merchants self-serve their own risk datasets. The currently supported report
    type is `PAYMENT_FRAUD_REPORT`, which contains payment fraud data reported through acquirer TC40 /
    SAFE reports for a given date range.


    Use [Generate a risk report](/docs/api/risk/risk_reports/generate) to submit a query and obtain a
    report `id`, followed by [Retrieve a risk report](/docs/api/risk/risk_reports/retrieve) to track the
    report status. When the report reaches `COMPLETED` status, obtain a short-lived signed download link.
    Reports are generated asynchronously. Subscribe to the `risk.risk_reports.completed` and `risk.risk_reports.failed`
    webhook events to be notified when a report is ready or generation has failed.
