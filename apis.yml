- aid: airwallex:airwallex-billing-rate-cards-api
  name: Airwallex Billing > Rate Cards API
  description: >-
    A Rate Card is a versioned container for multi-dimensional pricing. It groups multiple Rate Card Items,
    each representing the price for one combination of dimensions (e.g. `model` × `token_type`), under
    shared billing fields (`product_id`, `meter_id`, `currency`, `recurring`). This lets you define pricing
    for an entire matrix for a single [Product](/docs/api/billing/products) and add it to a [Subscription](/docs/api/billing/subscriptions)
    as a single item, instead of creating one Price for each combination.


    Pricing is organized in three layers:

    - Rate Card — the container and its shared billing fields.

    - Rate Card Version — an immutable snapshot of the pricing. Change pricing by publishing a new version;
    existing subscriptions stay pinned to the version they were created with.

    - Rate Card Item — one entry in the matrix: the price for a specific set of `dimension_values`.


    When usage is billed, each usage record is matched against the version's items in order and billed
    at the first item whose `dimension_values` match (an omitted key matches any value; an empty object
    matches all usage). So one Rate Card subscription item expands into one invoice line item per priced
    dimension combination that had usage.
  humanURL: https://www.airwallex.com/docs/api#/Introduction
  baseURL: https://api.airwallex.com/api/v1
  tags:
  - Billing > Rate Cards
  properties:
  - type: OpenAPI
    url: openapi/airwallex-billing-rate-cards-api-openapi.yml
  - type: APIReference
    url: https://www.airwallex.com/docs/api/introduction
  - type: JSONSchema
    url: json-schema/airwallex-invoice-schema.json
  - type: JSONSchema
    url: json-schema/airwallex-customer-balance-transaction-response-schema.json
  - type: JSONSchema
    url: json-schema/airwallex-checkout-schema.json
  - type: JSONSchema
    url: json-schema/airwallex-settlement-record-schema.json
  - type: JSONSchema
    url: json-schema/airwallex-checkout-session-response-schema.json
  - type: JSONSchema
    url: json-schema/airwallex-payment-intent-list-schema.json
- aid: airwallex:airwallex-billing-subscriptions-api
  name: Airwallex Billing > Subscriptions API
  description: >-
    A Subscription manages the billing lifecycle for the recurring products or services that a customer
    purchases. One or more Products and Prices can be added as Subscription Items to a Subscription.


    Customers can be charged automatically, or be issued invoices that they will pay manually every billing
    cycle.


    If a Subscription is set to charge a Billing Customer's Payment Source automatically, the charge will
    either happen at the start or end of a billing cycle depending on whether a Price's billing type is
    `IN_ADVANCE` or `IN_ARREARS`:


    - `IN_ADVANCE`: billed at the beginning of the billing cycle.

    - `IN_ARREARS`: billed at the end of the billing cycle.


    A Subscription with a free trial moves from `IN_TRIAL` status to `ACTIVE` status when the trial period
    ends. If a Subscription is created with a future start time, it will be in `PENDING` status until
    the trial period or paid billing period starts. The status of a Subscription is `UNPAID` when a payment
    initially fails. When this happens, Airwallex will retry payment up to 4 times (after 1 day, 2 days,
    5 days and 7 days).


    The status of a Subscription moves to `ACTIVE` if a payment retry attempt succeeds, or `CANCELLED`
    if all retries fail. A Subscription moves to `CANCELLED` when it ends or if cancelled.
  humanURL: https://www.airwallex.com/docs/api#/Introduction
  baseURL: https://api.airwallex.com/api/v1
  tags:
  - Billing > Subscriptions
  properties:
  - type: OpenAPI
