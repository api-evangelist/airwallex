- aid: airwallex:airwallex-issuing-card-transaction-lifecycles-api
  name: Airwallex Issuing > Card Transaction Lifecycles API
  description: "A **lifecycle** is the top level of the three-level transaction model \n(**Lifecycle →\
    \ Card Transaction → Transaction Event**).\n\nIt is a container that groups all related card transactions\
    \ and transaction events belonging to \nthe same payment flow, based on network information. Lifecycles\
    \ provide a network-level view \nof a payment along with aggregated billing amounts across all related\
    \ card transactions and events.\n\n**Key characteristics:**\n* Lifecycles do not have a status. Use\
    \ card transactions if you need guaranteed terminal statuses.\n* Grouping is **best-effort**: it depends\
    \ on payment networks and acquirers providing consistent \n  identifiers. For example, matched refunds\
    \ link to the original lifecycle; unmatched refunds \n  create a new one.\n* Use the lifecycle ID\
    \ to retrieve all associated card transactions and transaction events.\n\n**Data retention:** Resources\
    \ can be queried for a maximum of 2 years from creation.\n\nLearn more about the [transaction lifecycle](/docs/issuing/transactions/transaction-lifecycle)."
  humanURL: https://www.airwallex.com/docs/api#/Introduction
  baseURL: https://api.airwallex.com/api/v1
