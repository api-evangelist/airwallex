- aid: airwallex:airwallex-issuing-card-transactions-api
  name: Airwallex Issuing > Card Transactions API
  description: "A **card transaction** is the middle level of the three-level transaction model \n(**Lifecycle\
    \ → Card Transaction → Transaction Event**).\n\nIt groups related transaction events and represents\
    \ Airwallex's interpretation of a single card \ntransaction. Each card transaction has a guaranteed\
    \ terminal status and a fund direction, making it \nthe recommended level for tracking payment outcomes\
    \ without implementing custom grouping logic.\n\n**Statuses:** `AUTHORIZED` (non-terminal), `CLEARED`,\
    \ `REVERSED`, `EXPIRED`, `DECLINED`, \n`VERIFIED` (terminal).\n\n**Fund directions:** `DEBIT`, `CREDIT`,\
    \ or `NO_MOVEMENT`.\n\nAll card transactions within the same payment flow share a common lifecycle\
    \ ID.\n\n**Data retention:** Resources can be queried for a maximum of 2 years from creation.\n\n\
    Learn more about the [transaction lifecycle](/docs/issuing/transactions/transaction-lifecycle)."
