  name: Airwallex Payment Acceptance > Reference Data API
  description: >-
    All card schemes publish account range information which helps understand the product, issuer country
    code, issuer name etc. Hence, merchants can request account range data under a particular PAN thereby
    enabling business logic such as:


    -   Merchants query for BIN info using the PAN to get information about card type so that they can
    surcharge if the card used is commercial / credit or other cases.

    -   Merchants would like to know the brand and product information to run discounts and offers on
    the website. The cart amount will be dynamically updated to reflect the discounted price.

    -   Merchants query on the card details like country code to run some risk level checks at their side
    without depending on the acquirer. Merchants may not want to accept cards issued in a certain country,
    because sending this to the acquirer may cost them additional charges (gateway fee / authorization
    fee, etc.).
