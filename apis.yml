- aid: airwallex:airwallex-payment-acceptance-payment-consents-api
  name: Airwallex Payment Acceptance > Payment Consents API
  description: >-
    **Payment Consent** is an API resource to represent the agreement between merchant and Customer of
    making subsequent payments using the provided Payment Method. In general, we can categorize the usages
    of Payment Consent into two groups.


    - Merchant can initiate the payment without customer's presence (MIT). For example, membership subscription
    and utilities.

    - Customer can initiate the payment without having to input payment method information again (CIT).
    For example, fast checkout with saved method.


    To make payments, you can [confirm](/docs/api/payments/payment_intents/confirm) a Payment Intent with
    the reference of Payment Consent, which must be in the status of `VERIFIED`, `REQUIRES_PAYMENT_METHOD`
    or `REQUIRES_CUSTOMER_ACTION`. The latter two are only allowed for card and direct debit payment methods
    as they can be verified directly by the success of the initial payment.
