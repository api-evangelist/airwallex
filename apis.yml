  description: >-
    The **Payment Links** API allows you to accept payments from shoppers using a payment link URL. The
    payment link URL takes your shopper to an Airwallex hosted secure checkout page where they can make
    the payment with their preferred payment method.


    The Payment Link supports two pricing options:


    1. Fixed pricing - Both the payment `amount` and `currency` are locked. The shopper must pay the exact
    amount in the given currency.

    2. Flexible pricing - The shopper chooses to pay from a list of supported currencies you specify and
    decide on the exact amount to pay.
