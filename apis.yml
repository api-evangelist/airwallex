- aid: airwallex:airwallex-payment-acceptance-customer-balance-transactions-api
  name: Airwallex Payment Acceptance > Customer Balance Transactions API
  description: >-
    A **Customer Balance Transaction** records a change in the balance of funds that Airwallex holds and
    returns on behalf of your customer. It is used to notify you when bank transfer funds are received
    or reversed, including in exceptional scenarios such as overpayment, underpayment, or unmatched funding.


    [For bank transfer payments](https://www.airwallex.com/docs/payments/payment-methods/global/bank-transfer),
    the payment instructions are displayed to the shopper, who then manually transfers the funds through
    their own bank. Because the transfer is completed outside of the Airwallex checkout flow, the received
    funds may not always match the original PaymentIntent or PaymentAttempt. Customer Balance Transactions
    give you clear visibility into every received fund, its status, and any reversal.


    A Customer Balance Transaction has one of the following types:


    1. `bank_transfer` - Adds bank transfer funds to the customer balance.

    2. `bank_transfer_reversal` - Reverses a previous bank transfer transaction and deducts the corresponding
    amount from the customer balance.

    3. `applied_to_payment` - Applies bank transfer funds from the customer balance to a payment, reducing
    the available customer balance.


    Airwallex emits `customer_balance_transaction` webhook events as funds progress. Refer to the product
    documentation for the full list of events and their payloads.


    This resource applies to bank transfer payments only.
  humanURL: https://www.airwallex.com/docs/api#/Introduction
  baseURL: https://api.airwallex.com/api/v1
  tags:
  - Payment Acceptance > Customer Balance Transactions
  properties:
  - type: OpenAPI
    url: openapi/airwallex-payment-acceptance-customer-balance-transactions-api-openapi.yml
  - type: APIReference
