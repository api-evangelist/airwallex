- aid: airwallex:airwallex-payment-acceptance-payment-intents-api
  name: Airwallex Payment Acceptance > Payment Intents API
  description: >-
    A **Payment Intent** guides you through the process of collecting a payment from your customer. It
    tracks a payment when your customer first checks out, through to when payment is successfully paid
    by your customer. A Payment Intent transitions through a number of states throughout the customer's
    payment journey.


    You may specify the following on a Payment Intent.


    1. How much the payment is for? Denoted by `amount` and `currency`.

    2. Who is making the payment? This is described by the optional `customer_id` field.

    3. Which Payment Method to use? Denoted by `payment_method`.


    You/your customer will get back the following hints at different stages of the payment process:


    1. The available Payment Methods.

    2. The Payment Method attached to this customer (if `customer_id` is set).


    A combination of `status` and `next_action` guide you and your customers through the payment process,
    including triggering additional authentication flows as required.


    Data Retention Policy: You can query and operate Payment Intent resources for a maximum of 2 years
    since creation.
  humanURL: https://www.airwallex.com/docs/api#/Introduction
  baseURL: https://api.airwallex.com/api/v1
