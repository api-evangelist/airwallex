  description: >-
    Generate reports to understand the activity of your Platform account and connected accounts.


    Use [Create Platform report](/docs/api/scale/platform_reports/create) to obtain a report id, followed
    by [Get Platform report](/docs/api/scale/platform_reports/retrieve) to retrieve a download URL for
    the report once it is ready. Subscribe to the `Platform Report` webhook in the Airwallex webapp to
    be notified when the report that you have requested is ready. Only files smaller than 100MB can be
    generated.


    Create scheduled reports by specifying future dates for `to_created_at`, or `to_updated_at`.


    Reports will be generated at the end of the requested interval, once all data has been captured.


    For example, if `2023-01-10` is the current date, [request a Platform report](/docs/api/scale/platform_reports/create)
    with `from_created_at` = `2023-01-01` and `to_created_at` = `2023-02-01` to obtain data for January.
    The scheduled report will be generated after the end of the interval.
