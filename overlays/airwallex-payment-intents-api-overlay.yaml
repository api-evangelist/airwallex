    description: Airwallex production
  - url: https://api.sandbox.airwallex.com
    description: Airwallex sandbox
- target: $.components.securitySchemes
  update:
    BearerAuth:
      type: http
      scheme: bearer
      description: Bearer access token from POST /api/v1/authentication/login. Valid 30 minutes; cache and reuse.
- target: $.paths.*.*.responses
