- target: $.info
  update:
    x-apievangelist-enrichment:
      date: '2026-10-20'
      conventions: conventions/airwallex-conventions.yml
      errors: errors/airwallex-problem-types.yml
      decline_codes: errors/airwallex-decline-codes.yml
      authentication: authentication/airwallex-authentication.yml
      scopes: scopes/airwallex-scopes.yml
      rate_limits: rate-limits/airwallex-rate-limits.yml
      webhooks: asyncapi/airwallex-webhooks.yml
      mcp: mcp/airwallex-mcp.yml
      tool_crosswalk: mcp/airwallex-tool-crosswalk.yml
      skills: skills/_index.yml
    x-api-version-header: x-api-version
    x-idempotency:
      style: body-field
      field: request_id
      value_format: UUIDv4 per distinct logical operation
      replay_error: duplicate_request
      source: conventions/airwallex-conventions.yml + errors/airwallex-problem-types.yml
- target: $.components
