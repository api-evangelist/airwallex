overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Airwallex API
  version: 1.0.0
extends: ../openapi/_original/airwallex-openapi.yml
x-provenance:
  generated: '2026-10-20'
  method: generated
  source:
  - openapi/airwallex-openapi.yml
  - mcp/airwallex-tool-crosswalk.yml
  - authentication/airwallex-authentication.yml
  - conventions/airwallex-conventions.yml
  note: The verbatim contract declares no securitySchemes and no idempotency convention; this overlay adds both
    from the repo artifacts, plus each operation's public MCP OAuth scope (from the tool crosswalk). Replaces the
    sixteen overlays that extended the retired per-API reconstruction files.
