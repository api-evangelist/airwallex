note: Airwallex exposes TWO distinct OAuth scope vocabularies and both are real. (1) The partner-connections scope
  reference documents 98 `<resource>:<read|write>` scopes for third-party applications, each row mapping the scope
  to the REST operations it authorizes and the webhook events it may subscribe to. (2) The hosted MCP servers advertise
  a different, coarser `<r|w>:<awx_action|org_action>:<permission>` vocabulary in their RFC 9728 protected-resource
  metadata — 35 scopes on production, 48 in sandbox — fetched anonymously and saved verbatim under well-known/.
  No oauth2 securityScheme appears in the OpenAPI held in this repo, so none of this is derivable from the spec;
  every scope below was read off a provider surface.
