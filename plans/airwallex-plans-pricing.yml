specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Airwallex
providerId: airwallex
created: '2026-05-04'
modified: '2026-08-30'
generated: '2026-08-30'
method: searched
source: https://www.airwallex.com/us/pricing
note: >-
  REPLACES the 2026-05-04 scaffold, which invented API-request quota tiers (free 1,000/month,
  professional 100,000/month, enterprise uncapped) with TBD prices. Airwallex sells nothing of the
  kind. It publishes three per-seat platform plans and prices the money movement itself as
  per-transaction fees; there is no metered API-call product and no API-request quota anywhere in
  its pricing. The Platform API / Embedded Finance surface - the part this catalog entry is about -
  is explicitly "contact us for custom pricing".
currency: USD
billing_period: month
pricing_model: per-seat platform subscription plus per-transaction fees
api_metered: false
api_quota_published: false
plan_count: 4
plans:
  - id: airwallex-explore
    name: Explore
    type: freemium
    price: '0.00'
    currency: USD
    billing_period: month
    unit: per user/month
    audience: businesses managing funds and finances globally
    included_users: 10 free Spend users
    elements:
      - name: Business Accounts
        description: Multiple accounts per entity, collect and hold in 20+ currencies, interbank FX rates
      - name: Free batch transfers to 120+ countries
      - name: Yield on USD
        description: 3.22% on USD (rate as published; subject to change)
      - name: Spend
        description: Unlimited multi-currency corporate cards with zero international fees, card controls, expense management, bill pay
      - name: Payments
        description: Online card and local payment method acceptance globally, like-for-like settlement in 20+ currencies
      - name: Billing
        description: Invoicing, subscriptions and usage-based billing
      - name: Integrations
        description: Xero and QuickBooks bank feed / expense / bill sync
  - id: airwallex-grow
    name: Grow
    type: paid
    price: '12.00'
    currency: USD
    billing_period: month
    unit: per user/month
    additional_fee: platform fee based on team size
    max_users: 250 Spend users
    audience: growing businesses managing funds and spend with precision
    elements:
      - name: Everything in Explore
      - name: Yield on USD
        description: 3.37% on USD
      - name: Approvals and automation
        description: Customizable multi-conditional approvals, rules-based automation for expenses and bills
      - name: Integrations
        description: NetSuite, Dynamics 365 Business Central, HRIS platforms
      - name: Single sign-on
        status: coming soon
  - id: airwallex-accelerate
    name: Accelerate
    type: enterprise
    price: custom
    currency: USD
    audience: large businesses needing customized financial workflows and support
    contact: https://www.airwallex.com/signup/contact-sales
    elements:
      - name: Everything in Grow
      - name: Yield on USD
        description: 3.49% on USD
      - name: Purchase orders and 3-way matching
      - name: Custom direct Spend API integration with ERP
      - name: Centralized management across global entities
        description: up to 3 entities included; custom fees per additional entity
      - name: Dedicated account manager and onboarding support
  - id: airwallex-platform-api
    name: Platform APIs & Embedded Finance
    type: enterprise
    price: custom
    currency: USD
    audience: platforms and marketplaces embedding Airwallex financial services
    contact: https://www.airwallex.com/signup/contact-sales
    note: >-
      This is the plan that covers the Connected Accounts, Accounts, Payments, Transactional FX,
      Payouts and Issuing APIs catalogued in this repo. Airwallex publishes NO price for it - the
      pricing page says only "For Platform API & Embedded Finance use cases get in touch with us to
      discuss custom pricing". Recorded as a published sales gate, not as an unknown.
    elements:
      - name: Connected Accounts
      - name: Accounts
      - name: Payments
      - name: Transactional FX
      - name: Payouts
      - name: Issuing
transaction_fees:
  published_separately: true
  note: >-
    In addition to any monthly plan fee, per-transaction fees apply to FX, transfers and payments
    processing. Airwallex publishes a detailed fee schedule per region rather than one global table,
    and the plan fee is charged per business legal entity (one entity may hold many accounts).
  regional: true
  regional_note: >-
    Pricing is region-scoped - www.airwallex.com/<region>/pricing. The figures above are from the
    United States page.
maintainers:
