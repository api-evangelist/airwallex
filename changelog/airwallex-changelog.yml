- version: '2026-08-21'
  date: '2026-08-21'
  breaking: true
  change_count: 6
  affected_endpoints: 28
  highlights:
  - The account `status` field now exposes two additional values, `DORMANT` and `CLOSED`, providing a more granular
    view of inactive accounts. On earlier API versions, dormant accounts were returned as `ACTIVE`, and closed accounts
    were returned as `SUSPENDED`.
  - 'New account webhook events for the added statuses:'
  - Spend accounting field selections now use `source_id` as the internal accounting-value identifier. For Bills
    and Purchase Orders, create requests replace the legacy `identifier_type`, `field_id`, and `field_value_id`
    fields with required `type` and `source_id`
  - Spend Bill and Expense webhook payloads now include `source_id` for populated accounting field selections.
  - The Card Transaction Event response field `transaction_date_time` is renamed to `transacted_at`.
  - Transaction Disputes now use Card Transaction Event identifiers.
- version: '2026-07-17'
  date: '2026-07-17'
  breaking: true
  change_count: 3
  affected_endpoints: 7
  highlights:
  - '`country_code` is now required in the account address objects below. Previously `country_code` was optional
    in these addresses; requests that omit it in the cases described are now rejected with a validation error, ensuring
    a country can always be determined f'
  - The standalone `lifecycle_id` is removed from the Issuing Authorizations and Transactions APIs. Its value is
    now provided by the `card_transaction_data` object — which is available across all API versions — as its `card_transaction_lifecycle_id`
    child, alongsi
  - 'Issuing webhook events now carry a `card_transaction_data` object with the card transaction identifiers, so
    you can correlate webhook payloads with the Card Transactions model (Lifecycle → Card Transaction → Transaction
    Event) without subscribing to new event '
- version: '2026-06-30'
  date: '2026-06-30'
  breaking: true
  change_count: 10
  affected_endpoints: 19
  highlights:
  - 'Specific `risk_declined` cases are now returned with more accurate error codes:'
  - '`terminal_id` in `terminal_info` (under both `payment_method.card` and `payment_method.card_present`) is renamed
    to `terminal_identifier`. The field represents the 8-digit alphanumeric identifier sent to the card scheme,
    not the Airwallex Terminal resource ID;'
  - The `payment_method.card.three_ds` node is removed from API requests. `payment_method.card.three_ds.return_url`
    is replaced by the top-level `return_url`; all other fields in the node were already deprecated and unused.
  - Timestamp fields in responses now use the ISO-8601 standard timezone offset format `+00:00` instead of the legacy
    `+0000`. For example, `2024-06-15T10:30:00+0000` is now returned as `2024-06-15T10:30:00+00:00`. Date-only fields
    (`YYYY-MM-DD`) are unaffected.
  - The settlement `id` response field is renamed to `settlement_id`.
  - The `version` query parameter is removed from the Get a settlement report endpoint, as the old version is deprecated.
    The report is always generated using the latest report version.
