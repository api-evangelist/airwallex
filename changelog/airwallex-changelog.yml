  highlights:
  - 'This version includes major changes to Billing APIs via the following new resources:'
  - This version includes major changes to Billing APIs. It introduces new resources like **Billing Customers**,
    **Payment Sources**, and **Billing Transactions** to better abstract the payment provider resources from the
    billing software resources, and a new reso
  - Introduced new **Billing Customers** resource – A new resource representing customers in Billing, separate from
    the Payment Acceptance customers. Billing Customers store customer data for billing purposes and link to invoices
    and subscriptions.
  - Introduced **Payment Source** resource – A new resource for managing a customer’s saved funding source for billing.
    A **Payment Source** can be created from a verified payment consent and used for future charges in subscriptions
    or invoices.
  - Introduced **Billing Transactions** resource – A new read-only resource that records transactions related to
    invoices.
  - Introduced new **Billing Checkouts** resource – A new resource manages the setup and lifecycle of an Airwallex-hosted
    customer checkout experience, enabling customers to confirm and pay for line items or set up payment details
    for future transactions.
