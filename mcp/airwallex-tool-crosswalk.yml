method: derived
source: mcp/airwallex-mcp.yml
note: >-
  Airwallex has BOTH an MCP surface and an OpenAPI, so this crosswalk is emitted - but the honest
  shape of it is unusual and worth stating plainly. The only anonymously-enumerable tool list is the
  two-tool Docs MCP, and neither of those tools maps to a REST operation: they are documentation
  retrieval, not account actions. The production AgentOS and sandbox Developer servers DO expose
  account operations, but their tools/list is OAuth-gated, so their tool NAMES are not public. What
  IS public for those servers is their OAuth scope set (RFC 9728), and a scope is the closest
  public proxy for a capability. The scope-to-capability rows below are therefore recorded as
  `capability_crosswalk`, at low-to-medium confidence, and are NOT presented as tool names.
  Nothing here was invented; where a mapping could not be established it is left in rest_only or
  marked gated.
surfaces:
  openapi:
    files:
      - openapi/airwallex-authentication-api-openapi.yml
      - openapi/airwallex-balances-api-openapi.yml
      - openapi/airwallex-beneficiaries-api-openapi.yml
      - openapi/airwallex-customers-api-openapi.yml
      - openapi/airwallex-payment-intents-api-openapi.yml
      - openapi/airwallex-payouts-api-openapi.yml
      - openapi/airwallex-refunds-api-openapi.yml
      - openapi/airwallex-transfers-api-openapi.yml
    gated: false
    provenance_warning: >-
      These specs derive from openapi/_original/airwallex-openapi.yml, which describes itself as a
      "best-effort OpenAPI 3.1 representation ... derived from https://www.airwallex.com/docs/api".
      They are an API Evangelist reconstruction, not an Airwallex-published contract. Airwallex's
      own 48 dated OpenAPI documents are named in its docs application but are not downloadable
      (see lifecycle/airwallex-lifecycle.yml contract_discovery). Confidence on every rest[] binding
      below is capped accordingly.
  graphql:
