      servers: [production, sandbox]
      rest: [getCurrentBalances]
      confidence: high
    - scope: r:awx_action:pa_view
      servers: [production, sandbox]
      rest: [getPaymentIntent, getRefund]
      confidence: medium
      note: pa = payment acceptance; the read side of payment intents, refunds, disputes and payment methods
    - scope: w:awx_action:pa_edit
      servers: [sandbox]
      rest: [createPaymentIntent, confirmPaymentIntent, capturePaymentIntent, cancelPaymentIntent, createRefund]
      confidence: medium
      note: >-
        SANDBOX ONLY. The production scope set has no pa_edit, which is the machine-readable form of
        Airwallex's stated "no money-out actions by default" guardrail.
    - scope: r:awx_action:transfers_view
      servers: [production, sandbox]
      rest: [getTransfer, getPayout]
      confidence: medium
    - scope: w:awx_action:transfers_edit
      servers: [sandbox]
      rest: [createTransfer, createPayout]
      confidence: medium
      note: SANDBOX ONLY - absent from the production scope set.
    - scope: r:awx_action:contact_management_view
      servers: [production, sandbox]
      rest: [listBeneficiaries, getBeneficiary]
      confidence: medium
      note: beneficiaries/payees are managed under contact management
    - scope: w:awx_action:contact_management_edit
