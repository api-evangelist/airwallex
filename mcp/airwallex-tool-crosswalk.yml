  cli:
    binary: airwallex
    note: >-
      The CLI is the third agent surface and the only one that self-describes without auth on the
      user's own machine - `airwallex --tree` enumerates every command and
      `airwallex <cmd> --api-schema-only` prints the backing endpoint's schema. For an agent that
      can shell out, that is a richer crosswalk than anything published on the web.
    artifact: cli/airwallex-cli.yml
