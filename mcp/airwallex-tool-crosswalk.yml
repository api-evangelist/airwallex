capability_crosswalk:
  note: >-
    Public OAuth scopes on the gated MCP servers, mapped to the OpenAPI operations in this repo that
    fall inside them. This is a capability mapping, not a tool mapping - the scope grants access to
    a family of operations, and the server's actual tool names are unknown until an authenticated
    tools/list is run.
  rows:
