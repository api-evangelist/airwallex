note: Rebuilt 2026-10-20 against the new verbatim contract openapi/airwallex-openapi.yml (468 operations, assembled
  from the per-category OpenAPI fragments the Airwallex API reference serves), which replaced the 18-operation reconstruction
  the previous crosswalk was bound to. The only anonymously enumerable tool list is the two-tool Docs MCP (tools/list
  re-run live 2026-10-20), and neither tool invokes a REST operation, so crosswalk[] is honestly empty and both
  tools sit in mcp_only. The AgentOS (production) and Developer (sandbox) servers gate tools/list behind OAuth,
  so their tool NAMES are not public; their OAuth scopes ARE public (RFC 9728). capability_crosswalk binds each
  public MCP scope to the operations whose own x-scope extension in the spec carries the equivalent API scope. binding
  x-scope = same name in both vocabularies (r:org_action:billing.invoice_view <-> billing.invoice:read); x-scope-alias
  = our mapping between differently named resources (balances_view <-> balance:read), medium confidence. Write-scope
  rows list every operation whose x-scope names the :write scope, which in the spec includes some reads.
