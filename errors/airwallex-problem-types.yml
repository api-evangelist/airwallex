method: searched
source: https://www.airwallex.com/docs/api/errors
format: proprietary
format_note: Airwallex does NOT use RFC 9457 application/problem+json. Errors are a plain JSON object with code
  / source / message / details, returned as application/json. Recorded as-is rather than mapped into a problem+json
  shape it does not use.
envelope:
  content_type: application/json
  fields:
  - name: code
    description: machine-readable error code
  - name: source
    description: name of the request parameter that caused the error
  - name: message
    description: human-readable description of the error
  - name: details
    description: conditional key-value object carrying additional context
  - name: trace_id
    description: request trace identifier (present on at least the 429 response)
example:
  code: invalid_argument
  source: first_name
  message: Value is too short
  details:
    reason: First name must contain at least three characters.
status_codes:
- status: 200
  title: OK
  description: The request was processed successfully
- status: 201
  title: Created
  description: The request was processed successfully
- status: 400
  title: Bad request
  description: The request contains missing parameters, is in an incorrect shape, or failed another validation test
- status: 401
  title: Unauthorized
  description: The authentication token is invalid
- status: 403
  title: Forbidden
  description: The authentication token is not provided, or the request was denied due to insufficient permissions
- status: 404
  title: Not found
  description: The requested endpoint does not exist
- status: 409
  title: Conflict
  description: The request could not be completed due to a conflict with another request
- status: 429
  title: Too Many Requests
  description: The user has sent too many requests in a given amount of time
  code: too_many_requests
  example:
    code: too_many_requests
    message: Rate Limit Exceeded.
    trace_id: <trace id>
    details: {}
- status: 500
  title: Server error
  description: Something went wrong on our end
