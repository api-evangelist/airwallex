idempotency_signal:
  code: duplicate_request
  status: 400
  note: A replayed request_id is rejected with duplicate_request, which is the observable proof that request_id
    is the idempotency key.
decline_passthrough:
  code: issuer_declined
  note: Issuer declines carry the raw scheme response code through to the caller.
